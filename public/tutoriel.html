<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymates — Tutoriel interactif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
:root{
  --bg:#0b0b09; --surface:#111110; --surface2:#181815;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --accent:#c8b97a; --text:#f0ece0; --muted:rgba(240,236,224,0.45);
  --serif:'Playfair Display',Georgia,serif; --sans:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;
  padding:0 3rem;height:64px;background:rgba(11,11,9,0.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
.logo{font-family:var(--serif);font-size:1.35rem;color:var(--text);text-decoration:none;}
.logo em{font-style:italic;color:var(--accent);}
.nav-back{font-family:var(--sans);font-size:.85rem;color:var(--muted);text-decoration:none;border:1px solid var(--border2);
  padding:.5rem 1rem;border-radius:8px;transition:.2s;}
.nav-back:hover{color:var(--text);border-color:var(--accent);}
.wrap{max-width:980px;margin:0 auto;padding:2rem 1.5rem 4rem;}
.tut-head{text-align:center;margin-bottom:1.4rem;}
.tut-eyebrow{font-family:var(--mono);font-size:.58rem;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);margin-bottom:.6rem;}
.tut-title{font-family:var(--serif);font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700;}
.tut-title em{font-style:italic;color:var(--accent);}
.progress-row{display:flex;align-items:center;gap:1rem;margin:1.2rem 0;}
.progress-track{flex:1;height:4px;background:rgba(255,255,255,.08);border-radius:4px;position:relative;}
.progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .4s ease;}
.progress-label{font-family:var(--mono);font-size:.7rem;color:var(--muted);white-space:nowrap;}
.parts{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:-.2rem 0 1.1rem;}
.part-chip{font-family:var(--sans);font-size:.74rem;color:var(--muted);border:1px solid var(--border2);border-radius:999px;
  padding:.28rem .75rem;background:none;cursor:pointer;transition:.2s;}
.part-chip:hover{color:var(--text);border-color:var(--accent);}
.part-chip.active{color:var(--accent);border-color:var(--accent);background:rgba(200,185,122,.08);}
.part-chip.done{color:rgba(130,214,160,.85);border-color:rgba(130,214,160,.45);}
#canvas-host{border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -25px rgba(0,0,0,.8),0 0 0 1px var(--border2);}
#canvas-host canvas{display:block;width:100%;height:auto;}
.controls{display:flex;gap:.7rem;margin-top:1.2rem;justify-content:center;}
.ctrl{background:none;border:1px solid var(--border2);color:var(--muted);border-radius:9px;padding:.6rem 1.2rem;
  font-family:var(--sans);font-size:.85rem;cursor:pointer;transition:.2s;}
.ctrl:hover{color:var(--text);border-color:var(--accent);}
.ctrl.primary{border-color:var(--accent);color:var(--accent);}
.ctrl.primary:hover{background:rgba(200,185,122,.1);}
@media(max-width:700px){nav{padding:0 1.2rem;}.wrap{padding:1.4rem 1rem 3rem;}}
</style>
<script src="auth.js" data-protect></script>
<script src="ui.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="tut-head">
    <div class="tut-eyebrow">Tutoriel interactif</div>
    <h1 class="tut-title" id="tut-title">Chapitre</h1>
  </div>
  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <span class="progress-label" id="progress-label">Étape 1 / 1</span>
  </div>
  <!-- Une puce par compétence : cliquer saute à la première étape de la partie. -->
  <div class="parts" id="parts"></div>
  <div id="canvas-host"></div>
  <div class="controls">
    <button class="ctrl" id="btn-restart" onclick="window.__restart()">↺ Recommencer</button>
    <button class="ctrl primary" id="btn-skip" onclick="window.__skip()">Passer cette étape →</button>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   MOTEUR DE TUTORIEL INTERACTIF (P5.js)
   Chaque étape = une "slide". Quand la tâche est réussie,
   petite célébration animée puis passage à la slide suivante.
   ════════════════════════════════════════════════════════════ */

/* ─── helpers de dessin partagés (niveau global) ─── */
function disk(p, cx, cy, r, n, opt){
  opt = opt||{};
  const start=-p.HALF_PI, step=p.TWO_PI/n;
  // remplissage par part
  if (opt.colored){
    p.noStroke();
    for (let i=0;i<n;i++){
      if (!opt.colored[i]) continue;
      p.fill(122,200,230,90);
      p.beginShape(); p.vertex(cx,cy);
      for (let a=start+i*step; a<=start+(i+1)*step+0.001; a+=0.05) p.vertex(cx+r*p.cos(a), cy+r*p.sin(a));
      p.endShape(p.CLOSE);
    }
  }
  // contour
  p.noFill(); p.stroke(245,242,232,210); p.strokeWeight(2.6); p.circle(cx,cy,r*2);
  // traits
  for (let i=0;i<n;i++){
    const removed = opt.removed && opt.removed[i];
    const dashed = opt.dashedOdd && (i%2===1) && !removed;
    if (removed) continue;
    const a = start+i*step;
    const ex=cx+r*p.cos(a), ey=cy+r*p.sin(a);
    p.push();
    if (dashed){ p.stroke(130,210,160,200); p.strokeWeight(2.2); p.drawingContext.setLineDash([6,6]); }
    else { p.stroke(245,242,232,150); p.strokeWeight(1.8); p.drawingContext.setLineDash([]); }
    p.line(cx,cy,ex,ey);
    p.pop();
  }
  p.drawingContext.setLineDash([]);
}
function fraction(p, x, y, num, den, col){
  p.push(); p.textAlign(p.CENTER, p.CENTER); p.fill(col); p.textFont('Playfair Display');
  const s = p.height*0.075;
  p.textSize(s); p.text(num, x, y-s*0.62);
  p.stroke(col); p.strokeWeight(2.4); p.line(x-s*0.5, y, x+s*0.5, y); p.noStroke();
  p.text(den, x, y+s*0.62);
  p.pop();
}
function bigCount(p, x, y, txt){
  p.push(); p.textAlign(p.CENTER,p.CENTER); p.fill(230,210,120); p.textFont('DM Mono');
  p.textSize(p.height*0.045); p.text(txt, x, y); p.pop();
}
function partAt(p, cx, cy, r, n, mx, my){
  const dx=mx-cx, dy=my-cy, d=Math.hypot(dx,dy); if (d>r) return -1;
  let a=Math.atan2(dy,dx); const start=-Math.PI/2;
  let rel=a-start; rel=((rel%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
  return Math.floor(rel/(2*Math.PI/n));
}
function boundaryAt(p, cx, cy, r, n, mx, my){
  const dx=mx-cx, dy=my-cy, d=Math.hypot(dx,dy); if (d<r*0.12 || d>r*1.08) return -1;
  let a=Math.atan2(dy,dx); const start=-Math.PI/2, step=2*Math.PI/n;
  let best=-1, bd=999;
  for (let i=0;i<n;i++){ const ba=start+i*step; let diff=Math.abs(angleDiff(a,ba)); if(diff<bd){bd=diff;best=i;} }
  return (bd < step*0.4) ? best : -1;
}
function angleDiff(a,b){ let d=a-b; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; return d; }

// digits (décimaux)
function digitLayout(p, S){
  const s=p.height*0.16, n=S.digits.length, totalW=n*s*0.62;
  const x0=p.width/2-totalW/2;
  return S.digits.map((d,i)=>({d, x:x0+i*s*0.62+s*0.31, y:p.height*0.45, w:s*0.55, h:s*0.9, s}));
}
function drawDigits(p, S, highlights){
  const L=digitLayout(p,S);
  for (const it of L){
    const hl = it.d.k && highlights && highlights[it.d.k];
    const picked = S.picked && it.d.k===S.picked;
    p.push(); p.textAlign(p.CENTER,p.CENTER); p.textFont('Playfair Display'); p.textSize(it.s);
    if (it.d.k){
      p.rectMode(p.CENTER); p.noFill();
      const hover = p.mouseX>it.x-it.w/2 && p.mouseX<it.x+it.w/2 && p.mouseY>it.y-it.h/2 && p.mouseY<it.y+it.h/2;
      p.stroke(picked?'#82d6a0':(hover?'rgba(200,185,122,0.7)':'rgba(255,255,255,0.12)')); p.strokeWeight(2);
      p.rect(it.x, it.y, it.w, it.h, 8); p.noStroke();
    }
    p.fill(picked?'#82d6a0':'#f0ece0'); p.text(it.d.c, it.x, it.y);
    p.pop();
  }
  // labels positions
  p.push(); p.textAlign(p.CENTER,p.TOP); p.textFont('DM Sans'); p.textSize(p.height*0.026);
  for (const it of L){ if(it.d.k){ const names={u:'unités',dix:'dixièmes',cent:'centièmes'};
    p.fill(highlights&&highlights[it.d.k]?'#7ac8e6':'rgba(240,236,224,0.4)');
    p.text(names[it.d.k], it.x, it.y+it.h*0.6); } }
  p.pop();
}
function digitAt(p, S, mx, my){
  const L=digitLayout(p,S);
  for (let i=0;i<L.length;i++){ const it=L[i];
    if (mx>it.x-it.w/2 && mx<it.x+it.w/2 && my>it.y-it.h/2 && my<it.y+it.h/2) return i; }
  return -1;
}

const TUT = {};

/* ─────────── TUTORIEL : FRACTIONS ─────────── */
TUT.fractions = {
  title: 'Fractions',
  steps: [
    {
      title: 'Partage le disque',
      hint: "Avec les boutons + et −, fais 4 parts égales.",
      onEnter(p, S, ui){
        S.parts = 2;
        ui.push({key:'minus', label:'−'});
        ui.push({key:'plus',  label:'+'});
      },
      layoutButtons(p, ui){
        const y = p.height*0.86, w=66, h=66;
        ui.find(b=>b.key==='minus').rect = {x:p.width*0.5-110, y:y-h/2, w, h};
        ui.find(b=>b.key==='plus').rect  = {x:p.width*0.5+44,  y:y-h/2, w, h};
      },
      onButton(p, S, key){
        if(key==='minus') S.parts = Math.max(1, S.parts-1);
        if(key==='plus')  S.parts = Math.min(8, S.parts+1);
      },
      draw(p, S){
        const cx=p.width*0.5, cy=p.height*0.46, r=p.height*0.27;
        disk(p, cx, cy, r, S.parts, {});
        bigCount(p, cx, cy+r+34, S.parts + (S.parts>1?' parts':' part'));
      },
      isDone(S){ return S.parts===4; }
    },
    {
      title: 'Colorie 3 parts',
      hint: "Clique sur les parts du disque pour en colorier 3.",
      onEnter(p, S){ S.parts=4; S.colored={}; },
      onCanvas(p, S){
        const cx=p.width*0.5, cy=p.height*0.46, r=p.height*0.27;
        const i = partAt(p, cx, cy, r, 4, p.mouseX, p.mouseY);
        if(i>=0){ S.colored[i] = !S.colored[i]; }
      },
      draw(p, S){
        const cx=p.width*0.5, cy=p.height*0.46, r=p.height*0.27;
        disk(p, cx, cy, r, 4, {colored:S.colored});
        const n = Object.values(S.colored).filter(Boolean).length;
        fraction(p, cx, cy+r+44, n, 4, n===3? '#e6d278':'#f0ece0');
      },
      isDone(S){ return Object.values(S.colored).filter(Boolean).length===3; }
    },
    {
      title: 'Simplifie la fraction',
      hint: "Voici 6/8. Clique sur les traits en pointillés pour regrouper les parts 2 par 2.",
      onEnter(p, S){ S.removed={}; },
      onCanvas(p, S){
        const cx=p.width*0.5, cy=p.height*0.46, r=p.height*0.27;
        const b = boundaryAt(p, cx, cy, r, 8, p.mouseX, p.mouseY);
        if(b>=0 && b%2===1) S.removed[b]=true;
      },
      draw(p, S){
        const cx=p.width*0.5, cy=p.height*0.46, r=p.height*0.27;
        const colored={}; for(let i=0;i<6;i++) colored[i]=true;
        disk(p, cx, cy, r, 8, {colored, removed:S.removed, dashedOdd:true});
        const done = [1,3,5,7].every(i=>S.removed[i]);
        fraction(p, cx, cy+r+44, done?3:6, done?4:8, done?'#e6d278':'#f0ece0');
      },
      isDone(S){ return [1,3,5,7].every(i=>S.removed[i]); }
    },
    {
      title: 'Bravo !',
      hint: "Tu as compris : 6/8 = 3/4. Plus le dénominateur est grand, plus les parts sont petites.",
      onEnter(p,S,ui){ ui.push({key:'finish', label:'Terminer ✓'}); },
      layoutButtons(p,ui){ ui.find(b=>b.key==='finish').rect={x:p.width*0.5-90,y:p.height*0.84,w:180,h:54}; },
      onButton(p,S,key){ if(key==='finish') window.location.href='tutoriels.html'; },
      draw(p,S){
        const cx=p.width*0.5, cy=p.height*0.42, r=p.height*0.2;
        const colored={0:true,1:true,2:true};
        disk(p, cx, cy, r, 4, {colored});
        fraction(p, cx, cy+r+40, 3, 4, '#e6d278');
      },
      isDone(){ return false; }
    }
  ]
};

/* ─────────── TUTORIEL : ENTIERS & DÉCIMAUX ─────────── */
TUT.decimaux = {
  title: 'Entiers & décimaux',
  steps: [
    {
      title: 'Trouve les dixièmes',
      hint: "Dans le nombre 3,42 , clique sur le chiffre des dixièmes.",
      onEnter(p,S){ S.picked=null; S.digits=[{c:'3',k:'u'},{c:',',k:null},{c:'4',k:'dix'},{c:'2',k:'cent'}]; },
      onCanvas(p,S){
        const idx = digitAt(p, S, p.mouseX, p.mouseY);
        if(idx>=0 && S.digits[idx].k) S.picked = S.digits[idx].k;
      },
      draw(p,S){ drawDigits(p,S, {dix:'#7ac8e6'}); },
      isDone(S){ return S.picked==='dix'; }
    },
    {
      title: 'Multiplier par 10',
      hint: "Combien fait 2,5 × 10 ? Clique sur la bonne réponse.",
      type:'choice',
      question:'2,5 × 10 = ?',
      options:[{label:'2,5',ok:false},{label:'25',ok:true},{label:'250',ok:false}]
    },
    {
      title: 'Diviser par 10',
      hint: "Combien fait 4 ÷ 10 ? Clique sur la bonne réponse.",
      type:'choice',
      question:'4 ÷ 10 = ?',
      options:[{label:'40',ok:false},{label:'0,4',ok:true},{label:'0,04',ok:false}]
    },
    {
      title: 'Encore une !',
      hint: "Combien fait 3,07 × 100 ? Clique sur la bonne réponse.",
      type:'choice',
      question:'3,07 × 100 = ?',
      options:[{label:'30,7',ok:false},{label:'307',ok:true},{label:'3070',ok:false}]
    },
    {
      title: 'Bravo !',
      hint: "Tu maîtrises le déplacement de la virgule : ×10 vers la droite, ÷10 vers la gauche.",
      onEnter(p,S,ui){ ui.push({key:'finish',label:'Terminer ✓'}); },
      layoutButtons(p,ui){ ui.find(b=>b.key==='finish').rect={x:p.width*0.5-90,y:p.height*0.7,w:180,h:54}; },
      onButton(p,S,key){ if(key==='finish') window.location.href='tutoriels.html'; },
      draw(p,S){ p.push(); p.textAlign(p.CENTER,p.CENTER); p.fill('#e6d278'); p.textFont('Playfair Display');
        p.textSize(p.height*0.13); p.text('★', p.width*0.5, p.height*0.4); p.pop(); },
      isDone(){ return false; }
    }
  ]
};

/* ════════════════════════════════════════════════════════════
   BIBLIOTHÈQUE D'ÉTAPES GÉNÉRIQUES
   Des fabriques réutilisables pour construire vite des tutoriels
   riches : QCM, multi-sélection, droite graduée, curseurs,
   grilles cliquables, figures cliquables, horloge, barres…
   ════════════════════════════════════════════════════════════ */

function FX(){ return (window.__fx || { shake:function(){} }); }

/* — QCM simple — */
function qcm(title, hint, question, options){
  return { title:title, hint:hint, type:'choice', question:question, options:options };
}

/* — Étape finale — */
function finish(msg, sym){
  return {
    title:'Bravo !', hint:msg,
    onEnter(p,S,ui){ ui.push({key:'finish',label:'Terminer ✓'}); },
    layoutButtons(p,ui){ ui.find(b=>b.key==='finish').rect={x:p.width*0.5-90,y:p.height*0.78,w:180,h:54}; },
    onButton(p,S,key){ if(key==='finish') window.location.href='tutoriels.html'; },
    draw(p,S){
      p.push(); p.textAlign(p.CENTER,p.CENTER); p.fill('#e6d278'); p.textFont('Playfair Display');
      p.textSize(p.height*0.14); p.text(sym||'★', p.width*0.5, p.height*0.42); p.pop();
    },
    isDone(){ return false; }
  };
}

/* — Multi-sélection : cliquer TOUTES les bonnes pastilles —
   items:[{label, ok}] · un mauvais clic secoue l'écran */
function multi(title, hint, items, opt){
  opt = opt || {};
  return {
    title:title, hint:hint,
    onEnter(p,S){ S.sel={}; S.wrongFlash={}; },
    _geom(p){
      const n=items.length, perRow=Math.min(n, opt.perRow || 4);
      const rows=Math.ceil(n/perRow);
      const bw=Math.min(opt.w||170, p.width*0.9/perRow - 14), bh=58, gx=16, gy=18;
      const out=[];
      for(let i=0;i<n;i++){
        const r=Math.floor(i/perRow), inRow=Math.min(perRow, n-r*perRow);
        const rowW=inRow*bw+(inRow-1)*gx;
        const x0=p.width/2-rowW/2, y0=p.height*(opt.y||0.42)-((rows-1)*(bh+gy))/2;
        const c=i-r*perRow;
        out.push({x:x0+c*(bw+gx), y:y0+r*(bh+gy), w:bw, h:bh, item:items[i], idx:i});
      }
      return out;
    },
    onCanvas(p,S){
      for(const g of this._geom(p)){
        if(p.mouseX>g.x&&p.mouseX<g.x+g.w&&p.mouseY>g.y&&p.mouseY<g.y+g.h){
          if(g.item.ok){ S.sel[g.idx]=true; }
          else { S.wrongFlash[g.idx]=p.frameCount; FX().shake(8); }
          return;
        }
      }
    },
    draw(p,S){
      if(opt.prompt) p.push(),p.textAlign(p.CENTER,p.CENTER),p.fill('rgba(240,236,224,0.85)'),
        p.textFont('Playfair Display'),p.textSize(Math.max(20,p.height*0.055)),
        p.text(opt.prompt,p.width/2,p.height*0.24),p.pop();
      for(const g of this._geom(p)){
        const sel=S.sel[g.idx];
        const wrong=S.wrongFlash[g.idx] && p.frameCount-S.wrongFlash[g.idx]<26;
        const hover=p.mouseX>g.x&&p.mouseX<g.x+g.w&&p.mouseY>g.y&&p.mouseY<g.y+g.h;
        p.push(); p.rectMode(p.CORNER);
        p.fill(wrong?'rgba(200,80,70,0.20)':sel?'rgba(130,214,160,0.16)':hover?'rgba(200,185,122,0.14)':'rgba(255,255,255,0.05)');
        p.stroke(wrong?'rgba(200,80,70,0.8)':sel?'#82d6a0':'rgba(200,185,122,0.45)'); p.strokeWeight(sel?2:1.4);
        p.rect(g.x,g.y,g.w,g.h,12);
        p.noStroke(); p.fill(sel?'#82d6a0':wrong?'rgba(220,140,130,1)':'#f0ece0');
        p.textAlign(p.CENTER,p.CENTER); p.textFont('DM Sans'); p.textStyle(p.BOLD);
        let ts=Math.max(15,g.h*0.32); p.textSize(ts);
        while(p.textWidth(g.item.label)>g.w-16 && ts>11){ ts--; p.textSize(ts); }
        p.text(g.item.label,g.x+g.w/2,g.y+g.h/2);
        if(sel){ p.textSize(13); p.fill('#82d6a0'); p.text('✓',g.x+g.w-13,g.y+13); }
        p.pop();
      }
      // compteur
      const okTot=items.filter(i=>i.ok).length, got=Object.keys(S.sel).length;
      bigCount(p,p.width/2,p.height*0.86, got+' / '+okTot+' trouvé'+(okTot>1?'s':''));
    },
    isDone(S){ return items.filter(i=>i.ok).length===Object.keys(S.sel).length; }
  };
}

/* — Droite graduée : cliquer la bonne graduation —
   accept(v) sinon v===target */
function numberline(title, hint, min, max, target, opt){
  opt = opt || {};
  const accept = opt.accept || (v => v===target);
  return {
    title:title, hint:hint,
    onEnter(p,S){ S.nlPick=null; S.nlWrong=null; },
    _geom(p){
      const y=p.height*0.5, x0=p.width*0.12, x1=p.width*0.88;
      const n=max-min, dx=(x1-x0)/n;
      return {y,x0,x1,min,max,dx};
    },
    onCanvas(p,S){
      const g=this._geom(p);
      if(Math.abs(p.mouseY-g.y)>60) return;
      const v=Math.round((p.mouseX-g.x0)/g.dx)+min;
      if(v<min||v>max) return;
      if(accept(v)){ S.nlPick=v; }
      else { S.nlWrong={v,f:p.frameCount}; FX().shake(8); }
    },
    draw(p,S){
      const g=this._geom(p);
      p.push();
      p.stroke('rgba(245,242,232,0.8)'); p.strokeWeight(2.4); p.line(g.x0-24,g.y,g.x1+24,g.y);
      // flèche
      p.line(g.x1+24,g.y,g.x1+12,g.y-6); p.line(g.x1+24,g.y,g.x1+12,g.y+6);
      p.textFont('DM Mono'); p.textAlign(p.CENTER,p.TOP); p.textSize(Math.max(13,p.height*0.032));
      for(let v=min; v<=max; v++){
        const x=g.x0+(v-min)*g.dx;
        const hov=Math.abs(p.mouseX-x)<g.dx/2 && Math.abs(p.mouseY-g.y)<60;
        const picked=S.nlPick===v;
        const wrong=S.nlWrong && S.nlWrong.v===v && p.frameCount-S.nlWrong.f<26;
        p.stroke(picked?'#82d6a0':wrong?'rgba(200,80,70,0.9)':hov?'rgba(200,185,122,0.9)':'rgba(245,242,232,0.65)');
        p.strokeWeight(picked||hov?3:1.8);
        p.line(x,g.y-(picked?16:10),x,g.y+(picked?16:10));
        p.noStroke();
        p.fill(picked?'#82d6a0':wrong?'rgba(220,140,130,1)':v===0?'rgba(230,210,120,0.9)':'rgba(240,236,224,0.7)');
        p.text(String(v).replace('-','−'), x, g.y+22);
        if(picked){ p.fill('#82d6a0'); p.circle(x,g.y,10); }
      }
      p.pop();
      if(opt.legend) bigCount(p,p.width/2,p.height*0.78,opt.legend);
    },
    isDone(S){ return S.nlPick!=null; }
  };
}

/* — Curseur − / + : atteindre une valeur cible avec un rendu visuel — */
function stepper(title, hint, cfg){
  // cfg : {min,max,start,target,render(p,S,val),fmt(val)}
  return {
    title:title, hint:hint,
    onEnter(p,S,ui){ S.val=cfg.start; ui.push({key:'minus',label:'−'}); ui.push({key:'plus',label:'+'}); },
    layoutButtons(p,ui){
      const y=p.height*0.86,w=66,h=66;
      ui.find(b=>b.key==='minus').rect={x:p.width*0.5-110,y:y-h/2,w,h};
      ui.find(b=>b.key==='plus').rect ={x:p.width*0.5+44, y:y-h/2,w,h};
    },
    onButton(p,S,key){
      const st=cfg.step||1;
      if(key==='minus') S.val=Math.max(cfg.min,S.val-st);
      if(key==='plus')  S.val=Math.min(cfg.max,S.val+st);
    },
    draw(p,S){ cfg.render(p,S,S.val); },
    isDone(S){ return S.val===cfg.target; }
  };
}

/* — Grille : cliquer la bonne case (symétries, translation, points) — */
function gridPick(title, hint, cfg){
  // cfg : {cols, rows, target:[i,j], drawExtra(p,S,G), axes:bool}
  return {
    title:title, hint:hint,
    onEnter(p,S){ S.gPick=null; S.gWrong=null; },
    _G(p){
      const cols=cfg.cols, rows=cfg.rows;
      const cs=Math.min(p.width*0.8/cols, p.height*0.62/rows);
      const x0=p.width/2-cols*cs/2, y0=p.height*0.52-rows*cs/2;
      return {cols,rows,cs,x0,y0,
        cx:(i)=>x0+i*cs, cy:(j)=>y0+j*cs,
        cellAt:(mx,my)=>{
          const i=Math.floor((mx-x0)/cs), j=Math.floor((my-y0)/cs);
          return (i>=0&&i<cols&&j>=0&&j<rows)?[i,j]:null;
        }};
    },
    onCanvas(p,S){
      const G=this._G(p), c=G.cellAt(p.mouseX,p.mouseY);
      if(!c) return;
      if(c[0]===cfg.target[0]&&c[1]===cfg.target[1]){ S.gPick=c; }
      else { S.gWrong={c,f:p.frameCount}; FX().shake(8); }
    },
    draw(p,S){
      const G=this._G(p);
      p.push();
      p.stroke('rgba(245,242,232,0.14)'); p.strokeWeight(1);
      for(let i=0;i<=G.cols;i++) p.line(G.cx(i),G.y0,G.cx(i),G.y0+G.rows*G.cs);
      for(let j=0;j<=G.rows;j++) p.line(G.x0,G.cy(j),G.x0+G.cols*G.cs,G.cy(j));
      // survol
      const c=G.cellAt(p.mouseX,p.mouseY);
      if(c){ p.noStroke(); p.fill('rgba(200,185,122,0.10)');
        p.rect(G.cx(c[0]),G.cy(c[1]),G.cs,G.cs); }
      if(S.gWrong && p.frameCount-S.gWrong.f<26){ p.noStroke(); p.fill('rgba(200,80,70,0.25)');
        p.rect(G.cx(S.gWrong.c[0]),G.cy(S.gWrong.c[1]),G.cs,G.cs); }
      if(S.gPick){ p.noStroke(); p.fill('rgba(130,214,160,0.28)');
        p.rect(G.cx(S.gPick[0]),G.cy(S.gPick[1]),G.cs,G.cs);
        p.fill('#82d6a0'); p.circle(G.cx(S.gPick[0])+G.cs/2,G.cy(S.gPick[1])+G.cs/2,12); }
      p.pop();
      if(cfg.drawExtra) cfg.drawExtra(p,S,G);
    },
    isDone(S){ return !!S.gPick; }
  };
}

/* — Figure à côtés cliquables (triangles, etc.) —
   cfg : {pts:(p)=>[{x,y,name}], sides:[[a,b,ok,label]], marks(p,S,P)} */
function sidePick(title, hint, cfg){
  return {
    title:title, hint:hint,
    onEnter(p,S){ S.sPick=null; S.sWrong=null; },
    onCanvas(p,S){
      const P=cfg.pts(p);
      for(let k=0;k<cfg.sides.length;k++){
        const [a,b,ok]=cfg.sides[k];
        if(distSeg(p.mouseX,p.mouseY,P[a].x,P[a].y,P[b].x,P[b].y)<14){
          if(ok){ S.sPick=k; } else { S.sWrong={k,f:p.frameCount}; FX().shake(8); }
          return;
        }
      }
    },
    draw(p,S){
      const P=cfg.pts(p);
      p.push();
      for(let k=0;k<cfg.sides.length;k++){
        const [a,b,,label]=cfg.sides[k];
        const hov=distSeg(p.mouseX,p.mouseY,P[a].x,P[a].y,P[b].x,P[b].y)<14;
        const picked=S.sPick===k;
        const wrong=S.sWrong&&S.sWrong.k===k&&p.frameCount-S.sWrong.f<26;
        p.stroke(picked?'#82d6a0':wrong?'rgba(200,80,70,0.9)':hov?'rgba(200,185,122,0.95)':'rgba(245,242,232,0.8)');
        p.strokeWeight(picked?4.5:hov?3.6:2.6);
        p.line(P[a].x,P[a].y,P[b].x,P[b].y);
        if(label){
          const mx=(P[a].x+P[b].x)/2, my=(P[a].y+P[b].y)/2;
          const nx=-(P[b].y-P[a].y), ny=P[b].x-P[a].x, nl=Math.hypot(nx,ny);
          p.push(); p.noStroke(); p.fill('rgba(240,236,224,0.65)');
          p.textFont('DM Mono'); p.textSize(Math.max(13,p.height*0.032)); p.textAlign(p.CENTER,p.CENTER);
          p.text(label, mx+nx/nl*22, my+ny/nl*22); p.pop();
        }
      }
      // sommets
      p.noStroke(); p.fill('rgba(240,236,224,0.9)');
      p.textFont('Playfair Display'); p.textSize(Math.max(15,p.height*0.04)); p.textAlign(p.CENTER,p.CENTER);
      for(const pt of P){ if(pt.name) p.text(pt.name, pt.x+(pt.lx||0), pt.y+(pt.ly||0)); }
      p.pop();
      if(cfg.marks) cfg.marks(p,S,P);
    },
    isDone(S){ return S.sPick!=null; }
  };
}
function distSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
  let t=L2? ((px-ax)*dx+(py-ay)*dy)/L2 : 0; t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}

/* — Colorier k cases d'une barre (pourcentages, fractions) — */
function barColor(title, hint, n, k, opt){
  opt=opt||{};
  return {
    title:title, hint:hint,
    onEnter(p,S){ S.bar={}; },
    _G(p){ const w=p.width*0.7, x0=p.width*0.15, y=p.height*0.46, h=64;
      return {x0,y,h,seg:w/n,n}; },
    onCanvas(p,S){
      const G=this._G(p);
      if(p.mouseY<G.y||p.mouseY>G.y+G.h) return;
      const i=Math.floor((p.mouseX-G.x0)/G.seg);
      if(i>=0&&i<n){ S.bar[i]=!S.bar[i]; }
    },
    draw(p,S){
      const G=this._G(p);
      p.push();
      for(let i=0;i<n;i++){
        const x=G.x0+i*G.seg;
        const on=S.bar[i];
        const hov=p.mouseX>x&&p.mouseX<x+G.seg&&p.mouseY>G.y&&p.mouseY<G.y+G.h;
        p.fill(on?'rgba(122,200,230,0.45)':hov?'rgba(200,185,122,0.12)':'rgba(255,255,255,0.04)');
        p.stroke('rgba(245,242,232,0.7)'); p.strokeWeight(1.6);
        p.rect(x,G.y,G.seg,G.h);
      }
      p.pop();
      const c=Object.values(S.bar).filter(Boolean).length;
      const pct=Math.round(c/n*100);
      bigCount(p,p.width/2,G.y+G.h+46, opt.fmt? opt.fmt(c,n,pct) : (c+' / '+n+'   =   '+pct+' %'));
    },
    isDone(S){ return Object.values(S.bar).filter(Boolean).length===k; }
  };
}

/* — Horloge réglable (durées) — */
function clockStep(title, hint, cfg){
  // cfg : {startH,startM,targetH,targetM,stepMin}
  return {
    title:title, hint:hint,
    onEnter(p,S,ui){
      S.min=cfg.startH*60+cfg.startM;
      ui.push({key:'m15',label:'+15 min'}); ui.push({key:'h1',label:'+1 h'});
    },
    layoutButtons(p,ui){
      const y=p.height*0.87,h=52;
      ui.find(b=>b.key==='m15').rect={x:p.width*0.5-150,y:y-h/2,w:130,h};
      ui.find(b=>b.key==='h1').rect ={x:p.width*0.5+20, y:y-h/2,w:130,h};
    },
    onButton(p,S,key){
      if(key==='m15') S.min+=15;
      if(key==='h1')  S.min+=60;
      if(S.min>cfg.targetH*60+cfg.targetM){ S.min=cfg.startH*60+cfg.startM; FX().shake(8); }
    },
    draw(p,S){
      const cx=p.width*0.38, cy=p.height*0.5, r=Math.min(p.height*0.24,p.width*0.16);
      const h=Math.floor(S.min/60)%12, m=S.min%60;
      p.push();
      p.noFill(); p.stroke('rgba(245,242,232,0.85)'); p.strokeWeight(2.6); p.circle(cx,cy,r*2);
      p.textFont('DM Mono'); p.textSize(Math.max(12,r*0.16)); p.fill('rgba(240,236,224,0.7)'); p.noStroke(); p.textAlign(p.CENTER,p.CENTER);
      for(let k=1;k<=12;k++){ const a=-Math.PI/2+k*Math.PI/6;
        p.text(k, cx+Math.cos(a)*r*0.82, cy+Math.sin(a)*r*0.82); }
      const ah=-Math.PI/2+(h+m/60)*Math.PI/6, am=-Math.PI/2+m*Math.PI/30;
      p.stroke('rgba(230,210,120,0.95)'); p.strokeWeight(4.5); p.line(cx,cy,cx+Math.cos(ah)*r*0.5,cy+Math.sin(ah)*r*0.5);
      p.stroke('rgba(122,200,230,0.95)'); p.strokeWeight(2.6); p.line(cx,cy,cx+Math.cos(am)*r*0.72,cy+Math.sin(am)*r*0.72);
      p.noStroke(); p.fill('rgba(245,242,232,0.9)'); p.circle(cx,cy,7);
      p.pop();
      const H=Math.floor(S.min/60), M=S.min%60;
      const elapsed=S.min-(cfg.startH*60+cfg.startM);
      p.push(); p.textAlign(p.CENTER,p.CENTER);
      p.fill('#f0ece0'); p.textFont('Playfair Display'); p.textSize(p.height*0.085);
      p.text((H<10?'0':'')+H+' h '+(M<10?'0':'')+M, p.width*0.72, p.height*0.40);
      p.fill('rgba(130,210,160,0.9)'); p.textFont('DM Mono'); p.textSize(p.height*0.038);
      p.text('temps écoulé : '+Math.floor(elapsed/60)+' h '+(elapsed%60<10?'0':'')+(elapsed%60)+' min', p.width*0.72, p.height*0.55);
      p.pop();
    },
    isDone(S){ return S.min===cfg.targetH*60+cfg.targetM; }
  };
}

TUT.equation1 = { title:'Équations du 1er degré', steps:[

TUT.angles = { title:'Angles et parallélisme', steps:[
  {
    title:'Trouve l\'alterne-interne', hint:"Deux droites parallèles coupées par une sécante. L'angle jaune est marqué. Clique sur l'angle ALTERNE-INTERNE (entre les parallèles, de l'autre côté de la sécante).",
    onEnter(p,S){ S.aPick=null; S.aWrong=null; },
    _zones(p){
      const y1=p.height*0.36, y2=p.height*0.66;
      const secX = y => p.width*0.30 + (y-y1)/(y2-y1)*p.width*0.32;
      return [
        {x:secX(y1)+34, y:y1+22, ok:false, id:0},   // correspondant (au-dessus impossible: en dessous de d1 côté droit) → correspond côté même
        {x:secX(y2)+34, y:y2-22, ok:true,  id:1},   // alterne-interne
        {x:secX(y2)-34, y:y2+22, ok:false, id:2},   // externe
      ];
    },
    onCanvas(p,S){
      for(const z of this._zones(p)){
        if(Math.hypot(p.mouseX-z.x,p.mouseY-z.y)<26){
          if(z.ok) S.aPick=z.id; else { S.aWrong={id:z.id,f:p.frameCount}; FX().shake(8); }
          return;
        }
      }
    },
    draw(p,S){
      const y1=p.height*0.36, y2=p.height*0.66;
      const secX = y => p.width*0.30 + (y-y1)/(y2-y1)*p.width*0.32;
      p.push();
      p.stroke('rgba(245,242,232,0.8)'); p.strokeWeight(2.4);
      p.line(p.width*0.1,y1,p.width*0.9,y1);
      p.line(p.width*0.1,y2,p.width*0.9,y2);
      p.stroke('rgba(200,185,122,0.85)');
      const ext=0.28;
      p.line(secX(y1-(y2-y1)*ext), y1-(y2-y1)*ext, secX(y2+(y2-y1)*ext), y2+(y2-y1)*ext);
      // angle marqué : sous d1, côté gauche de la sécante
      p.noFill(); p.stroke('#e6d278'); p.strokeWeight(3);
      p.arc(secX(y1),y1, 46,46, Math.PI*0.25, Math.PI);
      p.noStroke(); p.fill('#e6d278'); p.textFont('DM Mono'); p.textSize(Math.max(12,p.height*0.03));
      p.textAlign(p.CENTER,p.CENTER); p.text('α', secX(y1)-34, y1+26);
      // zones cliquables
      for(const z of this._zones(p)){
        const hov=Math.hypot(p.mouseX-z.x,p.mouseY-z.y)<26;
        const picked=S.aPick===z.id;
        const wrong=S.aWrong&&S.aWrong.id===z.id&&p.frameCount-S.aWrong.f<26;
        p.noFill(); p.stroke(picked?'#82d6a0':wrong?'rgba(200,80,70,0.9)':hov?'rgba(200,185,122,0.9)':'rgba(245,242,232,0.4)');
        p.strokeWeight(picked?3:2); p.circle(z.x,z.y,44);
        p.noStroke(); p.fill(picked?'#82d6a0':'rgba(240,236,224,0.7)');
        p.text('?', z.x, z.y);
      }
      p.pop();
    },
    isDone(S){ return S.aPick!=null; }
  },
  qcm('La propriété', "Quand les droites sont parallèles, les angles alternes-internes sont…",
    'Alternes-internes = ?', [{label:'égaux',ok:true},{label:'complémentaires',ok:false},{label:'opposés',ok:false}]),
  qcm('La réciproque', "Si deux angles alternes-internes sont égaux, alors les deux droites sont…",
    'Alors les droites sont…', [{label:'parallèles',ok:true},{label:'perpendiculaires',ok:false},{label:'sécantes',ok:false}]),
  finish("Parallèles + sécante : alternes-internes égaux, correspondants égaux. Et la réciproque prouve le parallélisme.")
]};

TUT.homotheties = { title:'Homothéties', steps:[
  stepper('Agrandis la figure', "Une homothétie de centre O et de rapport k multiplie toutes les distances à O par k. Règle k pour DOUBLER le carré bleu (k = 2).",
    { min:1, max:6, start:1, step:1, target:4,
      render(p,S,v){
        const k=[0.5,1,1.5,2,2.5,3][v-1];
        const Ox=p.width*0.24, Oy=p.height*0.56;
        const base=Math.min(p.width,p.height)*0.11;
        p.push();
        p.noStroke(); p.fill('#e6d278'); p.circle(Ox,Oy,9);
        p.fill('rgba(240,236,224,0.85)'); p.textFont('Playfair Display'); p.textSize(p.height*0.04);
        p.textAlign(p.CENTER,p.CENTER); p.text('O',Ox,Oy+26);
        // carré d'origine (fantôme, k=1)
        p.noFill(); p.stroke('rgba(122,200,230,0.4)'); p.strokeWeight(1.6);
        p.rect(Ox+base*1.4,Oy-base,base,base);
        // carré transformé

        p.rect(Ox+base*1.4*k,Oy-base*k,base*k,base*k);

        p.line(Ox,Oy,Ox+base*1.4*k+base*k,Oy-base*k);

        p.pop();
        bigCount(p,p.width*0.72,p.height*0.24,'k = '+String(k).replace('.',','));

  qcm('Effet sur les longueurs', "Homothétie de rapport k = 3 : toutes les longueurs sont…",

TUT['stats-organisation'] = { title:'Organisation des données', steps:[
  {
    title:'Lis le diagramme', hint:"Voici les sports préférés d'une classe. Clique sur la barre du sport le PLUS choisi.",
    onEnter(p,S){ S.bPick=null; S.bWrong=null; },
    _bars(p){
      const data=[{l:'Foot',v:9},{l:'Danse',v:12},{l:'Judo',v:5},{l:'Natation',v:8}];
      const bw=p.width*0.13, gap=p.width*0.055, x0=p.width/2-(4*bw+3*gap)/2;
      const y0=p.height*0.78, maxH=p.height*0.42;
      return data.map((d,i)=>({...d, ok:d.v===12, x:x0+i*(bw+gap), w:bw, h:d.v/12*maxH, y0}));
    },
    onCanvas(p,S){
      this._bars(p).forEach((b,i)=>{
        if(p.mouseX>b.x&&p.mouseX<b.x+b.w&&p.mouseY>b.y0-b.h&&p.mouseY<b.y0){
          if(b.ok) S.bPick=i; else { S.bWrong={i,f:p.frameCount}; FX().shake(8); }
        }
      });
    },
    draw(p,S){
      p.push();
      this._bars(p).forEach((b,i)=>{

    onEnter(p,S){ S.secPick=null; S.secWrong=null; },
    _secs(){ return [ {a0:-Math.PI/2, a1:Math.PI/2, ok:true, label:'?'},
                      {a0:Math.PI/2, a1:Math.PI, ok:false, label:'?'},
                      {a0:Math.PI, a1:Math.PI*1.5, ok:false, label:'?'} ]; },
    onCanvas(p,S){
      const cx=p.width/2, cy=p.height*0.5, r=Math.min(p.height*0.27,p.width*0.2);
      const d=Math.hypot(p.mouseX-cx,p.mouseY-cy); if(d>r) return;
      let a=Math.atan2(p.mouseY-cy,p.mouseX-cx);
      const secs=this._secs();
      for(let i=0;i<secs.length;i++){
        let aa=a; while(aa<secs[i].a0) aa+=Math.PI*2;
        if(aa>=secs[i].a0&&aa<secs[i].a1){
          if(secs[i].ok) S.secPick=i; else { S.secWrong={i,f:p.frameCount}; FX().shake(8); }
          return;
        }
      }

    draw(p,S){
      const cx=p.width/2, cy=p.height*0.5, r=Math.min(p.height*0.27,p.width*0.2);

        p.fill(picked?'rgba(130,214,160,0.55)':wrong?'rgba(200,80,70,0.45)':cols[i]);

        p.arc(cx,cy,r*2,r*2,s.a0,s.a1,p.PIE);

    },

]};



/* ════════════════════════════════════════════════════════════
   LES TUTORIELS PAR COMPÉTENCE
   Chaque chapitre est découpé en PARTIES : une par compétence
   travaillée dans les familles d'exercices du site. Les étapes
   dessinées à la main plus haut sont réutilisées (OLD.x.steps[i]),

   part(nom, ...étapes) étiquette les étapes avec la compétence.

const OLD = Object.assign({}, TUT);
function part(nom){
  const out = [];
  for (let i = 1; i < arguments.length; i++){
    const st = arguments[i];
    if (!st) continue;
    out.push(Object.assign({}, st, { part: nom }));
  }
  return out;
}

  finish("P = favorables/total (équiprobabilité) · 0 ≤ P ≤ 1 · la somme des probabilités vaut 1 · P(contraire) = 1 − P · deux épreuves : on compte les couples d'issues.")
]}; })();

/* Chapitres du site sans famille en base : les tutoriels d'origine restent
   tels quels (inequations, systemes, parallelogrammes, perimetres, prisme,
   pyramides, triangles-semblables, proba-vocab, stats-graphiques). */

/* ════════════════════════════════════════════════════════════
   LE MOTEUR
   ════════════════════════════════════════════════════════════ */
const params = new URLSearchParams(location.search);
const chId = params.get('ch') || 'fractions';

const placeholder = {
  title: (params.get('title') || 'Ce chapitre'),
  steps: [{
    title:'Tutoriel en préparation',
    hint:"Ce tutoriel interactif arrive bientôt. Reviens vite !",
    onEnter(p,S,ui){ ui.push({key:'back',label:'← Retour'}); },
    layoutButtons(p,ui){ ui.find(b=>b.key==='back').rect={x:p.width*0.5-90,y:p.height*0.72,w:180,h:54}; },
    onButton(p,S,key){ if(key==='back') window.location.href='tutoriels.html'; },
    draw(p,S){ p.push(); p.textAlign(p.CENTER,p.CENTER); p.fill('rgba(200,185,122,0.5)'); p.textFont('Playfair Display');
      p.textSize(p.height*0.16); p.text('✎', p.width*0.5, p.height*0.42); p.pop(); },
    isDone(){ return false; }
  }]
};

const tut = TUT[chId] || placeholder;
document.getElementById('tut-title').textContent = tut.title;

/* Les compétences (parties) du tutoriel, dans l'ordre d'apparition. */
const PARTS = [];
tut.steps.forEach((st, i) => {
  if (st.part && !PARTS.some(pt => pt.nom === st.part)) PARTS.push({ nom: st.part, debut: i });
});
(function(){
  const host = document.getElementById('parts');
  if (!PARTS.length) { host.style.display = 'none'; return; }
  PARTS.forEach((pt, k) => {
    const b = document.createElement('button');
    b.className = 'part-chip'; b.textContent = (k + 1) + '. ' + pt.nom; b.title = pt.nom;
    b.addEventListener('click', () => { if (window.__goto) window.__goto(pt.debut); });
    pt.el = b; host.appendChild(b);
  });
})();
function partIndexOf(i){
  let k = -1;
  PARTS.forEach((pt, j) => { if (i >= pt.debut) k = j; });
  return k;
}

const sketch = (p) => {
  let stepIndex = 0;
  let S = {};
  let ui = [];
  let stepDone = false;
  let celebrate = 0;       // frames restants de célébration
  let confetti = [];
  let fadeIn = 0;          // 0..1 transition d'entrée
  let shake = 0;

  // hook : les étapes de la bibliothèque peuvent secouer l'écran
  window.__fx = { shake: v => { shake = Math.max(shake, v); } };

  function setupCanvas(){
    const host = document.getElementById('canvas-host');
    const w = host.clientWidth || 900;
    return p.createCanvas(w, Math.round(w*0.6));
  }

  p.setup = () => {
    const c = setupCanvas();
    c.parent('canvas-host');
    p.textFont('DM Sans');
    enterStep();
  };

  p.windowResized = () => {
    const host = document.getElementById('canvas-host');
    const w = host.clientWidth || 900;
    p.resizeCanvas(w, Math.round(w*0.6));
    layout();
  };

  function enterStep(){
    ui = [];
    stepDone = false;
    celebrate = 0;
    confetti = [];
    fadeIn = 0;
    const st = tut.steps[stepIndex];
    if (st.onEnter) st.onEnter(p, S, ui);
    layout();
    updateProgress();
  }

  function layout(){
    const st = tut.steps[stepIndex];
    if (st.type === 'choice') layoutChoice(st);
    else if (st.layoutButtons) st.layoutButtons(p, ui);
  }

  function layoutChoice(st){
    const n = st.options.length;
    const maxLbl = Math.max(...st.options.map(o => o.label.length));
    const bw = Math.min(maxLbl > 14 ? 240 : 170, p.width*0.29), bh = 60, gap = p.width*0.03;
    const totalW = n*bw + (n-1)*gap;
    const x0 = p.width/2 - totalW/2, y = p.height*0.66;
    ui = st.options.map((o,i)=>({key:'opt'+i, label:o.label, ok:o.ok,
      rect:{x:x0+i*(bw+gap), y, w:bw, h:bh}, wrong:false}));
  }

  function updateProgress(){
    const total = tut.steps.length;
    document.getElementById('progress-fill').style.width = ((stepIndex)/total*100)+'%';
    const k = partIndexOf(stepIndex);
    document.getElementById('progress-label').textContent =
      `Étape ${stepIndex+1} / ${total}` + (k >= 0 ? ` · compétence ${k+1} / ${PARTS.length}` : '');
    PARTS.forEach((pt, j) => {
      pt.el.classList.toggle('active', j === k);
      pt.el.classList.toggle('done', j < k);
    });
  }

  /* Sauter à une étape (puces des compétences). */
  window.__goto = (i) => {
    if (celebrate > 0 || i < 0 || i >= tut.steps.length) return;
    stepIndex = i; S = {}; enterStep();
  };

  p.draw = () => {
    // fond tableau sombre
    p.background(13,18,15);
    drawGrain();

    if (fadeIn < 1) fadeIn = Math.min(1, fadeIn + 0.06);

    const st = tut.steps[stepIndex];

    p.push();
    p.translate((1-easeOut(fadeIn))* p.width*0.06, 0);
    p.drawingContext.globalAlpha = fadeIn;

    // titre + consigne
    p.push();
    p.textAlign(p.CENTER, p.TOP);
    p.fill(200,185,122); p.textFont('DM Mono'); p.textSize(Math.max(11,p.width*0.014));
    if (st.part){
      const k = partIndexOf(stepIndex);
      p.fill(240,236,224,110); p.textSize(Math.max(10,p.width*0.012));
      p.text(('Compétence '+(k+1)+' / '+PARTS.length+' — '+st.part).toUpperCase(), p.width/2, p.height*0.012);
      p.fill(200,185,122); p.textSize(Math.max(11,p.width*0.014));
    }
    p.text(('Étape '+(stepIndex+1)+' · '+st.title).toUpperCase(), p.width/2, p.height*0.05);
    p.fill(240,236,224,210); p.textFont('DM Sans'); p.textSize(Math.max(14,p.width*0.020));
    wrapText(p, st.hint, p.width/2, p.height*0.105, p.width*0.84, p.width*0.028);
    p.pop();

    if (shake>0){ p.translate(Math.sin(p.frameCount*1.2)*shake, 0); shake*=0.85; if(shake<0.3) shake=0; }

    if (st.type === 'choice') drawChoice(p, st);
    else if (st.draw) st.draw(p, S);

    drawButtons(p);
    p.drawingContext.globalAlpha = 1;
    p.pop();

    // détection de réussite
    if (!stepDone && st.isDone && st.isDone(S)){ triggerComplete(); }

    // célébration
    if (celebrate > 0){
      drawConfetti(p);
      drawBravo(p);
      celebrate--;
      if (celebrate === 0) goNext();
    }
  };

  function drawChoice(p, st){
    p.push();
    p.textAlign(p.CENTER, p.CENTER);
    p.fill(240,236,224); p.textFont('Playfair Display');
    let size = p.height*0.11;
    p.textSize(size);
    while (p.textWidth(st.question) > p.width*0.88 && size > p.height*0.045){
      size *= 0.93; p.textSize(size);
    }
    p.text(st.question, p.width/2, p.height*0.40);
    p.pop();
  }

  function drawButtons(p){
    for (const b of ui){
      if (!b.rect) continue;
      const {x,y,w,h} = b.rect;
      const hover = p.mouseX>x && p.mouseX<x+w && p.mouseY>y && p.mouseY<y+h;
      p.push();
      p.rectMode(p.CORNER);
      p.noStroke();
      p.fill(b.wrong ? 'rgba(200,80,70,0.18)' : (hover ? 'rgba(200,185,122,0.16)' : 'rgba(255,255,255,0.05)'));
      p.stroke(b.wrong ? 'rgba(200,80,70,0.7)' : 'rgba(200,185,122,0.45)'); p.strokeWeight(1.4);
      p.rect(x, y, w, h, 12);
      p.noStroke();
      p.fill(b.wrong ? 'rgba(220,140,130,1)' : '#f0ece0');
      p.textAlign(p.CENTER, p.CENTER);
      p.textFont('DM Sans'); p.textStyle(p.BOLD);
      let ts = Math.max(18, h*0.4); p.textSize(ts);
      while (p.textWidth(b.label) > w-18 && ts > 11){ ts--; p.textSize(ts); }
      p.text(b.label, x+w/2, y+h/2);
      p.pop();
    }
  }

  p.mousePressed = () => {
    if (celebrate > 0) return;
    const st = tut.steps[stepIndex];
    // boutons
    for (const b of ui){
      if (!b.rect) continue;
      const {x,y,w,h} = b.rect;
      if (p.mouseX>x && p.mouseX<x+w && p.mouseY>y && p.mouseY<y+h){
        if (st.type === 'choice'){
          if (b.ok){ triggerComplete(); }
          else { b.wrong = true; shake = 8; setTimeout(()=>{ b.wrong=false; }, 500); }
        } else if (st.onButton){
          st.onButton(p, S, b.key);
          layout();
        }
        return;
      }
    }
    // clic libre sur le canvas
    if (st.onCanvas){ st.onCanvas(p, S); }
  };

  function triggerComplete(){
    if (stepDone) return;
    stepDone = true;
    celebrate = 70;
    // confetti
    confetti = [];
    for (let i=0;i<70;i++){
      confetti.push({ x:p.width/2, y:p.height*0.45,
        vx:(Math.random()-0.5)*9, vy:(Math.random()-0.9)*11,
        c:[ '#c8b97a','#7ac8e6','#82d6a0','#e6d278' ][i%4], s:3+Math.random()*4, a:1 });
    }
  }

  function drawConfetti(p){
    p.push(); p.noStroke();
    for (const c of confetti){
      c.x+=c.vx; c.y+=c.vy; c.vy+=0.35; c.a-=0.013;
      p.fill(p.color(c.c)); p.drawingContext.globalAlpha=Math.max(0,c.a);
      p.rect(c.x, c.y, c.s, c.s);
    }
    p.drawingContext.globalAlpha=1; p.pop();
  }

  function drawBravo(p){
    const t = 1 - celebrate/70;
    p.push();
    p.textAlign(p.CENTER, p.CENTER);
    p.drawingContext.globalAlpha = Math.min(1, t*3) * Math.min(1,(celebrate/12));
    p.fill('#82d6a0'); p.textFont('Playfair Display'); p.textSize(p.height*0.10);
    p.text('Bravo !', p.width/2, p.height*0.30);
    p.pop();
  }

  function goNext(){
    if (stepIndex < tut.steps.length-1){ stepIndex++; enterStep(); }
    else {
      document.getElementById('progress-fill').style.width='100%';
      document.getElementById('progress-label').textContent='Terminé ✓';
    }
  }

  // ── helpers de dessin partagés ──
  function drawGrain(){
    p.push(); p.noStroke();
    for (let y=0;y<p.height;y+=4){ p.fill(255,255,255, y%8===0?4:0); p.rect(0,y,p.width,1); }
    p.pop();
  }
  function wrapText(p, str, cx, y, maxW, lh){
    const words=str.split(' '); let line='', yy=y;
    for (const w of words){ const test=line?line+' '+w:w;
      if (p.textWidth(test)>maxW){ p.text(line, cx, yy); line=w; yy+=lh; } else line=test; }
    p.text(line, cx, yy);
  }
  function easeOut(t){ return 1-Math.pow(1-t,3); }

  // contrôles externes
  window.__restart = () => { S={}; stepIndex=0; enterStep(); };
  window.__skip = () => { if(celebrate===0){ goNext(); } };
};

new p5(sketch);
</script>
