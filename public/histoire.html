<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymates — Histoire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="histoire.css">
<script src="matiere.js"></script>
<script src="auth.js" data-protect data-sans-chip></script>
<script src="contenu-histoire.js"></script>
</head>
<body data-matiere="histoire">

<header class="bandeau">
  <a class="bandeau-titre" href="matieres.html">Poly<em>mates</em></a>
  <div class="bandeau-droite">
    <span id="lecteur"></span>
    <a href="matieres.html">Changer de matière</a>
    <button type="button" id="sortir">Se déconnecter</button>
  </div>
</header>

<nav class="outils" aria-label="Outils">
  <div class="outils-dedans">
    <div class="fil" id="fil"></div>

    <div class="classes" role="group" aria-label="Filtrer par classe">
      <span class="classes-nom">Classe</span>
      <div id="classes" style="display:flex;align-items:center;gap:.3rem;flex-wrap:wrap"></div>
    </div>

    <button type="button" class="outil-btn" id="ouvrir-recherche">
      Chercher <kbd>/</kbd>
    </button>
    <button type="button" class="outil-btn" id="aller-reviser">Réviser</button>
  </div>
</nav>

<div id="page"></div>

<p class="colophon">Polymates — Histoire · collège et lycée</p>

<div class="voile" id="voile" role="dialog" aria-modal="true" aria-label="Recherche">
  <div class="chercheur">
    <input type="search" id="q" placeholder="Une date, un chapitre, une notion, un personnage…"
           autocomplete="off" spellcheck="false" aria-label="Rechercher">
    <div class="resultats" id="resultats"></div>
    <div class="chercheur-pied">
      <span>↑ ↓ pour naviguer</span><span>↵ pour ouvrir</span><span>Échap pour fermer</span>
    </div>
  </div>
</div>

<div id="billet" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  const H = window.HISTOIRE;
  const page = document.getElementById("page");

  /* ══════════════════════════════════════════════════════════════
     Mémoire locale : chapitres révisés, scores, classe choisie.
     Tout passe par try/catch : si le stockage est indisponible, la
     plateforme fonctionne, elle oublie simplement d’une visite à
     l’autre.
     ══════════════════════════════════════════════════════════════ */
  const Memoire = (function () {
    const CLE = "mb_histoire";
    let etat = { vus: {}, scores: {}, classe: "tous", dernier: null, cartes: {} };
    try {
      const brut = JSON.parse(localStorage.getItem(CLE));
      if (brut && typeof brut === "object") etat = Object.assign(etat, brut);
    } catch (_) {}
    function ranger() { try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (_) {} }
    return {
      etat,
      vu(id) { return !!etat.vus[id]; },
      basculerVu(id) {
        if (etat.vus[id]) delete etat.vus[id]; else etat.vus[id] = Date.now();
        ranger(); return !!etat.vus[id];
      },
      score(id, juste, total) { etat.scores[id] = { juste, total, quand: Date.now() }; ranger(); },
      scoreDe(id) { return etat.scores[id] || null; },
      classe(v) { if (v === undefined) return etat.classe; etat.classe = v; ranger(); },
      dernier(v) { if (v === undefined) return etat.dernier; etat.dernier = v; ranger(); },
      carte(cle, su) { etat.cartes[cle] = su; ranger(); },
      oublier() { etat.vus = {}; etat.scores = {}; etat.cartes = {}; etat.dernier = null; ranger(); },
    };
  })();

  /* ── Petites aides ─────────────────────────────────────────────── */
  function el(balise, classe, texte) {
    const n = document.createElement(balise);
    if (classe) n.className = classe;
    if (texte !== undefined) n.textContent = texte;
    return n;
  }
  function svgEl(nom, attrs) {
    const n = document.createElementNS("http://www.w3.org/2000/svg", nom);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  let minuteurBillet;
  function billet(texte) {
    const b = document.getElementById("billet");
    b.textContent = texte; b.classList.add("on");
    clearTimeout(minuteurBillet);
    minuteurBillet = setTimeout(() => b.classList.remove("on"), 2400);
  }
  function nomClasse(id) {
    const n = H.niveaux.find(x => x.id === id);
    return n ? n.nom : id;
  }
  function listeClasses(ids) { return (ids || []).map(nomClasse).join(" · "); }
  /* Couper un texte à la fin d’un mot, jamais au milieu. */
  function coupe(texte, n) {
    if (texte.length <= n) return texte;
    const bout = texte.slice(0, n);
    return bout.slice(0, bout.lastIndexOf(" ")).replace(/[,;:]$/, "") + "…";
  }

  /* Filtre de classe : « tous » ou l’identifiant d’un niveau. */
  function retenus(chapitres) {
    const c = Memoire.classe();
    return c === "tous" ? chapitres : chapitres.filter(ch => ch.niveaux.includes(c));
  }
  function chapitresVisibles() { return retenus(H.chapitres); }

  /* ══════════════════════════════════════════════════════════════
     Les frises.

     L’échelle ne peut pas être proportionnelle : trois millions
     d’années de Préhistoire écraseraient le reste. Les repères sont
     donc espacés régulièrement — l’ordre est rigoureux, l’échelle ne
     l’est pas, et la frise le dit sous elle.
     ══════════════════════════════════════════════════════════════ */
  function friseDePeriode(periode) {
    const reperes = (periode.reperes || []).slice().sort((a, b) => a.an - b.an);
    const PAS = 168, MARGE = 60, HAUT = 214, AXE = 104;
    const largeur = MARGE * 2 + Math.max(0, reperes.length - 1) * PAS;

    const svg = svgEl("svg", {
      width: largeur, height: HAUT, viewBox: "0 0 " + largeur + " " + HAUT,
      role: "list", "aria-label": "Repères de la période " + periode.nom,
    });

    svg.appendChild(svgEl("line", {
      x1: 20, y1: AXE, x2: largeur - 20, y2: AXE,
      stroke: periode.teinte, "stroke-width": 2, "stroke-opacity": .55,
    }));

    reperes.forEach((r, i) => {
      const x = MARGE + i * PAS;
      const haut = i % 2 === 0;
      const bout = haut ? AXE - 34 : AXE + 34;

      const g = svgEl("g", { class: "evenement", role: "listitem", tabindex: "0" });
      g.setAttribute("aria-label", H.an(r.an) + " : " + r.label);

      g.appendChild(svgEl("line", {
        x1: x, y1: AXE, x2: x, y2: bout,
        stroke: periode.teinte, "stroke-width": 1, "stroke-opacity": .45,
      }));
      const point = svgEl("circle", { class: "point", cx: x, cy: AXE, r: 4.2, fill: periode.teinte });
      g.appendChild(point);

      const an = svgEl("text", {
        x: x, y: haut ? bout - 4 : bout + 14, "text-anchor": "middle",
        fill: "#2f2820", "font-family": "'Cormorant Garamond', Garamond, serif",
        "font-size": 15, "font-weight": 600,
      });
      an.textContent = H.anCourt(r.an);
      g.appendChild(an);

      /* Le libellé, coupé en lignes courtes pour rester lisible. */
      const mots = r.label.split(" ");
      const lignes = []; let ligne = "";
      mots.forEach(m => {
        if ((ligne + " " + m).trim().length > 20) { lignes.push(ligne.trim()); ligne = m; }
        else ligne += " " + m;
      });
      if (ligne.trim()) lignes.push(ligne.trim());

      lignes.slice(0, 3).forEach((t, k) => {
        const dep = haut ? bout - 22 - (lignes.length - 1 - k) * 13 : bout + 30 + k * 13;
        const txt = svgEl("text", {
          x: x, y: dep, "text-anchor": "middle", fill: "#6d6252",
          "font-family": "Spectral, Georgia, serif", "font-size": 11.5,
        });
        txt.textContent = t;
        g.appendChild(txt);
      });

      if (r.chapitreId) {
        g.style.cursor = "pointer";
        g.addEventListener("click", () => aller("#/c/" + r.chapitreId));
        g.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); aller("#/c/" + r.chapitreId); }
        });
      }
      svg.appendChild(g);
    });

    const cadre = el("div", "frise-cadre");
    cadre.appendChild(svg);
    return cadre;
  }

  /* Le ruban : toute l’histoire en une bande, période par période. */
  function ruban(actif) {
    const hote = el("div", "ruban");
    const bande = el("div", null);
    bande.style.cssText = "display:flex;gap:2px;align-items:stretch;overflow-x:auto";

    H.periodes.forEach(p => {
      const n = retenus(p.chapitres).length;
      const b = el("button", null);
      b.type = "button";
      b.style.cssText =
        "flex:" + p.part + " 1 0;min-width:6.6rem;text-align:left;cursor:pointer;" +
        "background:none;border:none;padding:0 0 .5rem;font:inherit;color:inherit;" +
        "opacity:" + (n === 0 ? ".38" : "1") + ";transition:opacity .2s";
      b.setAttribute("aria-label", p.nom + ", " + p.dates);

      const barre = el("div", null);
      barre.style.cssText =
        "height:" + (p.id === actif ? "12px" : "8px") + ";background:" + p.teinte +
        ";opacity:" + (p.id === actif ? "1" : ".72") + ";transition:height .2s,opacity .2s";
      const nom = el("div", null, p.nom);
      nom.style.cssText =
        "font-family:var(--titre);font-size:.98rem;margin-top:.4rem;line-height:1.15;" +
        (p.id === actif ? "color:" + p.teinte + ";font-weight:600" : "");
      const dates = el("div", null, p.dates);
      dates.style.cssText =
        "font-variant:small-caps;letter-spacing:.1em;font-size:.64rem;color:var(--encre-fantome)";

      b.append(barre, nom, dates);
      b.onmouseenter = () => { barre.style.opacity = "1"; };
      b.onmouseleave = () => { barre.style.opacity = p.id === actif ? "1" : ".72"; };
      b.onclick = () => aller("#/p/" + p.id);
      bande.appendChild(b);
    });

    hote.appendChild(bande);
    return hote;
  }

  /* ══════════════════════════════════════════════════════════════
     Accueil
     ══════════════════════════════════════════════════════════════ */
  function rendreAccueil() {
    const f = el("main", "feuille");
    f.appendChild(el("p", "rubrique", "Histoire"));

    const h1 = el("h1");
    h1.innerHTML = "Toute l’histoire,<br><em>période par période.</em>";
    f.appendChild(h1);

    const filet = el("div", "filet"); filet.innerHTML = "<span>❦</span>";
    f.appendChild(filet);

    const ouv = el("p", "ouverture lettrine",
      "Chaque période du programme a sa frise, ses chapitres et ses fiches, des origines " +
      "à nos jours. Choisissez une classe pour ne voir que ce qui vous concerne, ouvrez une " +
      "période pour en parcourir les chapitres, et passez en mode révision quand les dates " +
      "commencent à se mélanger.");
    f.appendChild(ouv);

    f.appendChild(ruban(null));
    const note = el("p", "note-echelle", "Repères ordonnés, échelle non proportionnelle");
    f.appendChild(note);

    /* La géographie a son propre espace depuis la séparation des deux
       matières : les élèves les associent, autant leur tendre le lien. */
    const versGeo = el("p", "mention");
    versGeo.style.cssText = "margin-top:1.2rem";
    const lienGeo = el("a", null, "Ouvrir la géographie →");
    lienGeo.href = "geographie.html?matiere=geographie";
    lienGeo.style.cssText = "color:var(--accent);text-decoration:none";
    versGeo.append(document.createTextNode("La géographie a désormais son propre espace. "), lienGeo);
    f.appendChild(versGeo);

    /* Reprendre là où l’on s’était arrêté. */
    const dernier = Memoire.dernier() && H.chapitre(Memoire.dernier());
    if (dernier) {
      const rep = el("div");
      rep.style.cssText =
        "margin-top:2rem;padding:.9rem 1.1rem;border:1px solid var(--trait);" +
        "border-left:3px solid " + dernier.teinte + ";background:rgba(255,252,242,.6);" +
        "display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap";
      const l = el("span", "mention", "Reprendre");
      const b = el("button", null, dernier.titre);
      b.type = "button";
      b.style.cssText = "font:inherit;font-family:var(--titre);font-size:1.1rem;background:none;" +
        "border:none;padding:0;cursor:pointer;color:" + dernier.teinte;
      b.onclick = () => aller("#/c/" + dernier.id);
      rep.append(l, b);
      f.appendChild(rep);
    }

    /* Les périodes, avec leur avancement. */
    const grille = el("div", "periodes");
    H.periodes.forEach(p => {
      const chaps = retenus(p.chapitres);
      const vus = chaps.filter(c => Memoire.vu(c.id)).length;

      const c = el("button", "periode-carte");
      c.type = "button";
      c.style.setProperty("--teinte", p.teinte);
      c.onclick = () => aller("#/p/" + p.id);

      c.appendChild(el("div", "carte-nom", p.nom));
      c.appendChild(el("div", "carte-dates", p.dates));
      c.appendChild(el("div", "carte-resume", coupe(p.resume, 120)));

      const pied = el("div", "carte-pied");
      const g = el("span");
      if (chaps.length === 0) {
        g.textContent = "rien en " + nomClasse(Memoire.classe());
      } else {
        g.innerHTML = "<strong>" + chaps.length + "</strong> chapitre" + (chaps.length > 1 ? "s" : "");
      }
      pied.appendChild(g);
      if (chaps.length) pied.appendChild(el("span", null, vus + " / " + chaps.length + " revus"));
      c.appendChild(pied);

      const jauge = el("div", "jauge");
      const i = el("i");
      i.style.width = (chaps.length ? (vus / chaps.length) * 100 : 0) + "%";
      jauge.appendChild(i);
      c.appendChild(jauge);

      grille.appendChild(c);
    });
    f.appendChild(grille);

    /* Avancement global et remise à zéro. */
    const chaps = chapitresVisibles();
    const vus = chaps.filter(c => Memoire.vu(c.id)).length;
    const bilan = el("div");
    bilan.style.cssText = "margin-top:2.4rem;padding-top:1.2rem;border-top:1px solid var(--trait);" +
      "display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap";
    const t = el("p");
    t.style.cssText = "font-family:var(--titre);font-size:1.05rem";
    t.innerHTML = chaps.length
      ? "Vous avez révisé <strong style=\"color:var(--accent)\">" + vus + "</strong> chapitre" +
        (vus > 1 ? "s" : "") + " sur " + chaps.length +
        (Memoire.classe() === "tous" ? "" : " en " + nomClasse(Memoire.classe())) + "."
      : "Aucun chapitre pour cette classe.";
    bilan.appendChild(t);

    const rev = el("button", "bouton plein", "Réviser maintenant");
    rev.type = "button"; rev.onclick = () => aller("#/reviser");
    bilan.appendChild(rev);

    if (vus > 0) {
      const raz = el("button", "bouton", "Effacer ma progression");
      raz.type = "button";
      raz.onclick = () => {
        if (confirm("Effacer les chapitres marqués comme révisés et les scores ?")) {
          Memoire.oublier(); rendre(); billet("Progression effacée.");
        }
      };
      bilan.appendChild(raz);
    }
    f.appendChild(bilan);

    return f;
  }

  /* ══════════════════════════════════════════════════════════════
     Une période
     ══════════════════════════════════════════════════════════════ */
  function rendrePeriode(p) {
    const f = el("main", "feuille");
    f.style.setProperty("--teinte", p.teinte);

    f.appendChild(el("p", "rubrique", p.nom));
    const h1 = el("h1"); h1.innerHTML = p.titre; f.appendChild(h1);

    const dates = el("p", "mention", p.dates);
    dates.style.marginTop = ".4rem";
    f.appendChild(dates);

    const filet = el("div", "filet"); filet.innerHTML = "<span>❦</span>";
    f.appendChild(filet);
    f.appendChild(el("p", "ouverture lettrine", p.resume));

    f.appendChild(friseDePeriode(p));
    f.appendChild(el("p", "note-echelle",
      (p.reperes || []).length + " repères · cliquez un repère rattaché à un chapitre pour l’ouvrir"));

    /* Les chapitres, filtrés par classe. */
    const chaps = retenus(p.chapitres);
    const sec = el("section", "sommaire");
    sec.appendChild(el("p", "sommaire-titre",
      Memoire.classe() === "tous"
        ? "Les chapitres de cette période"
        : "Les chapitres de cette période en " + nomClasse(Memoire.classe())));

    if (!chaps.length) {
      const vide = el("div", "vide");
      vide.innerHTML = "<strong>Rien pour cette classe ici</strong>" +
        "<p>Cette période n’est pas au programme de " + nomClasse(Memoire.classe()) +
        ". Choisissez une autre classe, ou « toutes ».</p>";
      sec.appendChild(vide);
    }

    chaps.forEach(c => {
      const b = el("button", "entree");
      b.type = "button";
      b.onclick = () => aller("#/c/" + c.id);

      const nom = el("span", "entree-nom", c.titre);
      const etiq = el("span", "etiquettes");
      c.niveaux.forEach(n => etiq.appendChild(el("span", "etiquette", nomClasse(n))));

      const points = el("span", "entree-points");
      points.setAttribute("aria-hidden", "true");

      const etat = el("span", "entree-etat" + (Memoire.vu(c.id) ? " entree-vu" : ""));
      const s = Memoire.scoreDe(c.id);
      etat.textContent = Memoire.vu(c.id)
        ? (s ? "revu · quiz " + s.juste + "/" + s.total : "revu")
        : "à voir";

      b.append(nom, etiq, points, etat);
      sec.appendChild(b);
    });
    f.appendChild(sec);

    /* Passer d’une période à l’autre. */
    const i = H.periodes.indexOf(p);
    f.appendChild(voisins(
      H.periodes[i - 1] && { titre: H.periodes[i - 1].nom, href: "#/p/" + H.periodes[i - 1].id },
      H.periodes[i + 1] && { titre: H.periodes[i + 1].nom, href: "#/p/" + H.periodes[i + 1].id }
    ));
    return f;
  }

  function voisins(avant, apres) {
    const n = el("nav", "voisins");
    n.setAttribute("aria-label", "Navigation");
    [["avant", avant, "← précédent"], ["apres", apres, "suivant →"]].forEach(([cl, v, sens]) => {
      if (!v) { n.appendChild(el("span")); return; }
      const b = el("button", "voisin " + cl);
      b.type = "button";
      b.appendChild(el("span", "sens", sens));
      b.appendChild(el("span", "titre", v.titre));
      b.onclick = () => aller(v.href);
      n.appendChild(b);
    });
    return n;
  }

  /* ══════════════════════════════════════════════════════════════
     Une fiche de chapitre : le cours au centre, les repères en marge
     ══════════════════════════════════════════════════════════════ */
  function rendreChapitre(c) {
    Memoire.dernier(c.id);
    const p = H.periode(c.periodeId);
    const f = el("main", "feuille");
    f.style.setProperty("--teinte", c.teinte);

    /* Tête */
    const tete = el("header", "fiche-tete");
    const rub = el("p", "rubrique");
    const lienP = el("button", null, p.nom);
    lienP.type = "button";
    lienP.style.cssText = "font:inherit;background:none;border:none;padding:0;cursor:pointer;color:inherit";
    lienP.onclick = () => aller("#/p/" + p.id);
    rub.appendChild(lienP);
    rub.appendChild(document.createTextNode(" · " + listeClasses(c.niveaux)));
    tete.appendChild(rub);
    tete.appendChild(el("h1", null, c.titre));
    tete.appendChild(el("p", "accroche", c.accroche));
    f.appendChild(tete);

    /* Corps : texte + marge */
    const feuillet = el("div", "feuillet");
    const corps = el("div", "corps");

    corps.appendChild(el("p", "ouverture lettrine", c.resume));

    c.parties.forEach(partie => {
      const s = el("section", "partie");
      s.appendChild(el("h2", null, partie.titre));
      const ul = el("ul");
      partie.points.forEach(pt => ul.appendChild(el("li", null, pt)));
      s.appendChild(ul);
      corps.appendChild(s);
    });

    /* À retenir */
    const ret = el("section", "retenir");
    ret.appendChild(el("p", "bloc-titre", "À retenir"));
    const ol = el("ol");
    c.retenir.forEach(r => ol.appendChild(el("li", null, r)));
    ret.appendChild(ol);
    corps.appendChild(ret);

    /* Quiz */
    if (c.quiz && c.quiz.length) corps.appendChild(quiz(c));

    /* La marge : dates, notions, personnages */
    const marge = el("aside", "marge");
    marge.setAttribute("aria-label", "Repères de la fiche");

    if (c.dates && c.dates.length) {
      const b = el("div", "bloc-marge");
      b.appendChild(el("p", "bloc-titre", "Dates clés"));
      const ul = el("ul", "marge-liste");
      c.dates.forEach(d => {
        const li = el("li");
        li.appendChild(el("span", "marge-an", H.anCourt(d.an) + " — "));
        li.appendChild(document.createTextNode(d.label));
        ul.appendChild(li);
      });
      b.appendChild(ul); marge.appendChild(b);
    }

    if (c.notions && c.notions.length) {
      const b = el("div", "bloc-marge");
      b.appendChild(el("p", "bloc-titre", "Notions"));
      const ul = el("ul", "marge-liste");
      c.notions.forEach(n => {
        const li = el("li");
        li.appendChild(el("div", "marge-mot", n.mot));
        li.appendChild(el("div", "marge-def", n.def));
        ul.appendChild(li);
      });
      b.appendChild(ul); marge.appendChild(b);
    }

    if (c.personnages && c.personnages.length) {
      const b = el("div", "bloc-marge");
      b.appendChild(el("p", "bloc-titre", "Personnages"));
      const ul = el("ul", "marge-liste");
      c.personnages.forEach(pe => {
        const li = el("li");
        li.appendChild(el("div", "marge-mot", pe.nom));
        li.appendChild(el("div", "marge-vie", pe.vie));
        li.appendChild(el("div", "marge-role", pe.role));
        ul.appendChild(li);
      });
      b.appendChild(ul); marge.appendChild(b);
    }

    feuillet.append(corps, marge);
    f.appendChild(feuillet);

    /* Actions */
    const actions = el("div", "actions");
    const vu = el("button", "bouton" + (Memoire.vu(c.id) ? " plein" : ""));
    vu.type = "button";
    vu.textContent = Memoire.vu(c.id) ? "✓ Chapitre revu" : "Marquer comme revu";
    vu.onclick = () => {
      const on = Memoire.basculerVu(c.id);
      vu.textContent = on ? "✓ Chapitre revu" : "Marquer comme revu";
      vu.classList.toggle("plein", on);
      billet(on ? "Chapitre marqué comme revu." : "Marque retirée.");
    };
    actions.appendChild(vu);

    const imp = el("button", "bouton", "Imprimer la fiche");
    imp.type = "button";
    imp.onclick = () => window.print();
    actions.appendChild(imp);

    const versP = el("button", "bouton", "Retour à " + p.nom);
    versP.type = "button";
    versP.onclick = () => aller("#/p/" + p.id);
    actions.appendChild(versP);
    f.appendChild(actions);

    /* Chapitre précédent / suivant, dans l’ordre du programme filtré */
    const liste = chapitresVisibles().length ? chapitresVisibles() : H.chapitres;
    const i = liste.findIndex(x => x.id === c.id);
    f.appendChild(voisins(
      i > 0 && { titre: liste[i - 1].titre, href: "#/c/" + liste[i - 1].id },
      i >= 0 && i < liste.length - 1 && { titre: liste[i + 1].titre, href: "#/c/" + liste[i + 1].id }
    ));

    return f;
  }

  /* ── Le quiz d’une fiche ───────────────────────────────────────── */
  function quiz(c) {
    const s = el("section", "quiz");
    s.appendChild(el("p", "sommaire-titre", "Vérifier — " + c.quiz.length + " questions"));

    let repondues = 0, justes = 0;
    const bilan = el("p", "score");
    bilan.hidden = true;

    c.quiz.forEach((q, qi) => {
      const bloc = el("div", "question");
      bloc.appendChild(el("p", "question-txt", (qi + 1) + ". " + q.q));

      const choix = el("div", "choix");
      const expl = el("p", "explication");
      expl.hidden = true;
      expl.textContent = q.pourquoi;

      q.choix.forEach((texte, i) => {
        const b = el("button", null, texte);
        b.type = "button";
        b.onclick = () => {
          if (bloc.dataset.fait) return;
          bloc.dataset.fait = "1";
          repondues++;
          const bon = i === q.bonne;
          if (bon) justes++;
          [...choix.children].forEach((autre, k) => {
            autre.disabled = true;
            if (k === q.bonne) {
              autre.classList.add("juste");
              autre.appendChild(el("span", "marque", "✓"));
            } else if (k === i) {
              autre.classList.add("faux");
              autre.appendChild(el("span", "marque", "✗"));
            }
          });
          expl.hidden = false;
          if (repondues === c.quiz.length) {
            bilan.hidden = false;
            bilan.innerHTML = "Résultat : <em>" + justes + " / " + c.quiz.length + "</em> — " +
              (justes === c.quiz.length ? "la fiche est acquise."
               : justes >= c.quiz.length / 2 ? "revoyez les points manqués, c’est presque là."
               : "relisez la fiche, puis retentez.");
            Memoire.score(c.id, justes, c.quiz.length);
          }
        };
        choix.appendChild(b);
      });

      bloc.append(choix, expl);
      s.appendChild(bloc);
    });

    s.appendChild(bilan);
    return s;
  }

  /* ══════════════════════════════════════════════════════════════
     Mode révision : quiz tiré au sort, et cartes de dates
     ══════════════════════════════════════════════════════════════ */
  let ongletRevision = "quiz";

  function rendreRevision() {
    const f = el("main", "feuille");
    f.appendChild(el("p", "rubrique", "Révision"));
    const h1 = el("h1");
    h1.innerHTML = "Se tester,<br><em>jusqu’à ce que ça tienne.</em>";
    f.appendChild(h1);
    const filet = el("div", "filet"); filet.innerHTML = "<span>❦</span>";
    f.appendChild(filet);

    const onglets = el("div", "onglets");
    onglets.setAttribute("role", "tablist");
    [["quiz", "Quiz au hasard"], ["dates", "Cartes de dates"]].forEach(([id, nom]) => {
      const b = el("button", "onglet", nom);
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", ongletRevision === id ? "true" : "false");
      b.onclick = () => { ongletRevision = id; rendre(); };
      onglets.appendChild(b);
    });
    f.appendChild(onglets);

    f.appendChild(ongletRevision === "quiz" ? quizAuHasard() : cartesDeDates());
    return f;
  }

  function melange(t) {
    const a = t.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function quizAuHasard() {
    const hote = el("div");
    const chaps = chapitresVisibles();
    const banque = [];
    chaps.forEach(c => (c.quiz || []).forEach(q => banque.push({ q, c })));

    if (!banque.length) {
      const v = el("div", "vide");
      v.innerHTML = "<strong>Aucune question pour cette classe</strong><p>Changez de classe pour élargir le tirage.</p>";
      hote.appendChild(v);
      return hote;
    }

    const NOMBRE = Math.min(10, banque.length);
    let tirage = melange(banque).slice(0, NOMBRE);
    let i = 0, justes = 0;

    const entete = el("p", "mention");
    const scene = el("div");
    const barre = el("div", "carte-barre");

    function afficher() {
      scene.innerHTML = "";
      barre.innerHTML = "";
      if (i >= tirage.length) {
        const fin = el("div");
        fin.style.textAlign = "center";
        const t = el("p");
        t.style.cssText = "font-family:var(--titre);font-size:1.6rem;margin-bottom:.5rem";
        t.innerHTML = "Résultat : <em style=\"font-style:normal;color:var(--accent)\">" +
          justes + " / " + tirage.length + "</em>";
        fin.appendChild(t);
        fin.appendChild(el("p", null,
          justes === tirage.length ? "Sans faute." :
          justes >= tirage.length * 0.7 ? "Solide. Repassez les chapitres manqués." :
          "À retravailler : reprenez les fiches, les questions reviendront."));
        scene.appendChild(fin);

        const encore = el("button", "bouton plein", "Nouveau tirage");
        encore.type = "button";
        encore.onclick = () => { tirage = melange(banque).slice(0, NOMBRE); i = 0; justes = 0; afficher(); };
        barre.appendChild(encore);
        entete.textContent = "Terminé";
        return;
      }

      const { q, c } = tirage[i];
      entete.textContent = "Question " + (i + 1) + " sur " + tirage.length + " · " + c.periodeNom;

      const bloc = el("div", "question");
      bloc.style.setProperty("--teinte", c.teinte);
      bloc.appendChild(el("p", "question-txt", q.q));

      const choix = el("div", "choix");
      const expl = el("p", "explication"); expl.hidden = true;

      q.choix.forEach((texte, k) => {
        const b = el("button", null, texte);
        b.type = "button";
        b.onclick = () => {
          if (bloc.dataset.fait) return;
          bloc.dataset.fait = "1";
          const bon = k === q.bonne;
          if (bon) justes++;
          [...choix.children].forEach((autre, n) => {
            autre.disabled = true;
            if (n === q.bonne) { autre.classList.add("juste"); autre.appendChild(el("span", "marque", "✓")); }
            else if (n === k) { autre.classList.add("faux"); autre.appendChild(el("span", "marque", "✗")); }
          });
          expl.textContent = q.pourquoi;
          expl.hidden = false;

          barre.innerHTML = "";
          const lien = el("button", "bouton", "Ouvrir la fiche « " + c.titre + " »");
          lien.type = "button";
          lien.onclick = () => aller("#/c/" + c.id);
          const suite = el("button", "bouton plein", i + 1 < tirage.length ? "Question suivante" : "Voir le résultat");
          suite.type = "button";
          suite.onclick = () => { i++; afficher(); };
          barre.append(lien, suite);
          suite.focus();
        };
        choix.appendChild(b);
      });

      bloc.append(choix, expl);
      scene.appendChild(bloc);
    }

    hote.append(entete, scene, barre);
    afficher();
    return hote;
  }

  function cartesDeDates() {
    const hote = el("div");

    /* Les repères des chapitres retenus par le filtre de classe ;
       si le filtre est sur « toutes », tous les repères. */
    const idsVisibles = new Set(chapitresVisibles().map(c => c.id));
    let paquet = H.reperes.filter(r =>
      Memoire.classe() === "tous" || (r.chapitreId && idsVisibles.has(r.chapitreId)));
    if (!paquet.length) paquet = H.reperes;

    /* Choix de la période. */
    const choixP = el("div");
    choixP.style.cssText = "display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:1.4rem";
    let periodeChoisie = "toutes";

    let ordre = [], k = 0, retournee = false;

    function refaire() {
      const filtre = paquet.filter(r => periodeChoisie === "toutes" || r.periodeId === periodeChoisie);
      ordre = melange(filtre);
      k = 0; retournee = false;
      afficher();
    }

    [["toutes", "Toutes"]].concat(H.periodes.map(p => [p.id, p.nom])).forEach(([id, nom]) => {
      const b = el("button", "classe-btn", nom);
      b.type = "button";
      b.setAttribute("aria-pressed", periodeChoisie === id ? "true" : "false");
      b.onclick = () => {
        periodeChoisie = id;
        [...choixP.children].forEach(x => x.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
        refaire();
      };
      choixP.appendChild(b);
    });

    const scene = el("div");
    const barre = el("div", "carte-barre");
    const compte = el("p", "compteur");
    compte.style.cssText = "text-align:center;margin-top:.8rem";

    function afficher() {
      scene.innerHTML = ""; barre.innerHTML = "";
      if (!ordre.length) {
        scene.appendChild(el("div", "vide", "Aucun repère ici."));
        return;
      }
      const r = ordre[k % ordre.length];
      const carte = el("div", "carte-date");
      carte.style.setProperty("--teinte", r.teinte);
      carte.tabIndex = 0;
      carte.setAttribute("role", "button");
      carte.setAttribute("aria-label", "Carte de date, appuyer pour retourner");

      if (!retournee) {
        carte.appendChild(el("div", "carte-face-an", H.anCourt(r.an)));
        carte.appendChild(el("div", "carte-indice", "Que s’est-il passé ?"));
      } else {
        carte.appendChild(el("div", "carte-face-txt", r.label));
        carte.appendChild(el("div", "carte-face-an", H.anCourt(r.an)));
      }
      carte.appendChild(el("div", "carte-periode", r.periodeNom));

      function retourner() { retournee = !retournee; afficher(); }
      carte.onclick = retourner;
      carte.onkeydown = e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); retourner(); }
      };
      scene.appendChild(carte);

      const retourne = el("button", "bouton", retournee ? "Cacher la réponse" : "Retourner la carte");
      retourne.type = "button"; retourne.onclick = retourner;
      barre.appendChild(retourne);

      if (r.chapitreId) {
        const fiche = el("button", "bouton", "Voir la fiche");
        fiche.type = "button";
        fiche.onclick = () => aller("#/c/" + r.chapitreId);
        barre.appendChild(fiche);
      }

      const suivante = el("button", "bouton plein", "Carte suivante");
      suivante.type = "button";
      suivante.onclick = () => { k++; retournee = false; afficher(); };
      barre.appendChild(suivante);

      compte.textContent = "Carte " + ((k % ordre.length) + 1) + " sur " + ordre.length;
    }

    const aide = el("p", "mention");
    aide.style.cssText = "text-align:center;margin-bottom:1rem";
    aide.textContent = "Cliquez la carte — ou touche Espace — pour découvrir la réponse.";

    hote.append(choixP, aide, scene, barre, compte);
    refaire();
    return hote;
  }

  /* ══════════════════════════════════════════════════════════════
     Recherche : chapitres, notions, personnages, repères
     ══════════════════════════════════════════════════════════════ */
  const INDEX = [];
  H.chapitres.forEach(c => {
    /* Le corps du cours est indexé lui aussi : chercher « féodalité »
       doit ramener le chapitre où le mot est expliqué, même s’il ne
       figure ni dans le titre ni dans l’accroche. */
    const corpsTexte = [c.resume]
      .concat(c.parties.map(p => p.titre + " " + p.points.join(" ")))
      .concat(c.retenir).join(" ");
    INDEX.push({ type: "Chapitre", nom: c.titre, ou: c.periodeNom + " · " + listeClasses(c.niveaux),
                 quoi: c.accroche, corps: corpsTexte, href: "#/c/" + c.id, poids: 0 });
    (c.notions || []).forEach(n => INDEX.push({
      type: "Notion", nom: n.mot, ou: c.titre, quoi: n.def, href: "#/c/" + c.id, poids: 1 }));
    (c.personnages || []).forEach(p => INDEX.push({
      type: "Personnage", nom: p.nom, ou: c.titre, quoi: p.vie + " — " + p.role, href: "#/c/" + c.id, poids: 2 }));
  });
  H.periodes.forEach(p => INDEX.push({
    type: "Période", nom: p.nom, ou: p.dates, quoi: p.resume, href: "#/p/" + p.id, poids: 0 }));
  H.reperes.forEach(r => INDEX.push({
    type: "Repère", nom: H.an(r.an) + " — " + r.label, ou: r.periodeNom,
    quoi: "", href: r.chapitreId ? "#/c/" + r.chapitreId : "#/p/" + r.periodeId, poids: 3 }));

  function sansAccent(t) {
    return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[’']/g, "'");
  }
  INDEX.forEach(e => {
    e._n = sansAccent(e.nom);
    e._q = sansAccent(e.quoi || "");
    e._c = sansAccent(e.corps || "");
  });

  const voile = document.getElementById("voile");
  const champ = document.getElementById("q");
  const liste = document.getElementById("resultats");
  let vise = 0, trouves = [];

  function chercher(mot) {
    const m = sansAccent(mot.trim());
    liste.innerHTML = ""; vise = 0; trouves = [];
    if (m.length < 2) {
      const aide = el("div", "chercheur-pied");
      aide.textContent = "Tapez au moins deux lettres — « Verdun », « féodalité », « 1789 », « Périclès »…";
      liste.appendChild(aide);
      return;
    }
    trouves = INDEX
      .map(e => {
        const i = e._n.indexOf(m);
        const score = i === 0 ? 0 : i > 0 ? 1
                    : e._q.indexOf(m) >= 0 ? 4
                    : e._c.indexOf(m) >= 0 ? 6 : -1;
        return score < 0 ? null : { e, score: score + e.poids };
      })
      .filter(Boolean)
      .sort((a, b) => a.score - b.score || a.e.nom.length - b.e.nom.length)
      .slice(0, 30)
      .map(x => x.e);

    if (!trouves.length) {
      const rien = el("div", "vide");
      rien.innerHTML = "<strong>Rien trouvé</strong><p>Essayez un autre mot, ou une date seule.</p>";
      liste.appendChild(rien);
      return;
    }

    trouves.forEach((e, i) => {
      const b = el("button", "resultat" + (i === 0 ? " vise" : ""));
      b.type = "button";
      const nom = el("div", "resultat-nom");
      const pos = e._n.indexOf(m);
      if (pos >= 0) {
        nom.appendChild(document.createTextNode(e.nom.slice(0, pos)));
        const mk = el("mark", null, e.nom.slice(pos, pos + m.length));
        nom.appendChild(mk);
        nom.appendChild(document.createTextNode(e.nom.slice(pos + m.length)));
      } else nom.textContent = e.nom;

      b.appendChild(nom);
      b.appendChild(el("div", "resultat-ou", e.type + " · " + e.ou));
      if (e.quoi) b.appendChild(el("div", "resultat-quoi", e.quoi.slice(0, 120)));
      b.onclick = () => { fermerRecherche(); aller(e.href); };
      liste.appendChild(b);
    });
  }

  function viser(d) {
    const enfants = [...liste.querySelectorAll(".resultat")];
    if (!enfants.length) return;
    enfants[vise] && enfants[vise].classList.remove("vise");
    vise = (vise + d + enfants.length) % enfants.length;
    enfants[vise].classList.add("vise");
    enfants[vise].scrollIntoView({ block: "nearest" });
  }

  function ouvrirRecherche() {
    voile.classList.add("ouvert");
    champ.value = ""; chercher("");
    setTimeout(() => champ.focus(), 20);
  }
  function fermerRecherche() { voile.classList.remove("ouvert"); }

  document.getElementById("ouvrir-recherche").onclick = ouvrirRecherche;
  champ.oninput = () => chercher(champ.value);
  voile.onclick = e => { if (e.target === voile) fermerRecherche(); };

  document.addEventListener("keydown", e => {
    const saisie = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (voile.classList.contains("ouvert")) {
      if (e.key === "Escape") { e.preventDefault(); fermerRecherche(); }
      if (e.key === "ArrowDown") { e.preventDefault(); viser(1); }
      if (e.key === "ArrowUp") { e.preventDefault(); viser(-1); }
      if (e.key === "Enter") {
        e.preventDefault();
        const cible = liste.querySelectorAll(".resultat")[vise];
        if (cible) cible.click();
      }
      return;
    }
    if ((e.key === "k" && (e.metaKey || e.ctrlKey)) || (e.key === "/" && !saisie)) {
      e.preventDefault(); ouvrirRecherche();
    }
  });

  /* ══════════════════════════════════════════════════════════════
     Filtre de classe
     ══════════════════════════════════════════════════════════════ */
  const hoteClasses = document.getElementById("classes");
  function dessinerClasses() {
    hoteClasses.innerHTML = "";
    const tous = el("button", "classe-btn", "Toutes");
    tous.type = "button";
    tous.setAttribute("aria-pressed", Memoire.classe() === "tous" ? "true" : "false");
    tous.onclick = () => { Memoire.classe("tous"); dessinerClasses(); rendre(); };
    hoteClasses.appendChild(tous);
    hoteClasses.appendChild(el("span", "classe-sep"));

    let cycle = null;
    H.niveaux.forEach(n => {
      if (cycle && n.cycle !== cycle) hoteClasses.appendChild(el("span", "classe-sep"));
      cycle = n.cycle;
      const b = el("button", "classe-btn", n.nom);
      b.type = "button";
      b.title = n.cycle + " — " + n.nom;
      b.setAttribute("aria-pressed", Memoire.classe() === n.id ? "true" : "false");
      b.onclick = () => {
        Memoire.classe(Memoire.classe() === n.id ? "tous" : n.id);
        dessinerClasses(); rendre();
      };
      hoteClasses.appendChild(b);
    });
  }

  /* ══════════════════════════════════════════════════════════════
     Routage
     ══════════════════════════════════════════════════════════════ */
  function aller(hash) {
    if (location.hash === hash) rendre();
    else location.hash = hash;
  }

  function filDAriane(pieces) {
    const fil = document.getElementById("fil");
    fil.innerHTML = "";
    pieces.forEach((p, i) => {
      if (i) fil.appendChild(el("span", null, "›"));
      if (p.href) {
        const b = el("button", null, p.nom);
        b.type = "button";
        b.onclick = () => aller(p.href);
        fil.appendChild(b);
      } else fil.appendChild(el("span", "fil-ici", p.nom));
    });
  }

  function rendre() {
    const route = (location.hash || "#/").replace(/^#/, "");
    const parts = route.split("/").filter(Boolean);
    let vue, titre = "Histoire";

    if (parts[0] === "p" && H.periode(parts[1])) {
      const p = H.periode(parts[1]);
      vue = rendrePeriode(p);
      titre = p.nom;
      filDAriane([{ nom: "Histoire", href: "#/" }, { nom: p.nom }]);
    } else if (parts[0] === "c" && H.chapitre(parts[1])) {
      const c = H.chapitre(parts[1]);
      vue = rendreChapitre(c);
      titre = c.titre;
      filDAriane([{ nom: "Histoire", href: "#/" },
                  { nom: c.periodeNom, href: "#/p/" + c.periodeId },
                  { nom: c.titre }]);
    } else if (parts[0] === "reviser") {
      vue = rendreRevision();
      titre = "Révision";
      filDAriane([{ nom: "Histoire", href: "#/" }, { nom: "Révision" }]);
    } else {
      vue = rendreAccueil();
      filDAriane([{ nom: "Histoire" }]);
    }

    page.innerHTML = "";
    page.appendChild(vue);
    document.title = "Polymates — " + titre;
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  document.getElementById("aller-reviser").onclick = () => aller("#/reviser");
  window.addEventListener("hashchange", rendre);

  dessinerClasses();
  rendre();

  /* ── Bandeau : session ─────────────────────────────────────────── */
  const u = window.MB_AUTH && MB_AUTH.user();
  if (u && u.pseudo) document.getElementById("lecteur").textContent = u.pseudo;
  document.getElementById("sortir").onclick = () => {
    if (window.MB_AUTH) MB_AUTH.logout(); else location.href = "index.html";
  };
})();
</script>
</body>
