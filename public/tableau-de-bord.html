<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymates — Tableau de bord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* L'architecture de cette page reste à développer : ce premier jet montre
     déjà les données réelles pour qu'on puisse en juger sur pièce plutôt que
     sur une maquette vide. */
  .bord-wrap { max-width: 940px; margin: 0 auto; padding: 2.4rem 1.2rem 4rem; }
  .bord-tete { margin-bottom: 2rem; }
  .bord-tete h1 { font-family: var(--serif); font-size: 2.4rem; margin: 0 0 .3rem; }
  .bord-tete em { color: var(--accent); font-style: italic; }
  .bord-sous { color: var(--muted); font-family: var(--sans); }

  .bord-cles { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2.2rem; }
  .bord-cle { flex: 1 1 160px; background: var(--surface2); border: 1px solid var(--border);
              border-radius: 12px; padding: 1rem 1.1rem; }
  .bord-cle-n { font-family: var(--serif); font-size: 2rem; color: var(--accent); }
  .bord-cle-l { color: var(--muted); font-size: .8rem; font-family: var(--sans);
                letter-spacing: .03em; }

  .bord-chap { border: 1px solid var(--border); border-radius: 12px;
               margin-bottom: 1rem; overflow: hidden; }
  .bord-chap-tete { display: flex; align-items: center; gap: .9rem; padding: .9rem 1.1rem;
                    background: var(--surface2); cursor: pointer; }
  .bord-chap-nom { flex: 1; font-family: var(--sans); }
  .bord-chap-taux { font-family: var(--mono); color: var(--accent); }
  .bord-fams { padding: .3rem 1.1rem 1rem; display: none; }
  .bord-chap.ouvert .bord-fams { display: block; }
  .bord-fam { display: flex; align-items: center; gap: .8rem; padding: .5rem 0;
              border-top: 1px solid var(--border); font-size: .88rem; }
  .bord-fam-nom { flex: 1; font-family: var(--sans); }
  .bord-fam-avance { color: var(--muted); font-family: var(--mono); font-size: .78rem; }

  .jauge { width: 120px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.09);
           overflow: hidden; flex: none; }
  .jauge i { display: block; height: 100%; background: var(--accent2); }

  .bord-vide { text-align: center; color: var(--muted); padding: 3rem 1rem;
               font-family: var(--sans); }
</style>
</head>
<body>

<div class="bord-wrap">
  <div class="bord-tete">
    <h1>Tableau de <em>bord.</em></h1>
    <p class="bord-sous" id="bord-sous">Chargement de ta progression…</p>
  </div>

  <div class="bord-cles" id="bord-cles"></div>
  <div id="bord-liste"></div>
</div>

<script src="matiere.js"></script>
<script src="auth.js" data-protect></script>
<script src="curseur.js"></script>
<script src="ui.js" defer></script>
<script>
(function () {
  "use strict";

  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const matiere = () => (window.MB_MAT && MB_MAT.id) || "mathematiques";

  function carte(n, libelle) {
    return '<div class="bord-cle"><div class="bord-cle-n">' + n
         + '</div><div class="bord-cle-l">' + libelle + '</div></div>';
  }

  function ligneFamille(f) {
    /* Deux mesures distinctes, volontairement affichées ensemble :
       le TAUX dit la qualité des réponses, l'AVANCEMENT dit ce qui reste à
       faire. Une famille peut être réussie à 100 % et n'être couverte qu'au
       quart — ne montrer que l'un des deux tromperait. */
    const avance = f.total_famille
      ? f.exercices_reussis + " / " + f.total_famille + " exercices"
      : f.exercices_reussis + " exercice(s)";
    return '<div class="bord-fam">'
      + '<div class="bord-fam-nom">' + esc(f.famille) + '</div>'
      + '<div class="jauge"><i style="width:' + f.taux + '%"></i></div>'
      + '<div class="bord-chap-taux">' + f.taux + '%</div>'
      + '<div class="bord-fam-avance">' + avance + '</div>'
      + '</div>';
  }

  function blocChapitre(c) {
    return '<div class="bord-chap" onclick="this.classList.toggle(\'ouvert\')">'
      + '<div class="bord-chap-tete">'
      +   '<div class="bord-chap-nom">' + esc(c.chapitre) + '</div>'
      +   '<div class="jauge"><i style="width:' + c.taux + '%"></i></div>'
      +   '<div class="bord-chap-taux">' + c.taux + '%</div>'
      + '</div>'
      + '<div class="bord-fams">' + c.familles.map(ligneFamille).join("") + '</div>'
      + '</div>';
  }

  async function charger() {
    const sous  = document.getElementById("bord-sous");
    const cles  = document.getElementById("bord-cles");
    const liste = document.getElementById("bord-liste");
    try {
      const res = await MB_AUTH.apiFetch("/progression/stats?matiere=" + encodeURIComponent(matiere()));
      if (!res.ok) throw new Error("Erreur " + res.status);
      const d = await res.json();

      if (!d.chapitres.length) {
        sous.textContent = "Rien à afficher pour le moment.";
        liste.innerHTML = '<div class="bord-vide">Fais une séance d\'entraînement :'
          + ' tes résultats apparaîtront ici, chapitre par chapitre.</div>';
        return;
      }

      sous.textContent = "Ce que tu as travaillé, et ce qu'il te reste à voir.";
      cles.innerHTML = carte(d.total.tentatives, "exercices faits")
                     + carte(d.total.reussies,   "réussis")
                     + carte(d.total.taux + "%", "de réussite")
                     + carte(d.chapitres.length, "chapitres abordés");
      liste.innerHTML = d.chapitres
        .sort((a, b) => b.tentatives - a.tentatives)
        .map(blocChapitre).join("");
    } catch (e) {
      sous.textContent = "Progression indisponible pour l'instant.";
      liste.innerHTML = '<div class="bord-vide">' + esc(e.message) + '</div>';
    }
  }

  document.addEventListener("DOMContentLoaded", charger);
})();
</script>
</body>
</html>
