<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymates — Tableau de bord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .bord-wrap { max-width: 940px; margin: 0 auto; padding: 2.4rem 1.2rem 4rem; }
  .bord-tete h1 { font-family: var(--serif); font-size: 2.4rem; margin: 0 0 .3rem; }
  .bord-tete em { color: var(--accent); font-style: italic; }
  .bord-sous { color: var(--muted); font-family: var(--sans); }

  /* Fil d'Ariane : à trois niveaux, l'élève doit toujours savoir où il est
     et pouvoir remonter d'un cran. */
  .fil { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
         margin: 1.6rem 0 1.2rem; font-family: var(--sans); font-size: .86rem; }
  .fil a { color: var(--muted); text-decoration: none; border-bottom: 1px solid transparent; }
  .fil a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .fil span { color: var(--muted); }
  .fil b { color: var(--text); font-weight: 500; }

  .bord-cles { display: flex; gap: .9rem; flex-wrap: wrap; margin-bottom: 1.8rem; }
  .bord-cle { flex: 1 1 150px; background: var(--surface2); border: 1px solid var(--border);
              border-radius: 12px; padding: .9rem 1.1rem; }
  .bord-cle-n { font-family: var(--serif); font-size: 1.9rem; color: var(--accent); }
  .bord-cle-l { color: var(--muted); font-size: .78rem; font-family: var(--sans);
                letter-spacing: .03em; }

  /* Une ligne cliquable, même dessin pour un chapitre et pour une famille :
     la hiérarchie se lit dans le fil d'Ariane, pas dans deux styles distincts. */
  .item { display: flex; align-items: center; gap: .9rem; width: 100%;
          text-align: left; background: var(--surface2); border: 1px solid var(--border);
          border-radius: 12px; padding: .95rem 1.1rem; margin-bottom: .6rem;
          font-family: var(--sans); color: var(--text); font-size: .95rem;
          transition: border-color .2s, background .2s; }
  .item:hover { border-color: var(--accent); background: var(--surface3); }
  .item-nom { flex: 1; }
  .item-sous { display: block; color: var(--muted); font-size: .76rem; margin-top: .18rem; }
  .item-fleche { color: var(--muted); }
  .item-bouclee { color: var(--accent2); font-size: .8rem; }

  .jauge { width: 110px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.09);
           overflow: hidden; flex: none; }
  .jauge i { display: block; height: 100%; background: var(--accent2); }
  .jauge-vide i { background: rgba(255,255,255,.18); }
  .pct { font-family: var(--mono); color: var(--accent); min-width: 3.2rem;
         text-align: right; font-size: .88rem; }
  .pct-neuf { color: var(--muted); }

  .fiche { background: var(--surface2); border: 1px solid var(--border);
           border-radius: 12px; padding: 1.3rem 1.4rem; }
  .fiche h2 { font-family: var(--serif); font-size: 1.5rem; margin: 0 0 1.2rem; }
  .fiche-ligne { display: flex; justify-content: space-between; align-items: baseline;
                 padding: .55rem 0; border-top: 1px solid var(--border);
                 font-family: var(--sans); font-size: .92rem; }
  .fiche-ligne:first-of-type { border-top: none; }
  .fiche-val { font-family: var(--mono); color: var(--text); }
  .fiche-note { color: var(--muted); font-size: .82rem; font-family: var(--sans);
                line-height: 1.55; margin-top: 1.2rem; }

  /* Bouton d'action : il lance un travail, il doit donc se distinguer des
     lignes de navigation, qui ne font que descendre d'un niveau. */
  .go-seance { display: inline-flex; align-items: center; gap: .5rem;
               padding: .7rem 1.3rem; margin-bottom: .5rem;
               border: 1px solid var(--accent); border-radius: 999px;
               background: rgba(200,185,122,.08); color: var(--accent);
               font-family: var(--sans); font-size: .9rem; cursor: pointer;
               transition: background .2s, transform .2s; }
  .go-seance:hover { background: rgba(200,185,122,.16); transform: translateY(-1px); }
  .go-note { color: var(--muted); font-family: var(--sans); font-size: .8rem;
             margin: 0 0 1.4rem; }

  .bord-vide { text-align: center; color: var(--muted); padding: 2.6rem 1rem;
               font-family: var(--sans); line-height: 1.6; }
  .bord-vide a { color: var(--accent); }
</style>
</head>
<body>

<div class="bord-wrap">
  <div class="bord-tete">
    <h1>Tableau de <em>bord.</em></h1>
    <p class="bord-sous" id="bord-sous">Chargement de ta progression…</p>
  </div>
  <div class="fil" id="fil"></div>
  <div id="bord-corps"></div>
</div>

<script src="matiere.js"></script>
<script src="auth.js" data-protect></script>
<script src="curseur.js"></script>
<script src="ui.js" defer></script>
<script>
(function () {
  "use strict";

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* Trois niveaux : chapitres → familles → fiche d'une famille.
     L'état tient en deux variables, ce qui suffit et évite un routeur. */
  let DATA = null;          // { classe, chapitres: [...] }
  let chapitreOuvert = null;
  let familleOuverte  = null;

  function jauge(pct, neuf) {
    return '<div class="jauge' + (neuf ? " jauge-vide" : "") + '">'
         + '<i style="width:' + Math.max(0, Math.min(100, pct)) + '%"></i></div>';
  }
  function pourcent(v) {
    return v === null
      ? '<div class="pct pct-neuf">—</div>'
      : '<div class="pct">' + v + '%</div>';
  }
  function carte(n, libelle) {
    return '<div class="bord-cle"><div class="bord-cle-n">' + n
         + '</div><div class="bord-cle-l">' + libelle + '</div></div>';
  }

  /* ── Fil d'Ariane ─────────────────────────────────────────────────── */
  function fil() {
    const f = $("fil");
    let h = '<a href="#" data-n="0">Chapitres</a>';
    if (chapitreOuvert) h += ' <span>›</span> ' + (familleOuverte
      ? '<a href="#" data-n="1">' + esc(chapitreOuvert.chapitre) + '</a>'
      : '<b>' + esc(chapitreOuvert.chapitre) + '</b>');
    if (familleOuverte) h += ' <span>›</span> <b>' + esc(familleOuverte.famille) + '</b>';
    f.innerHTML = h;
    f.querySelectorAll("a").forEach(a => a.onclick = e => {
      e.preventDefault();
      if (a.dataset.n === "0") { chapitreOuvert = null; familleOuverte = null; }
      else familleOuverte = null;
      rendre();
    });
  }

  /* ── Niveau 1 : les chapitres de la classe ────────────────────────── */
  function vueChapitres() {
    const c = DATA.chapitres;
    if (!c.length) return '<div class="bord-vide">'
      + 'Aucun chapitre pour cette classe.<br>'
      + 'Renseigne ta classe depuis <a href="compte.html">ton compte</a> '
      + 'pour voir ton programme.</div>';

    const tent = c.reduce((a, x) => a + x.tentatives, 0);
    const reus = c.reduce((a, x) => a + x.reussies, 0);
    const tot  = c.reduce((a, x) => a + x.total, 0);
    const er   = c.reduce((a, x) => a + x.exercices_reussis, 0);

    const cles = '<div class="bord-cles">'
      + carte(c.length, "chapitres au programme")
      + carte(tent, "exercices faits")
      + carte(tent ? Math.round(100 * reus / tent) + "%" : "—", "de réussite")
      + carte(tot ? Math.round(100 * er / tot) + "%" : "0%", "du programme couvert")
      + '</div>';

    return cles + c.map((ch, i) =>
      '<button class="item" data-ch="' + i + '">'
      + '<span class="item-nom">' + esc(ch.chapitre)
      +   '<span class="item-sous">' + ch.familles.length + ' famille'
      +   (ch.familles.length > 1 ? "s" : "")
      +   (ch.familles_bouclees ? ' · ' + ch.familles_bouclees + ' bouclée'
          + (ch.familles_bouclees > 1 ? "s" : "") : "")
      +   ' · ' + ch.exercices_reussis + ' / ' + ch.total + ' exercices réussis</span></span>'
      + jauge(ch.avancement, !ch.tentatives)
      + pourcent(ch.taux)
      + '<span class="item-fleche">→</span></button>').join("");
  }

  /* ── Niveau 2 : les familles du chapitre ──────────────────────────── */
  function vueFamilles() {
    const ch = chapitreOuvert;
    /* Le bouton précède les chiffres : à ce niveau, l'élève vient surtout
       pour travailler, la statistique n'est qu'un repère. */
    const bouton = ch.total
      ? '<button class="go-seance" data-go="chapitre">\u25b6 S\'entraîner sur ce chapitre</button>'
        + '<p class="go-note">Séance tirée dans les ' + ch.familles.length + ' famille'
        + (ch.familles.length > 1 ? 's' : '') + ' de ce chapitre'
        + (DATA.classe ? ', au programme de ' + esc(DATA.classe) : '') + '.</p>'
      : '';
    return bouton + '<div class="bord-cles">'
      + carte(ch.familles.length, "familles")
      + carte(ch.tentatives, "exercices faits")
      + carte(ch.taux === null ? "—" : ch.taux + "%", "de réussite")
      + carte(ch.avancement + "%", "du chapitre couvert")
      + '</div>'
      + ch.familles.map((f, i) =>
        '<button class="item" data-fam="' + i + '">'
        + '<span class="item-nom">' + esc(f.famille)
        +   '<span class="item-sous">' + f.exercices_reussis + ' / ' + f.total
        +   ' exercices réussis'
        +   (f.bouclee ? ' · <span class="item-bouclee">famille bouclée</span>' : '')
        +   '</span></span>'
        + jauge(f.avancement, !f.tentatives)
        + pourcent(f.taux)
        + '<span class="item-fleche">→</span></button>').join("");
  }

  /* ── Niveau 3 : la fiche d'une famille ────────────────────────────── */
  function vueFiche() {
    const f = familleOuverte;
    const manques = f.tentatives - f.reussies;
    const date = f.derniere ? new Date(f.derniere) : null;
    const quand = date && !isNaN(date)
      ? date.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" })
      : "jamais travaillée";

    const l = (k, v) => '<div class="fiche-ligne"><span>' + k
      + '</span><span class="fiche-val">' + v + '</span></div>';

    let note;
    if (!f.tentatives) {
      note = "Tu n'as pas encore travaillé cette famille. Lance une séance "
           + "d'entraînement sur ce chapitre pour la découvrir.";
    } else if (f.bouclee) {
      note = "Tu as réussi tous les exercices de cette famille : ils redeviennent "
           + "disponibles à l'entraînement, pour entretenir ce que tu sais.";
    } else {
      note = "Il te reste " + (f.total - f.exercices_reussis) + " exercice"
           + (f.total - f.exercices_reussis > 1 ? "s" : "")
           + " à réussir dans cette famille. Tant qu'elle n'est pas bouclée, "
           + "ceux que tu as déjà réussis ne te seront pas reproposés.";
    }

    const reste = f.total - f.exercices_reussis;
    const bouton = f.total
      ? '<button class="go-seance" data-go="famille">\u25b6 S\'entraîner sur cette famille</button>'
        + '<p class="go-note">' + (reste > 0
            ? reste + ' exercice' + (reste > 1 ? 's' : '') + ' encore à réussir.'
            : 'Famille bouclée : les exercices redeviennent disponibles pour réviser.')
        + '</p>'
      : '';

    return bouton + '<div class="fiche"><h2>' + esc(f.famille) + '</h2>'
      + l("Exercices de la famille", f.total)
      + l("Exercices réussis", f.exercices_reussis + " / " + f.total)
      + l("Avancement", f.avancement + " %")
      + l("Tentatives", f.tentatives)
      + l("Réponses justes", f.reussies)
      + l("Réponses manquées", manques)
      + l("Taux de réussite", f.taux === null ? "—" : f.taux + " %")
      + l("Dernier passage", quand)
      + '<p class="fiche-note">' + note + '</p></div>';
  }

  /* ── Rendu ────────────────────────────────────────────────────────── */
  function rendre() {
    fil();
    const corps = $("bord-corps");
    corps.innerHTML = familleOuverte ? vueFiche()
                    : chapitreOuvert ? vueFamilles()
                    : vueChapitres();

    corps.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => {
      chapitreOuvert = DATA.chapitres[+b.dataset.ch];
      familleOuverte = null;
      rendre();
    });
    corps.querySelectorAll("[data-fam]").forEach(b => b.onclick = () => {
      familleOuverte = chapitreOuvert.familles[+b.dataset.fam];
      rendre();
    });

    /* Le ciblage voyage dans l'URL : cette page ne peut pas appeler une
       fonction de app.html, qui vit dans un autre document. */
    corps.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
      const p = new URLSearchParams();
      p.set("chapitre", chapitreOuvert.chapitre);
      if (b.dataset.go === "famille" && familleOuverte)
        p.set("famille", familleOuverte.famille);
      if (DATA.classe) p.set("classe", DATA.classe);
      const base = (window.MB_MAT && MB_MAT.lien) ? MB_MAT.lien("app.html") : "app.html";
      window.location.href = base + "#entrainement?" + p.toString();
    });
  }

  async function charger() {
    const sous = $("bord-sous");
    try {
      const mat = (window.MB_MAT && MB_MAT.id) || "mathematiques";
      const res = await MB_AUTH.apiFetch(
        "/progression/programme?matiere=" + encodeURIComponent(mat));
      if (!res.ok) throw new Error("Erreur " + res.status);
      DATA = await res.json();

      sous.textContent = DATA.classe
        ? "Programme de " + DATA.classe + " — ce que tu as travaillé, et ce qu'il te reste."
        : "Renseigne ta classe depuis ton compte pour n'afficher que ton programme.";
      rendre();
    } catch (e) {
      sous.textContent = "Progression indisponible pour l'instant.";
      $("bord-corps").innerHTML = '<div class="bord-vide">' + esc(e.message) + '</div>';
    }
  }

  document.addEventListener("DOMContentLoaded", charger);
})();
</script>
</body>
</html>
