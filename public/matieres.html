<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymates — Choisir une matière</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b09; --surface:#111110; --surface2:#181815;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --accent:#c8b97a; --text:#f0ece0; --muted:rgba(240,236,224,0.5);
  --serif:'Playfair Display',Georgia,serif; --sans:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 45% at 50% -10%, rgba(200,185,122,.08), transparent);}

.wrap{max-width:1100px;margin:0 auto;padding:4.5rem 2rem 5rem;position:relative;z-index:1;}

.head{text-align:center;margin-bottom:3.2rem;}
.eyebrow{font-family:var(--mono);font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);
  margin-bottom:1.1rem;display:flex;align-items:center;justify-content:center;gap:.8rem;}
.eyebrow::before,.eyebrow::after{content:'';display:block;width:2.5rem;height:1px;background:rgba(200,185,122,.4);}
.eyebrow em{font-style:italic;}
h1{font-family:var(--serif);font-size:clamp(2rem,4.6vw,3rem);font-weight:700;line-height:1.15;margin-bottom:.9rem;}
h1 em{font-style:italic;color:var(--accent);}
.sub{color:var(--muted);font-size:.96rem;line-height:1.7;max-width:520px;margin:0 auto;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:1.1rem;}

/* Groupes de matières : un simple repère (titre + filet), pas un cadre. */
.groupe{margin-top:2.6rem;}
.groupe:first-child{margin-top:0;}
.groupe-titre{display:flex;align-items:center;gap:.9rem;margin-bottom:1.1rem;
  font-family:var(--mono);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);}
.groupe-titre::after{content:'';flex:1;height:1px;background:var(--border2);}

.subject{
  --sc:var(--accent);
  position:relative;display:flex;flex-direction:column;gap:.65rem;
  background:var(--surface);border:1px solid var(--border2);border-top:2px solid var(--sc);
  border-radius:16px;padding:1.7rem 1.5rem 1.4rem;
  text-decoration:none;color:inherit;text-align:left;font:inherit;
  transition:transform .2s ease,border-color .2s ease,background .2s ease,box-shadow .25s ease;
  min-height:182px;
  opacity:0;transform:translateY(14px);
  animation:cardIn .55s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes cardIn{to{opacity:1;transform:none;}}
.subject.ready{cursor:pointer;}
.subject.ready:hover{transform:translateY(-5px);border-color:var(--sc);background:var(--surface2);
  box-shadow:0 22px 45px -28px var(--sc);}
.subject.ready:focus-visible{outline:2px solid var(--sc);outline-offset:3px;}
.subject.soon{cursor:pointer;opacity:.52;}
.subject.soon:hover{opacity:.7;}

.subject-icon{font-size:1.7rem;}
.subject-title{font-family:var(--serif);font-size:1.3rem;}
.subject-desc{font-size:.85rem;line-height:1.55;color:var(--muted);}
.subject-go{margin-top:auto;font-size:.8rem;color:var(--sc);opacity:0;transform:translateX(-4px);transition:.2s;}
.subject.ready:hover .subject-go,.subject.ready:focus-visible .subject-go{opacity:1;transform:none;}
.subject-badge{align-self:flex-start;margin-top:auto;font-family:var(--mono);font-size:.55rem;
  letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:.22rem .6rem;
  color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--border2);}

/* Filière professionnelle : une grosse tuile par famille de métiers ;
   ses spécialités se déplient au survol, par-dessus les tuiles voisines. */
.groupe-note{font-size:.84rem;color:var(--muted);margin:-.4rem 0 1rem;}
.grid-familles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;}
.famille{position:relative;opacity:0;transform:translateY(10px);animation:cardIn .45s cubic-bezier(.22,1,.36,1) forwards;}
.famille.ouvert{z-index:20;}
.famille-btn{width:100%;min-height:150px;display:flex;flex-direction:column;align-items:flex-start;gap:.55rem;text-align:left;
  font:inherit;color:inherit;cursor:pointer;background:var(--surface);border:1px solid var(--border2);border-top:2px solid rgba(200,185,122,.55);
  border-radius:16px;padding:1.3rem 3rem 1.1rem 1.3rem;transition:border-color .2s,background .2s,border-radius .15s;}
.famille.hors .famille-btn{border-top-color:rgba(122,180,200,.6);border-style:dashed;border-top-style:solid;}
.famille-btn:hover,.famille.ouvert .famille-btn{background:var(--surface2);border-color:var(--accent);}
.famille.ouvert .famille-btn{border-bottom-left-radius:4px;border-bottom-right-radius:4px;}
.famille-btn{text-decoration:none;}
.famille-pret{font-family:var(--mono);font-size:.55rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(200,185,122,.45);border-radius:999px;padding:.15rem .5rem;}
.famille-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.famille-icone{font-size:1.7rem;}
.famille-nom{font-family:var(--serif);font-size:1.18rem;line-height:1.3;}
.famille-pied{margin-top:auto;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;}
.famille-n{font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;color:var(--muted);}
.famille-fleche{position:absolute;top:.9rem;right:.9rem;width:2rem;height:2rem;border-radius:999px;border:1px solid var(--border2);
  background:transparent;color:var(--muted);font-size:1.15rem;line-height:1;cursor:pointer;transition:transform .2s,color .2s,border-color .2s;}
.famille-fleche:hover,.famille.ouvert .famille-fleche{color:var(--accent);border-color:var(--accent);}
.famille.ouvert .famille-fleche{transform:rotate(90deg);}
.famille-panneau{display:none;position:absolute;left:0;right:0;top:calc(100% - 2px);max-height:min(430px,62vh);overflow-y:auto;
  background:var(--surface2);border:1px solid var(--accent);border-top:none;border-radius:0 0 16px 16px;
  padding:.6rem;flex-direction:column;gap:.45rem;box-shadow:0 26px 50px -18px rgba(0,0,0,.85);}
.famille.ouvert .famille-panneau{display:flex;}
.famille-desc{font-size:.78rem;color:var(--muted);margin:.1rem .3rem .2rem;}
.bac{display:flex;align-items:center;gap:.7rem;min-height:50px;text-align:left;font:inherit;color:inherit;text-decoration:none;
  background:var(--surface);border:1px solid var(--border2);border-radius:11px;padding:.55rem .8rem;cursor:pointer;
  transition:border-color .2s,background .2s;flex:none;}
.bac.soon .bac-icone,.bac.soon .bac-nom{opacity:.75;}
.bac:hover{border-color:var(--accent);background:var(--bg,#0f0f0d);}
.bac:hover .bac-icone,.bac:hover .bac-nom{opacity:1;}
.bac:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.bac-icone{font-size:1.15rem;flex:none;}
.bac-nom{flex:1;font-size:.85rem;line-height:1.35;display:flex;flex-direction:column;gap:.15rem;}
.bac-options{font-size:.72rem;color:var(--muted);line-height:1.35;}
.bac-badge{flex:none;font-family:var(--mono);font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--border2);border-radius:999px;padding:.15rem .45rem;}
/* écrans tactiles et petits écrans : la liste se déplie dans le flux */
@media (hover:none),(max-width:600px){
  .famille-panneau{position:static;max-height:none;box-shadow:none;}
  .famille.ouvert .famille-btn{border-bottom-left-radius:4px;border-bottom-right-radius:4px;}
}

.foot-link{text-align:center;margin-top:3.2rem;font-size:.85rem;color:var(--muted);}
.foot-link a{color:var(--accent);text-decoration:none;}
.foot-link a:hover{text-decoration:underline;}

#toast{position:fixed;left:50%;bottom:2rem;transform:translate(-50%,140%);
  background:var(--surface2);border:1px solid var(--border2);border-radius:999px;
  padding:.7rem 1.3rem;font-size:.86rem;color:var(--text);z-index:200;
  box-shadow:0 18px 40px -20px rgba(0,0,0,.8);transition:transform .35s cubic-bezier(.22,1,.36,1);}
#toast.on{transform:translate(-50%,0);}

/* Bouton « Compte » : même apparence que dans la barre de navigation du site.
   En haut à gauche sur grand écran, pour ne pas chevaucher la pastille de
   session (en haut à droite) ; sous le titre sur téléphone, où la pastille
   occupe toute la largeur. */
.compte-btn{position:fixed;top:14px;left:16px;z-index:90;display:inline-flex;align-items:center;gap:.45rem;
  font-size:.8rem;font-weight:500;background:#c8b97a;color:#0b0b09;border-radius:8px;padding:.55rem 1.1rem;
  text-decoration:none;box-shadow:0 6px 24px -8px rgba(0,0,0,.6);transition:transform .15s,background .2s;}
.compte-btn:hover{transform:translateY(-1px);background:#d6c98e;}
.compte-btn:focus-visible{outline:2px solid #f0ece0;outline-offset:2px;}

@media(max-width:600px){.wrap{padding:5rem 1.2rem 4rem;}
  .compte-btn{position:static;margin-top:1.3rem;padding:.65rem 1.6rem;font-size:.86rem;}}
@media(max-width:600px){.grid-familles{grid-template-columns:1fr;}.famille-btn{min-height:120px;}}
@media (prefers-reduced-motion:reduce){.subject{animation:none;opacity:1;transform:none;}.famille{animation:none;opacity:1;transform:none;}}
</style>
<script src="matiere.js"></script>
<script src="auth.js" data-protect></script>
</head>
<body>

  <div class="head">
    <p class="eyebrow">Poly<em>mates</em></p>
    <h1 id="titre">Quelle matière<br>veux-tu <em>explorer</em> ?</h1>
    <p class="sub">Choisis une matière pour accéder à ses cours, tutoriels et exercices.</p>
    <a class="compte-btn" href="compte.html" title="Mon compte : profil, crédits, progression">Compte</a>
  </div>

  <div id="groupes"></div>

  <p class="foot-link">Une matière que tu aimerais voir en priorité ? <a href="mailto:contact@polymates.fr">Écris-nous</a>.</p>
</div>

<div id="toast"></div>

<script>

        { nom: "Métiers de l'accueil", href: "medecine.html?matiere=bp-accueil", icone: "🛎️" }
      ]},
      { titre: "Industries graphiques et communication", href: "medecine.html?matiere=fam-graphiques", icone: "🖨️", bacs: [
        { nom: "Façonnage de produits imprimés, routage", href: "medecine.html?matiere=bp-faconnage", icone: "📰" },
        { nom: "Réalisation de produits imprimés et plurimédia", href: "medecine.html?matiere=bp-rpip", icone: "🖼️", options: ["productions graphiques", "productions imprimées"] }
      ]},
      { titre: "Hôtellerie-restauration", href: "medecine.html?matiere=fam-hotellerie", icone: "🍽️", bacs: [
        { nom: "Cuisine", href: "medecine.html?matiere=bp-cuisine", icone: "👨‍🍳" },
        { nom: "Commercialisation et services en restauration", href: "medecine.html?matiere=bp-csr", icone: "🍷" }
      ]},
      { titre: "Alimentation", href: "medecine.html?matiere=fam-alimentation", icone: "🥖", bacs: [
        { nom: "Boulanger-pâtissier", href: "medecine.html?matiere=bp-boulanger-patissier", icone: "🥐" },
        { nom: "Boucher charcutier traiteur", href: "medecine.html?matiere=bp-boucher", icone: "🥩" },
        { nom: "Poissonnier écailler traiteur", href: "medecine.html?matiere=bp-poissonnier", icone: "🐟" }
      ]},
      { titre: "Beauté et bien-être", href: "medecine.html?matiere=fam-beaute", icone: "💄", bacs: [
        { nom: "Esthétique cosmétique parfumerie", href: "medecine.html?matiere=bp-esthetique", icone: "💄" },
        { nom: "Métiers de la coiffure", href: "medecine.html?matiere=bp-coiffure", icone: "💇" }
      ]},
      { titre: "Hors famille", icone: "🧭", horsFamille: true,
        desc: "Spécialités choisies directement en seconde.", bacs: [
        { nom: "Accompagnement, soins et services à la personne", href: "medecine.html?matiere=bp-assp", icone: "🤝" },
        { nom: "Animation enfance et personnes âgées", href: "medecine.html?matiere=bp-aepa", icone: "🧸" },
        { nom: "Hygiène, propreté et stérilisation", href: "medecine.html?matiere=bp-hps", icone: "🧽" },
        { nom: "Optique lunetterie", href: "medecine.html?matiere=bp-optique", icone: "👓" },

        { nom: "Technicien en appareillage orthopédique", href: "medecine.html?matiere=bp-orthopedie", icone: "🦿" },
        { nom: "Perruquier posticheur", href: "medecine.html?matiere=bp-perruquier", icone: "💇" },
        { nom: "Métiers de la couture et de la confection", href: "medecine.html?matiere=bp-couture", icone: "🧵" },
        { nom: "Métiers du cuir", href: "medecine.html?matiere=bp-cuir", icone: "👜", options: ["chaussures", "maroquinerie", "sellerie garnissage"] },
        { nom: "Photographie", href: "medecine.html?matiere=bp-photographie", icone: "📷" },
        { nom: "Carrossier peintre automobile", href: "medecine.html?matiere=bp-carrossier", icone: "🎨" },
        { nom: "Maintenance nautique", href: "medecine.html?matiere=bp-nautique", icone: "⛵" },
        { nom: "Transport fluvial", href: "medecine.html?matiere=bp-fluvial", icone: "🚢" },
        { nom: "Conducteur transport routier de marchandises", href: "medecine.html?matiere=bp-conducteur-routier", icone: "🚚" },
        { nom: "Plastiques et composites", href: "medecine.html?matiere=bp-plastiques", icone: "🧴" },
        { nom: "Modélisation et prototypage 3D", href: "medecine.html?matiere=bp-prototypage-3d", icone: "🖨️" },
        { nom: "Techniques d'interventions sur installations nucléaires", href: "medecine.html?matiere=bp-nucleaire", icone: "☢️" },
        { nom: "Production en industries pharmaceutiques, alimentaires et cosmétiques", href: "medecine.html?matiere=bp-pipac", icone: "💊" },
        { nom: "Technicien constructeur bois", href: "medecine.html?matiere=bp-constructeur-bois", icone: "🏠" },
        { nom: "Métiers et arts de la pierre", href: "medecine.html?matiere=bp-pierre", icone: "🪨" },
        { nom: "Métiers de la sécurité", href: "medecine.html?matiere=bp-securite", icone: "🛡️" },
        { nom: "Gestion des pollutions et protection de l'environnement", href: "medecine.html?matiere=bp-gppe", icone: "♻️" }
      ]},
    ]},
  ];

  /* famille de métiers dépliée (une seule à la fois) ; survol possible ou non */
  const SURVOL = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  let ouverte = null;
  const hote = document.getElementById('groupes');
  let n = 0;
  GROUPES.forEach(g => {
    const sec = document.createElement('section');
    sec.className = 'groupe';
    sec.innerHTML = `<h2 class="groupe-titre">${g.titre}</h2>` + (g.note ? `<p class="groupe-note">${g.note}</p>` : '');
    if (g.familles) {
      if (g.matieres && g.matieres.length) {
        const tete = document.createElement('div');
        tete.className = 'grid';
        tete.style.marginBottom = '1.4rem';
        g.matieres.forEach(m => tete.appendChild(carte(m, n++)));
        sec.appendChild(tete);
      }
      const grille = document.createElement('div');
      grille.className = 'grid-familles';
      g.familles.forEach((f, k) => grille.appendChild(carteFamille(f, k)));
      sec.appendChild(grille);
      hote.appendChild(sec);
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'grid';
    g.matieres.forEach(m => grid.appendChild(carte(m, n++)));
    sec.appendChild(grid);
    hote.appendChild(sec);
  });

  /* Famille de métiers : un gros bouton (cliquable) qui déplie la liste de
     ses spécialités au survol de la souris. Sur écran tactile, la flèche
     déplie la liste ; au clavier, elle s'ouvre dès que le focus y entre. */
  function ouvrir(el, oui) {
    if (oui && ouverte && ouverte !== el) ouvrir(ouverte, false);
    el.classList.toggle('ouvert', oui);
    el.querySelector('.famille-fleche').setAttribute('aria-expanded', oui ? 'true' : 'false');
    ouverte = oui ? el : (ouverte === el ? null : ouverte);
  }
  function carteFamille(f, k) {
    const el = document.createElement('div');
    el.className = 'famille' + (f.horsFamille ? ' hors' : '');
    el.style.animationDelay = Math.min(k * 35, 500) + 'ms';
    const nb = f.bacs.length;
    el.innerHTML =
      (f.href ? `<a class="famille-btn" href="${f.href}" title="Cours de seconde : ${f.titre}">`
              : `<button type="button" class="famille-btn" title="${f.horsFamille ? 'Bacs pros hors famille de métiers' : 'Famille de métiers : ' + f.titre}">`)
      + `<span class="famille-icone">${f.icone}</span>`
      + `<span class="famille-nom">${f.titre}</span>`
      + `<span class="famille-pied"><span class="famille-n">${nb} spécialité${nb > 1 ? 's' : ''}</span>`
      + (f.href ? `<span class="famille-pret">Cours de seconde · QCM →</span></span></a>`
                : `<span class="bac-badge">À venir</span></span></button>`)
      + `<button type="button" class="famille-fleche" aria-expanded="false" aria-label="Voir les spécialités : ${f.titre}">›</button>`
      + `<div class="famille-panneau">`
      + (f.desc ? `<p class="famille-desc">${f.desc}</p>` : '')
      + `</div>`;
    const pan = el.querySelector('.famille-panneau');
    f.bacs.forEach((m, i) => pan.appendChild(carteBac(m, i)));
    if (!f.href) el.querySelector('.famille-btn').onclick = () =>
      toast((f.horsFamille ? 'Les bacs pros hors famille arrivent' : 'La famille « ' + f.titre + ' » arrive') + ' bientôt sur Polymates.');
    el.querySelector('.famille-fleche').onclick = e => { e.stopPropagation(); ouvrir(el, !el.classList.contains('ouvert')); };
    if (SURVOL) {
      let t;
      el.addEventListener('mouseenter', () => { clearTimeout(t); ouvrir(el, true); });
      el.addEventListener('mouseleave', () => { t = setTimeout(() => ouvrir(el, false), 140); });
    }
    /* clavier seulement : un clic ou un toucher passe par le survol ou la flèche */
    el.addEventListener('focusin', e => { if (!el.dataset.ferme && e.target.matches(':focus-visible')) ouvrir(el, true); delete el.dataset.ferme; });
    el.addEventListener('focusout', e => { if (!el.contains(e.relatedTarget)) ouvrir(el, false); });
    el.addEventListener('keydown', e => { if (e.key === 'Escape') { ouvrir(el, false); el.dataset.ferme = '1'; el.querySelector('.famille-btn').focus(); } });
    return el;
  }
  /* un toucher en dehors referme la famille ouverte (écrans tactiles) */
  document.addEventListener('click', e => { if (ouverte && !ouverte.contains(e.target)) ouvrir(ouverte, false); });

  /* Bouton compact d'une spécialité. Il s'ouvre dès qu'on lui donne un href ;
     sans href, il est « à venir ». Les options éventuelles sont rappelées dessous. */
  function carteBac(m, i) {
    const dispo = !!m.href;
    const el = document.createElement(dispo ? 'a' : 'button');
    el.className = 'bac ' + (dispo ? 'ready' : 'soon');
    el.title = 'Bac pro ' + m.nom;
    if (dispo) el.href = m.href; else el.type = 'button';
    const opts = m.options && m.options.length
      ? `<span class="bac-options">${m.options.length} options : ${m.options.join(' · ')}</span>` : '';
    el.innerHTML = `<span class="bac-icone">${m.icone}</span><span class="bac-nom">${m.nom}${opts}</span>`
      + (dispo ? '' : '<span class="bac-badge">À venir</span>');
    if (!dispo) el.onclick = e => { e.stopPropagation(); toast('Le bac pro ' + m.nom + ' arrive bientôt sur Polymates.'); };
    return el;
  }

  function carte(m, i) {
    const ouverte = !!m.href;
    const el = document.createElement(ouverte ? 'a' : 'button');
    el.className = 'subject ' + (ouverte ? 'ready' : 'soon');
    el.style.setProperty('--sc', m.couleur);
    el.style.animationDelay = Math.min(i * 50, 500) + 'ms';   /* plafonné : les cartes du bas n'attendent pas */
    if (ouverte) el.href = m.href;
    else el.type = 'button';
    el.innerHTML =
      `<div class="subject-icon">${m.icone}</div>` +
      `<div class="subject-title">${m.nom}</div>` +
      `<div class="subject-desc">${m.desc}</div>` +
      (ouverte ? `<div class="subject-go">Entrer →</div>`
               : `<div class="subject-badge">À venir</div>`);
    if (!ouverte) el.onclick = () => toast(m.nom + " arrive bientôt sur Polymates.");
    return el;
  }

  /* petit message éphémère */
  let tid;
  function toast(txt){
    const t = document.getElementById('toast');
    t.textContent = txt; t.classList.add('on');
    clearTimeout(tid); tid = setTimeout(() => t.classList.remove('on'), 2600);
  }

  /* accueil personnalisé une fois la session connue */
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      const u = window.MB_AUTH && MB_AUTH.user();
      if (u && u.pseudo) {
        document.getElementById('titre').innerHTML =
          'Bonjour ' + escapeHtml(u.pseudo) + ',<br>que veux-tu <em>explorer</em> ?';
      }
    }, 60);
  });

  function escapeHtml(t){
    return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
