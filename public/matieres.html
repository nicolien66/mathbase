<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymates — Choisir une matière</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b09; --surface:#111110; --surface2:#181815;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --accent:#c8b97a; --text:#f0ece0; --muted:rgba(240,236,224,0.5);
  --serif:'Playfair Display',Georgia,serif; --sans:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 45% at 50% -10%, rgba(200,185,122,.08), transparent);}

.wrap{max-width:1100px;margin:0 auto;padding:4.5rem 2rem 5rem;position:relative;z-index:1;}

.head{text-align:center;margin-bottom:3.2rem;}
.eyebrow{font-family:var(--mono);font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);
  margin-bottom:1.1rem;display:flex;align-items:center;justify-content:center;gap:.8rem;}
.eyebrow::before,.eyebrow::after{content:'';display:block;width:2.5rem;height:1px;background:rgba(200,185,122,.4);}
.eyebrow em{font-style:italic;}
h1{font-family:var(--serif);font-size:clamp(2rem,4.6vw,3rem);font-weight:700;line-height:1.15;margin-bottom:.9rem;}
h1 em{font-style:italic;color:var(--accent);}
.sub{color:var(--muted);font-size:.96rem;line-height:1.7;max-width:520px;margin:0 auto;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:1.1rem;}

/* Groupes de matières : un simple repère (titre + filet), pas un cadre. */
.groupe{margin-top:2.6rem;}
.groupe:first-child{margin-top:0;}
.groupe-titre{display:flex;align-items:center;gap:.9rem;margin-bottom:1.1rem;
  font-family:var(--mono);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);}
.groupe-titre::after{content:'';flex:1;height:1px;background:var(--border2);}

.subject{
  --sc:var(--accent);
  position:relative;display:flex;flex-direction:column;gap:.65rem;
  background:var(--surface);border:1px solid var(--border2);border-top:2px solid var(--sc);
  border-radius:16px;padding:1.7rem 1.5rem 1.4rem;
  text-decoration:none;color:inherit;text-align:left;font:inherit;
  transition:transform .2s ease,border-color .2s ease,background .2s ease,box-shadow .25s ease;
  min-height:182px;
  opacity:0;transform:translateY(14px);
  animation:cardIn .55s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes cardIn{to{opacity:1;transform:none;}}
.subject.ready{cursor:pointer;}
.subject.ready:hover{transform:translateY(-5px);border-color:var(--sc);background:var(--surface2);
  box-shadow:0 22px 45px -28px var(--sc);}
.subject.ready:focus-visible{outline:2px solid var(--sc);outline-offset:3px;}
.subject.soon{cursor:pointer;opacity:.52;}
.subject.soon:hover{opacity:.7;}

.subject-icon{font-size:1.7rem;}
.subject-title{font-family:var(--serif);font-size:1.3rem;}
.subject-desc{font-size:.85rem;line-height:1.55;color:var(--muted);}
.subject-go{margin-top:auto;font-size:.8rem;color:var(--sc);opacity:0;transform:translateX(-4px);transition:.2s;}
.subject.ready:hover .subject-go,.subject.ready:focus-visible .subject-go{opacity:1;transform:none;}
.subject-badge{align-self:flex-start;margin-top:auto;font-family:var(--mono);font-size:.55rem;
  letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:.22rem .6rem;
  color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--border2);}

/* Bacs pros : volets repliables par domaine, boutons compacts. */
.groupe-note{font-size:.84rem;color:var(--muted);margin:-.4rem 0 1rem;}
.domaine{border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.015);margin-bottom:.7rem;}
.domaine[open]{border-color:var(--border2);}
.domaine summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.75rem;padding:.85rem 1.1rem;
  border-radius:14px;transition:background .2s;user-select:none;}
.domaine summary::-webkit-details-marker{display:none;}
.domaine summary:hover{background:rgba(255,255,255,.03);}
.domaine summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.domaine summary::after{content:'›';margin-left:.2rem;color:var(--muted);font-size:1.2rem;transition:transform .2s;}
.domaine[open] summary::after{transform:rotate(90deg);}
.domaine-icone{font-size:1.15rem;}
.domaine-nom{flex:1;font-family:var(--serif);font-size:1.08rem;}
.domaine-n{font-family:var(--mono);font-size:.66rem;color:var(--muted);border:1px solid var(--border2);border-radius:999px;padding:.1rem .5rem;}
.grid-bacs{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.6rem;padding:.2rem 1rem 1rem;}
.bac{display:flex;align-items:center;gap:.7rem;min-height:58px;text-align:left;font:inherit;color:inherit;text-decoration:none;
  background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:.6rem .85rem;cursor:pointer;
  transition:border-color .2s,background .2s,opacity .2s;opacity:0;animation:cardIn .4s cubic-bezier(.22,1,.36,1) forwards;}
.bac.soon{animation-name:bacIn;}
@keyframes bacIn{to{opacity:.6;transform:none;}}
.bac.soon:hover{opacity:.85;}
.bac.ready{animation-name:cardIn;}
.bac:hover{border-color:var(--accent);background:var(--surface2);}
.bac:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.bac-icone{font-size:1.2rem;flex:none;}
.bac-nom{flex:1;font-size:.86rem;line-height:1.35;}
.bac-badge{flex:none;font-family:var(--mono);font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--border2);border-radius:999px;padding:.15rem .45rem;}

.foot-link{text-align:center;margin-top:3.2rem;font-size:.85rem;color:var(--muted);}
.foot-link a{color:var(--accent);text-decoration:none;}
.foot-link a:hover{text-decoration:underline;}

#toast{position:fixed;left:50%;bottom:2rem;transform:translate(-50%,140%);
  background:var(--surface2);border:1px solid var(--border2);border-radius:999px;
  padding:.7rem 1.3rem;font-size:.86rem;color:var(--text);z-index:200;
  box-shadow:0 18px 40px -20px rgba(0,0,0,.8);transition:transform .35s cubic-bezier(.22,1,.36,1);}
#toast.on{transform:translate(-50%,0);}

/* Bouton « Compte » : même apparence que dans la barre de navigation du site.
   En haut à gauche sur grand écran, pour ne pas chevaucher la pastille de
   session (en haut à droite) ; sous le titre sur téléphone, où la pastille
   occupe toute la largeur. */
.compte-btn{position:fixed;top:14px;left:16px;z-index:90;display:inline-flex;align-items:center;gap:.45rem;
  font-size:.8rem;font-weight:500;background:#c8b97a;color:#0b0b09;border-radius:8px;padding:.55rem 1.1rem;
  text-decoration:none;box-shadow:0 6px 24px -8px rgba(0,0,0,.6);transition:transform .15s,background .2s;}
.compte-btn:hover{transform:translateY(-1px);background:#d6c98e;}
.compte-btn:focus-visible{outline:2px solid #f0ece0;outline-offset:2px;}

@media(max-width:600px){.wrap{padding:5rem 1.2rem 4rem;}
  .compte-btn{position:static;margin-top:1.3rem;padding:.65rem 1.6rem;font-size:.86rem;}}
@media(max-width:600px){.grid-bacs{grid-template-columns:1fr;padding:.2rem .7rem .8rem;}.domaine summary{padding:.8rem .9rem;}}
@media (prefers-reduced-motion:reduce){.subject{animation:none;opacity:1;transform:none;}.bac{animation:none;opacity:1;}.bac.soon{opacity:.6;}}
</style>
<script src="matiere.js"></script>
<script src="auth.js" data-protect></script>
</head>
<body>
<div class="wrap">
  <div class="head">
    <p class="eyebrow">Poly<em>mates</em></p>
    <h1 id="titre">Quelle matière<br>veux-tu <em>explorer</em> ?</h1>
    <p class="sub">Choisis une matière pour accéder à ses cours, tutoriels et exercices.</p>
    <a class="compte-btn" href="compte.html" title="Mon compte : profil, crédits, progression">Compte</a>
  </div>

  <div id="groupes"></div>

  <p class="foot-link">Une matière que tu aimerais voir en priorité ? <a href="mailto:contact@polymates.fr">Écris-nous</a>.</p>
</div>

<div id="toast"></div>

<script>
(function(){
  /* Les matières scolaires viennent de matiere.js : une seule liste pour tout le site.
     Pour ouvrir une matière, il suffit d'y passer ouverte:true.
     Les autres groupes sont décrits ici ; leurs boutons sont « à venir » tant
     qu'ils n'ont pas de href. */
  const RETIREES = ["anglais"];   /* matières de matiere.js qu'on ne montre pas ici */
  const scolaires = MB_MAT.liste().filter(m => !RETIREES.includes(m.id)).map(m => ({
    nom: m.nom, icone: m.icone, couleur: m.couleur, desc: m.desc,
    href: m.ouverte ? (m.accueil + '?matiere=' + encodeURIComponent(m.id)) : null,
  }));

  const GROUPES = [
    { titre: "Matières scolaires", matieres: scolaires },
    { titre: "Médecine", matieres: [
      { nom:"Biologie cellulaire", href:"medecine.html?matiere=biologie-cellulaire", icone:"🧫", couleur:"#7ac8b4",
        desc:"La cellule : membranes, organites, noyau, division et communication cellulaire." },
      { nom:"Histologie", href:"medecine.html?matiere=histologie", icone:"🔬", couleur:"#c87a9a",
        desc:"Les tissus du corps humain : épithéliums, tissus conjonctifs, musculaires et nerveux." },
      { nom:"Anatomie", href:"medecine.html?matiere=anatomie", icone:"🫀", couleur:"#c87a7a",
        desc:"L'organisation du corps : os, muscles, organes et appareils, région par région." },
      { nom:"Embryologie", href:"medecine.html?matiere=embryologie", icone:"🧬", couleur:"#a07ac8",
        desc:"Le développement de l'embryon, de la fécondation à la mise en place des organes." },
    ]},
    { titre: "Informatique", matieres: [
      { nom:"Cybersécurité", icone:"🔐", couleur:"#7ac8a0",
        desc:"Protéger systèmes et données : menaces, mots de passe, chiffrement, réseaux." },
      { nom:"Python", icone:"🐍", couleur:"#d4c46a",
        desc:"Variables, boucles, fonctions et listes : programmer pas à pas." },
      { nom:"C", icone:"⚙️", couleur:"#8a9aae",
        desc:"Types, pointeurs et mémoire : comprendre ce que fait la machine." },
      { nom:"Java", icone:"☕", couleur:"#c89a7a",
        desc:"Classes, objets et héritage : la programmation orientée objet." },
      { nom:"HTML", icone:"🧱", couleur:"#d48a6a",
        desc:"Structurer une page web : balises, titres, liens, images et formulaires." },
      { nom:"CSS", icone:"🎨", couleur:"#7a9ec8",
        desc:"Mettre en forme une page : couleurs, typographie, mise en page et responsive." },
      { nom:"JavaScript", icone:"📜", couleur:"#e6c27e",
        desc:"Rendre une page interactive : événements, DOM et logique côté navigateur." },
      { nom:"Bases de données et SQL", icone:"🗄️", couleur:"#82b4d2",
        desc:"Tables, clés et relations ; interroger les données avec SELECT, JOIN et GROUP BY." },
    ]},
    { titre: "Bureautique", matieres: [
      { nom:"Word", icone:"📝", couleur:"#7a9ec8",
        desc:"Rédiger et mettre en page : styles, tableaux, sommaire automatique, publipostage." },
      { nom:"Excel", icone:"📊", couleur:"#7ac8a0",
        desc:"Formules, fonctions, graphiques et tableaux croisés dynamiques." },
      { nom:"PowerPoint", icone:"📽️", couleur:"#d48a6a",
        desc:"Construire une présentation claire : diapositives, masques, animations." },
      { nom:"Certification Pix", icone:"🏅", couleur:"#a07ac8",
        desc:"Préparer la certification des compétences numériques : information, communication, création de contenus, sécurité." },
    ]},
    { titre: "Économie et gestion", matieres: [
      { nom:"Microéconomie", icone:"🛍️", couleur:"#c8b97a",
        desc:"Offre, demande et prix : comment décident consommateurs et entreprises." },
      { nom:"Macroéconomie", icone:"🌐", couleur:"#7ab4c8",
        desc:"Croissance, chômage, inflation et politiques économiques d'un pays." },
      { nom:"Comptabilité", icone:"🧾", couleur:"#a0c87a",
        desc:"Écritures, bilan, compte de résultat et TVA : tenir les comptes d'une entreprise." },
    ]},
    { titre: "Religion", matieres: [
      { nom:"Bible", icone:"📜", couleur:"#c89a7a",
        desc:"Lire et comprendre les textes, les personnages et les grands récits." },
    ]},
    { titre: "Permis", matieres: [
      { nom:"Permis piéton", href:"permis.html?permis=pieton", icone:"🚸", couleur:"#7ac8b4",
        desc:"Se déplacer à pied en sécurité : traverser, signaux, dangers de la rue." },
      { nom:"Permis de voiture", href:"permis.html?permis=voiture", icone:"🚗", couleur:"#c87a7a",
        desc:"Code de la route : signalisation, priorités, situations de conduite." },
      { nom:"Code de la mer", icone:"⛵", couleur:"#7a9ec8",
        desc:"Permis bateau : balisage, règles de barre, feux, sécurité à bord." },
      { nom:"BAFA", icone:"🏕️", couleur:"#a0c87a",
        desc:"Animer des enfants en accueil collectif : réglementation, sécurité, projet d'animation." },
      { nom:"CACES", icone:"🏗️", couleur:"#d4c46a",
        desc:"Conduite d'engins : chariots, nacelles, grues — règles de sécurité et théorie." },
      { nom:"Habilitation électrique", icone:"⚡", couleur:"#e6c27e",
        desc:"Risques électriques, niveaux d'habilitation et consignes avant d'intervenir." },
      { nom:"Hygiène alimentaire (HACCP)", icone:"🧼", couleur:"#82d2a0",
        desc:"Microbes, températures, traçabilité et nettoyage en restauration." },
    ]},
    { titre: "Filière professionnelle", note: "Les spécialités du bac professionnel, par domaine.", domaines: [
      { titre: "Bâtiment et travaux publics", icone: "🏗️", bacs: [
        { nom: "Travaux publics", icone: "🚧" },
        { nom: "Technicien du bâtiment (gros œuvre)", icone: "🧱" },
        { nom: "Ouvrages du bâtiment : métallerie", icone: "🔩" },
        { nom: "Interventions sur le patrimoine bâti", icone: "🏛️" },
        { nom: "Aménagement et finition du bâtiment", icone: "🖌️" },
        { nom: "Menuiserie aluminium-verre", icone: "🪟" },
        { nom: "Métiers et arts de la pierre", icone: "🪨" },
        { nom: "MELEC (électricité et environnements connectés)", icone: "⚡" },
        { nom: "Installateur en chauffage, climatisation et énergies renouvelables", icone: "🔥" },
        { nom: "Métiers du froid et des énergies renouvelables", icone: "❄️" },
        { nom: "Technicien d'études du bâtiment", icone: "📐" },
        { nom: "Technicien géomètre-topographe", icone: "🗺️" }
      ]},
      { titre: "Bois et ameublement", icone: "🪵", bacs: [
        { nom: "Technicien de fabrication bois et matériaux associés", icone: "🪵" },
        { nom: "Technicien constructeur bois", icone: "🏠" },
        { nom: "Technicien menuisier agenceur", icone: "🪚" },
        { nom: "Étude et réalisation d'agencement", icone: "📏" }
      ]},
      { titre: "Industrie et production", icone: "🏭", bacs: [
        { nom: "Fonderie", icone: "🫕" },
        { nom: "Technicien en chaudronnerie industrielle", icone: "🛠️" },
        { nom: "Technicien en réalisation de produits mécaniques", icone: "⚙️" },
        { nom: "Maintenance des systèmes de production connectés", icone: "🔧" },
        { nom: "Pilote de ligne de production", icone: "🏭" },
        { nom: "Microtechniques", icone: "🔬" },
        { nom: "Technicien modeleur", icone: "🧩" },
        { nom: "Traitements des matériaux", icone: "🧪" },
        { nom: "Plastiques et composites", icone: "🧴" },
        { nom: "Procédés de la chimie, de l'eau et des papiers-cartons", icone: "⚗️" },
        { nom: "Production en industries pharmaceutiques, alimentaires et cosmétiques", icone: "💊" },
        { nom: "Modélisation et prototypage 3D", icone: "🖨️" },
        { nom: "Techniques d'interventions sur installations nucléaires", icone: "☢️" },
        { nom: "Systèmes numériques", icone: "💻" }
      ]},
      { titre: "Véhicules, transport et logistique", icone: "🚚", bacs: [
        { nom: "Maintenance des véhicules", icone: "🚗" },
        { nom: "Carrossier peintre automobile", icone: "🎨" },
        { nom: "Maintenance des matériels", icone: "🚜" },
        { nom: "Aéronautique", icone: "✈️" },
        { nom: "Maintenance nautique", icone: "⛵" },
        { nom: "Transport fluvial", icone: "🚢" },
        { nom: "Conducteur transport routier de marchandises", icone: "🚛" },
        { nom: "Organisation de transport de marchandises", icone: "📋" },
        { nom: "Logistique", icone: "📦" }
      ]},
      { titre: "Alimentation, hôtellerie et restauration", icone: "🍽️", bacs: [
        { nom: "Cuisine", icone: "🍳" },
        { nom: "Commercialisation et services en restauration", icone: "🍽️" },
        { nom: "Boulanger-pâtissier", icone: "🥐" },
        { nom: "Boucher charcutier traiteur", icone: "🥩" },
        { nom: "Poissonnier écailler traiteur", icone: "🐟" }
      ]},
      { titre: "Santé, beauté et services à la personne", icone: "🩺", bacs: [
        { nom: "Accompagnement, soins et services à la personne", icone: "🤝" },
        { nom: "Animation enfance et personnes âgées", icone: "🧸" },
        { nom: "Hygiène, propreté et stérilisation", icone: "🧼" },
        { nom: "Esthétique cosmétique parfumerie", icone: "💄" },
        { nom: "Métiers de la coiffure", icone: "💇" },
        { nom: "Perruquier posticheur", icone: "💈" },
        { nom: "Optique lunetterie", icone: "👓" },
        { nom: "Technicien en prothèse dentaire", icone: "🦷" },
        { nom: "Technicien en appareillage orthopédique", icone: "🦿" }
      ]},
      { titre: "Mode, artisanat et arts graphiques", icone: "🧵", bacs: [
        { nom: "Métiers de la couture et de la confection", icone: "🧵" },
        { nom: "Métiers du cuir", icone: "👜" },
        { nom: "Photographie", icone: "📷" },
        { nom: "Réalisation de produits imprimés et plurimédia", icone: "🖼️" },
        { nom: "Façonnage de produits imprimés, routage", icone: "📰" }
      ]},
      { titre: "Commerce, accueil, sécurité et environnement", icone: "🛎️", bacs: [
        { nom: "Métiers du commerce et de la vente", icone: "🛒" },
        { nom: "Métiers de l'accueil", icone: "🛎️" },
        { nom: "AGOrA (gestion administrative)", icone: "🗂️" },
        { nom: "Métiers de la sécurité", icone: "🛡️" },
        { nom: "Gestion des pollutions et protection de l'environnement", icone: "♻️" }
      ]},
    ]},
  ];

  const hote = document.getElementById('groupes');
  let n = 0;
  GROUPES.forEach(g => {
    const sec = document.createElement('section');
    sec.className = 'groupe';
    sec.innerHTML = `<h2 class="groupe-titre">${g.titre}</h2>` + (g.note ? `<p class="groupe-note">${g.note}</p>` : '');
    if (g.domaines) {
      /* Les bacs pros sont nombreux : un domaine par volet repliable,
         en boutons compacts. Le premier volet est ouvert sur grand écran ;
         sur téléphone, tous sont fermés pour garder la page courte. */
      g.domaines.forEach((d, k) => {
        const vol = document.createElement('details');
        vol.className = 'domaine';
        if (k === 0 && window.matchMedia('(min-width:601px)').matches) vol.open = true;
        vol.innerHTML = `<summary><span class="domaine-icone">${d.icone}</span>`
          + `<span class="domaine-nom">${d.titre}</span><span class="domaine-n">${d.bacs.length}</span></summary>`;
        const grid = document.createElement('div');
        grid.className = 'grid grid-bacs';
        d.bacs.forEach((m, i) => grid.appendChild(carteBac(m, i)));
        vol.appendChild(grid);
        sec.appendChild(vol);
      });
      hote.appendChild(sec);
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'grid';
    g.matieres.forEach(m => grid.appendChild(carte(m, n++)));
    sec.appendChild(grid);
    hote.appendChild(sec);
  });

  /* Bouton compact d'un bac pro. Comme les autres matières, il s'ouvre dès
     qu'on lui donne un href ; sans href, il est « à venir ». */
  function carteBac(m, i) {
    const ouverte = !!m.href;
    const el = document.createElement(ouverte ? 'a' : 'button');
    el.className = 'bac ' + (ouverte ? 'ready' : 'soon');
    el.style.animationDelay = (i * 25) + 'ms';
    el.title = 'Bac pro ' + m.nom;
    if (ouverte) el.href = m.href; else el.type = 'button';
    el.innerHTML = `<span class="bac-icone">${m.icone}</span><span class="bac-nom">${m.nom}</span>`
      + (ouverte ? '' : '<span class="bac-badge">À venir</span>');
    if (!ouverte) el.onclick = () => toast('Le bac pro ' + m.nom + ' arrive bientôt sur Polymates.');
    return el;
  }

  function carte(m, i) {
    const ouverte = !!m.href;
    const el = document.createElement(ouverte ? 'a' : 'button');
    el.className = 'subject ' + (ouverte ? 'ready' : 'soon');
    el.style.setProperty('--sc', m.couleur);
    el.style.animationDelay = (i * 50) + 'ms';
    if (ouverte) el.href = m.href;
    else el.type = 'button';
    el.innerHTML =
      `<div class="subject-icon">${m.icone}</div>` +
      `<div class="subject-title">${m.nom}</div>` +
      `<div class="subject-desc">${m.desc}</div>` +
      (ouverte ? `<div class="subject-go">Entrer →</div>`
               : `<div class="subject-badge">À venir</div>`);
    if (!ouverte) el.onclick = () => toast(m.nom + " arrive bientôt sur Polymates.");
    return el;
  }

  /* petit message éphémère */
  let tid;
  function toast(txt){
    const t = document.getElementById('toast');
    t.textContent = txt; t.classList.add('on');
    clearTimeout(tid); tid = setTimeout(() => t.classList.remove('on'), 2600);
  }

  /* accueil personnalisé une fois la session connue */
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      const u = window.MB_AUTH && MB_AUTH.user();
      if (u && u.pseudo) {
        document.getElementById('titre').innerHTML =
          'Bonjour ' + escapeHtml(u.pseudo) + ',<br>que veux-tu <em>explorer</em> ?';
      }
    }, 60);
  });

  function escapeHtml(t){
    return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
