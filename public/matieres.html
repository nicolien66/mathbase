<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymates — Choisir une matière</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b09; --surface:#111110; --surface2:#181815;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --accent:#c8b97a; --text:#f0ece0; --muted:rgba(240,236,224,0.5);
  --serif:'Playfair Display',Georgia,serif; --sans:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 45% at 50% -10%, rgba(200,185,122,.08), transparent);}

.wrap{max-width:1100px;margin:0 auto;padding:4.5rem 2rem 5rem;position:relative;z-index:1;}

.head{text-align:center;margin-bottom:3.2rem;}
.eyebrow{font-family:var(--mono);font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);
  margin-bottom:1.1rem;display:flex;align-items:center;justify-content:center;gap:.8rem;}
.eyebrow::before,.eyebrow::after{content:'';display:block;width:2.5rem;height:1px;background:rgba(200,185,122,.4);}
.eyebrow em{font-style:italic;}
h1{font-family:var(--serif);font-size:clamp(2rem,4.6vw,3rem);font-weight:700;line-height:1.15;margin-bottom:.9rem;}
h1 em{font-style:italic;color:var(--accent);}
.sub{color:var(--muted);font-size:.96rem;line-height:1.7;max-width:520px;margin:0 auto;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:1.1rem;}

/* Groupes de matières : un simple repère (titre + filet), pas un cadre. */
.groupe{margin-top:2.6rem;}
.groupe:first-child{margin-top:0;}
.groupe-titre{display:flex;align-items:center;gap:.9rem;margin-bottom:1.1rem;
  font-family:var(--mono);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);}
.groupe-titre::after{content:'';flex:1;height:1px;background:var(--border2);}

.subject{
  --sc:var(--accent);
  position:relative;display:flex;flex-direction:column;gap:.65rem;
  background:var(--surface);border:1px solid var(--border2);border-top:2px solid var(--sc);
  border-radius:16px;padding:1.7rem 1.5rem 1.4rem;
  text-decoration:none;color:inherit;text-align:left;font:inherit;
  transition:transform .2s ease,border-color .2s ease,background .2s ease,box-shadow .25s ease;
  min-height:182px;
  opacity:0;transform:translateY(14px);
  animation:cardIn .55s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes cardIn{to{opacity:1;transform:none;}}
.subject.ready{cursor:pointer;}
.subject.ready:hover{transform:translateY(-5px);border-color:var(--sc);background:var(--surface2);
  box-shadow:0 22px 45px -28px var(--sc);}
.subject.ready:focus-visible{outline:2px solid var(--sc);outline-offset:3px;}
.subject.soon{cursor:pointer;opacity:.52;}
.subject.soon:hover{opacity:.7;}

.subject-icon{font-size:1.7rem;}
.subject-title{font-family:var(--serif);font-size:1.3rem;}
.subject-desc{font-size:.85rem;line-height:1.55;color:var(--muted);}
.subject-go{margin-top:auto;font-size:.8rem;color:var(--sc);opacity:0;transform:translateX(-4px);transition:.2s;}
.subject.ready:hover .subject-go,.subject.ready:focus-visible .subject-go{opacity:1;transform:none;}
.subject-badge{align-self:flex-start;margin-top:auto;font-family:var(--mono);font-size:.55rem;
  letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:.22rem .6rem;
  color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--border2);}

.foot-link{text-align:center;margin-top:3.2rem;font-size:.85rem;color:var(--muted);}
.foot-link a{color:var(--accent);text-decoration:none;}
.foot-link a:hover{text-decoration:underline;}

#toast{position:fixed;left:50%;bottom:2rem;transform:translate(-50%,140%);
  background:var(--surface2);border:1px solid var(--border2);border-radius:999px;
  padding:.7rem 1.3rem;font-size:.86rem;color:var(--text);z-index:200;
  box-shadow:0 18px 40px -20px rgba(0,0,0,.8);transition:transform .35s cubic-bezier(.22,1,.36,1);}
#toast.on{transform:translate(-50%,0);}

/* Bouton « Compte » : même apparence que dans la barre de navigation du site.
   En haut à gauche sur grand écran, pour ne pas chevaucher la pastille de
   session (en haut à droite) ; sous le titre sur téléphone, où la pastille
   occupe toute la largeur. */
.compte-btn{position:fixed;top:14px;left:16px;z-index:90;display:inline-flex;align-items:center;gap:.45rem;
  font-size:.8rem;font-weight:500;background:#c8b97a;color:#0b0b09;border-radius:8px;padding:.55rem 1.1rem;
  text-decoration:none;box-shadow:0 6px 24px -8px rgba(0,0,0,.6);transition:transform .15s,background .2s;}
.compte-btn:hover{transform:translateY(-1px);background:#d6c98e;}
.compte-btn:focus-visible{outline:2px solid #f0ece0;outline-offset:2px;}

@media(max-width:600px){.wrap{padding:5rem 1.2rem 4rem;}
  .compte-btn{position:static;margin-top:1.3rem;padding:.65rem 1.6rem;font-size:.86rem;}}
@media (prefers-reduced-motion:reduce){.subject{animation:none;opacity:1;transform:none;}}
</style>
<script src="matiere.js"></script>
<script src="auth.js" data-protect></script>
</head>
<body>
<div class="wrap">
  <div class="head">
    <p class="eyebrow">Poly<em>mates</em></p>
    <h1 id="titre">Quelle matière<br>veux-tu <em>explorer</em> ?</h1>
    <p class="sub">Choisis une matière pour accéder à ses cours, tutoriels et exercices.</p>
    <a class="compte-btn" href="compte.html" title="Mon compte : profil, crédits, progression">Compte</a>
  </div>

  <div id="groupes"></div>

  <p class="foot-link">Une matière que tu aimerais voir en priorité ? <a href="mailto:contact@polymates.fr">Écris-nous</a>.</p>
</div>

<div id="toast"></div>

<script>
(function(){
  /* Les matières scolaires viennent de matiere.js : une seule liste pour tout le site.
     Pour ouvrir une matière, il suffit d'y passer ouverte:true.
     Les autres groupes sont décrits ici ; leurs boutons sont « à venir » tant
     qu'ils n'ont pas de href. */
  const scolaires = MB_MAT.liste().map(m => ({
    nom: m.nom, icone: m.icone, couleur: m.couleur, desc: m.desc,
    href: m.ouverte ? (m.accueil + '?matiere=' + encodeURIComponent(m.id)) : null,
  }));

  const GROUPES = [
    { titre: "Matières scolaires", matieres: scolaires },
    { titre: "Religion", matieres: [
      { nom:"Bible", icone:"📜", couleur:"#c89a7a",
        desc:"Lire et comprendre les textes, les personnages et les grands récits." },
    ]},
    { titre: "Permis", matieres: [
      { nom:"Permis piéton", icone:"🚸", couleur:"#7ac8b4",
        desc:"Se déplacer à pied en sécurité : traverser, signaux, dangers de la rue." },
      { nom:"Permis de voiture", icone:"🚗", couleur:"#c87a7a",
        desc:"Code de la route : signalisation, priorités, situations de conduite." },
    ]},
    { titre: "Matières manuelles", matieres: [
      { nom:"Électricité", icone:"⚡", couleur:"#d4c46a",
        desc:"Circuits, schémas, habilitation et installations du bac pro." },
      { nom:"Menuiserie", icone:"🪚", couleur:"#b8916a",
        desc:"Bois, assemblages, lecture de plans et fabrication." },
      { nom:"Maintenance automobile", icone:"🔧", couleur:"#8a9aae",
        desc:"Moteur, freinage, diagnostic et entretien des véhicules." },
      { nom:"Cuisine", icone:"🍳", couleur:"#d48a6a",
        desc:"Techniques de base, hygiène, préparations et organisation du poste." },
    ]},
  ];

  const hote = document.getElementById('groupes');
  let n = 0;
  GROUPES.forEach(g => {
    const sec = document.createElement('section');
    sec.className = 'groupe';
    sec.innerHTML = `<h2 class="groupe-titre">${g.titre}</h2>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    g.matieres.forEach(m => grid.appendChild(carte(m, n++)));
    sec.appendChild(grid);
    hote.appendChild(sec);
  });

  function carte(m, i) {
    const ouverte = !!m.href;
    const el = document.createElement(ouverte ? 'a' : 'button');
    el.className = 'subject ' + (ouverte ? 'ready' : 'soon');
    el.style.setProperty('--sc', m.couleur);
    el.style.animationDelay = (i * 50) + 'ms';
    if (ouverte) el.href = m.href;
    else el.type = 'button';
    el.innerHTML =
      `<div class="subject-icon">${m.icone}</div>` +
      `<div class="subject-title">${m.nom}</div>` +
      `<div class="subject-desc">${m.desc}</div>` +
      (ouverte ? `<div class="subject-go">Entrer →</div>`
               : `<div class="subject-badge">À venir</div>`);
    if (!ouverte) el.onclick = () => toast(m.nom + " arrive bientôt sur Polymates.");
    return el;
  }

  /* petit message éphémère */
  let tid;
  function toast(txt){
    const t = document.getElementById('toast');
    t.textContent = txt; t.classList.add('on');
    clearTimeout(tid); tid = setTimeout(() => t.classList.remove('on'), 2600);
  }

  /* accueil personnalisé une fois la session connue */
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      const u = window.MB_AUTH && MB_AUTH.user();
      if (u && u.pseudo) {
        document.getElementById('titre').innerHTML =
          'Bonjour ' + escapeHtml(u.pseudo) + ',<br>que veux-tu <em>explorer</em> ?';
      }
    }, 60);
  });

  function escapeHtml(t){
    return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
