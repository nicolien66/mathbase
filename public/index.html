<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathBase</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  background:#0b0b09;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  font-family:'Playfair Display', Georgia, serif;
}

.stage {
  position:relative;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  width:100%; height:100%;
}

.glyph {
  position:absolute;
  font-size:min(22rem, 60vw);
  font-weight:700;
  color:rgba(200,185,122,0);
  line-height:1;
  pointer-events:none;
  top:50%; left:50%;
  transform:translate(-50%,-55%);
  transition:color 2s ease;
  z-index:0;
  user-select:none;
}

.center {
  position:relative; z-index:1;
  display:flex; flex-direction:column;
  align-items:center; gap:0;
}

.line {
  height:1px;
  background:linear-gradient(to right, transparent, rgba(200,185,122,.6), transparent);
  width:0;
  transition:width 1s cubic-bezier(.77,0,.18,1);
}

.logo-wrap { overflow:hidden; padding:.9rem 0 .4rem; }
.logo {
  font-size:clamp(3rem, 10vw, 5.5rem);
  font-weight:400; letter-spacing:-.03em;
  color:#f0ece0;
  opacity:0; transform:translateY(28px);
  transition:opacity .9s ease, transform .9s cubic-bezier(.22,1,.36,1);
}
.logo em { font-style:italic; color:#c8b97a; }

.tagline {
  font-family:'DM Mono', monospace;
  font-size:.58rem; letter-spacing:.26em; text-transform:uppercase;
  color:rgba(200,185,122,0);
  margin-top:1.2rem;
  transition:color 1s ease .3s;
}

.enter-btn {
  margin-top:3rem;
  background:none;
  border:1px solid rgba(200,185,122,0);
  color:rgba(200,185,122,0);
  font-family:'DM Mono', monospace;
  font-size:.65rem; letter-spacing:.22em; text-transform:uppercase;
  padding:.75rem 2.2rem;
  border-radius:4px;
  cursor:pointer;
  transition:border-color 1s ease .5s, color 1s ease .5s, background .2s, transform .15s;
}
.enter-btn:hover {
  background:rgba(200,185,122,.08);
  transform:translateY(-1px);
}
.enter-btn:active { transform:scale(.97); }

.sparks {
  position:absolute; inset:0;
  pointer-events:none; overflow:hidden; z-index:0;
}
.spark {
  position:absolute;
  border-radius:50%;
  background:#c8b97a;
  opacity:0;
  animation:sparkAnim var(--d) ease var(--delay) infinite;
}
@keyframes sparkAnim {
  0%   { opacity:0; transform:translate(0,0) scale(1); }
  15%  { opacity:.85; }
  100% { opacity:0; transform:translate(var(--tx),var(--ty)) scale(0); }
}

.halo {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:200px; height:200px;
  border-radius:50%;
  border:1px solid rgba(200,185,122,0);
  pointer-events:none; z-index:0;
  transition:border-color 1.5s ease;
  animation:haloPulse 4s ease-in-out infinite;
}
.halo2 {
  animation-delay:-2s;
  width:320px; height:320px;
}
@keyframes haloPulse {
  0%,100% { transform:translate(-50%,-50%) scale(1);    opacity:.4; }
  50%      { transform:translate(-50%,-50%) scale(1.08); opacity:.1; }
}

body.exiting .stage {
  animation:exitFade .8s ease forwards;
}
@keyframes exitFade {
  to { opacity:0; transform:scale(1.04); }
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="sparks" id="sparks"></div>
  <div class="halo"  id="halo1"></div>
  <div class="halo halo2" id="halo2"></div>
  <div class="glyph" id="glyph">∑</div>

  <div class="center">
    <div class="line" id="line-top"></div>
    <div class="logo-wrap">
      <div class="logo" id="logo">Math<em>Base</em></div>
    </div>
    <div class="line" id="line-bot"></div>
    <div class="tagline" id="tagline">Exercices · Intelligence artificielle</div>
    <button class="enter-btn" id="btn" onclick="enter()">Entrer</button>
  </div>
</div>

<script>
function intro() {
  const lineTop = document.getElementById('line-top');
  const lineBot = document.getElementById('line-bot');
  const logo    = document.getElementById('logo');
  const tagline = document.getElementById('tagline');
  const btn     = document.getElementById('btn');
  const glyph   = document.getElementById('glyph');
  const halo1   = document.getElementById('halo1');
  const halo2   = document.getElementById('halo2');

  // reset
  lineTop.style.width = '0';
  lineBot.style.width = '0';
  logo.style.opacity = '0';
  logo.style.transform = 'translateY(28px)';
  tagline.style.color = 'rgba(200,185,122,0)';
  btn.style.borderColor = 'rgba(200,185,122,0)';
  btn.style.color = 'rgba(200,185,122,0)';
  glyph.style.color = 'rgba(200,185,122,0)';
  halo1.style.borderColor = 'rgba(200,185,122,0)';
  halo2.style.borderColor = 'rgba(200,185,122,0)';

  setTimeout(() => {
    glyph.style.color = 'rgba(200,185,122,.03)';
    halo1.style.borderColor = 'rgba(200,185,122,.12)';
    halo2.style.borderColor = 'rgba(200,185,122,.07)';
    lineTop.style.width = '300px';
    lineBot.style.width = '300px';
  }, 400);

  setTimeout(() => {
    logo.style.opacity = '1';
    logo.style.transform = 'translateY(0)';
  }, 1100);

  setTimeout(() => {
    tagline.style.color = 'rgba(200,185,122,.5)';
  }, 1900);

  setTimeout(() => {
    btn.style.borderColor = 'rgba(200,185,122,.35)';
    btn.style.color = 'rgba(200,185,122,.7)';
  }, 2400);
}

// Particules continues
const sparksEl = document.getElementById('sparks');

function spawnSpark() {
  const s = document.createElement('div');
  s.className = 'spark';
  const size = .8 + Math.random() * 1.8;
  s.style.width  = size + 'px';
  s.style.height = size + 'px';
  const cx = window.innerWidth  / 2 + (Math.random() - .5) * 60;
  const cy = window.innerHeight / 2 + (Math.random() - .5) * 40;
  s.style.left = cx + 'px';
  s.style.top  = cy + 'px';
  const angle = Math.random() * Math.PI * 2;
  const dist  = 80 + Math.random() * 200;
  const dur   = 2 + Math.random() * 2;
  s.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
  s.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
  s.style.setProperty('--d', dur + 's');
  s.style.setProperty('--delay', '0s');
  sparksEl.appendChild(s);
  setTimeout(() => s.remove(), dur * 1000);
}

const sparkInterval = setInterval(spawnSpark, 180);

function enter() {
  clearInterval(sparkInterval);
  document.body.classList.add('exiting');
  setTimeout(() => {
    window.location.href = 'app.html';
  }, 800);
}

intro();
</script>
</body>
</html>
