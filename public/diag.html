<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Diagnostic MathBase</title>
<style>
  body{background:#0b0b09;color:#f0ece0;font-family:monospace;padding:2rem;font-size:14px;line-height:1.7;}
  h1{color:#c8b97a;font-size:1.2rem;}
  .ok{color:#7ac8a0;} .bad{color:#e6826e;font-weight:bold;} .warn{color:#c8b97a;}
  #report{white-space:pre-wrap;background:#14130f;border:1px solid #333;border-radius:10px;padding:1.2rem;margin-top:1rem;}
  iframe{width:100%;height:300px;border:1px solid #444;border-radius:8px;margin-top:1rem;}
  button{background:#c8b97a;color:#0b0b09;border:none;border-radius:8px;padding:.6rem 1.2rem;font-family:monospace;cursor:pointer;margin-top:1rem;}
</style>
</head>
<body>
<h1>🔍 Diagnostic MathBase</h1>
<p>Cette page teste app.html#entrainement dans ton navigateur et affiche le résultat ci-dessous.<br>
<strong>Recopie tout le rapport (ou fais une capture) et envoie-le.</strong></p>
<div id="report">Chargement du diagnostic…</div>
<iframe id="frame" src="app.html#entrainement"></iframe>

<script>
const R = [];
const log  = (t) => R.push(t);
const ok   = (t) => R.push("✔ " + t);
const bad  = (t) => R.push("✘ PROBLÈME : " + t);
const flush = () => document.getElementById("report").textContent = R.join("\n");

async function checkServedFiles() {
  log("═══ 1. FICHIERS SERVIS PAR LE SERVEUR ═══");
  const marks = {
    "script.js": ["routeFromHash", "openSeance", "openExamen", "loadAnnales"],
    "style.css": [".view.active", ".seance-page", ".home-grid", ".annale-card"],
    "app.html":  ['id="view-seance"', 'id="seance-hero-title"', 'id="view-home"', 'data-tab="entrainement"'],
    "auth.js":   ["hasBackend", "guard"],
    "calc.js":   ["mb-calc-fab"],
    "contenu.js":["CHAPTER_STRUCTURE"],
  };
  for (const [file, needles] of Object.entries(marks)) {
    try {
      const res = await fetch(file + "?nocache=" + Date.now());
      if (!res.ok) { bad(file + " → HTTP " + res.status); continue; }
      const txt = await res.text();
      const missing = needles.filter(n => !txt.includes(n));
      if (missing.length) bad(file + " est une ANCIENNE VERSION — il manque : " + missing.join(", "));
      else ok(file + " est à jour (" + txt.length + " octets)");
    } catch (e) { bad(file + " → " + e.message); }
  }
  flush();
}

function checkFrame() {
  log("");
  log("═══ 2. RENDU RÉEL DE app.html#entrainement ═══");
  const fr = document.getElementById("frame");
  let doc, win;
  try { win = fr.contentWindow; doc = fr.contentDocument; }
  catch (e) { bad("iframe inaccessible : " + e.message); flush(); return; }
  if (!doc || !doc.body) { bad("le document de l'iframe est vide"); flush(); return; }

  // erreurs JS capturées
  if (win.__errs && win.__errs.length) {
    win.__errs.forEach(e => bad("ERREUR JS dans la page : " + e));
  }

  // vue active
  const active = doc.querySelector(".view.active");
  if (!active) bad("AUCUNE vue active — c'est pour ça que c'est noir");
  else {
    const cs = win.getComputedStyle(active);
    log("vue active : #" + active.id + "  (display=" + cs.display + ", opacity=" + cs.opacity + ", hauteur=" + active.offsetHeight + "px)");
    if (cs.display === "none") bad("la vue active est en display:none → CSS pas appliqué");
    else if (active.offsetHeight < 50) bad("la vue active a une hauteur quasi nulle → contenu vide ou masqué");
    else ok("la vue active a un contenu visible de " + active.offsetHeight + "px de haut");
  }

  // qu'y a-t-il RÉELLEMENT au centre de l'écran ?
  const cx = Math.floor(fr.clientWidth / 2), cy = 200;
  const el = doc.elementFromPoint(cx, cy);
  if (el) {
    let chain = [], n = el;
    for (let i = 0; i < 4 && n; i++) { chain.push(n.tagName + (n.id ? "#" + n.id : "") + (n.className && typeof n.className === "string" ? "." + n.className.split(" ")[0] : "")); n = n.parentElement; }
    log("élément au point (" + cx + "," + cy + ") : " + chain.join(" ← "));
  } else log("aucun élément au centre (page réellement vide à cet endroit)");

  // surcouches fixes visibles
  const overlays = [];
  doc.querySelectorAll("*").forEach(e => {
    const cs = win.getComputedStyle(e);
    if (cs.position === "fixed" && cs.opacity !== "0" && cs.display !== "none"
        && cs.backgroundColor !== "rgba(0, 0, 0, 0)" && e.offsetWidth > fr.clientWidth * 0.8) {
      overlays.push(e.tagName + (e.id ? "#" + e.id : "") + " z=" + cs.zIndex + " bg=" + cs.backgroundColor);
    }
  });
  if (overlays.length) { log("surcouches plein écran visibles :"); overlays.forEach(o => bad("  RECOUVRE LA PAGE : " + o)); }
  else ok("aucune surcouche opaque ne recouvre la page");

  // le hash a-t-il routé ?
  const heroTitle = doc.getElementById("seance-hero-title");
  log("titre de séance : " + (heroTitle ? '"' + heroTitle.textContent.trim() + '"' : "ABSENT du HTML"));

  // INSPECTION PROFONDE de la vue active
  log("");
  log("═══ 3. POURQUOI LA HAUTEUR EST NULLE ═══");
  if (active) {
    // remonter les parents pour voir qui impose une contrainte
    let n = active, up = [];
    while (n && n !== doc.documentElement) {
      const cs = win.getComputedStyle(n);
      up.push("#" + (n.id || n.tagName) + " h=" + n.offsetHeight + " display=" + cs.display + " height=" + cs.height + " overflow=" + cs.overflow + " maxH=" + cs.maxHeight);
      n = n.parentElement;
    }
    log("chaîne des parents (de la vue vers le haut) :");
    up.forEach(u => log("   " + u));

    // enfants directs de la vue
    log("");
    log("enfants directs de la vue active :");
    Array.from(active.children).forEach(c => {
      const cs = win.getComputedStyle(c);
      log("   " + c.tagName + "#" + (c.id||"-") + " h=" + c.offsetHeight + " display=" + cs.display + " visibility=" + cs.visibility + " position=" + cs.position);
    });

    // le body lui-même
    const bcs = win.getComputedStyle(doc.body);
    log("");
    log("body : h=" + doc.body.offsetHeight + " display=" + bcs.display + " height=" + bcs.height + " overflow=" + bcs.overflow + " position=" + bcs.position);
    const hcs = win.getComputedStyle(doc.documentElement);
    log("html : h=" + doc.documentElement.offsetHeight + " display=" + hcs.display + " height=" + hcs.height);
  }

  log("");
  log("═══ FIN — envoie ce rapport tel quel ═══");
  flush();
}

// capturer les erreurs JS de l'iframe
const fr = document.getElementById("frame");
fr.addEventListener("load", () => {
  try {
    fr.contentWindow.__errs = [];
    fr.contentWindow.addEventListener("error", (e) => {
      fr.contentWindow.__errs.push(e.message + " (" + (e.filename || "").split("/").pop() + ":" + e.lineno + ")");
    });
  } catch (e) {}
  setTimeout(checkFrame, 2500);
});

checkServedFiles();
</script>
</body>
</html>
