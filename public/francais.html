<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymates — Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="parchemin.css">
<link rel="stylesheet" href="atelier.css">
<style>
/* Le programme du jour : une seule chose à faire, franchement proposée. */
.programme {
  margin-top: 2.4rem; padding: 1.5rem 1.7rem;
  border: 1px solid rgba(168,129,58,.4); background: rgba(168,129,58,.07);
}
.programme-quoi {
  font-variant: small-caps; letter-spacing: .16em; font-size: .72rem;
  color: var(--encre-pale); margin-bottom: .5rem;
}
.programme-titre { font-family: var(--titre); font-size: 1.75rem; font-weight: 600; line-height: 1.15; }
.programme-texte { margin-top: .4rem; color: var(--encre-pale); font-size: .97rem; }

.serie-jours { display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap; margin-top: 1.2rem; }
.semaine { display: flex; gap: .3rem; }
.jour {
  width: 1.5rem; height: 1.5rem; display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(120,100,60,.35);
  font-variant: small-caps; font-size: .62rem; color: var(--encre-pale);
}
.jour.travaille { background: var(--accent); border-color: var(--accent); color: var(--papier-clair); }

.carnet-mot {
  display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap;
  padding: .5rem 0; border-bottom: 1px solid rgba(120,100,60,.14);
}
.carnet-mot:last-child { border-bottom: none; }
.carnet-juste { font-family: var(--titre); font-size: 1.12rem; font-weight: 600; }
.carnet-rate { font-size: .88rem; color: var(--correction); text-decoration: line-through; }
.carnet-type { flex: 1 1 8rem; font-variant: small-caps; letter-spacing: .1em; font-size: .7rem; color: var(--encre-pale); }
.carnet-quand { font-variant: small-caps; letter-spacing: .1em; font-size: .7rem; color: var(--a-revoir); }
.carnet-oublier {
  background: none; border: none; padding: 0 .2rem; cursor: pointer;
  color: var(--encre-pale); font-size: .95rem; line-height: 1; opacity: .5;
}
.carnet-oublier:hover { opacity: 1; color: var(--correction); }

.dernieres { margin-top: 1rem; }
.derniere {
  display: flex; align-items: baseline; gap: .7rem;
  padding: .4rem 0; border-bottom: 1px solid rgba(120,100,60,.12);
  font-size: .95rem;
}
.derniere:last-child { border-bottom: none; }
.derniere-titre { font-family: var(--titre); font-size: 1.05rem; flex: 1; }
.derniere-note { font-family: var(--titre); font-weight: 600; }
.derniere-note.haut { color: var(--acquis); }
.derniere-note.bas { color: var(--correction); }
.derniere-date { font-variant: small-caps; letter-spacing: .1em; font-size: .68rem; color: var(--encre-pale); }
</style>
<script src="matiere.js"></script>
<script src="auth.js" data-protect data-sans-chip></script>
<script src="francais-contenu.js"></script>
<script src="francais-dictees.js"></script>
<script src="francais-exercices.js"></script>
<script src="francais-progres.js"></script>
<script src="francais-atelier.js"></script>
</head>
<body data-matiere="francais">

<header class="bandeau">
  <a class="bandeau-titre" href="matieres.html">Poly<em>mates</em></a>
  <div class="bandeau-droite">
    <span id="lecteur"></span>
    <a href="matieres.html">Changer de matière</a>
    <button type="button" id="sortir">Se déconnecter</button>
  </div>
</header>

<div id="rubans"></div>
<div id="page"></div>

<p class="colophon">Polymates — Français</p>

<script>
(function () {
  "use strict";
  if (!MB_ATELIER.installer("accueil")) return;

  const { ech, el, lien, lienChapitre, nomChapitre } = MB_ATELIER;
  const THEMES = window.FRANCAIS_THEMES || [];
  const DICTEES = window.FRANCAIS_DICTEES || [];
  const page = document.getElementById("page");

  const totalChap = THEMES.reduce((n, t) => n + t.chapitres.length, 0);
  const lus = () => THEMES.reduce((n, t) =>
    n + t.chapitres.filter(c => MB_FR.estLu(t.id, c.id)).length, 0);

  /* ══════════════════════════════════════════════════════════════
     LE PROGRAMME DU JOUR
     Une seule proposition, choisie dans cet ordre : réviser ce qui a été
     manqué, puis lire le chapitre suivant, puis s'entraîner, puis dicter.
     Proposer quatre choses revient à n'en proposer aucune.
     ══════════════════════════════════════════════════════════════ */
  function programme() {
    const s = MB_FR.stats();

    if (s.aReviser >= 3) {
      return { quoi: "À faire d'abord", titre: s.aReviser + " mots vous attendent",
        texte: "Des mots manqués en dictée ou en exercice reviennent aujourd'hui. " +
               "Cinq minutes suffisent, et c'est ce qui fait la différence sur la durée.",
        bouton: "Réviser mes fautes", href: lien("francais-exercices.html") + "#revision" };
    }
    /* Le premier chapitre non lu, dans l'ordre du programme. */
    for (const t of THEMES) {
      for (const c of t.chapitres) {
        if (!MB_FR.estLu(t.id, c.id)) {
          return { quoi: lus() ? "Le chapitre suivant" : "Par où commencer",
            titre: c.nom,
            texte: c.resume + " — " + t.nom.toLowerCase() + ", chapitre " +
                   (t.chapitres.indexOf(c) + 1) + " sur " + t.chapitres.length + ".",
            bouton: "Lire le cours", href: lienChapitre(c.id) };
        }
      }
    }
    /* Tout est lu : la dictée non faite du plus haut niveau atteint. */
    const faites = MB_FR.dictees().map(d => d.id);
    const reste = DICTEES.filter(d => faites.indexOf(d.id) < 0);
    if (reste.length) {
      const d = reste[0];
      return { quoi: "Mettre à l'épreuve", titre: "Dictée : " + d.titre,
        texte: d.mots + " mots, niveau " + d.niveau + ". Les chapitres travaillés : " +
               (d.vise || []).map(nomChapitre).filter(Boolean).join(", ") + ".",
        bouton: "Faire cette dictée", href: lien("francais-dictee.html") };
    }
    return { quoi: "Entretenir", titre: "Tout le cours est lu, toutes les dictées faites",
      texte: "Il reste le mélange général et le marathon de conjugaison, qui ne " +
             "s'épuisent pas. Et les dictées se refont : la note doit monter.",
      bouton: "Mélange général", href: lien("francais-exercices.html") };
  }

  /* ══════════════════════════════════════════════════════════════
     LA PAGE
     ══════════════════════════════════════════════════════════════ */
  function vue() {
    const s = MB_FR.stats();
    page.innerHTML = "";
    const f = el("main", "feuille");

    f.appendChild(el("p", "rubrique", "Français"));
    f.appendChild(el("h1", null, "Lire, écrire,<br><em>et dire juste.</em>"));
    f.appendChild(el("div", "filet", "<span>❦</span>"));
    f.appendChild(el("p", "ouverture",
      "Cet atelier a un seul but : écrire un français sans faute. Le cours donne la règle, " +
      "les exercices l'ancrent, la dictée la met à l'épreuve, et le carnet ramène ce qui " +
      "a été manqué jusqu'à ce que ce soit acquis."));

    /* ── Le programme du jour ── */
    const p = programme();
    const prog = el("section", "programme");
    prog.appendChild(el("p", "programme-quoi", ech(p.quoi)));
    prog.appendChild(el("p", "programme-titre", ech(p.titre)));
    prog.appendChild(el("p", "programme-texte", ech(p.texte)));
    const barre = el("div", "barre-boutons");
    const a = document.createElement("a");
    a.className = "bouton"; a.href = p.href; a.textContent = p.bouton;
    barre.appendChild(a);
    prog.appendChild(barre);
    f.appendChild(prog);

    /* ── La série de jours : sept cases, rien de plus ── */
    if (s.serie || MB_FR.etat().jours.length) {
      const sj = el("div", "serie-jours");
      const b = el("div", "compteur");
      b.innerHTML = '<b>' + s.serie + '</b><span>' +
        (s.serie > 1 ? "jours d'affilée" : s.serie === 1 ? "jour" : "série interrompue") + '</span>';
      sj.appendChild(b);
      const sem = el("div", "semaine");
      const NOMS = ["d", "l", "m", "m", "j", "v", "s"];
      for (let i = 6; i >= 0; i--) {
        const dte = new Date(); dte.setDate(dte.getDate() - i);
        const j = el("div", "jour" + (MB_FR.etat().jours.indexOf(MB_FR.jour(dte)) >= 0 ? " travaille" : ""),
                     NOMS[dte.getDay()]);
        j.title = dte.toLocaleDateString("fr-FR");
        sem.appendChild(j);
      }
      sj.appendChild(sem);
      f.appendChild(sj);
    }

    /* ── Les chiffres ── */
    const ch = el("div", "chiffres");
    const cartesChiffres = [
      ["Chapitres lus", lus() + " / " + totalChap, Math.round(100 * lus() / totalChap)],
      ["Exercices justes", s.exTaux == null ? "—" : s.exTaux + " %", s.exTaux],
      ["Moyenne en dictée", s.dicteeMoyenne == null ? "—" : s.dicteeMoyenne + " %", s.dicteeMoyenne],
      ["Mots au carnet", s.carnet, null],
    ];
    cartesChiffres.forEach(([nom, val, pct]) => {
      const b = el("div");
      b.appendChild(el("div", "chiffre-val", ech(val)));
      b.appendChild(el("div", "chiffre-nom", ech(nom)));
      if (pct != null) b.appendChild(el("div", "jauge", '<span style="width:' + pct + '%"></span>'));
      ch.appendChild(b);
    });
    f.appendChild(ch);

    /* ── Les salles ── */
    const sec = el("section", "sommaire");
    sec.appendChild(el("p", "sommaire-titre", "Les salles de l'atelier"));
    const cartes = el("div", "cartes");
    [
      { page:"francais-cours.html", marque:"¶", nom:"Le cours",
        chiffre: totalChap + " chapitres",
        texte:"Orthographe, grammaire, conjugaison : la règle, ses exemples, ses tableaux et son récapitulatif." },
      { page:"francais-exercices.html", marque:"✎", nom:"Exercices",
        chiffre: window.FRANCAIS_EXERCICES.length + " questions",
        texte:"Dix questions par séance, corrigées à la volée, avec le renvoi au chapitre concerné." },
      { page:"francais-dictee.html", marque:"☙", nom:"Dictées",
        chiffre: DICTEES.length + " textes",
        texte:"Écouter, écrire sur le cahier, recevoir la copie corrigée à l'encre rouge, faute par faute." },
      { page:"francais-conjugueur.html", marque:"⁂", nom:"Conjugueur",
        chiffre:"tous les verbes",
        texte:"La table complète d'un verbe, ses cinq formes clés, et un entraînement au tirage au sort." },
      { page:"francais-memento.html", marque:"☞", nom:"Mémento",
        chiffre:"toutes les règles",
        texte:"Chaque tableau du cours, cherchable d'un mot. À ouvrir en pleine rédaction." },
    ].forEach(x => {
      const c = document.createElement("a");
      c.className = "carte"; c.href = lien(x.page);
      c.innerHTML =
        '<span class="carte-tete">' +
          '<span class="carte-marque" aria-hidden="true">' + x.marque + '</span>' +
          '<span class="carte-nom">' + ech(x.nom) + '</span>' +
          '<span class="carte-chiffre">' + ech(x.chiffre) + '</span>' +
          '<span class="carte-fleche">Entrer →</span>' +
        '</span>' +
        '<span class="carte-texte">' + ech(x.texte) + '</span>';
      cartes.appendChild(c);
    });
    sec.appendChild(cartes);
    f.appendChild(sec);

    /* ── Le carnet de fautes ── */
    const carnet = MB_FR.carnet();
    const mots = Object.keys(carnet);
    if (mots.length) {
      const car = el("section", "sommaire");
      car.appendChild(el("p", "sommaire-titre",
        "Mon carnet de fautes — " + mots.length + (mots.length > 1 ? " mots" : " mot")));
      const dus = MB_FR.aReviser();
      const ordre = dus.map(x => x.mot)
        .concat(mots.filter(m => !dus.some(d => d.mot === m)));
      ordre.slice(0, 12).forEach(m => {
        const x = carnet[m];
        const due = dus.some(d => d.mot === m);
        const l = el("div", "carnet-mot");
        l.appendChild(el("span", "carnet-juste", ech(x.attendu)));
        if (x.erreurs && x.erreurs[0]) l.appendChild(el("span", "carnet-rate", ech(x.erreurs[0])));
        l.appendChild(el("span", "carnet-type", ech(x.type || "orthographe")));
        l.appendChild(el("span", "carnet-quand", due ? "à revoir" : "revu"));
        const o = el("button", "carnet-oublier", "×");
        o.type = "button";
        o.title = "Retirer « " + x.attendu + " » du carnet";
        o.setAttribute("aria-label", "Retirer " + x.attendu + " du carnet");
        o.onclick = () => { MB_FR.oublier(m); vue(); };
        l.appendChild(o);
        car.appendChild(l);
      });
      if (mots.length > 12) car.appendChild(el("p", "note", "et " + (mots.length - 12) + " autres."));
      const b = el("div", "barre-boutons");
      const rev = document.createElement("a");
      rev.className = "bouton creux";
      rev.href = lien("francais-exercices.html") + "#revision";
      rev.textContent = dus.length ? "Réviser les " + dus.length + " mots dus" : "Tout est révisé pour aujourd'hui";
      if (!dus.length) { rev.className = "bouton sourd"; rev.removeAttribute("href"); }
      b.appendChild(rev);
      car.appendChild(b);
      f.appendChild(car);
    }

    /* ── Les dernières dictées ── */
    const d = MB_FR.dictees();
    if (d.length) {
      const sec2 = el("section", "sommaire");
      sec2.appendChild(el("p", "sommaire-titre", "Dernières dictées"));
      const liste = el("div", "dernieres");
      d.slice(0, 5).forEach(x => {
        const l = el("div", "derniere");
        l.appendChild(el("span", "derniere-titre", ech(x.titre)));
        l.appendChild(el("span", "derniere-note " + (x.score >= 85 ? "haut" : "bas"), x.score + " %"));
        l.appendChild(el("span", "derniere-date",
          new Date(x.date).toLocaleDateString("fr-FR", { day: "numeric", month: "short" })));
        liste.appendChild(l);
      });
      sec2.appendChild(liste);
      f.appendChild(sec2);
    }

    /* ── Ce qui n'existe pas encore : le dire, plutôt que de le taire ── */
    f.appendChild(el("p", "note",
      "Littérature, expression écrite et annales du brevet ne sont pas encore ouvertes. " +
      "Les données de progression restent sur cet appareil et n'en sortent pas."));

    if (MB_FR.etat().jours.length) {
      const raz = el("div", "barre-boutons");
      const b = el("button", "bouton sourd", "Effacer ma progression");
      b.type = "button";
      b.onclick = () => {
        if (confirm("Effacer tout : chapitres lus, scores, dictées et carnet de fautes ?")) {
          MB_FR.reinitialiser(); vue();
        }
      };
      raz.appendChild(b);
      f.appendChild(raz);
    }

    page.appendChild(f);
  }

  window.addEventListener("mb-francais-progres", vue);
  vue();
})();
</script>
</body>
</html>
