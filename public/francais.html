<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymates — Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="parchemin.css">
<link rel="stylesheet" href="atelier.css">
<link rel="stylesheet" href="francais-ui.css">
<link rel="stylesheet" href="francais.css">
<script src="matiere.js"></script>
<script src="auth.js" data-protect data-sans-chip></script>
<script src="francais-contenu.js"></script>
<script src="francais-dictees.js"></script>
<script src="francais-exercices.js"></script>
<script src="francais-progres.js"></script>
<script src="francais-atelier.js"></script>
</head>
<body data-matiere="francais">

<header class="bandeau">
  <a class="bandeau-titre" href="matieres.html">Poly<em>mates</em></a>
  <div class="bandeau-droite">
    <span id="lecteur"></span>
    <a href="matieres.html">Changer de matière</a>
    <button type="button" id="sortir">Se déconnecter</button>
  </div>
</header>

<div id="rubans"></div>
<div id="page"></div>

<p class="colophon">Polymates — Français</p>

<script>
(function () {
  "use strict";
  if (!MB_ATELIER.installer("accueil")) return;

  const { ech, el, lien, lienChapitre, nomChapitre } = MB_ATELIER;
  const THEMES = window.FRANCAIS_THEMES || [];
  const DICTEES = window.FRANCAIS_DICTEES || [];
  const page = document.getElementById("page");

  const totalChap = THEMES.reduce((n, t) => n + t.chapitres.length, 0);
  const lus = () => THEMES.reduce((n, t) =>
    n + t.chapitres.filter(c => MB_FR.estLu(t.id, c.id)).length, 0);

  /* ══════════════════════════════════════════════════════════════
     LE PROGRAMME DU JOUR
     Une seule proposition, choisie dans cet ordre : réviser ce qui a été
     manqué, puis lire le chapitre suivant, puis s'entraîner, puis dicter.
     Proposer quatre choses revient à n'en proposer aucune.
     ══════════════════════════════════════════════════════════════ */
  function programme() {
    const s = MB_FR.stats();

    if (s.aReviser >= 3) {
      return { quoi: "À faire d'abord", titre: s.aReviser + " mots vous attendent",
        texte: "Des mots manqués en dictée ou en exercice reviennent aujourd'hui. " +
               "Cinq minutes suffisent, et c'est ce qui fait la différence sur la durée.",
        bouton: "Réviser mes fautes", href: lien("francais-exercices.html") + "#revision" };
    }
    /* Le premier chapitre non lu, dans l'ordre du programme. */
    for (const t of THEMES) {
      for (const c of t.chapitres) {
        if (!MB_FR.estLu(t.id, c.id)) {
          return { quoi: lus() ? "Le chapitre suivant" : "Par où commencer",
            titre: c.nom,
            texte: c.resume + " — " + t.nom.toLowerCase() + ", chapitre " +
                   (t.chapitres.indexOf(c) + 1) + " sur " + t.chapitres.length + ".",
            bouton: "Lire le cours", href: lienChapitre(c.id) };
        }
      }
    }
    /* Tout est lu : la dictée non faite du plus haut niveau atteint. */
    const faites = MB_FR.dictees().map(d => d.id);
    const reste = DICTEES.filter(d => faites.indexOf(d.id) < 0);
    if (reste.length) {
      const d = reste[0];
      return { quoi: "Mettre à l'épreuve", titre: "Dictée : " + d.titre,
        texte: d.mots + " mots, niveau " + d.niveau + ". Les chapitres travaillés : " +
               (d.vise || []).map(nomChapitre).filter(Boolean).join(", ") + ".",
        bouton: "Faire cette dictée", href: lien("francais-dictee.html") };
    }
    return { quoi: "Entretenir", titre: "Tout le cours est lu, toutes les dictées faites",
      texte: "Il reste le mélange général et le marathon de conjugaison, qui ne " +
             "s'épuisent pas. Et les dictées se refont : la note doit monter.",
      bouton: "Mélange général", href: lien("francais-exercices.html") };
  }

  /* ══════════════════════════════════════════════════════════════
     LA PAGE
     ══════════════════════════════════════════════════════════════ */
  function vue() {
    const s = MB_FR.stats();
    const carnet = MB_FR.carnet();
    const dus = MB_FR.aReviser();
    page.innerHTML = "";
    const f = el("main", "feuille");

    /* ── En-tête ── */
    f.appendChild(MB_ATELIER.entete("Français", "Cours, exercices, dictées : tout ce qu'il faut pour écrire sans faute."));

    /* ── Continuer : une seule chose à faire, avec son bouton ── */
    const p = programme();
    const cont = el("section", "continuer");
    const g = el("div");
    g.appendChild(el("div", "continuer-quoi", ech(p.quoi)));
    g.appendChild(el("div", "continuer-titre", ech(p.titre)));
    g.appendChild(el("div", "continuer-texte", ech(p.texte)));
    if (s.serie || MB_FR.etat().jours.length) {
      const se = el("div", "serie");
      se.appendChild(el("span", null, "<b>" + s.serie + "</b> " + (s.serie > 1 ? "jours d'affilée" : s.serie === 1 ? "jour" : "série interrompue")));
      const cases = el("div", "serie-cases");
      const NOMS = ["d", "l", "m", "m", "j", "v", "s"];
      for (let i = 6; i >= 0; i--) {
        const dte = new Date(); dte.setDate(dte.getDate() - i);
        const c = el("div", "serie-case" + (MB_FR.etat().jours.indexOf(MB_FR.jour(dte)) >= 0 ? " ok" : ""), NOMS[dte.getDay()]);
        c.title = dte.toLocaleDateString("fr-FR");
        cases.appendChild(c);
      }
      se.appendChild(cases);
      g.appendChild(se);
    }
    cont.appendChild(g);
    const a = document.createElement("a");
    a.className = "btn grand"; a.href = p.href; a.textContent = p.bouton + " →";
    cont.appendChild(a);
    f.appendChild(cont);

    /* ── Accès rapide ── */
    const tuiles = el("div", "tuiles");
    [
      { page:"francais-cours.html", ico:"📖", nom:"Cours", chiffre: lus() + " / " + totalChap + " chapitres lus", texte:"La règle, ses exemples, ses tableaux." },
      { page:"francais-exercices.html", ico:"✏️", nom:"Exercices", chiffre: s.exTaux == null ? window.FRANCAIS_EXERCICES.length + " questions" : s.exTaux + " % de réussite", texte:"Dix questions, corrigées à la volée." },
      { page:"francais-dictee.html", ico:"🎧", nom:"Dictées", chiffre: s.dicteeMoyenne == null ? DICTEES.length + " textes" : "moyenne " + s.dicteeMoyenne + " %", texte:"Écouter, écrire, recevoir la copie corrigée." },
      { page:"francais-conjugueur.html", ico:"🔤", nom:"Conjugueur", chiffre:"tous les verbes", texte:"La table complète et un entraînement." },
      { page:"francais-memento.html", ico:"📋", nom:"Mémento", chiffre:"toutes les règles", texte:"Chaque tableau du cours, cherchable." },
    ].forEach(x => {
      const t = document.createElement("a");
      t.className = "tuile"; t.href = lien(x.page);
      t.innerHTML = '<span class="tuile-ico" aria-hidden="true">' + x.ico + '</span>' +
        '<span class="tuile-nom">' + ech(x.nom) + '</span>' +
        '<span class="tuile-chiffre">' + ech(x.chiffre) + '</span>' +
        '<span class="tuile-texte">' + ech(x.texte) + '</span>';
      tuiles.appendChild(t);
    });
    f.appendChild(tuiles);

    /* ── Le cours, chapitre par chapitre : la carte du programme ── */
    const sec = el("section", "section");
    const st = el("div", "section-tete");
    st.appendChild(el("h2", null, "Le programme, chapitre par chapitre"));
    const tout = document.createElement("a"); tout.href = lien("francais-cours.html"); tout.textContent = "Ouvrir le cours →";
    st.appendChild(tout);
    sec.appendChild(st);
    THEMES.forEach(t => {
      const lusT = t.chapitres.filter(c => MB_FR.estLu(t.id, c.id)).length;
      const bd = el("div", "theme-bandeau");
      bd.style.setProperty("--teinte", t.teinte);
      bd.innerHTML = '<i></i><b>' + ech(t.nom) + '</b><span>' + lusT + ' / ' + t.chapitres.length + ' lus</span>';
      sec.appendChild(bd);
      const gr = el("div", "fr-grille");
      t.chapitres.forEach((c, i) => {
        const lu = MB_FR.estLu(t.id, c.id);
        const score = MB_FR.scoreChapitre(c.id);
        const ch = document.createElement("a");
        ch.className = "fr-chap"; ch.href = lienChapitre(c.id);
        ch.style.setProperty("--teinte", t.teinte);
        let etat = lu ? '<span class="fr-chap-etat lu">✓ lu</span>' : '<span class="fr-chap-etat">à lire</span>';
        if (score != null) etat = '<span class="fr-chap-etat ' + (score >= 75 ? "score-haut" : "score-bas") + '">' + score + ' %</span>';
        ch.innerHTML = '<span class="fr-chap-num">' + (i + 1) + '</span><span class="fr-chap-nom">' + ech(c.nom) + '</span>' + etat;
        gr.appendChild(ch);
      });
      sec.appendChild(gr);
    });
    f.appendChild(sec);

    /* ── Le carnet de fautes ── */
    const mots = Object.keys(carnet);
    if (mots.length) {
      const car = el("section", "section");
      const ct = el("div", "section-tete");
      ct.appendChild(el("h2", null, "Mon carnet de fautes — " + mots.length + (mots.length > 1 ? " mots" : " mot")));
      if (dus.length) { const r = document.createElement("a"); r.href = lien("francais-exercices.html") + "#revision"; r.textContent = "Réviser les " + dus.length + " mots dus →"; ct.appendChild(r); }
      else ct.appendChild(el("span", null, "Tout est révisé pour aujourd'hui"));
      car.appendChild(ct);
      const table = el("table", "carnet-table");
      const ordre = dus.map(x => x.mot).concat(mots.filter(m => !dus.some(d => d.mot === m)));
      ordre.slice(0, 10).forEach(m => {
        const x = carnet[m], due = dus.some(d => d.mot === m);
        const tr = el("tr");
        tr.innerHTML = '<td class="mot-juste">' + ech(x.attendu) + '</td>' +
          '<td class="mot-rate">' + ech(x.erreurs && x.erreurs[0] || "") + '</td>' +
          '<td class="mot-type">' + ech(x.type || "orthographe") + '</td>' +
          '<td class="mot-du ' + (due ? "oui" : "non") + '">' + (due ? "à revoir" : "revu") + '</td>' +
          '<td></td>';
        const o = el("button", "oublier", "×"); o.type = "button"; o.title = "Retirer « " + x.attendu + " » du carnet";
        o.onclick = () => { MB_FR.oublier(m); vue(); };
        tr.lastChild.appendChild(o);
        table.appendChild(tr);
      });
      car.appendChild(table);
      if (mots.length > 10) car.appendChild(el("p", "note", "et " + (mots.length - 10) + " autres."));
      f.appendChild(car);
    }

    /* ── Les dernières dictées ── */
    const d = MB_FR.dictees();
    if (d.length) {
      const sec2 = el("section", "section");
      const dt = el("div", "section-tete");
      dt.appendChild(el("h2", null, "Dernières dictées"));
      const rd = document.createElement("a"); rd.href = lien("francais-dictee.html"); rd.textContent = "Toutes les dictées →"; dt.appendChild(rd);
      sec2.appendChild(dt);
      const table = el("table", "carnet-table");
      d.slice(0, 5).forEach(x => {
        const tr = el("tr");
        tr.innerHTML = '<td class="mot-juste">' + ech(x.titre) + '</td>' +
          '<td class="mot-du ' + (x.score >= 90 ? "non" : "oui") + '">' + x.score + ' %</td>' +
          '<td class="mot-type">' + ech(new Date(x.date).toLocaleDateString("fr-FR")) + '</td>';
        table.appendChild(tr);
      });
      sec2.appendChild(table);
      f.appendChild(sec2);
    }
    page.appendChild(f);
  }

  vue();
})();
</script>
</body>
</html>
