<header class="bandeau">
  <a class="bandeau-titre" href="matieres.html">Poly<em>mates</em></a>
  <div class="bandeau-droite">
    <span id="lecteur"></span>

    <button type="button" id="sortir">Se déconnecter</button>
  </div>

<div id="page"></div>

<script>
(function () {
  "use strict";

  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const svgEl = (tag, attrs) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const page = document.getElementById("page");

  /* ── Mémoire : la carte affichée, le mode de la France ── */
  const Memoire = (function () {
    const CLE = "mb_geographie";
    let etat = { carte: "monde", modeFrance: "regions" };
    try { const brut = JSON.parse(localStorage.getItem(CLE)); if (brut && typeof brut === "object") etat = Object.assign(etat, brut); } catch (_) {}
    const ranger = () => { try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (_) {} };
    return {
      carte(v) { if (v === undefined) return etat.carte; etat.carte = v; ranger(); },
      modeFrance(v) { if (v === undefined) return etat.modeFrance; etat.modeFrance = v; ranger(); },
    };
  })();

  /* ══════════════════════════════════════════════════════════════
     LES CARTES
     Trois cartes dessinées en SVG à partir des contours de
     geographie-cartes.js : le monde (projection de Mercator),
     l'Europe et la France. Chaque territoire réagit au survol et au
     clic, et sa fiche s'affiche à côté de la carte.
     ══════════════════════════════════════════════════════════════ */
  const DATA = window.GEO_CARTES;

  /* Projection de Mercator, ajustée à un cadre [lonMin, latMin, lonMax, latMax]. */
  function mercator(cadre, W, H) {
    const y = lat => Math.log(Math.tan(Math.PI / 4 + (Math.max(-85, Math.min(85, lat)) * Math.PI / 180) / 2));
    const x0 = cadre[0], x1 = cadre[2], y0 = y(cadre[1]), y1 = y(cadre[3]);
    const sx = W / (x1 - x0), sy = H / (y1 - y0), s = Math.min(sx, sy);
    const dx = (W - (x1 - x0) * s) / 2, dy = (H - (y1 - y0) * s) / 2;
    return ([lon, lat]) => [dx + (lon - x0) * s, dy + (y1 - y(lat)) * s];
  }

  function cheminDe(geom, proj) {
    const anneau = r => r.map((c, i) => (i ? "L" : "M") + proj(c).map(v => v.toFixed(1)).join(" ")).join("") + "Z";
    if (geom.type === "Polygon") return geom.coordinates.map(anneau).join("");
    return geom.coordinates.map(poly => poly.map(anneau).join("")).join("");
  }

  const fmt = n => n == null ? "—" : Math.round(n).toLocaleString("fr-FR");
  const fmtKm2 = n => n == null ? "—" : fmt(n) + " km²";

  /* ── Les trois cartes ─────────────────────────────────────────── */
  const CARTES = [
    {
      id: "monde", nom: "Le monde", sous: "Projection de Mercator · " + DATA.pays.length + " pays",
      cadre: [-170, -58, 180, 84], ratio: 0.52,
      couches: () => [{ id: "pays", items: DATA.pays, cle: p => p.id, classe: "pays" }],
      fiche: p => ({
        rubrique: p.continent + (p.region ? " · " + p.region : ""),
        titre: (p.drapeau ? p.drapeau + " " : "") + p.nom,
        sous: p.officiel !== p.nom ? p.officiel : "",
        lignes: [["Capitale", p.capitale || "—"], ["Population", p.population ? fmt(p.population) + " habitants" : "—"], ["Superficie", fmtKm2(p.superficie)], ["Langues", p.langues || "—"],
                 ["Pays voisins", p.voisins.length ? p.voisins.map(v => { const q = DATA.pays.find(x => x.id === v); return q ? q.nom : v; }).join(", ") : "aucun (île)"]],
      }),
      vide: "Survolez un pays pour le nommer, cliquez pour ouvrir sa fiche.",
    },
    {
      id: "europe", nom: "L'Europe", sous: DATA.europe.length + " pays",
      cadre: [-25, 34, 45, 71.5], ratio: 0.72,
      couches: () => [{ id: "pays", items: DATA.europe, cle: p => p.id, classe: "pays" }],
      fiche: p => ({
        rubrique: p.region || "Europe",
        titre: (p.drapeau ? p.drapeau + " " : "") + p.nom,
        sous: p.officiel !== p.nom ? p.officiel : "",
        lignes: [["Capitale", p.capitale || "—"], ["Population", p.population ? fmt(p.population) + " habitants" : "—"], ["Superficie", fmtKm2(p.superficie)], ["Langues", p.langues || "—"],
                 ["Pays voisins", p.voisins.length ? p.voisins.map(v => { const q = DATA.pays.find(x => x.id === v); return q ? q.nom : v; }).join(", ") : "aucun (île)"]],
      }),
      vide: "Survolez un pays pour le nommer, cliquez pour ouvrir sa fiche.",
    },
    {
      id: "france", nom: "La France", sous: "13 régions · 96 départements · 45 grandes villes",
      cadre: [-5.4, 41.2, 9.8, 51.3], ratio: 0.95,
      modes: [["regions", "Régions"], ["departements", "Départements"]],
      couches: mode => [
        { id: mode, items: mode === "regions" ? DATA.france.regions : DATA.france.departements, cle: x => x.code, classe: mode === "regions" ? "region" : "departement" },
        { id: "villes", points: DATA.france.villes, cle: v => v.code },
      ],
      fiche: (x, couche) => {
        if (couche === "villes") {
          const d = DATA.france.departements.find(k => k.code === x.departement), r = DATA.france.regions.find(k => k.code === x.region);
          return { rubrique: "Commune" + (x.banlieue ? " · agglomération" : ""), titre: x.nom, sous: "",
            lignes: [["Population", fmt(x.population) + " habitants"], ["Département", d ? d.nom + " (" + d.code + ")" : "—"], ["Région", r ? r.nom : "—"], ["Code INSEE", x.code]] };
        }
        if (couche === "regions") {
          return { rubrique: "Région", titre: x.nom, sous: "",
            lignes: [["Chef-lieu", x.chefLieu || "—"], ["Population", fmt(x.population) + " habitants"], ["Départements", x.departements.length + " : " + x.departements.join(", ")]] };
        }
        const r = DATA.france.regions.find(k => k.code === x.region);
        const villes = DATA.france.villes.filter(v => v.departement === x.code).map(v => v.nom);
        return { rubrique: "Département " + x.code, titre: x.nom, sous: "",
          lignes: [["Préfecture", x.prefecture || "—"], ["Région", r ? r.nom : "—"], ["Population", fmt(x.population) + " habitants"], ["Communes", fmt(x.communes)], ["Grandes villes", villes.length ? villes.join(", ") : "—"]] };
      },
      vide: "Survolez une région ou un département ; cliquez pour ouvrir sa fiche. Les points sont les grandes villes.",
    },
  ];

  /* ── Dessiner une carte dans un conteneur ─────────────────────── */
  function dessinerCarte(carte, mode, hote, surSelection, interactif) {
    const W = 1000, H = Math.round(1000 * carte.ratio);
    const proj = mercator(carte.cadre, W, H);
    const svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, class: "carte-svg", role: "img", "aria-label": carte.nom });
    svg.appendChild(svgEl("rect", { x: 0, y: 0, width: W, height: H, class: "carte-mer" }));
    const couches = carte.couches(mode);
    let actif = null;
    couches.forEach(couche => {
      const g = svgEl("g", { class: "couche couche-" + couche.id });
      if (couche.items) {
        couche.items.forEach(item => {
          const p = svgEl("path", { d: cheminDe(item.g, proj), class: "terr " + couche.classe, "data-cle": couche.cle(item) });
          if (interactif) {
            p.addEventListener("mouseenter", () => infobulle(item.nom));
            p.addEventListener("mouseleave", () => infobulle(null));
            p.addEventListener("click", () => { if (actif) actif.classList.remove("actif"); actif = p; p.classList.add("actif"); surSelection(item, couche.id); });
          }
          g.appendChild(p);
        });
      }
      if (couche.points) {
        couche.points.forEach(v => {
          const [x, y] = proj([v.lon, v.lat]);
          const r = v.population > 400000 ? 7 : v.population > 200000 ? 5.5 : 4.5;
          const c = svgEl("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r, class: "ville" + (v.banlieue ? " banlieue" : ""), "data-cle": couche.cle(v) });
          if (interactif) {
            c.addEventListener("mouseenter", () => infobulle(v.nom));
            c.addEventListener("mouseleave", () => infobulle(null));
            c.addEventListener("click", e => { e.stopPropagation(); if (actif) actif.classList.remove("actif"); actif = c; c.classList.add("actif"); surSelection(v, "villes"); });
          }
          g.appendChild(c);
          if (!v.banlieue && v.population > 250000) {
            g.appendChild(svgEl("text", { x: (x + 9).toFixed(1), y: (y + 4).toFixed(1), class: "ville-nom" })).textContent = v.nom;
          }
        });
      }
      svg.appendChild(g);
    });
    hote.innerHTML = "";
    hote.appendChild(svg);
    return svg;
  }

  /* L'infobulle suit la souris. */
  const bulle = el("div", "carte-bulle"); bulle.hidden = true; document.body.appendChild(bulle);
  function infobulle(texte) { bulle.hidden = !texte; if (texte) bulle.textContent = texte; }
  document.addEventListener("mousemove", e => { if (!bulle.hidden) { bulle.style.left = (e.clientX + 14) + "px"; bulle.style.top = (e.clientY + 14) + "px"; } });


  /* ══════════════════════════════════════════════════════════════
     ÉCRAN 1 : LE CARROUSEL DES CARTES
     La carte choisie au centre, interactive, avec sa fiche à droite ;
     les deux autres sur les côtés, en vignettes.
     ══════════════════════════════════════════════════════════════ */
  let selection = null;   /* { item, couche } de la carte centrale */

  function rendreCarrousel() {
    const idx = Math.max(0, CARTES.findIndex(c => c.id === Memoire.carte()));
    const carte = CARTES[idx];
    const f = el("main", "geo-accueil");

    f.appendChild(el("p", "geo-consigne", "Choisissez une carte"));

    const car = el("section", "geo-car");
    const prev = CARTES[idx - 1], next = CARTES[idx + 1];
    const fleche = (sens, cible) => {
      const b = el("button", "geo-fleche " + sens);
      b.type = "button"; b.disabled = !cible;
      b.setAttribute("aria-label", sens === "gauche" ? "Carte précédente" : "Carte suivante");
      b.innerHTML = sens === "gauche" ? "&#8592;" : "&#8594;";
      if (cible) b.onclick = () => { Memoire.carte(cible.id); selection = null; rendre(); };
      return b;
    };
    car.appendChild(fleche("gauche", prev));

    const piste = el("div", "geo-piste");
    /* vignette de gauche */
    piste.appendChild(vignette(prev));

    /* la carte centrale, interactive */
    const centre = el("div", "geo-centre");
    const tete = el("div", "geo-centre-tete");
    const titres = el("div");
    titres.appendChild(el("div", "geo-centre-nom", carte.nom));
    titres.appendChild(el("div", "geo-centre-sous", carte.sous));
    tete.appendChild(titres);
    if (carte.modes) {
      const modes = el("div", "geo-modes");
      carte.modes.forEach(([id, nom]) => {
        const b = el("button", "geo-mode" + (Memoire.modeFrance() === id ? " actif" : ""), nom);
        b.type = "button"; b.setAttribute("aria-pressed", Memoire.modeFrance() === id ? "true" : "false");
        b.onclick = () => { Memoire.modeFrance(id); selection = null; rendre(); };
        modes.appendChild(b);
      });
      tete.appendChild(modes);
    }
    centre.appendChild(tete);

    const corps = el("div", "geo-corps" + (selection ? " fiche-ouverte" : ""));
    const hoteCarte = el("div", "geo-carte");
    corps.appendChild(hoteCarte);
    const fiche = el("aside", "geo-fiche");
    corps.appendChild(fiche);
    centre.appendChild(corps);
    piste.appendChild(centre);

    /* vignette de droite */
    piste.appendChild(vignette(next));
    car.appendChild(piste);
    car.appendChild(fleche("droite", next));
    f.appendChild(car);

    const points = el("div", "geo-points");
    CARTES.forEach((c, i) => {
      const d = el("button", "geo-point" + (i === idx ? " actif" : "")); d.type = "button";
      d.setAttribute("aria-label", c.nom); d.title = c.nom;
      d.onclick = () => { Memoire.carte(c.id); selection = null; rendre(); };
      points.appendChild(d);
    });
    f.appendChild(points);

    const pied = el("div", "geo-pied");
    const prog = el("button", "geo-lien", "Le programme de géographie, de la 6ᵉ à la terminale →");
    prog.type = "button"; prog.onclick = () => aller("#/programme");
    pied.appendChild(prog);
    f.appendChild(pied);

    /* Dessin de la carte et branchement de la fiche */
    const mode = carte.modes ? Memoire.modeFrance() : null;
    dessinerCarte(carte, mode, hoteCarte, (item, couche) => { selection = { item, couche }; montrerFiche(fiche, carte, corps); }, true);
    montrerFiche(fiche, carte, corps);
    if (selection) {
      const cle = selection.couche === "villes" ? selection.item.code : (carte.id === "france" ? selection.item.code : selection.item.id);
      const noeud = hoteCarte.querySelector('[data-cle="' + cle + '"]');
      if (noeud) noeud.classList.add("actif");
    }
    return f;
  }

  function vignette(carte) {
    if (!carte) return el("div", "geo-vignette vide");
    const v = el("button", "geo-vignette"); v.type = "button";
    v.setAttribute("aria-label", "Voir " + carte.nom);
    v.appendChild(el("div", "geo-vignette-nom", carte.nom));
    const mini = el("div", "geo-vignette-carte");
    dessinerCarte(carte, carte.modes ? "regions" : null, mini, () => {}, false);
    v.appendChild(mini);
    v.onclick = () => { Memoire.carte(carte.id); selection = null; rendre(); };
    return v;
  }

  function montrerFiche(fiche, carte, corps) {
    fiche.innerHTML = "";
    if (!selection) {
      corps.classList.remove("fiche-ouverte");
      fiche.appendChild(el("p", "geo-fiche-vide", carte.vide));
      return;
    }
    corps.classList.add("fiche-ouverte");
    const d = carte.fiche(selection.item, selection.couche);
    const fermer = el("button", "geo-fermer"); fermer.type = "button"; fermer.innerHTML = "&#215;"; fermer.setAttribute("aria-label", "Fermer la fiche");
    fermer.onclick = () => { selection = null; rendre(); };
    fiche.appendChild(fermer);
    fiche.appendChild(el("div", "geo-fiche-rubrique", d.rubrique));
    fiche.appendChild(el("h2", "geo-fiche-titre", d.titre));
    if (d.sous) fiche.appendChild(el("p", "geo-fiche-sous", d.sous));
    const dl = el("dl", "geo-fiche-lignes");
    d.lignes.forEach(([k, v]) => { dl.appendChild(el("dt", null, k)); dl.appendChild(el("dd", null, v)); });
    fiche.appendChild(dl);
  }

  /* ══════════════════════════════════════════════════════════════
     ÉCRAN 2 : LE PROGRAMME, EN LISTE
     ══════════════════════════════════════════════════════════════ */

    {

      themes: [

          ] },
        { nom: "Habiter un espace de faible densité", court: "Faibles densités",

          ] },

      ],
    },

      themes: [
        { nom: "La question démographique et l'inégal développement", court: "Démographie",
          intro: "La population mondiale augmente, mais pas partout au même rythme ni dans les mêmes conditions.",
          chapitres: [

          ] },
        { nom: "Des ressources limitées, à gérer et à renouveler", court: "Ressources",
          intro: "Se nourrir, boire, se chauffer : trois besoins, trois tensions sur les ressources.",
          chapitres: [

  function rendreProgramme() {
    const f = el("main", "geo-programme");
    const tete = el("div", "geo-prog-tete");
    const retour = el("button", "geo-retour"); retour.type = "button"; retour.innerHTML = "&#8592; Les cartes"; retour.onclick = () => aller("#/");
    tete.appendChild(retour);
    tete.appendChild(el("h1", "geo-prog-titre", "Le programme de géographie"));
    f.appendChild(tete);
    ANNEES.forEach(a => {
      const sec = el("section", "geo-annee");
      sec.style.setProperty("--teinte", a.teinte);
      const h = el("div", "geo-annee-tete");
      h.appendChild(el("span", "geo-annee-classe", a.classe));
      const t = el("div");
      t.appendChild(el("h2", "geo-annee-nom", a.titre));
      t.appendChild(el("p", "geo-annee-question", a.question));
      h.appendChild(t);
      sec.appendChild(h);
      const themes = el("div", "geo-themes");
      a.themes.forEach(th => {
        const bloc = el("div", "geo-theme");
        bloc.appendChild(el("h3", "geo-theme-nom", th.nom));
        bloc.appendChild(el("p", "geo-theme-intro", th.intro));
        const ol = el("ol", "geo-chapitres");
        th.chapitres.forEach(c => ol.appendChild(el("li", null, c)));
        bloc.appendChild(ol);
        themes.appendChild(bloc);
      });
      sec.appendChild(themes);
      f.appendChild(sec);
    });
    return f;
  }

  /* ══════════════════════════════════════════════════════════════
     Routage
     ══════════════════════════════════════════════════════════════ */
  function aller(hash) { if (location.hash === hash) rendre(); else location.hash = hash; }
  function rendre() {
    const route = (location.hash || "#/").replace(/^#/, "").split("/").filter(Boolean);
    const vue = route[0] === "programme" ? rendreProgramme() : rendreCarrousel();
    page.innerHTML = ""; page.appendChild(vue);
    document.body.classList.toggle("accueil", route[0] !== "programme");
    document.title = "Polymates — Géographie" + (route[0] === "programme" ? " · programme" : "");
    window.scrollTo({ top: 0 });
  }
  document.addEventListener("keydown", e => {
    if (e.target && e.target.matches && e.target.matches("input, select, textarea")) return;
    if (!document.body.classList.contains("accueil")) return;
    const idx = CARTES.findIndex(c => c.id === Memoire.carte());
    if (e.key === "ArrowLeft" && idx > 0) { Memoire.carte(CARTES[idx - 1].id); selection = null; rendre(); }
    if (e.key === "ArrowRight" && idx < CARTES.length - 1) { Memoire.carte(CARTES[idx + 1].id); selection = null; rendre(); }
    if (e.key === "Escape" && selection) { selection = null; rendre(); }
  });
  window.addEventListener("hashchange", rendre);
  rendre();

  /* ── Bandeau ── */
  const u = window.MB_AUTH && MB_AUTH.user();
  if (u && u.pseudo) document.getElementById("lecteur").textContent = u.pseudo;
  document.getElementById("sortir").onclick = () => { if (window.MB_AUTH) MB_AUTH.logout(); else location.href = "index.html"; };
})();
</script>
</body>
</html>
