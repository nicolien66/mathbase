<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="parchemin.css">
<script src="matiere.js"></script>
<script src="auth.js" data-protect data-sans-chip></script>
</head>
<body>

<header class="bandeau">
  <a class="bandeau-titre" href="matieres.html">Poly<em>mates</em></a>
  <div class="bandeau-droite">
    <span id="lecteur"></span>
    <a href="matieres.html">Changer de matière</a>
    <button type="button" id="sortir">Se déconnecter</button>
  </div>
</header>

<main class="feuille">
  <p class="rubrique" id="rubrique">Polymates</p>
  <h1 id="titre">—</h1>
  <div class="filet"><span>❦</span></div>

  <p class="ouverture" id="ouverture"></p>

  <section class="sommaire">
    <p class="sommaire-titre" id="sommaire-titre">Sommaire</p>
    <div id="entrees"></div>
  </section>
</main>

<p class="colophon">Polymates — <span id="colophon-matiere"></span></p>

<script>
(function () {
  /* Gabarit « sommaire simple » des matières littéraires : même mise en
     page, même papier, seuls le texte et l'encre d'accent changent. Une
     matière absente de PAGES est renvoyée vers son propre accueil. */

  /* Le français a désormais sa propre page (francais.html), avec ses trois
     thèmes et leurs cours : il a quitté ce gabarit. Celui-ci reste en place
     pour la prochaine matière littéraire qui n'aura d'abord qu'un sommaire —
     il suffit de lui ajouter une entrée ci-dessous. */
  const PAGES = {};

  /* Cette page sert les matières littéraires réduites à un sommaire. Les
     autres ont leur propre accueil : francais.html, histoire.html,
     geographie.html. */
  const page = PAGES[MB_MAT.id];
  if (!page) { location.replace(MB_MAT.lien(MB_MAT.accueil) || "matieres.html"); return; }

  document.body.setAttribute("data-matiere", MB_MAT.id);
  document.title = "Polymates — " + page.rubrique;
  document.getElementById("rubrique").textContent = page.rubrique;
  document.getElementById("titre").innerHTML = page.titre;
  document.getElementById("ouverture").textContent = page.ouverture;
  document.getElementById("sommaire-titre").textContent = page.sommaire;
  document.getElementById("colophon-matiere").textContent = page.rubrique;

  /* Sommaire : chaque entrée s'ouvre pour dire ce qu'elle accueillera. */
  const hote = document.getElementById("entrees");
  page.sections.forEach((s, i) => {
    const bouton = document.createElement("button");
    bouton.className = "entree";
    bouton.type = "button";
    bouton.setAttribute("aria-expanded", "false");
    bouton.setAttribute("aria-controls", "detail-" + i);
    bouton.innerHTML =
      '<span class="entree-nom"></span>' +
      '<span class="entree-points" aria-hidden="true"></span>' +
      '<span class="entree-etat">à paraître</span>';
    bouton.querySelector(".entree-nom").textContent = s.nom;

    const detail = document.createElement("div");
    detail.className = "entree-detail";
    detail.id = "detail-" + i;
    detail.innerHTML = "<p></p>";
    detail.querySelector("p").textContent = s.detail;

    bouton.onclick = () => {
      const ouvert = detail.classList.toggle("ouvert");
      bouton.setAttribute("aria-expanded", ouvert ? "true" : "false");
    };

    hote.appendChild(bouton);
    hote.appendChild(detail);
  });

  /* Bandeau : qui lit, et comment sortir. */
  const u = MB_AUTH.user();
  if (u && u.pseudo) document.getElementById("lecteur").textContent = u.pseudo;
  document.getElementById("sortir").onclick = () => MB_AUTH.logout();
})();
</script>
</body>
</html>
