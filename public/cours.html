COURS['Géométrie du triangle'] = { branch:'geometrie', level:'5ème',
  intro:"Somme des angles, inégalité triangulaire, triangles particuliers : ce qu'il faut savoir pour construire un triangle et calculer ses angles.",
  competences:[
    { nom:'Les types de triangle', classe:'5ème',
      def:["Isocèle : deux côtés égaux, et donc deux angles égaux (à la base). Équilatéral : trois côtés égaux, trois angles de 60°.","Rectangle : un angle droit. Quelconque : rien de particulier."],
      methode:["Lis le codage des côtés égaux et des angles droits.","Nomme le triangle le plus précis possible.","Un triangle peut être rectangle ET isocèle."],
      exemple:{ q:"Triangle de côtés 5, 5 et 7 cm", l:["deux côtés égaux","isocèle"] },
      piege:["Un triangle équilatéral n'est pas isocèle","Il l'est : il a même trois paires de côtés égaux"] },
    { nom:'Un triangle est-il constructible ?', classe:'5ème',
      def:["Inégalité triangulaire : dans un triangle, chaque côté est plus petit que la somme des deux autres.","Il suffit de vérifier le plus grand côté : s'il est inférieur à la somme des deux autres, le triangle existe."],
      methode:["Repère le plus grand côté.","Additionne les deux autres.","Compare : plus grand côté < somme → constructible ; égal → points alignés ; plus grand → impossible."],
      exemple:{ q:"Côtés 5, 7 et 11 cm", l:["5 + 7 = 12","11 < 12","constructible"] },
      piege:["3, 4 et 8 : constructible car 3 + 8 > 4","3 + 4 = 7 < 8 : impossible, il faut vérifier le plus grand côté"] },
    { nom:'Le triangle quelconque : somme des angles', classe:'5ème',
      def:["Dans tout triangle, la somme des trois angles vaut 180°.","Cela permet de calculer le troisième angle dès que deux sont connus."],
      methode:["Additionne les deux angles connus.","Soustrais le résultat de 180°.","Vérifie la cohérence avec la figure (un angle obtus est plus grand que 90°)."],
      exemple:{ q:"A = 48° et B = 67°. Que vaut C ?", l:["48 + 67 = 115","180 − 115 = 65","C = 65°"] },
      piege:["Un triangle peut avoir deux angles obtus","Impossible : 90 + 90 dépasserait déjà 180°"],
      visuel:{ type:'triangle', noms:['A','B','C'], cotes:{} , angle:'C'} },
    { nom:'Le triangle isocèle', classe:'5ème–6ème',
      def:["Dans un triangle isocèle, les deux angles à la base (opposés aux côtés égaux) sont égaux.","Connaissant l'angle au sommet, on trouve les angles à la base : (180 − sommet) ÷ 2."],
      methode:["Identifie le sommet principal : celui d'où partent les deux côtés égaux.","Retire l'angle au sommet de 180°.","Partage le reste en deux."],
      exemple:{ q:"Angle au sommet 40°. Angles à la base ?", l:["180 − 40 = 140","140 ÷ 2 = 70","70° chacun"] },
      piege:["Angles à la base = 180 − 40 = 140° chacun","(180 − 40) ÷ 2 = 70° chacun"] },
    { nom:'Le triangle rectangle', classe:'5ème',
      def:["Dans un triangle rectangle, l'angle droit vaut 90° : les deux autres angles se partagent les 90° restants, ils sont complémentaires.","Le côté opposé à l'angle droit, le plus long, s'appelle l'hypoténuse."],
      methode:["Repère l'angle droit.","Soustrais l'angle aigu connu de 90°.","Nomme l'hypoténuse pour préparer Pythagore ou la trigonométrie."],
      exemple:{ q:"Triangle rectangle avec un angle de 35°. L'autre angle aigu ?", l:["90 − 35 = 55","55°"] },
      piege:["L'autre angle vaut 180 − 35 = 145°","L'angle droit compte déjà 90° : 90 − 35 = 55°"],
      visuel:{ type:'triangle', rect:true, hyp:true, cotes:{BC:'hypoténuse'} } },
  ] };

COURS['Théorème de Pythagore'] = { branch:'geometrie', level:'4ème–3ème',
  intro:"Dans un triangle rectangle, le carré de l'hypoténuse est la somme des carrés des deux autres côtés. Le théorème calcule des longueurs ; sa réciproque et sa contraposée décident si un angle est droit.",
  competences:[
    { nom:"Repérer l'hypoténuse et énoncer le théorème", classe:'4ème',
      def:["Dans un triangle ABC rectangle en A, l'hypoténuse est [BC] : le côté opposé à l'angle droit, le plus long.","Théorème de Pythagore : BC² = AB² + AC²."],
      methode:["Trouve l'angle droit ; l'hypoténuse est en face.","Écris l'égalité avec l'hypoténuse seule d'un côté.","Rédige : « Dans le triangle ABC rectangle en A, d'après le théorème de Pythagore… »."],
      exemple:{ q:"DEF rectangle en E. Égalité de Pythagore ?", l:["hypoténuse : [DF] (opposée à E)","DF² = DE² + EF²"] },
      piege:["ABC rectangle en A : AB² = AC² + BC²","BC² = AB² + AC² : l'hypoténuse est en face de l'angle droit"],
      visuel:{ type:'triangle', rect:true, hyp:true, cotes:{AB:'AB', CA:'AC', BC:'BC'} },
      retenir:'BC² = AB² + AC²  (rectangle en A)' },
    { nom:"Calculer l'hypoténuse", classe:'4ème',
      def:["Pour trouver l'hypoténuse, on ADDITIONNE les carrés des deux autres côtés, puis on prend la racine carrée.","Le résultat est souvent une valeur approchée."],
      methode:["Écris l'égalité de Pythagore.","Remplace par les longueurs connues et calcule les carrés.","Additionne, puis BC = √(résultat). Arrondis si nécessaire."],
      exemple:{ q:"Mât de 4 m, fil fixé au sol à 3 m du pied. Longueur du fil ?", l:["fil² = 4² + 3² = 16 + 9 = 25","fil = √25","5 m"] },
      piege:["BC = AB + AC = 7 m","BC = √(4² + 3²) = 5 m : on additionne les carrés"],
      visuel:{ type:'triangle', rect:true, hyp:true, cotes:{AB:'3 m', CA:'4 m', BC:'?'} } },
    { nom:"Calculer un côté de l'angle droit", classe:'4ème–3ème',
      def:["Pour trouver un côté de l'angle droit, on SOUSTRAIT : AC² = BC² − AB².","On isole le carré cherché avant de prendre la racine."],
      methode:["Écris l'égalité de Pythagore avec l'hypoténuse.","Isole le carré du côté inconnu par soustraction.","Prends la racine carrée."],
      exemple:{ q:"Hypoténuse 13, un côté 5. L'autre ?", l:["AC² = 13² − 5² = 169 − 25","AC² = 144","AC = 12"] },
      piege:["AC² = 13² + 5² = 194","AC² = 13² − 5² = 144 : l'hypoténuse est la plus grande"] },
    { nom:'Réciproque et contraposée', classe:'3ème',
      def:["Réciproque : si BC² = AB² + AC², alors le triangle est rectangle en A. Elle PROUVE un angle droit.","Contraposée : si BC² ≠ AB² + AC², le triangle n'est PAS rectangle."],
      methode:["Calcule séparément le carré du plus grand côté et la somme des carrés des deux autres.","Compare les deux nombres.","Égaux → rectangle (réciproque). Différents → pas rectangle (contraposée)."],
      exemple:{ q:"Côtés 5, 12, 13. Rectangle ?", l:["13² = 169","5² + 12² = 25 + 144 = 169","égaux : rectangle en l'angle opposé au côté 13"] },
      piege:["Côtés 4, 6, 8 : 8² = 64 ≠ 52, on ne peut rien dire","On peut conclure : le triangle n'est pas rectangle (contraposée)"] },
    { nom:'Résoudre un problème', classe:'3ème',
      def:["Diagonale d'un écran, d'un terrain, hauteur d'une échelle contre un mur : dès qu'un angle droit apparaît, Pythagore s'applique.","On commence par faire un schéma et repérer le triangle rectangle."],
      methode:["Fais un schéma et nomme le triangle rectangle.","Identifie l'hypoténuse.","Applique le théorème et conclus avec l'unité."],
      exemple:{ q:"Écran de 40 cm × 30 cm. Diagonale ?", l:["d² = 40² + 30² = 1600 + 900","d² = 2500","d = 50 cm"] },
      piege:["Diagonale = 40 + 30 = 70 cm","d = √(40² + 30²) = 50 cm"] },
  ] };

COURS['Théorème de Thalès'] = { branch:'geometrie', level:'3ème',
  intro:"Deux droites parallèles coupées par deux sécantes créent des longueurs proportionnelles. Le théorème de Thalès calcule des longueurs ; sa réciproque prouve un parallélisme.",
  competences:[
    { nom:'Triangles imbriqués', classe:'3ème',
      def:["Configuration : M sur [AB], N sur [AC] et (MN) ∥ (BC). Alors AM/AB = AN/AC = MN/BC.","Les petits et les grands côtés se correspondent : le petit triangle AMN est une réduction du grand ABC."],
      methode:["Repère le sommet commun A et les deux parallèles.","Écris les trois rapports, petit triangle sur grand triangle.","Utilise deux rapports connus et un produit en croix pour la longueur cherchée."],
      exemple:{ q:"AM = 3, AB = 9, BC = 12. Calcule MN.", l:["MN/BC = AM/AB = 3/9","MN = 12 × 3 ÷ 9","MN = 4"] },
      piege:["AM/AB = MN/NC","AM/AB = MN/BC : on compare avec le côté entier du grand triangle"],
      visuel:{ type:'triangle', noms:['A','B','C'], cotes:{AB:'AB', CA:'AC', BC:'BC'} } },
    { nom:'Triangles opposés (le papillon)', classe:'3ème',
      def:["Configuration papillon : B, A, M alignés, C, A, N alignés, et (BC) ∥ (MN). Les deux triangles sont opposés par le sommet A.","Les rapports sont les mêmes : AM/AB = AN/AC = MN/BC."],
      methode:["Vérifie l'alignement des points et le parallélisme.","Écris les rapports en partant toujours du sommet commun A.","Produit en croix."],
      exemple:{ q:"AB = 10, AM = 8, BC = 10. Calcule MN.", l:["MN/BC = AM/AB = 8/10","MN = 10 × 8 ÷ 10","MN = 8 cm"] },
      piege:["Dans le papillon, on peut prendre AB/AM = MN/BC","Toujours le même ordre : AM/AB = MN/BC"] },
    { nom:'La réciproque de Thalès', classe:'3ème',
      def:["Si les points sont alignés dans le même ordre et si AM/AB = AN/AC, alors (MN) ∥ (BC).","Il faut vérifier l'égalité de DEUX rapports (pas celui avec MN/BC), et l'ordre des points."],
      methode:["Vérifie que les points sont dans le même ordre sur les deux sécantes.","Calcule AM/AB et AN/AC séparément.","Égaux → parallèles. Différents → pas parallèles."],
      exemple:{ q:"AM = 3, AB = 9, AN = 2, AC = 6. (MN) ∥ (BC) ?", l:["AM/AB = 3/9 = 1/3","AN/AC = 2/6 = 1/3","égaux et même ordre : (MN) ∥ (BC)"] },
      piege:["Les rapports sont égaux, donc c'est parallèle, sans vérifier l'ordre des points","Il faut aussi l'alignement dans le même ordre"] },
    { nom:'Triangles semblables', classe:'3ème',
      def:["Deux triangles sont semblables quand ils ont les mêmes angles. Leurs côtés sont alors proportionnels, avec un rapport de similitude k.","Si k = 2, les longueurs doublent et l'aire est multipliée par k² = 4."],
      methode:["Montre que deux angles sont égaux (le troisième l'est automatiquement).","Associe les côtés opposés aux angles égaux.","Calcule k et applique-le aux longueurs (× k) ou aux aires (× k²)."],
      exemple:{ q:"Triangles semblables de rapport 3. Aire du petit : 5 cm². Aire du grand ?", l:["aires multipliées par 3² = 9","5 × 9 = 45 cm²"] },
      piege:["Rapport 2 : l'aire est doublée","L'aire est multipliée par 2² = 4"] },
  ] };

COURS['Trigonométrie'] = { branch:'geometrie', level:'4ème–3ème',
  intro:"Dans un triangle rectangle, les angles et les côtés sont liés par le cosinus, le sinus et la tangente. Trois formules pour calculer une longueur ou un angle.",
  competences:[
    { nom:'Repérer les côtés par rapport à un angle', classe:'4ème',
      def:["Dans un triangle rectangle, l'hypoténuse est fixe : en face de l'angle droit.","Pour un angle aigu donné, le côté OPPOSÉ est en face de lui, le côté ADJACENT le touche sans être l'hypoténuse."],
      methode:["Marque l'angle étudié.","L'hypoténuse : en face de l'angle droit. L'opposé : en face de l'angle marqué. L'adjacent : le troisième côté.","Attention : opposé et adjacent s'échangent si on change d'angle."],
      exemple:{ q:"ABC rectangle en A, angle en C. Opposé et adjacent ?", l:["hypoténuse : [BC]","opposé à C : [AB]","adjacent à C : [AC]"] },
      piege:["L'adjacent, c'est le côté le plus proche de l'angle : l'hypoténuse","L'hypoténuse n'est jamais l'adjacent"],
      visuel:{ type:'triangle', rect:true, hyp:true, angle:'C', cotes:{AB:'opposé', CA:'adjacent', BC:'hypoténuse'} } },
    { nom:'Le cosinus', classe:'4ème',
      def:["cos(angle) = adjacent ÷ hypoténuse. C'est un nombre entre 0 et 1, sans unité.","Il permet de calculer un côté (adjacent = hypoténuse × cos) ou un angle (angle = cos⁻¹ du rapport)."],
      methode:["Écris cos(angle) = adjacent/hypoténuse avec les noms des côtés.","Remplace les longueurs connues.","Isole la longueur cherchée, ou utilise cos⁻¹ (touche Acos) pour l'angle."],
      exemple:{ q:"Hypoténuse 12, angle 60°. Côté adjacent ?", l:["cos(60°) = adj / 12","adj = 12 × cos(60°) = 12 × 0,5","6"] },
      piege:["cos(x) = 0,5 donc x = 0,5°","x = cos⁻¹(0,5) = 60°"] },
    { nom:'Le sinus', classe:'3ème',
      def:["sin(angle) = opposé ÷ hypoténuse.","Comme le cosinus, il vaut entre 0 et 1 ; sin(30°) = 0,5."],
      methode:["Écris sin(angle) = opposé/hypoténuse.","Remplace, puis isole ce que tu cherches.","Angle cherché : sin⁻¹."],
      exemple:{ q:"Opposé 3, hypoténuse 6. Angle ?", l:["sin(x) = 3/6 = 0,5","x = sin⁻¹(0,5)","x = 30°"] },
      piege:["sin(x) = hypoténuse / opposé","sin(x) = opposé / hypoténuse : l'hypoténuse est toujours en bas"] },
    { nom:'La tangente', classe:'3ème',
      def:["tan(angle) = opposé ÷ adjacent. La seule formule sans hypoténuse ; elle peut dépasser 1.","tan(45°) = 1 : dans ce cas, opposé et adjacent sont égaux."],
      methode:["Écris tan(angle) = opposé/adjacent.","Remplace les longueurs connues.","Isole la longueur, ou utilise tan⁻¹ pour l'angle."],
      exemple:{ q:"Opposé 5, adjacent 5. Angle ?", l:["tan(x) = 5/5 = 1","x = tan⁻¹(1)","x = 45°"] },
      piege:["tan(x) = opposé / hypoténuse","tan(x) = opposé / adjacent"],
      retenir:'SOH · CAH · TOA' },
    { nom:'Résoudre un problème', classe:'3ème',
      def:["Pente d'une rampe, hauteur d'un arbre depuis son ombre, angle d'une échelle : on schématise un triangle rectangle et on choisit la formule qui relie les deux côtés connus à l'inconnue.","Le mot « angle » et deux longueurs → cos, sin ou tan selon les côtés."],
      methode:["Schéma, angle droit, angle cherché ou connu.","Nomme les côtés (opposé, adjacent, hypoténuse) par rapport à l'angle.","Choisis la formule qui contient les deux côtés en jeu."],
      exemple:{ q:"Une rampe monte de 1 m pour 10 m au sol. Angle ?", l:["opposé 1, adjacent 10 → tangente","tan(x) = 0,1","x = tan⁻¹(0,1) ≈ 5,7°"] },
      piege:["Deux côtés de l'angle droit connus → cosinus","Opposé et adjacent → tangente"] },
  ] };

COURS['Triangles semblables'] = { branch:'geometrie', level:'3ème',
  intro:"Deux triangles semblables ont les mêmes angles : l'un est un agrandissement de l'autre. Leurs côtés sont proportionnels.",
  competences:[
    { nom:'Reconnaître des triangles semblables', classe:'3ème',
      def:["Deux triangles sont semblables s'ils ont deux angles deux à deux égaux : le troisième est alors égal aussi.","Ils sont aussi semblables si leurs trois côtés sont proportionnels."],
      methode:["Compare les angles connus des deux triangles.","Ou calcule les rapports des côtés, du plus petit au plus grand.","Conclus à la similitude et note le rapport k."],
      exemple:{ q:"Côtés 3, 4, 5 et 6, 8, 10. Semblables ?", l:["6/3 = 8/4 = 10/5 = 2","oui, rapport k = 2"] },
      piege:["Deux triangles avec un angle égal sont semblables","Il en faut deux (ou les trois côtés proportionnels)"] },
    { nom:'Utiliser le rapport de similitude', classe:'3ème',
      def:["Si le rapport est k, toutes les longueurs du grand triangle valent k fois celles du petit.","Les aires sont multipliées par k², pas par k."],
      methode:["Associe les côtés homologues (opposés aux angles égaux).","Calcule k avec un couple de côtés connus.","Applique × k aux longueurs, × k² aux aires."],
      exemple:{ q:"k = 2, aire du petit 7 cm². Aire du grand ?", l:["aire × k² = × 4","28 cm²"] },
      piege:["k = 2 → aire du grand = 14 cm²","aire = 7 × 4 = 28 cm²"] },
  ] };

COURS['Homothéties'] = { branch:'geometrie', level:'3ème',
  intro:"L'homothétie agrandit ou réduit une figure à partir d'un centre, en multipliant toutes les distances au centre par le rapport k.",
  competences:[
    { nom:"Construire l'image par une homothétie", classe:'3ème',
      def:["L'image M′ de M par l'homothétie de centre O et de rapport k vérifie : O, M et M′ alignés, et OM′ = k × OM.","Si k > 0, M′ est du même côté que M ; si k < 0, de l'autre côté de O."],

      visuel:{ type:'axe', min:0, max:7, points:[{x:0,label:'O',c:CL.or},{x:2,label:'M'},{x:6,label:'M′',c:CL.vert}] } },
    { nom:'Les propriétés', classe:'3ème',
      def:["Une homothétie de rapport k multiplie les longueurs par |k| et les aires par k². Elle conserve les angles, l'alignement et le parallélisme.","k > 1 agrandit ; 0 < k < 1 réduit ; k < 0 retourne la figure (demi-tour), comme la symétrie centrale pour k = −1."],
      methode:["Détermine k et son signe.","Longueurs : × |k|. Aires : × k².","Pour reconnaître une homothétie, cherche le centre à l'intersection des droites (MM′)."],
      exemple:{ q:"k = 3, aire de départ 5 cm². Aire de l'image ?", l:["aire × 3² = × 9","45 cm²"] },

COURS['Translation et rotation'] = { branch:'geometrie', level:'4ème',
  intro:"Deux déplacements qui ne déforment pas : la translation fait glisser une figure, la rotation la fait pivoter autour d'un point.",
  competences:[
    { nom:'La translation', classe:'4ème',
      def:["Une translation est un glissement défini par un vecteur : une direction, un sens et une longueur.","Chaque point se déplace du même vecteur : sur quadrillage, on compte les cases (par exemple 3 à droite, 1 en bas) pour tous les sommets."],
      methode:["Lis le vecteur : combien de cases horizontalement et verticalement.","Applique ce déplacement à chaque sommet.","Relie les images dans le même ordre."],
      exemple:{ q:"Vecteur : 3 à droite, 1 en bas. Image de A(1 ; 4) ?", l:["x : 1 + 3 = 4","y : 4 − 1 = 3","A′(4 ; 3)"] },
      piege:["Une translation est définie par un centre et un angle","Non : c'est un vecteur ; le centre et l'angle définissent une rotation"] },
    { nom:'La rotation', classe:'4ème',
      def:["Une rotation est définie par un centre O, un angle et un sens (horaire ou anti-horaire).","L'image M′ de M vérifie OM′ = OM et l'angle MOM′ égale l'angle de la rotation. Un quart de tour = 90°, un demi-tour = 180°."],
      methode:["Trace le cercle de centre O passant par M (ou garde la distance OM).","Reporte l'angle à partir de [OM) dans le bon sens.","Le point obtenu à la même distance est M′."],
      exemple:{ q:"Rotation de centre O, 90°, sens anti-horaire. Que vérifie M′ ?", l:["OM′ = OM","angle MOM′ = 90°"] },
      piege:["Une rotation de 180° et une symétrie centrale sont différentes","C'est la même transformation"] },
    { nom:'Ce qui est conservé', classe:'4ème',
      def:["Translation et rotation conservent les longueurs, les angles, les aires, l'alignement et le parallélisme : la figure image est superposable à la figure de départ.","Seules sa position (translation) ou son orientation (rotation) changent."],
      methode:["Pour justifier une égalité de longueurs ou d'angles, cite la transformation.","Pour identifier la transformation : les segments [MM′] parallèles et de même longueur → translation ; sinon, cherche un centre → rotation."],
      exemple:{ q:"AB = 5 cm, translation. Que vaut A′B′ ?", l:["les longueurs sont conservées","A′B′ = 5 cm"] },
      piege:["Une rotation agrandit la figure","Elle la fait seulement pivoter, sans changer ses dimensions"] },
  ] };

COURS['Volumes et solides'] = { branch:'geometrie', level:'6ème–3ème',
  intro:"Reconnaître les solides usuels et calculer leur volume : une formule par famille, et une seule idée derrière : aire de la base × hauteur, divisée par 3 pour les solides pointus.",
  competences:[
    { nom:'Reconnaître un solide', classe:'6ème–3ème',

      visuel:{ type:'pave', l:'pavé droit' } },
    { nom:'Volume du cube et du pavé droit', classe:'6ème',
      def:["Cube d'arête c : V = c³. Pavé droit : V = L × l × h.","Le volume se mesure en cm³, m³… et 1 L = 1 dm³."],
      methode:["Repère les trois dimensions dans la même unité.","Multiplie-les.","Écris l'unité au cube ; convertis en litres si demandé."],
      exemple:{ q:"Pavé de 5 cm × 3 cm × 2 cm", l:["V = 5 × 3 × 2","V = 30 cm³"] },

      visuel:{ type:'pave', l:'5 cm', h:'2 cm' } },
    { nom:'Volume du prisme et du cylindre', classe:'5ème',

      exemple:{ q:"Cylindre de rayon 2 cm et de hauteur 5 cm", l:["base : π × 2² = 4π","V = 4π × 5","V = 20π ≈ 62,8 cm³"] },

    { nom:'Volume de la pyramide et du cône', classe:'4ème',
      def:["Les solides pointus valent le tiers du prisme ou du cylindre de même base et même hauteur : V = (1/3) × aire de la base × hauteur.","La hauteur est perpendiculaire à la base, du sommet au plan de la base."],
      methode:["Aire de la base.","Multiplie par la hauteur.","Divise par 3."],

      methode:["Calcule r³.","Multiplie par π puis par 4/3.","Valeur exacte, puis approchée."],
      exemple:{ q:"Boule de rayon 3 cm", l:["3³ = 27","(4/3) × π × 27","V = 36π ≈ 113 cm³"] },
      piege:["V = 4 × π × r² (c'est l'aire de la sphère)","V = (4/3) × π × r³"] },
  ] };

COURS['Notions de fonctions'] = { branch:'fonctions', level:'3ème',
  intro:"Une fonction est une machine : un nombre entre, un nombre sort. On apprend la notation, le calcul d'une image, la recherche d'un antécédent et la lecture d'un tableau ou d'une courbe.",
  competences:[
    { nom:'La notation « flèche »', classe:'3ème',
      def:["f : x ↦ 3x − 2 se lit « à x, la fonction f associe 3x − 2 ». On écrit aussi f(x) = 3x − 2.","f(x) n'est pas « f fois x » : c'est le nombre obtenu en sortie quand on entre x."],
      methode:["Repère la lettre d'entrée (souvent x) et la formule de sortie.","Écris f(x) = formule.","Pour calculer, remplace la lettre par le nombre choisi."],
      exemple:{ q:"g : x ↦ x² + 1. Écris g(x) et calcule g(2).", l:["g(x) = x² + 1","g(2) = 2² + 1 = 5"] },
      piege:["f(4) signifie f × 4","f(4) est l'image de 4 : on remplace x par 4"] },
    { nom:'Calculer une image', classe:'3ème',
      def:["L'image de a par f est f(a) : le nombre qui sort quand on entre a.","Avec un nombre négatif ou un carré, on met des parenthèses : f(−4) = 3 × (−4) − 2 ; g(−3) = (−3)² + 1."],
      methode:["Remplace x par le nombre, entre parenthèses.","Applique les priorités : carré, puis ×, puis + et −.","Écris f(a) = résultat."],
      exemple:{ q:"f(x) = 3x − 2. Calcule f(−4).", l:["f(−4) = 3 × (−4) − 2","= −12 − 2","= −14"] },
      piege:["g(x) = x² + 1 : g(−3) = −9 + 1 = −8","(−3)² = 9, donc g(−3) = 10"] },
    { nom:'Déterminer un antécédent', classe:'3ème',
      def:["Un antécédent de b par f est un nombre x tel que f(x) = b : c'est une entrée qui donne la sortie b.","On le trouve en résolvant une équation. Un nombre peut avoir plusieurs antécédents, ou aucun."],
      methode:["Écris l'équation f(x) = b.","Résous-la.","Avec un carré, n'oublie pas la solution négative."],
      exemple:{ q:"g(x) = x² + 1. Antécédents de 10 ?", l:["x² + 1 = 10","x² = 9","x = 3 ou x = −3"] },
      piege:["Antécédent de 10 par f(x) = 3x − 2 : f(10) = 28","On résout 3x − 2 = 10 : x = 4"] },
    { nom:'Lire un tableau de valeurs', classe:'3ème',
      def:["Un tableau de valeurs donne des couples (x ; f(x)) : la ligne du haut, les entrées ; la ligne du bas, les images.","Sur une courbe, l'image se lit sur l'axe vertical, l'antécédent sur l'axe horizontal. Un nombre a UNE image mais peut avoir PLUSIEURS antécédents."],
      methode:["Image de a : cherche a en haut, lis la valeur en dessous.","Antécédents de b : cherche b en bas, lis TOUTES les valeurs au-dessus.","Sur la courbe, pars de l'axe, va jusqu'à la courbe, puis vers l'autre axe."],
      exemple:{ q:"h(1) = 4 et h(3) = 4. Que dire de 4 ?", l:["4 a deux antécédents : 1 et 3","une image est unique, un antécédent non"] },
      piege:["Une fonction peut donner deux images à un même nombre","Non : une seule image ; mais plusieurs antécédents possibles"],
      visuel:{ type:'tableau', lignes:[['x','1','2','3'],['h(x)','4','1','4']] } },
  ] };

COURS['Fonction linéaire'] = { branch:'fonctions', level:'3ème',
  intro:"f(x) = ax : la proportionnalité écrite comme une fonction. Sa courbe est une droite qui passe par l'origine, et son coefficient a se lit sur n'importe quel point.",
  competences:[
    { nom:'Reconnaître une fonction linéaire', classe:'3ème',
      def:["Une fonction linéaire s'écrit f(x) = a × x, sans terme ajouté. Le nombre a est le coefficient.","Sa représentation graphique est une droite passant par l'origine O. Elle traduit une situation de proportionnalité."],
      methode:["Vérifie que l'expression est de la forme ax : pas de « + b », pas de carré.","Vérifie sur un graphique que la droite passe par O.","Dans un tableau, vérifie que f(x) ÷ x est constant."],
      exemple:{ q:"f(x) = −2x, g(x) = 3x + 1, h(x) = x². Linéaire ?", l:["f : oui (a = −2)","g : non, à cause du + 1","h : non, à cause du carré"] },
      piege:["f(x) = 2x + 3 est linéaire car il y a 2x","Non : le + 3 la rend affine ; linéaire = ax seulement"],
      visuel:{ type:'repere', xmin:-3, xmax:3, ymin:-4, ymax:6, droites:[{a:2,b:0,label:'y = 2x'}], points:[{x:1,y:2,label:'(1 ; 2)'}] } },
    { nom:'Image et antécédent', classe:'3ème',
      def:["Image : f(x) = a × x, on multiplie.","Antécédent de b : on résout a × x = b, donc x = b ÷ a."],
      methode:["Image de 5 par f(x) = −2x : −2 × 5.","Antécédent de 22 par f(x) = 4x : 4x = 22, x = 22 ÷ 4.","Vérifie en recalculant l'image."],
      exemple:{ q:"f(x) = 4x. Antécédent de 22 ?", l:["4x = 22","x = 22 ÷ 4","x = 5,5"] },
      piege:["Antécédent de 22 par f(x) = 4x : 4 × 22 = 88","x = 22 ÷ 4 = 5,5"] },
    { nom:'Déterminer le coefficient', classe:'3ème',
      def:["Un seul point suffit : si f(x₀) = y₀, alors a = y₀ ÷ x₀.","En particulier, a = f(1), et a est la pente de la droite."],
      methode:["Repère un couple (x ; f(x)) connu, avec x ≠ 0.","Calcule a = f(x) ÷ x.","Écris f(x) = ax."],
      exemple:{ q:"f linéaire, f(4) = 6. Expression de f ?", l:["a = 6 ÷ 4 = 1,5","f(x) = 1,5x"] },
      piege:["f(4) = 6 donc a = 4 ÷ 6","a = f(x) ÷ x = 6 ÷ 4 = 1,5"] },
    { nom:'Résoudre un problème', classe:'3ème',
      def:["Taux de change, prix au kilo, vitesse constante : toute proportionnalité se modélise par une fonction linéaire.","Le coefficient est la valeur pour une unité."],
      methode:["Identifie la grandeur d'entrée x et la grandeur de sortie.","Le coefficient a est la sortie pour une unité d'entrée.","Écris f(x) = ax et utilise-la pour calculer."],
      exemple:{ q:"1 € = 1,10 $. Fonction et valeur de 50 € ?", l:["f(x) = 1,10x","f(50) = 55","50 € = 55 $"] },
      piege:["f(x) = x + 1,10","f(x) = 1,10x : c'est une multiplication"] },
  ] };

COURS['Fonction affine'] = { branch:'fonctions', level:'3ème',
  intro:"f(x) = ax + b : une droite qui ne passe plus forcément par l'origine. a est la pente, b l'ordonnée à l'origine. On apprend à lire, calculer et retrouver a et b.",
  competences:[
    { nom:'Identifier a et b', classe:'3ème',
      def:["f(x) = ax + b : a est le coefficient directeur (la pente), b l'ordonnée à l'origine (la hauteur où la droite coupe l'axe vertical, car f(0) = b).","Si b = 0, la fonction est linéaire ; si a = 0, elle est constante."],
      methode:["Écris l'expression sous la forme ax + b, même si l'ordre est différent (7 − 3x → a = −3, b = 7).","a : le nombre devant x, avec son signe. b : le nombre seul.","Sur un graphique : b est le point sur l'axe vertical ; a se lit en avançant d'une unité."],
      exemple:{ q:"f(x) = −3x + 7", l:["a = −3","b = 7"] },
      piege:["f(x) = 7 − 3x : a = 7 et b = −3","a = −3 (devant x), b = 7"],
      visuel:{ type:'repere', xmin:-3, xmax:3, ymin:-2, ymax:6, droites:[{a:2,b:1,label:'y = 2x + 1'}], points:[{x:0,y:1,label:'b = 1'}] } },
    { nom:'Calculer des images', classe:'3ème',
      def:["L'image de x par f(x) = ax + b se calcule en remplaçant x : multiplication d'abord, addition ensuite.","Avec un nombre négatif, parenthèses obligatoires : f(−2) = −3 × (−2) + 7."],
      methode:["Remplace x entre parenthèses.","Calcule a × x.","Ajoute b."],
      exemple:{ q:"f(x) = −3x + 7. Calcule f(−2).", l:["f(−2) = −3 × (−2) + 7","= 6 + 7","= 13"] },
      piege:["f(3) = 2 × 3 + 1 = 2 × 4 = 8","2 × 3 + 1 = 7 : la multiplication d'abord"] },
    { nom:'Déterminer un antécédent', classe:'3ème',
      def:["L'antécédent de y par f est la solution de l'équation ax + b = y.","Il est unique dès que a ≠ 0."],
      methode:["Écris ax + b = y.","Soustrais b des deux côtés.","Divise par a."],
      exemple:{ q:"f(x) = 2x + 1. Antécédent de 9 ?", l:["2x + 1 = 9","2x = 8","x = 4"] },
      piege:["Antécédent de 9 : f(9) = 19","On résout 2x + 1 = 9 : x = 4"] },
    { nom:'Déterminer une fonction affine', classe:'3ème',
      def:["Deux points suffisent : a = (f(x₂) − f(x₁)) ÷ (x₂ − x₁), la variation de f divisée par la variation de x.","Puis b se trouve en remplaçant un point dans f(x) = ax + b."],
      methode:["Calcule a avec les deux couples connus.","Remplace x et f(x) d'un couple dans ax + b = f(x) pour trouver b.","Écris f(x) = ax + b et vérifie avec l'autre couple."],
      exemple:{ q:"f affine, f(1) = 5 et f(3) = 11", l:["a = (11 − 5) ÷ (3 − 1) = 3","3 × 1 + b = 5 → b = 2","f(x) = 3x + 2"] },
      piege:["a = (3 − 1) ÷ (11 − 5)","a = (11 − 5) ÷ (3 − 1) : variation de f sur variation de x"],
      retenir:'a = Δf ÷ Δx   ·   b = f(0)' },
    { nom:'Résoudre un problème', classe:'3ème',
      def:["Abonnement plus prix par minute, forfait plus prix au kilomètre : une partie fixe (b) et une partie proportionnelle (ax).","Comparer deux tarifs revient à résoudre f(x) = g(x)."],
      methode:["Identifie la partie fixe (b) et le prix unitaire (a).","Écris f(x) = ax + b.","Calcule une valeur, ou résous une équation pour comparer."],
      exemple:{ q:"10 € par mois + 0,05 € par minute. Prix pour x minutes ?", l:["partie fixe : 10, prix unitaire : 0,05","f(x) = 0,05x + 10"] },
      piege:["f(x) = 10x + 0,05","f(x) = 0,05x + 10 : le prix unitaire multiplie x"] },
  ] };

COURS['Bases des probabilités'] = { branch:'proba', level:'5ème–3ème',
  intro:"Dé, pièce, urne, roue : le hasard se calcule. On apprend à lister les issues, à calculer une probabilité, à utiliser l'événement contraire et à traiter une expérience à deux épreuves.",
  competences:[
    { nom:"Les issues d'une expérience", classe:'5ème',
      def:["Une expérience aléatoire a plusieurs résultats possibles, les issues. L'univers est l'ensemble de toutes les issues : pour un dé, {1, 2, 3, 4, 5, 6}.","Un événement regroupe certaines issues : « obtenir un nombre pair » = {2, 4, 6}."],
      methode:["Liste toutes les issues sans en oublier.","Pour un événement, sélectionne les issues qui le réalisent.","Compte-les : c'est le nombre d'issues favorables."],
      exemple:{ q:"Dé à 6 faces, événement « multiple de 3 »", l:["univers : {1, 2, 3, 4, 5, 6}","issues favorables : {3, 6}","2 issues favorables"] },
      piege:["« Obtenir un nombre pair » est une issue","C'est un événement ; les issues sont 2, 4 et 6"] },
    { nom:"L'échelle des probabilités", classe:'5ème–4ème',
      def:["Une probabilité est un nombre entre 0 et 1 : 0 pour un événement impossible, 1 pour un événement certain, 0,5 pour une chance sur deux.","La somme des probabilités de toutes les issues vaut 1."],
      methode:["Situe l'événement sur l'échelle : impossible, peu probable, une chance sur deux, probable, certain.","Pour trouver une probabilité manquante, utilise la somme égale à 1.","Une probabilité s'écrit en fraction, en décimal ou en pourcentage."],
      exemple:{ q:"Roue : rouge 0,5, bleu 0,3, vert ?", l:["0,5 + 0,3 = 0,8","P(vert) = 1 − 0,8","= 0,2"] },
      piege:["Une probabilité peut valoir 1,2","Jamais : elle est toujours entre 0 et 1"],
      visuel:{ type:'axe', min:0, max:1, pas:0.25, points:[{x:0,label:'impossible',c:CL.rouge},{x:0.5,label:'1 sur 2',c:CL.or},{x:1,label:'certain',c:CL.vert}] } },
    { nom:"Calculer la probabilité d'un événement", classe:'5ème–4ème',
      def:["Quand toutes les issues ont la même chance (équiprobabilité) : P = nombre d'issues favorables ÷ nombre d'issues possibles.","On simplifie la fraction obtenue."],
      methode:["Compte les issues possibles.","Compte les issues favorables à l'événement.","Divise et simplifie."],
      exemple:{ q:"Jeu de 32 cartes. Probabilité de tirer un as ?", l:["4 as sur 32 cartes","P = 4/32","= 1/8"] },
      piege:["Urne : 3 rouges, 7 bleues. P(rouge) = 3/7","P(rouge) = 3/10 : on divise par le total"],
      visuel:{ type:'disque', parts:[{label:'as 4',frac:0.125,c:'rgba(230,210,120,0.45)'},{label:'autres 28',frac:0.875}] } },
    { nom:"L'événement contraire", classe:'4ème–3ème',
      def:["L'événement contraire de A, noté « non A », est réalisé quand A ne l'est pas.","P(non A) = 1 − P(A). C'est souvent plus rapide de calculer le contraire."],
      methode:["Formule l'événement contraire avec des mots.","Calcule 1 − P(A).","Utilise-le pour « au moins un » : contraire de « aucun »."],
      exemple:{ q:"P(as) = 1/8. Probabilité de ne pas tirer un as ?", l:["1 − 1/8","= 7/8"] },
      piege:["Contraire de « obtenir 6 » : « obtenir 1 »","Contraire : « ne pas obtenir 6 », soit {1, 2, 3, 4, 5}"] },
    { nom:'De la fréquence à la probabilité', classe:'3ème',
      def:["Quand on ne peut pas raisonner par équiprobabilité (punaise, joueur), on répète l'expérience un grand nombre de fois.","La fréquence observée se rapproche de la probabilité quand le nombre d'essais augmente."],
      methode:["Compte le nombre de fois où l'événement s'est produit.","Divise par le nombre total d'essais : c'est la fréquence.","Avec beaucoup d'essais, prends cette fréquence comme estimation de la probabilité."],
      exemple:{ q:"Punaise lancée 1000 fois, pointe en l'air 380 fois", l:["fréquence = 380 ÷ 1000","P ≈ 0,38"] },
      piege:["Après 10 lancers, la fréquence donne la probabilité exacte","Il faut un grand nombre de lancers pour une bonne estimation"] },
    { nom:'Une expérience à deux épreuves', classe:'3ème',
      def:["Dé puis pièce, deux pièces, deux tirages avec remise : on liste les couples d'issues avec un tableau ou un arbre.","Le nombre d'issues se multiplie : 6 × 2 = 12 pour un dé et une pièce. Avec remise, les probabilités des branches se multiplient."],
      methode:["Dessine un arbre : une branche par issue de la première épreuve, puis de la seconde.","Compte les chemins favorables sur le total, ou multiplie les probabilités le long d'un chemin.","Additionne les chemins qui réalisent l'événement."],
      exemple:{ q:"Urne : 2 rouges, 3 bleues, deux tirages avec remise. P(rouge, rouge) ?", l:["P(rouge) = 2/5 à chaque tirage","2/5 × 2/5","= 4/25"] },
      piege:["Deux pièces : P(exactement un pile) = 1/4","Chemins PF et FP : 2/4 = 1/2"],
      visuel:{ type:'arbre', n1:['P','F'], n2:['P','F'] } },
  ] };

COURS['Organisation des données'] = { branch:'stats', level:'6ème',

    { nom:'Construire un diagramme', classe:'6ème',

COURS['Statistiques'] = { branch:'stats', level:'5ème–4ème',
  intro:"Résumer une série de nombres par quelques indicateurs : la fréquence, la moyenne (simple ou pondérée), la médiane et l'étendue.",
  competences:[
    { nom:'La fréquence', classe:'5ème',
      def:["Fréquence d'une valeur = effectif de cette valeur ÷ effectif total.","Les fréquences de toutes les valeurs ont pour somme 1, soit 100 %."],
      methode:["Compte l'effectif total.","Divise l'effectif de la valeur par le total.","Exprime en décimal ou en pourcentage."],
      exemple:{ q:"18 élèves sur 30 pratiquent un sport", l:["18 ÷ 30 = 0,6","soit 60 %"] },
      piege:["La somme des fréquences vaut l'effectif total","Elle vaut 1 (100 %)"] },
    { nom:'La moyenne', classe:'4ème',
      def:["La moyenne d'une série est la somme des valeurs divisée par leur nombre.","Elle est sensible aux valeurs extrêmes : une très grande valeur la tire vers le haut."],
      methode:["Additionne toutes les valeurs.","Divise par le nombre de valeurs.","Vérifie que la moyenne est entre le minimum et le maximum."],
      exemple:{ q:"Notes : 8 ; 11 ; 12 ; 14 ; 15", l:["somme : 60","60 ÷ 5","moyenne : 12"] },
      piege:["Moyenne de 12 ; 15 ; 9 ; 16 = 52 ÷ 3","52 ÷ 4 = 13 : on divise par le nombre de valeurs"] },
    { nom:'La moyenne pondérée', classe:'5ème–3ème',
      def:["Quand chaque valeur a un coefficient (ou un effectif), on multiplie chaque valeur par son coefficient, on additionne, puis on divise par la somme des coefficients.","Une note à coefficient 3 compte comme trois notes identiques."],
      methode:["Multiplie chaque valeur par son coefficient.","Additionne ces produits.","Divise par la somme des coefficients (pas par le nombre de valeurs)."],
      exemple:{ q:"8 (coef 1) et 14 (coef 3)", l:["8 × 1 + 14 × 3 = 50","1 + 3 = 4","50 ÷ 4 = 12,5"] },
      piege:["(8 + 14) ÷ 2 = 11","(8 + 42) ÷ 4 = 12,5 : le coefficient compte"],
      visuel:{ type:'tableau', lignes:[['note','8','14'],['coef','1','3'],['produit','8','42']] } },
    { nom:'La médiane', classe:'4ème',

/* ═══════════════════════════════════════════════════════════
   LE LIVRE DE COURS
   Un cours = une suite de PAGES que l'on tourne avec les flèches.
   Une page = un titre, du texte à gauche, une illustration à
   droite, et parfois un encart en bas (exemple, monde réel,
   à retenir, piège). Certaines illustrations tournent en boucle,
   lentement : la page reste calme et lisible.

   Format d'une page :
     { titre, texte:[lignes], figure:{ type, ...params, anim:true },
       encart:{ type:'exemple'|'monde'|'retenir'|'piege', titre, lignes } }
   ═══════════════════════════════════════════════════════════ */

const LIVRES = {};

const C = {
  craie:'rgba(245,242,232,0.94)', doux:'rgba(240,236,224,0.8)', muet:'rgba(240,236,224,0.5)',
  or:'rgba(230,210,120,0.95)', bleu:'rgba(130,200,230,0.95)', vert:'rgba(130,214,160,0.95)',
  rouge:'rgba(230,130,110,0.95)', violet:'rgba(190,150,230,0.95)', brun:'rgba(200,160,120,0.95)',
  bleuF:'rgba(130,200,230,0.28)', vertF:'rgba(130,214,160,0.28)', rougeF:'rgba(230,130,110,0.28)', orF:'rgba(230,210,120,0.3)',
};
function clamp01(v){ return Math.min(1, Math.max(0, v)); }

/* ── primitives ─────────────────────────────────────────── */
function trait(ctx, x1, y1, x2, y2, col, w){
  ctx.save(); ctx.strokeStyle = col || C.craie; ctx.lineWidth = w || 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
}
function texte(ctx, t, x, y, col, size, font, align){
  ctx.save(); ctx.fillStyle = col || C.craie; ctx.font = (size || 16) + 'px ' + (font || 'DM Sans, sans-serif');
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y); ctx.restore();
}
function poly(ctx, pts, fill, stroke, w){
  ctx.save(); ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath(); if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = w || 2; ctx.lineJoin = 'round'; ctx.stroke(); } ctx.restore();
}
function rond(ctx, x, y, r, fill, stroke, w){
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  if (fill){ ctx.fillStyle = fill; ctx.fill(); } if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = w || 2; ctx.stroke(); } ctx.restore();
}
function fleche(ctx, x1, y1, x2, y2, col, w){
  trait(ctx, x1, y1, x2, y2, col, w);
  const a = Math.atan2(y2 - y1, x2 - x1), L = 10;
  trait(ctx, x2, y2, x2 - L*Math.cos(a - .5), y2 - L*Math.sin(a - .5), col, w);
  trait(ctx, x2, y2, x2 - L*Math.cos(a + .5), y2 - L*Math.sin(a + .5), col, w);
}
function decoupe(ctx, t, largeur, font){
  ctx.save(); ctx.font = font; const out = []; let cur = '';
  for (const m of String(t).split(' ')){ const e = (cur + ' ' + m).trim(); if (ctx.measureText(e).width > largeur && cur){ out.push(cur); cur = m; } else cur = e; }
  if (cur) out.push(cur); ctx.restore(); return out;
}
function oscille(t, periode){ return (Math.sin(t / periode * Math.PI*2) + 1) / 2; }   // 0→1→0 en boucle
function cycle(t, periode){ return (t % periode) / periode; }                          // 0→1 puis retour à 0

/* ── ILLUSTRATIONS ───────────────────────────────────────
   Chaque fonction dessine dans une boîte b = {x,y,w,h}.
   t est le temps en secondes (0 si la page est statique). */
const FIG = {

  /* Pizza / gâteau partagé : { n, k, legende } — anim : une part se soulève */
  pizza(ctx, b, f, t){
    const cx = b.x + b.w/2, cy = b.y + b.h/2 - 10, r = Math.min(b.w, b.h)*0.36, n = f.n, k = f.k;
    for (let i = 0; i < n; i++){
      const a0 = -Math.PI/2 + i*2*Math.PI/n, a1 = a0 + 2*Math.PI/n, am = (a0 + a1)/2;
      const lev = (f.anim && i === 0) ? oscille(t, 4)*10 : 0;
      const ox = Math.cos(am)*lev, oy = Math.sin(am)*lev;
      ctx.save(); ctx.beginPath(); ctx.moveTo(cx + ox, cy + oy); ctx.arc(cx + ox, cy + oy, r, a0, a1); ctx.closePath();
      ctx.fillStyle = i < k ? 'rgba(230,180,90,0.75)' : 'rgba(230,180,90,0.22)'; ctx.fill();
      ctx.strokeStyle = C.craie; ctx.lineWidth = 1.6; ctx.stroke(); ctx.restore();
      if (i < k){ rond(ctx, cx + ox + Math.cos(am)*r*0.55, cy + oy + Math.sin(am)*r*0.55, 5, 'rgba(200,60,50,0.85)'); }
    }
    if (f.legende) texte(ctx, f.legende, cx, cy + r + 34, C.or, 17, 'DM Mono, monospace', 'center');
  },

  /* Jauge / réservoir : { k, n, unite, total } — anim : le niveau monte lentement */
  jauge(ctx, b, f, t){
    const w = Math.min(90, b.w*0.3), h = b.h*0.7, x = b.x + b.w/2 - w/2, y = b.y + b.h*0.12;
    const niveau = f.anim ? cycle(t, 6) * (f.k/f.n) : f.k/f.n;
    ctx.save(); ctx.fillStyle = 'rgba(130,200,230,0.45)'; ctx.fillRect(x, y + h*(1 - niveau), w, h*niveau); ctx.restore();
    ctx.save(); ctx.strokeStyle = C.craie; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h); ctx.restore();
    for (let i = 1; i < f.n; i++){ const yy = y + h - i*h/f.n; trait(ctx, x - 8, yy, x, yy, C.muet, 1.5); texte(ctx, i + '/' + f.n, x - 14, yy, C.muet, 12, 'DM Mono, monospace', 'right'); }
    texte(ctx, f.legende || '', b.x + b.w/2, y + h + 26, C.or, 16, 'DM Mono, monospace', 'center');
    if (f.total) texte(ctx, f.total, x + w + 12, y + 10, C.doux, 13, 'DM Mono, monospace', 'left');
  },

  /* Barre de longueur partagée : { n, k, legende, etiquettes } */
  barre(ctx, b, f, t){
    const w = b.w - 40, x0 = b.x + 20, y = b.y + b.h*0.42, h = Math.min(50, b.h*0.25), seg = w/f.n;
    for (let i = 0; i < f.n; i++){
      ctx.save(); ctx.fillStyle = i < f.k ? (f.c || C.bleuF) : 'rgba(255,255,255,0.04)'; ctx.fillRect(x0 + i*seg, y, seg, h);
      ctx.strokeStyle = C.craie; ctx.lineWidth = 1.4; ctx.strokeRect(x0 + i*seg, y, seg, h); ctx.restore();
      if (f.etiquettes) texte(ctx, f.etiquettes[i] || '', x0 + i*seg + seg/2, y + h/2, C.craie, 13, 'DM Mono, monospace', 'center');
    }
    if (f.total) texte(ctx, f.total, b.x + b.w/2, y - 18, C.doux, 14, 'DM Mono, monospace', 'center');
    if (f.legende) texte(ctx, f.legende, b.x + b.w/2, y + h + 28, C.or, 16, 'DM Mono, monospace', 'center');
  },

  /* Droite graduée : { min, max, pas, etiq, points:[{x,label,c}], anim:'saut' } */
  axe(ctx, b, f, t){
    const y = b.y + b.h*0.55, x0 = b.x + 24, x1 = b.x + b.w - 24, n = (f.max - f.min), dx = (x1 - x0)/n, pas = f.pas || 1;
    trait(ctx, x0 - 14, y, x1 + 14, y, C.craie, 2); trait(ctx, x1 + 14, y, x1 + 4, y - 5, C.craie, 2); trait(ctx, x1 + 14, y, x1 + 4, y + 5, C.craie, 2);
    for (let k = f.min; k <= f.max + 1e-9; k = +(k + pas).toFixed(6)){
      const x = x0 + (k - f.min)*dx; trait(ctx, x, y - 6, x, y + 6, C.craie, 1.4);
      const mult = !f.etiq || Math.abs(k / f.etiq - Math.round(k / f.etiq)) < 1e-6;
      if (mult) texte(ctx, String(+k.toFixed(6)).replace('.', ',').replace('-','−'), x, y + 18, Math.abs(k) < 1e-9 ? C.or : C.muet, 12, 'DM Mono, monospace', 'center');
    }
    (f.points || []).forEach((p, i) => {
      let px = p.x;
      if (f.anim && p.vers != null) px = p.x + (p.vers - p.x)*oscille(t, 5);
      const x = x0 + (px - f.min)*dx;
      rond(ctx, x, y, 6, p.c || C.bleu); texte(ctx, p.label || '', x, y - 18, p.c || C.bleu, 15, 'italic Georgia, serif', 'center');
    });
    if (f.fleche){ const a = x0 + (f.fleche[0] - f.min)*dx, c = x0 + (f.fleche[1] - f.min)*dx; fleche(ctx, a, y - 34, c, y - 34, C.or, 2); texte(ctx, f.fleche[2] || '', (a + c)/2, y - 48, C.or, 13, 'DM Mono, monospace', 'center'); }
    if (f.legende) texte(ctx, f.legende, b.x + b.w/2, b.y + b.h - 16, C.or, 15, 'DM Mono, monospace', 'center');
  },

  /* Thermomètre : { min, max, valeur, valeurs:[...] } — anim : le mercure bouge entre les valeurs */
  thermometre(ctx, b, f, t){
    const x = b.x + b.w/2, y0 = b.y + 24, h = b.h - 70, w = 22;
    let v = f.valeur; if (f.anim && f.valeurs){ const k = cycle(t, 8)*f.valeurs.length; const i = Math.floor(k), j = (i+1) % f.valeurs.length; v = f.valeurs[i] + (f.valeurs[j] - f.valeurs[i])*Math.min(1, Math.max(0, (k - i - 0.6)/0.4)); }
    ctx.save(); ctx.strokeStyle = C.craie; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - w/2, y0, w, h, 11) : ctx.rect(x - w/2, y0, w, h); ctx.stroke(); ctx.restore();
    const yv = y0 + h - (v - f.min)/(f.max - f.min)*h;
    ctx.save(); ctx.fillStyle = v < 0 ? 'rgba(130,200,230,0.8)' : 'rgba(230,130,110,0.8)'; ctx.fillRect(x - w/2 + 5, yv, w - 10, y0 + h - yv + 4); ctx.restore();
    rond(ctx, x, y0 + h + 8, 16, v < 0 ? 'rgba(130,200,230,0.8)' : 'rgba(230,130,110,0.8)', C.craie, 2);
    for (let k = f.min; k <= f.max; k += (f.pas || 10)){ const yy = y0 + h - (k - f.min)/(f.max - f.min)*h; trait(ctx, x + w/2, yy, x + w/2 + 8, yy, C.muet, 1.4); texte(ctx, (k > 0 ? '+' : '') + String(k).replace('-','−') + '°', x + w/2 + 14, yy, k === 0 ? C.or : C.muet, 12, 'DM Mono, monospace', 'left'); }
    texte(ctx, (v > 0 ? '+' : '') + Math.round(v) + ' °C', x - w/2 - 14, yv, v < 0 ? C.bleu : C.rouge, 17, 'DM Mono, monospace', 'right');
  },

  /* Ascenseur / immeuble : { etages:[-2..5], depart, arrivee } — anim : la cabine monte et descend */
  ascenseur(ctx, b, f, t){
    const n = f.max - f.min + 1, eh = Math.min(36, (b.h - 30)/n), x = b.x + b.w/2 - 60, y0 = b.y + 15 + (n - 1)*eh;
    for (let k = f.min; k <= f.max; k++){
      const y = y0 - (k - f.min)*eh;
      ctx.save(); ctx.strokeStyle = 'rgba(245,242,232,0.35)'; ctx.lineWidth = 1; ctx.strokeRect(x, y - eh/2, 120, eh); ctx.restore();
      texte(ctx, k === 0 ? 'RDC' : (k > 0 ? '+' : '') + String(k).replace('-','−'), x - 12, y, k === 0 ? C.or : (k < 0 ? C.bleu : C.doux), 13, 'DM Mono, monospace', 'right');
    }
    let pos = f.arrivee; if (f.anim){ const c = cycle(t, 7); pos = c < 0.45 ? f.depart + (f.arrivee - f.depart)*(c/0.45) : (c < 0.55 ? f.arrivee : f.arrivee + (f.depart - f.arrivee)*((c - 0.55)/0.45)); }
    const yc = y0 - (pos - f.min)*eh;
    ctx.save(); ctx.fillStyle = 'rgba(230,210,120,0.35)'; ctx.fillRect(x + 40, yc - eh/2 + 3, 40, eh - 6); ctx.strokeStyle = C.or; ctx.lineWidth = 1.5; ctx.strokeRect(x + 40, yc - eh/2 + 3, 40, eh - 6); ctx.restore();
    texte(ctx, f.legende || '', b.x + b.w/2, b.y + b.h - 12, C.or, 14, 'DM Mono, monospace', 'center');
  },

  /* Compte en banque : barres + et − : { mouvements:[{l,v}] } */
  compte(ctx, b, f, t){
    const y0 = b.y + b.h*0.5, n = f.mouvements.length, bw = Math.min(44, (b.w - 40)/n*0.6), gap = (b.w - 40)/n, sc = (b.h*0.38)/Math.max(...f.mouvements.map(m => Math.abs(m.v)));
    trait(ctx, b.x + 10, y0, b.x + b.w - 10, y0, C.craie, 1.6);
    let solde = 0;
    f.mouvements.forEach((m, i) => {
      const x = b.x + 20 + i*gap + gap/2 - bw/2, h = m.v*sc;
      ctx.save(); ctx.fillStyle = m.v >= 0 ? C.vertF : C.rougeF; ctx.strokeStyle = m.v >= 0 ? C.vert : C.rouge; ctx.lineWidth = 1.4;
      ctx.fillRect(x, y0 - Math.max(0, h), bw, Math.abs(h)); ctx.strokeRect(x, y0 - Math.max(0, h), bw, Math.abs(h)); ctx.restore();
      texte(ctx, (m.v > 0 ? '+' : '−') + Math.abs(m.v), x + bw/2, y0 - h - (m.v >= 0 ? 12 : -12), m.v >= 0 ? C.vert : C.rouge, 13, 'DM Mono, monospace', 'center');
      texte(ctx, m.l, x + bw/2, b.y + b.h - 14, C.muet, 11, 'DM Sans, sans-serif', 'center');
      solde += m.v;
    });
    texte(ctx, 'solde : ' + (solde >= 0 ? '+' : '−') + Math.abs(solde) + ' €', b.x + b.w/2, b.y + 14, solde >= 0 ? C.vert : C.rouge, 15, 'DM Mono, monospace', 'center');
  },

  /* Tableau : { lignes:[[..]], entetes, surligne:[[r,c]], fleche:'× 2' } */
  tableau(ctx, b, f, t){
    const rows = f.lignes, nc = rows[0].length, nr = rows.length, cw = Math.min(120, (b.w - 20)/nc), rh = Math.min(46, (b.h - 40)/(nr + 0.4));
    const x0 = b.x + b.w/2 - nc*cw/2, y0 = b.y + b.h/2 - nr*rh/2 - (f.legende ? 10 : 0);
    for (let r = 0; r < nr; r++) for (let c = 0; c < nc; c++){
      const val = String(rows[r][c]), q = val.includes('?');
      ctx.save(); if (c === 0 || q){ ctx.fillStyle = q ? C.orF : 'rgba(255,255,255,0.05)'; ctx.fillRect(x0 + c*cw, y0 + r*rh, cw, rh); }
      ctx.strokeStyle = C.craie; ctx.lineWidth = 1.2; ctx.strokeRect(x0 + c*cw, y0 + r*rh, cw, rh); ctx.restore();
      texte(ctx, val, x0 + c*cw + cw/2, y0 + r*rh + rh/2, q ? C.or : (c === 0 ? C.doux : C.craie), c === 0 ? 13 : 16, c === 0 ? 'DM Sans, sans-serif' : 'DM Mono, monospace', 'center');
    }
    if (f.fleche){ const xf = x0 + nc*cw + 18; fleche(ctx, xf, y0 + rh/2, xf, y0 + rh*1.5, C.vert, 1.8); texte(ctx, f.fleche, xf + 10, y0 + rh, C.vert, 14, 'DM Mono, monospace', 'left'); }
    if (f.legende) texte(ctx, f.legende, b.x + b.w/2, y0 + nr*rh + 24, C.or, 15, 'DM Mono, monospace', 'center');
  },

  /* Balance : { g, d, note } — anim : légère oscillation si déséquilibrée, immobile sinon */
  balance(ctx, b, f, t){
    const cx = b.x + b.w/2, y = b.y + b.h*0.5, w = b.w*0.36, inc = f.anim ? (oscille(t, 4) - 0.5)*0.08 : 0;
    ctx.save(); ctx.translate(cx, y); ctx.rotate(inc);
    trait(ctx, -w, 0, w, 0, C.craie, 3);
    ctx.fillStyle = C.bleuF; ctx.strokeStyle = C.bleu; ctx.lineWidth = 1.5; ctx.fillRect(-w - 10, -46, 120, 40); ctx.strokeRect(-w - 10, -46, 120, 40);
    ctx.fillStyle = C.vertF; ctx.strokeStyle = C.vert; ctx.fillRect(w - 110, -46, 120, 40); ctx.strokeRect(w - 110, -46, 120, 40);
    texte(ctx, f.g, -w + 50, -26, C.bleu, 18, 'DM Mono, monospace', 'center'); texte(ctx, f.d, w - 50, -26, C.vert, 18, 'DM Mono, monospace', 'center');
    ctx.restore();

    if (f.note) texte(ctx, f.note, cx, y + 76, C.or, 14, 'DM Mono, monospace', 'center');
  },

  /* Triangle : { rect, noms, cotes:{AB,BC,CA}, angle, hyp, anim:'rotation' } */
  triangle(ctx, b, f, t){
    const m = 34, A = {x:b.x + m, y:b.y + b.h - m}, B = {x:b.x + b.w - m, y:b.y + b.h - m}, Cc = f.rect ? {x:b.x + m, y:b.y + m + 10} : {x:b.x + b.w*0.42, y:b.y + m + 10};
    const noms = f.noms || ['A','B','C'];
    poly(ctx, [A, B, Cc], f.fond || null, null);
    trait(ctx, A.x, A.y, B.x, B.y, C.craie, 2.3); trait(ctx, B.x, B.y, Cc.x, Cc.y, f.hyp ? C.bleu : C.craie, 2.3); trait(ctx, Cc.x, Cc.y, A.x, A.y, C.craie, 2.3);
    if (f.rect){ ctx.save(); ctx.strokeStyle = C.doux; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(A.x + 14, A.y); ctx.lineTo(A.x + 14, A.y - 14); ctx.lineTo(A.x, A.y - 14); ctx.stroke(); ctx.restore(); }
    texte(ctx, noms[0], A.x - 14, A.y + 14, C.craie, 17, 'italic Georgia, serif', 'center'); texte(ctx, noms[1], B.x + 14, B.y + 14, C.craie, 17, 'italic Georgia, serif', 'center'); texte(ctx, noms[2], Cc.x + (f.rect ? -14 : 0), Cc.y - 12, C.craie, 17, 'italic Georgia, serif', 'center');
    const c = f.cotes || {};

    if (c.CA) texte(ctx, c.CA, (A.x + Cc.x)/2 - 26, (A.y + Cc.y)/2, C.doux, 14, 'DM Mono, monospace', 'center');
    if (c.BC) texte(ctx, c.BC, (B.x + Cc.x)/2 + 28, (B.y + Cc.y)/2 - 8, f.hyp ? C.bleu : C.doux, 14, 'DM Mono, monospace', 'center');
    if (f.angle){ const P = f.angle === 'B' ? B : Cc, autres = f.angle === 'B' ? [A, Cc] : [A, B];
      const a1 = Math.atan2(autres[0].y - P.y, autres[0].x - P.x), a2 = Math.atan2(autres[1].y - P.y, autres[1].x - P.x);
      ctx.save(); ctx.strokeStyle = C.or; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(P.x, P.y, 24, Math.min(a1, a2), Math.max(a1, a2)); ctx.stroke(); ctx.restore();
      if (f.angleLabel) texte(ctx, f.angleLabel, P.x + (f.angle === 'B' ? -40 : 30), P.y + 20, C.or, 14, 'DM Mono, monospace', 'center'); }
  },

  /* Échelle contre un mur (Pythagore) : { h, d, l } — anim : l'échelle glisse un peu */
  echelle(ctx, b, f, t){
    const solY = b.y + b.h - 30, murX = b.x + 40, k = f.anim ? oscille(t, 6)*0.12 : 0;
    trait(ctx, b.x + 10, solY, b.x + b.w - 10, solY, C.craie, 2.5); trait(ctx, murX, b.y + 10, murX, solY, C.craie, 2.5);
    const L = Math.min(b.w, b.h)*0.72, ang = 1.15 - k, top = {x: murX, y: solY - L*Math.sin(ang)}, pied = {x: murX + L*Math.cos(ang), y: solY};
    trait(ctx, top.x + 6, top.y, pied.x + 6, pied.y, C.brun, 4); trait(ctx, top.x - 6, top.y, pied.x - 6, pied.y, C.brun, 4);

  /* Parallèles et sécante : { angles:[{pos,label,c}] } */
  paralleles(ctx, b, f, t){

    const I = y => ({x: sx0 + (sx1 - sx0)*((sy0 - y)/(sy0 - sy1)), y}), I1 = I(y1), I2 = I(y2), dir = Math.atan2(sy1 - sy0, sx1 - sx0);

    texte(ctx, '(d)', x1, y1 - 12, C.muet, 12, 'DM Mono, monospace', 'right'); texte(ctx, "(d′)", x1, y2 - 12, C.muet, 12, 'DM Mono, monospace', 'right');
  },

  /* Horloge : { h, m } — anim : les aiguilles avancent (une minute par seconde) */
  horloge(ctx, b, f, t){
    const cx = b.x + b.w/2, cy = b.y + b.h/2 - 6, r = Math.min(b.w, b.h)*0.36, min = (f.h*60 + f.m) + (f.anim ? Math.floor(t)*1 : 0);

  /* Symétrie sur quadrillage : { axe:'v'|'centre', figure:[[i,j]...], cols, rows } — anim : le pliage/demi-tour */
  symetrie(ctx, b, f, t){
    const cols = f.cols || 10, rows = f.rows || 8, cs = Math.min((b.w - 30)/cols, (b.h - 30)/rows), x0 = b.x + b.w/2 - cols*cs/2, y0 = b.y + b.h/2 - rows*cs/2;
    ctx.save(); ctx.strokeStyle = 'rgba(245,242,232,0.12)'; for (let i = 0; i <= cols; i++){ ctx.beginPath(); ctx.moveTo(x0 + i*cs, y0); ctx.lineTo(x0 + i*cs, y0 + rows*cs); ctx.stroke(); } for (let j = 0; j <= rows; j++){ ctx.beginPath(); ctx.moveTo(x0, y0 + j*cs); ctx.lineTo(x0 + cols*cs, y0 + j*cs); ctx.stroke(); } ctx.restore();
    const P = f.figure.map(([i, j]) => ({x: x0 + i*cs, y: y0 + j*cs}));
    const cxA = x0 + cols/2*cs, cyA = y0 + rows/2*cs, q = f.anim ? oscille(t, 6) : 1;
    let img;
    if (f.centre){ rond(ctx, cxA, cyA, 4, C.rouge); texte(ctx, 'O', cxA + 10, cyA - 10, C.rouge, 13, 'italic Georgia, serif'); const ang = Math.PI*q; img = P.map(p => ({x: cxA + (p.x - cxA)*Math.cos(ang) - (p.y - cyA)*Math.sin(ang), y: cyA + (p.x - cxA)*Math.sin(ang) + (p.y - cyA)*Math.cos(ang)})); }
    else { trait(ctx, cxA, y0 - 6, cxA, y0 + rows*cs + 6, C.rouge, 2); texte(ctx, '(d)', cxA + 12, y0 + 4, C.rouge, 12, 'DM Mono, monospace'); img = P.map(p => ({x: cxA + (cxA - p.x)*(2*q - 1) , y: p.y})); }
    poly(ctx, P, C.bleuF, C.bleu, 2); poly(ctx, img, C.vertF, C.vert, 2);
    if (f.legende) texte(ctx, f.legende, b.x + b.w/2, b.y + b.h - 10, C.or, 14, 'DM Mono, monospace', 'center');
  },

  /* Translation / rotation sur quadrillage : { figure, vecteur:[dx,dy] | angle } — anim : le glissement en boucle */
  deplacement(ctx, b, f, t){
    const cols = 10, rows = 8, cs = Math.min((b.w - 30)/cols, (b.h - 30)/rows), x0 = b.x + b.w/2 - cols*cs/2, y0 = b.y + b.h/2 - rows*cs/2;
    ctx.save(); ctx.strokeStyle = 'rgba(245,242,232,0.12)'; for (let i = 0; i <= cols; i++){ ctx.beginPath(); ctx.moveTo(x0 + i*cs, y0); ctx.lineTo(x0 + i*cs, y0 + rows*cs); ctx.stroke(); } for (let j = 0; j <= rows; j++){ ctx.beginPath(); ctx.moveTo(x0, y0 + j*cs); ctx.lineTo(x0 + cols*cs, y0 + j*cs); ctx.stroke(); } ctx.restore();
    const P = f.figure.map(([i, j]) => ({x: x0 + i*cs, y: y0 + j*cs})), q = f.anim ? oscille(t, 6) : 1;
    let img;
    if (f.vecteur){ img = P.map(p => ({x: p.x + f.vecteur[0]*cs*q, y: p.y + f.vecteur[1]*cs*q})); fleche(ctx, x0 + cs, y0 + cs, x0 + cs + f.vecteur[0]*cs, y0 + cs + f.vecteur[1]*cs, C.or, 2); }
    else { const O = {x: x0 + (f.centre ? f.centre[0] : 5)*cs, y: y0 + (f.centre ? f.centre[1] : 4)*cs}, ang = (f.angle || 90)*Math.PI/180*q; rond(ctx, O.x, O.y, 4, C.rouge); texte(ctx, 'O', O.x + 10, O.y - 10, C.rouge, 13, 'italic Georgia, serif'); img = P.map(p => ({x: O.x + (p.x - O.x)*Math.cos(ang) - (p.y - O.y)*Math.sin(ang), y: O.y + (p.x - O.x)*Math.sin(ang) + (p.y - O.y)*Math.cos(ang)})); }
    poly(ctx, P, C.bleuF, C.bleu, 2); poly(ctx, img, C.vertF, C.vert, 2);
    if (f.legende) texte(ctx, f.legende, b.x + b.w/2, b.y + b.h - 10, C.or, 14, 'DM Mono, monospace', 'center');
  },

  /* Grandissement / homothétie : { k } — anim : la figure grandit depuis O */
  homothetie(ctx, b, f, t){
    const O = {x: b.x + 30, y: b.y + b.h - 30}, k = f.anim ? 1 + (f.k - 1)*oscille(t, 6) : f.k, u = Math.min(b.w, b.h)*0.16;
    const P = [{x: O.x + 1.2*u, y: O.y - 0.6*u}, {x: O.x + 2*u, y: O.y - 0.7*u}, {x: O.x + 1.5*u, y: O.y - 1.6*u}];
    const img = P.map(p => ({x: O.x + (p.x - O.x)*k, y: O.y + (p.y - O.y)*k}));
    img.forEach(p => trait(ctx, O.x, O.y, p.x, p.y, 'rgba(245,242,232,0.25)', 1));

    texte(ctx, 'k = ' + k.toFixed(1), b.x + b.w - 20, b.y + 16, C.or, 14, 'DM Mono, monospace', 'right');
  },

  /* Programme de calcul : boîtes reliées par des flèches : { etapes:['× 3','+ 5'], entree, sorties } */
  machine(ctx, b, f, t){
    const n = f.etapes.length + 1, gap = (b.w - 40)/n, y = b.y + b.h/2, bw = Math.min(70, gap*0.6);
    const vals = f.valeurs || []; let x = b.x + 20 + gap/2;
    const boite = (txt, val, col) => { ctx.save(); ctx.fillStyle = col || 'rgba(255,255,255,0.05)'; ctx.strokeStyle = C.craie; ctx.lineWidth = 1.6; ctx.fillRect(x - bw/2, y - 24, bw, 48); ctx.strokeRect(x - bw/2, y - 24, bw, 48); ctx.restore(); texte(ctx, txt, x, y, C.craie, 15, 'DM Mono, monospace', 'center'); if (val != null) texte(ctx, String(val), x, y + 42, C.or, 14, 'DM Mono, monospace', 'center'); };
    boite(f.entree || 'x', vals[0], C.bleuF);
    f.etapes.forEach((e, i) => { fleche(ctx, x + bw/2 + 4, y, x + gap - bw/2 - 4, y, C.muet, 1.5); x += gap; boite(e, vals[i + 1], i === f.etapes.length - 1 ? C.vertF : null); });

  /* Puissances : grains de riz qui doublent : { n } — anim : les cases se remplissent */
  doublement(ctx, b, f, t){
    const n = f.n || 6, gap = (b.w - 30)/n, y = b.y + b.h/2, k = f.anim ? Math.floor(cycle(t, 9)*(n + 1)) : n;
    for (let i = 0; i < n; i++){ const x = b.x + 15 + i*gap + gap/2, v = Math.pow(2, i), on = i < k; ctx.save(); ctx.strokeStyle = on ? C.bleu : C.muet; ctx.lineWidth = 1.4; ctx.strokeRect(x - gap*0.4, y - 40, gap*0.8, 80); ctx.restore();
      if (on){ const cnt = Math.min(v, 32); for (let g = 0; g < cnt; g++) rond(ctx, x - gap*0.32 + (g % 8)*(gap*0.64/7), y - 26 + Math.floor(g/8)*16, 3, C.or); texte(ctx, '2' + '⁰¹²³⁴⁵⁶⁷'[i] + ' = ' + v, x, y + 56, C.craie, 12, 'DM Mono, monospace', 'center'); }
      texte(ctx, 'j' + (i), x, y - 52, C.muet, 11, 'DM Mono, monospace', 'center'); }

  /* Titre décoratif seul */

/* ── RENDU D'UNE PAGE ────────────────────────────────────── */
const ENCARTS = {
  exemple:{ titre:'EXEMPLE', c:C.vert, f:C.vertF },
  monde:{ titre:'DANS LA VRAIE VIE', c:C.or, f:C.orF },
  retenir:{ titre:'À RETENIR', c:C.bleu, f:C.bleuF },
  piege:{ titre:'PIÈGE', c:C.rouge, f:C.rougeF },
  methode:{ titre:'MÉTHODE', c:C.violet, f:'rgba(190,150,230,0.22)' },
  exercice:{ titre:'À TOI', c:C.or, f:C.orF },
};

function dessinerPage(ctx, W, H, page, t){
  drawBoard(ctx, W, H);
  const marge = W*0.045, avecFig = !!page.figure && page.figure.type !== 'vide';
  const colW = avecFig ? W*0.5 : W*0.91;
  const bas = H*0.96;

  /* ── Encart : ses lignes sont découpées à la largeur, sa hauteur en découle ── */
  let encH = 0, encLignes = [];
  const encFont = page.encart ? (15 + 'px ' + (page.encart.type === 'exemple' ? 'DM Mono, monospace' : 'DM Sans, sans-serif')) : '';
  if (page.encart){
    page.encart.lignes.forEach(l => decoupe(ctx, l, W*0.91 - 32, encFont).forEach((sl, i) => encLignes.push({ t: sl, premiere: i === 0 })));
    encH = 40 + encLignes.length*22 + 14;
    encH = Math.min(encH, H*0.42);
  }
  const yEnc = page.encart ? bas - encH : bas;

  /* ── Texte : on réduit la taille jusqu'à ce que tout tienne au-dessus de l'encart ── */
  const corps = page.texte || [];
  function mesure(scale){
    let y = H*0.14;
    const titreSize = Math.round(26*scale), titreFont = titreSize + 'px Playfair Display, Georgia, serif';
    const tl = decoupe(ctx, page.titre || '', colW, titreFont);
    y += tl.length*titreSize*1.3 + 10;
    const blocs = corps.map(bloc => {
      const isObj = typeof bloc === 'object', size = Math.round((isObj && bloc.s ? bloc.s : 16)*scale), font = size + 'px ' + (isObj && bloc.f ? bloc.f : 'DM Sans, sans-serif');
      const lignes = decoupe(ctx, isObj ? bloc.t : bloc, colW - (isObj && bloc.puce ? 22 : 0), font);
      y += lignes.length*size*1.5 + 8;
      return { lignes, size, famille: isObj && bloc.f ? bloc.f : 'DM Sans, sans-serif', col: isObj && bloc.c ? bloc.c : C.doux, puce: isObj && bloc.puce };
    });
    return { fin: y, titreSize, tl, blocs };
  }
  let scale = 1, m = mesure(scale);
  while (m.fin > yEnc - 12 && scale > 0.7){ scale -= 0.05; m = mesure(scale); }

  /* ── Dessin ── */
  if (page.eyebrow) texte(ctx, page.eyebrow, marge, H*0.065, 'rgba(200,185,122,0.75)', 12, 'DM Mono, monospace', 'left');
  let y = H*0.14;
  m.tl.forEach(l => { texte(ctx, l, marge, y, C.craie, m.titreSize, 'Playfair Display, Georgia, serif', 'left'); y += m.titreSize*1.3; });
  y += 10;
  m.blocs.forEach(bl => {
    bl.lignes.forEach((l, i) => {
      if (bl.puce && i === 0) rond(ctx, marge + 6, y, 3, bl.col);
      texte(ctx, l, marge + (bl.puce ? 22 : 0), y, bl.col, bl.size, bl.famille, 'left');
      y += bl.size*1.5;
    });
    y += 8;
  });

  /* ── Figure : dans la colonne de droite, au-dessus de l'encart ── */
  if (avecFig){
    const box = { x: W*0.57, y: H*0.11, w: W*0.395, h: yEnc - 16 - H*0.11 };
    const fn = FIG[page.figure.type]; if (fn) fn(ctx, box, page.figure, page.figure.anim ? t : 0);
  }

  /* ── Encart ── */
  if (page.encart){
    const e = page.encart, meta = ENCARTS[e.type] || ENCARTS.exemple, x = marge, w = W*0.91;
    ctx.save(); ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(x, yEnc, w, encH); ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.fillRect(x, yEnc, w, encH); ctx.fillStyle = meta.c; ctx.fillRect(x, yEnc, 3, encH); ctx.restore();
    texte(ctx, meta.titre + (e.titre ? ' — ' + e.titre : ''), x + 16, yEnc + 18, meta.c, 12, 'DM Mono, monospace', 'left');
    let yy = yEnc + 42;
    const n = page.encart.lignes.length; let idx = -1;
    encLignes.forEach(l => { if (l.premiere) idx++; const last = idx === n - 1 && e.type === 'exemple'; texte(ctx, l.t, x + 16, yy, last ? C.vert : C.craie, 15, e.type === 'exemple' ? 'DM Mono, monospace' : 'DM Sans, sans-serif', 'left'); yy += 22; });
  }
}

/* ── Fabrique les leçons (une par compétence) à partir des livres ── */
function leconsDuLivre(nom, livre){
  const meta = branchMeta(livre.branch), n = livre.competences.length, out = [];
  const idBase = 'l_' + nom.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_');
  const anime = pages => pages.some(p => p.figure && p.figure.anim);
  out.push({ id: idBase + '_0', chapter: nom, branch: livre.branch, tag: meta.label + ' · ' + livre.level, level: livre.level, title:"Vue d'ensemble", desc: livre.intro, competence: 0, duration: '2 pages',
    steps: [
      { eyebrow:'CHAPITRE', titre: nom, texte:[{ t: livre.intro, s:18 }], figure: livre.figure || { type:'vide' } },
      { eyebrow: n + ' COMPÉTENCES', titre:'Ce que tu vas savoir faire', texte: livre.competences.map((c, i) => ({ t:(i + 1) + '.  ' + c.nom, s:16, c:C.craie })), figure: livre.figure ? Object.assign({}, livre.figure, { anim:false }) : { type:'vide' } },
    ] });
  livre.competences.forEach((c, i) => {
    const pages = c.pages.map((p, j) => Object.assign({ eyebrow:'COMPÉTENCE ' + (i + 1) + ' / ' + n + ' · ' + c.nom.toUpperCase() + ' · page ' + (j + 1) + ' / ' + c.pages.length }, p));
    const familles = (typeof FAMILLES !== 'undefined' && FAMILLES[nom] && FAMILLES[nom][c.nom]) || [];
    out.push({ id: idBase + '_' + (i + 1), chapter: nom, branch: livre.branch, tag: meta.label + ' · ' + (c.classe || livre.level), level: c.classe || livre.level, title: c.nom, desc: c.pages[0].texte && typeof c.pages[0].texte[0] === 'string' ? c.pages[0].texte[0] : (c.pages[0].texte && c.pages[0].texte[0] ? c.pages[0].texte[0].t : ''), competence: i + 1, duration: c.pages.length + ' pages' + (anime(c.pages) ? ' · animé' : ''), steps: pages, familles });
  });

  /* ── Le bilan du chapitre : tous les « à retenir », puis tous les pièges ── */
  const retenirs = [], pieges = [];
  livre.competences.forEach(c => {
    c.pages.forEach(p => { if (!p.encart) return;
      if (p.encart.type === 'retenir') retenirs.push({ nom: c.nom, lignes: p.encart.lignes });
      if (p.encart.type === 'piege') pieges.push({ nom: c.nom, lignes: p.encart.lignes });
    });
  });
  const bilan = [];
  const tranche = (arr, k) => { const out = []; for (let i = 0; i < arr.length; i += k) out.push(arr.slice(i, i + k)); return out; };
  tranche(retenirs, 4).forEach((grp, i, all) => bilan.push({
    eyebrow:'BILAN · À RETENIR · page ' + (i + 1) + ' / ' + all.length, titre:'Ce qu\'il faut retenir',
    texte: grp.flatMap(r => [{ t: r.nom, c: C.or, s: 15 }].concat(r.lignes.map(l => ({ t: l, c: C.craie, s: 16, f:'DM Mono, monospace' })))),
    figure: livre.figure ? Object.assign({}, livre.figure, { anim:false }) : { type:'vide' },
  }));
  tranche(pieges, 3).forEach((grp, i, all) => bilan.push({
    eyebrow:'BILAN · LES PIÈGES · page ' + (i + 1) + ' / ' + all.length, titre:'Les erreurs à ne plus faire',
    texte: grp.flatMap(p => [{ t: p.nom, c: C.or, s: 15 }, { t: p.lignes[0], c: C.rouge, s: 15, f:'DM Mono, monospace' }, { t: p.lignes[1], c: C.vert, s: 15, f:'DM Mono, monospace' }]),
    figure: { type:'vide' },
  }));
  if (bilan.length) out.push({ id: idBase + '_bilan', chapter: nom, branch: livre.branch, tag: meta.label + ' · ' + livre.level, level: livre.level,
    title:'Bilan du chapitre', desc:'Tous les « à retenir » et tous les pièges du chapitre, sur quelques pages.', competence: 0, bilan: true,
    duration: bilan.length + ' pages', steps: bilan, familles: [] });
  return out;
}

/* ── Conversion des cours « par compétence » (COURS) en pages, pour les chapitres
      qui n'ont pas encore leur livre illustré. Même format, texte plus sobre. ── */
function livreDepuisCours(nom, ch){
  return { branch: ch.branch, level: ch.level, intro: ch.intro, competences: ch.competences.map(c => {
    const pages = [];
    const fig = c.visuel ? convertirVisuel(c.visuel) : null;
    pages.push({ titre: c.nom, texte: c.def.map(t => ({ t, puce:true })), figure: fig || { type:'vide' } });
    if (c.methode) pages.push({ titre:'Comment faire', texte: c.methode.map((t, i) => ({ t:(i + 1) + '.  ' + t, c:C.bleu })), figure: fig ? Object.assign({}, fig, { anim:false }) : { type:'vide' },
      encart: c.exemple ? { type:'exemple', titre: c.exemple.q, lignes: c.exemple.l } : undefined });
    if (c.piege) pages.push({ titre:'Attention au piège', texte:[{ t:'✗  ' + c.piege[0], c:C.rouge, f:'DM Mono, monospace', s:16 }, { t:'✓  ' + c.piege[1], c:C.vert, f:'DM Mono, monospace', s:16 }], figure:{ type:'vide' },
      encart: c.retenir ? { type:'retenir', lignes:[c.retenir] } : undefined });
    return { nom: c.nom, classe: c.classe, pages };
  }) };
}
function convertirVisuel(v){
  const f = Object.assign({}, v);
  if (v.type === 'rectangle') return { type:'carrelage', L:v.L, l:v.l, unite:v.unite, legende:v.legende };
  if (v.type === 'triangle' || v.type === 'axe' || v.type === 'tableau' || v.type === 'cercle' || v.type === 'batons' || v.type === 'disque' || v.type === 'repere' || v.type === 'balance' || v.type === 'paralleles' || v.type === 'pave') return f;
  if (v.type === 'barre') return { type:'barre', n:v.n, k:v.k, legende:v.legende };
  if (v.type === 'arbre') return { type:'arbre', n1:v.n1.map(l => ({ l })), n2:v.n2.map(l => ({ l })) };
  return null;
}
