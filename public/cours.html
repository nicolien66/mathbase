LIVRES['Angles et parallélisme'] = { branch:'geometrie', level:'5ème', figure:{ type:'paralleles', angles:[{pos:2,label:'64°',c:C.or},{pos:4,label:'64°',c:C.or}] },
  intro:"Deux rues parallèles traversées par une avenue en biais forment huit angles… et on n'en mesure qu'un seul pour connaître les sept autres. Ce livre apprend à repérer les paires d'angles (opposés, complémentaires, supplémentaires, alternes-internes, correspondants) et à s'en servir dans les deux sens : calculer un angle, ou prouver que deux droites sont parallèles.",
  competences:[

    { nom:'Angles opposés par le sommet', classe:'5ème', pages:[
      { titre:'Deux droites qui se croisent', texte:["Deux droites sécantes forment quatre angles autour de leur point d'intersection. Deux angles face à face, qui n'ont en commun que leur sommet, sont opposés par le sommet : comme les deux lames d'une paire de ciseaux.","Ils ont TOUJOURS la même mesure. Pourquoi ? Chacun est le supplémentaire du même angle voisin : si l'angle voisin vaut 145°, les deux valent 180 − 145 = 35°.","Deux angles voisins, qui partagent un côté et forment ensemble un angle plat, sont supplémentaires : leur somme est 180°."],
        figure:{ type:'paralleles', angles:[{pos:0,label:'35°',c:C.or},{pos:2,label:'35°',c:C.or},{pos:1,label:'145°',c:C.bleu},{pos:3,label:'145°',c:C.bleu}] },
        encart:{ type:'retenir', lignes:["Opposés par le sommet : égaux. Voisins (adjacents sur une droite) : supplémentaires."] } },
      { titre:'Un angle donne les trois autres', texte:["Un angle mesure 35°. Son opposé mesure 35°. Ses deux voisins mesurent 180 − 35 = 145° chacun (et sont opposés entre eux).","Vérification : 35 + 145 + 35 + 145 = 360°, le tour complet. C'est toujours vrai autour d'un point.","Sur une figure, on repère d'abord les paires opposées (face à face), puis les paires voisines (côte à côte)."],
        figure:{ type:'tableau', lignes:[['angle','35°'],['opposé','35°'],['voisins','145° et 145°'],['total','360°']] },
        encart:{ type:'piege', lignes:["Deux angles côte à côte de même sommet sont opposés par le sommet  ✗","Ils sont adjacents et supplémentaires ; les opposés sont face à face  ✓"] } },
      { titre:'À toi', texte:["Deux droites se coupent en O. L'un des angles mesure 112°.","1. Que valent les trois autres ?","2. L'un des angles vaut le triple de son voisin : que valent-ils ?"],
        figure:{ type:'paralleles', angles:[{pos:1,label:'112°',c:C.bleu}] },
        encart:{ type:'exercice', titre:'Indice', lignes:["Pour le 2 : voisin + triple du voisin = 180°."] } },
      { titre:'Réponse', texte:["1. Opposé : 112°. Voisins : 180 − 112 = 68° chacun.","2. Si le voisin vaut x, l'autre vaut 3x, et x + 3x = 180, donc 4x = 180, x = 45°. Les angles valent 45° et 135° (et leurs opposés pareil).","Une petite équation suffit dès que les angles sont liés par une relation."],
        figure:{ type:'paralleles', angles:[{pos:1,label:'112°',c:C.bleu},{pos:3,label:'112°',c:C.bleu},{pos:0,label:'68°',c:C.or},{pos:2,label:'68°',c:C.or}] } },
    ] },

    { nom:'Angles complémentaires et supplémentaires', classe:'5ème', pages:[
      { titre:'Ensemble, 90° ou 180°', texte:["Deux angles sont complémentaires si leur somme fait 90° : ils se complètent en un angle droit. 37° et 53°, 30° et 60°, 45° et 45°.","Deux angles sont supplémentaires si leur somme fait 180° : ensemble ils forment un angle plat. 131° et 49°, 90° et 90°.","Pour retenir : « complémentaire » a un C comme « coin » (angle droit) ; « supplémentaire » un S comme « segment » (angle plat)."],
        figure:{ type:'tableau', lignes:[['complémentaires','somme 90°','37° et 53°'],['supplémentaires','somme 180°','131° et 49°']] },
        encart:{ type:'retenir', lignes:["Complémentaire de x : 90 − x.   Supplémentaire de x : 180 − x."] } },
      { titre:'Où on les rencontre', texte:["Dans un triangle rectangle, les deux angles aigus sont complémentaires : l'angle droit prend 90°, il en reste 90° pour les deux autres.","Deux angles voisins le long d'une droite sont supplémentaires : c'est ce qui a servi pour les angles opposés par le sommet.","Dans un parallélogramme, deux angles consécutifs sont supplémentaires."],
        figure:{ type:'triangle', rect:true, angle:'C', angleLabel:'55°', cotes:{} },
        encart:{ type:'exemple', titre:'Un triangle rectangle a un angle de 35°', lignes:["l'autre angle aigu : 90 − 35 = 55°"] } },
      { titre:'À toi', texte:["1. Complémentaire de 28° ? Supplémentaire de 28° ?","2. Deux angles complémentaires : l'un est le double de l'autre. Leurs mesures ?","3. Un angle et son supplémentaire sont égaux : combien valent-ils ?"],
        figure:{ type:'tableau', lignes:[['28°','compl. ?','suppl. ?']] },
        encart:{ type:'exercice', titre:'Indice', lignes:["2 : x + 2x = 90. 3 : x + x = 180."] } },
      { titre:'Réponse', texte:["1. Complémentaire : 62°. Supplémentaire : 152°.","2. x + 2x = 90, x = 30 : les angles valent 30° et 60°.","3. 2x = 180, x = 90° : un angle droit est son propre supplémentaire."],
        figure:{ type:'tableau', lignes:[['1','62° et 152°'],['2','30° et 60°'],['3','90°']] } },
    ] },

    { nom:'Angles alternes-internes', classe:'5ème', pages:[
      { titre:'Une sécante et deux droites', texte:["Une droite (la sécante) traverse deux droites (d) et (d′). Elle forme quatre angles à chaque croisement, huit en tout.","Deux angles sont alternes-internes s'ils sont ENTRE les deux droites (internes) et de part et d'autre de la sécante (alternes). Ils forment un « Z » : chacun est dans un coin du Z.","Il y a deux paires d'angles alternes-internes sur une figure."],
        figure:{ type:'paralleles', angles:[{pos:2,label:'a',c:C.or},{pos:4,label:'b',c:C.or}] },
        encart:{ type:'retenir', lignes:["Alternes-internes = entre les droites, de chaque côté de la sécante (le Z)."] } },
      { titre:'Si les droites sont parallèles, ils sont égaux', texte:["(d) ∥ (d′). Alors deux angles alternes-internes ont la même mesure. Si l'un vaut 64°, l'autre vaut 64°.","Pourquoi ? Fais glisser le croisement du haut le long de la sécante jusqu'au croisement du bas : comme les droites sont parallèles, la figure se superpose exactement. L'angle du haut vient se poser sur son opposé par le sommet en bas, qui est égal à l'alterne-interne.","Si les droites ne sont PAS parallèles, les alternes-internes sont différents. La propriété a besoin du parallélisme."],
        figure:{ type:'paralleles', angles:[{pos:2,label:'64°',c:C.or},{pos:4,label:'64°',c:C.or}] },
        encart:{ type:'piege', lignes:["Les alternes-internes sont toujours égaux  ✗","Seulement si les droites sont parallèles  ✓"] } },
      { titre:'À toi', texte:["(d) ∥ (d′), coupées par une sécante. Un angle alterne-interne mesure 108°.","1. Que vaut l'autre angle de la paire ?","2. Que valent les deux autres angles internes ?"],
        figure:{ type:'paralleles', angles:[{pos:2,label:'108°',c:C.or}] },
        encart:{ type:'exercice', titre:'Indice', lignes:["Les deux angles internes d'un même côté de la sécante sont voisins d'un alterne-interne."] } },
      { titre:'Réponse', texte:["1. 108°, par égalité des alternes-internes (droites parallèles).","2. Les deux autres angles internes valent 180 − 108 = 72° chacun : chacun est voisin (supplémentaire) d'un angle de 108° sur sa droite.","Remarque : les deux angles internes du même côté de la sécante (108° et 72°) sont supplémentaires. C'est une autre propriété des parallèles."],
        figure:{ type:'paralleles', angles:[{pos:2,label:'108°',c:C.or},{pos:4,label:'108°',c:C.or},{pos:3,label:'72°',c:C.bleu},{pos:5,label:'72°',c:C.bleu}] } },
    ] },

    { nom:'Angles correspondants', classe:'5ème', pages:[
      { titre:'Même position, à chaque croisement', texte:["Deux angles sont correspondants s'ils sont du MÊME côté de la sécante et à la même position par rapport à leur droite : l'un « en haut à droite » du premier croisement, l'autre « en haut à droite » du second. Ils forment un « F ».","Il y a quatre paires d'angles correspondants.","Si (d) ∥ (d′), les angles correspondants sont égaux : le second croisement est une copie glissée du premier."],
        figure:{ type:'paralleles', angles:[{pos:1,label:'131°',c:C.bleu},{pos:5,label:'131°',c:C.bleu}] },
        encart:{ type:'retenir', lignes:["Correspondants = même côté de la sécante, même position (le F). Égaux si les droites sont parallèles."] } },
      { titre:'Ne pas confondre les deux', texte:["Alternes-internes : de part et d'autre de la sécante, tous les deux entre les droites (Z). Correspondants : du même côté, l'un au-dessus de sa droite et l'autre au-dessus de la sienne (F).","Avec des parallèles, les deux paires donnent des angles égaux ; mais si on se trompe de paire, on applique la propriété à des angles qui ne sont pas liés.","Truc : trace mentalement le Z ou le F sur la figure. Si les deux angles sont dans les coins de la lettre, c'est la bonne paire."],
        figure:{ type:'tableau', lignes:[['alternes-internes','Z','de part et d\'autre, entre les droites'],['correspondants','F','même côté, même position']] },
        encart:{ type:'piege', lignes:["Deux angles correspondants sont de part et d'autre de la sécante  ✗","Même côté ; ce sont les alternes-internes qui sont de part et d'autre  ✓"] } },
      { titre:'À toi', texte:["(d) ∥ (d′). Au croisement du haut, l'angle « en haut à gauche » vaut 47°.","Que vaut l'angle « en haut à gauche » du croisement du bas ? Et l'angle « en bas à droite » du croisement du bas ?"],
        figure:{ type:'paralleles', angles:[{pos:1,label:'47°',c:C.bleu}] },
        encart:{ type:'exercice', titre:'Indice', lignes:["Le premier est un correspondant ; le second est son opposé par le sommet."] } },
      { titre:'Réponse', texte:["« En haut à gauche » en bas : correspondant du 47°, donc 47°.","« En bas à droite » en bas : opposé par le sommet du précédent, donc 47° aussi.","Avec des parallèles, les huit angles n'ont que deux valeurs : 47° et 133°, en alternance."],
        figure:{ type:'paralleles', angles:[{pos:1,label:'47°',c:C.bleu},{pos:5,label:'47°',c:C.bleu},{pos:7,label:'47°',c:C.bleu}] } },

    { nom:'Déduire un angle', classe:'5ème', pages:[
      { titre:'Enchaîner les propriétés', texte:["(d) ∥ (d′). Un angle mesure 131°. Pour trouver n'importe quel autre, on enchaîne : son correspondant vaut 131° ; le supplémentaire de celui-ci vaut 49° ; l'opposé de ce dernier vaut 49°.","Chaque étape cite sa propriété : « angles correspondants avec (d) ∥ (d′) », « angles supplémentaires », « angles opposés par le sommet ». C'est la rédaction attendue.","Un seul angle suffit pour connaître les huit."],
        figure:{ type:'paralleles', angles:[{pos:1,label:'131°',c:C.bleu},{pos:5,label:'131°',c:C.bleu},{pos:4,label:'49°',c:C.or}] },
        encart:{ type:'methode', lignes:["1. Repérer l'angle connu.","2. Le propager : opposé (égal), voisin (180 −), correspondant ou alterne-interne (égal si parallèles).","3. Citer la propriété à chaque étape."] } },
      { titre:'La réciproque : prouver un parallélisme', texte:["Et si on ne sait pas si les droites sont parallèles ? On mesure deux angles alternes-internes (ou correspondants). S'ils sont ÉGAUX, alors les droites sont parallèles. C'est la réciproque.","Si deux alternes-internes valent 60° et 70°, les droites ne sont pas parallèles : avec des parallèles, ils seraient égaux.","Deux sens : parallèles ⟹ angles égaux (pour calculer) ; angles égaux ⟹ parallèles (pour prouver)."],
        figure:{ type:'tableau', lignes:[['(d) ∥ (d′)','⟹','alternes-internes égaux'],['alternes-internes égaux','⟹','(d) ∥ (d′)']] },
        encart:{ type:'piege', lignes:["Alternes-internes 60° et 70° : les droites sont parallèles  ✗","Ils devraient être égaux : pas parallèles  ✓"] } },
      { titre:'À toi', texte:["Sur une figure, une sécante coupe (d) et (d′). Au croisement avec (d), un angle vaut 55°. Au croisement avec (d′), l'angle correspondant vaut 55° aussi.","1. Que peut-on conclure ?","2. Un autre angle du croisement avec (d′) est alterne-interne avec un angle de 125° du croisement avec (d). Est-ce cohérent ?"],
        figure:{ type:'paralleles', angles:[{pos:1,label:'55°',c:C.bleu},{pos:5,label:'55°',c:C.bleu}] },
        encart:{ type:'exercice', titre:'Indice', lignes:["Sur (d), 55° et 125° sont voisins : 55 + 125 = 180."] } },
      { titre:'Réponse', texte:["1. Deux angles correspondants égaux : d'après la réciproque, (d) ∥ (d′).","2. Sur (d), le voisin de 55° vaut 125°. Son alterne-interne sur (d′) doit valoir 125° aussi, puisque les droites sont parallèles. Cohérent.","Une fois le parallélisme prouvé, toutes les propriétés des parallèles s'appliquent."],
        figure:{ type:'paralleles', angles:[{pos:1,label:'55°',c:C.bleu},{pos:5,label:'55°',c:C.bleu},{pos:2,label:'125°',c:C.or},{pos:4,label:'125°',c:C.or}] },
        encart:{ type:'retenir', lignes:["opposés : égaux · voisins : 180° · complémentaires : 90° · parallèles + sécante : alternes-internes (Z) et correspondants (F) égaux · réciproque : égaux ⟹ parallèles."] } },
    ] },
  ] };

/* ══════════════════════════════════════════════════════════════

LIVRES['Géométrie du triangle'] = { branch:'geometrie', level:'5ème', figure:{ type:'triangle', noms:['A','B','C'], cotes:{}, angle:'C' },
  intro:"Le triangle est la figure la plus solide : une charpente, un pylône, un pont sont faits de triangles, parce qu'un triangle dont on connaît les trois côtés ne peut pas se déformer. Ce livre apprend à reconnaître les triangles, à savoir s'ils existent, et à calculer leurs angles.",
  competences:[

    { nom:'Les types de triangle', classe:'5ème', pages:[
      { titre:'Trois côtés, trois angles, plusieurs familles', texte:["Un triangle a trois côtés et trois angles. Selon ce qu'on sait d'eux, on le range dans une famille.","Isocèle : deux côtés de même longueur. Le sommet commun à ces deux côtés est le sommet principal, le troisième côté est la base. Ses deux angles à la base sont égaux.","Équilatéral : trois côtés égaux, et donc trois angles égaux, de 60°. Rectangle : un angle droit. Quelconque : aucune de ces propriétés."],
        figure:{ type:'tableau', lignes:[['isocèle','2 côtés égaux','2 angles égaux'],['équilatéral','3 côtés égaux','3 angles de 60°'],['rectangle','1 angle droit',''],['quelconque','rien de spécial','']] },
        encart:{ type:'retenir', lignes:["Un équilatéral est un isocèle particulier. Un triangle peut être rectangle ET isocèle."] } },
      { titre:'Lire, puis nommer précisément', texte:["Triangle de côtés 5, 5 et 7 cm : deux côtés égaux → isocèle. Côtés 6, 6, 6 : équilatéral. Un angle droit et deux côtés de 4 cm de part et d'autre : rectangle isocèle.","On donne toujours le nom le plus précis : « équilatéral » plutôt qu'« isocèle », « rectangle isocèle » plutôt que « rectangle ».","Le codage (traits égaux, petit carré) dit la famille sans mesurer."],
        figure:{ type:'triangle', rect:true, cotes:{AB:'4 cm', CA:'4 cm'}, angle:'B', angleLabel:'45°' },
        encart:{ type:'piege', lignes:["Un triangle équilatéral n'est pas isocèle  ✗","Il l'est : il a (au moins) deux côtés égaux  ✓"] } },
      { titre:'À toi', texte:["Donne la nature précise :","1. Côtés 3 cm, 4 cm, 5 cm.","2. Deux angles de 70°.","3. Un angle de 90° et un angle de 45°.","4. Trois angles de 60°."],
        figure:{ type:'tableau', lignes:[['1','3, 4, 5'],['2','70°, 70°'],['3','90°, 45°'],['4','60°, 60°, 60°']] },
        encart:{ type:'exercice', titre:'Indice', lignes:["Pour le 1, pense à Pythagore. Pour les autres, calcule le troisième angle."] } },
      { titre:'Réponse', texte:["1. 3² + 4² = 25 = 5² : rectangle (réciproque de Pythagore). Côtés tous différents : rectangle, pas isocèle.","2. Deux angles égaux → isocèle. Le troisième vaut 180 − 140 = 40°.","3. Troisième angle : 180 − 90 − 45 = 45°. Deux angles égaux et un droit : rectangle isocèle.","4. Trois angles égaux : équilatéral."],
        figure:{ type:'tableau', lignes:[['1','rectangle'],['2','isocèle'],['3','rectangle isocèle'],['4','équilatéral']] } },
    ] },

    { nom:'Un triangle est-il constructible ?', classe:'5ème', pages:[
      { titre:'Le chemin le plus court', texte:["Pour aller de A à B, le plus court est la ligne droite. Passer par C est toujours plus long, ou au mieux aussi long (si C est sur le segment).","Donc dans un triangle, chaque côté est plus court que la somme des deux autres : AB < AC + CB. C'est l'inégalité triangulaire.","Trois longueurs ne forment un triangle que si elles respectent cette règle. Sinon, les deux petits côtés ne se rejoignent pas."],
        figure:{ type:'triangle', noms:['A','B','C'], cotes:{AB:'AB', CA:'AC', BC:'CB'} },
        encart:{ type:'retenir', lignes:["Constructible ⟺ le plus grand côté est strictement plus petit que la somme des deux autres."] } },
      { titre:'Un seul test suffit', texte:["Côtés 5, 7 et 11. Il suffit de vérifier avec le plus grand : 11 < 5 + 7 = 12 ? Oui. Constructible. (Les deux autres inégalités sont automatiquement vraies.)","Côtés 3, 4 et 8 : 8 < 3 + 4 = 7 ? Non. Pas constructible : avec 3 et 4, on n'arrive pas à couvrir 8.","Côtés 3, 4 et 7 : 7 = 3 + 4. Cas limite : les trois points sont alignés, le « triangle » est plat. On ne le compte pas comme un triangle."],
        figure:{ type:'tableau', lignes:[['5, 7, 11','11 < 12','constructible'],['3, 4, 8','8 > 7','impossible'],['3, 4, 7','7 = 7','points alignés']] },
        encart:{ type:'piege', lignes:["3, 4, 8 : constructible car 3 + 8 > 4  ✗","Il faut tester le PLUS GRAND côté : 8 > 3 + 4  ✓"] } },
      { titre:'Construire au compas', texte:["Triangle de côtés 5, 4 et 3 cm. On trace [AB] de 5 cm. Arc de cercle de centre A, rayon 4 cm. Arc de centre B, rayon 3 cm. Les deux arcs se coupent en C.","Si les arcs ne se coupent pas, c'est que l'inégalité triangulaire n'est pas respectée : les compas sont trop courts pour se rejoindre.","Un triangle est déterminé par ses trois côtés : tous les triangles 5-4-3 sont superposables. C'est ce qui rend les charpentes indéformables."],
        figure:{ type:'triangle', noms:['A','B','C'], cotes:{AB:'5 cm', CA:'4 cm', BC:'3 cm'} },
        encart:{ type:'exercice', titre:'À toi', lignes:["Peut-on construire un triangle de côtés 6, 6 et 12 ? De côtés 2, 9 et 10 ? De côtés 4,5 ; 4,5 ; 4,5 ?","Un triangle a deux côtés de 4 et 9 cm : entre quelles valeurs le troisième est-il compris ?"] } },
      { titre:'Réponse', texte:["6, 6, 12 : 12 = 6 + 6, points alignés, pas de triangle. 2, 9, 10 : 10 < 11, oui. 4,5 partout : oui (équilatéral).","Troisième côté c avec 4 et 9 : il doit être plus petit que 4 + 9 = 13, et assez grand pour que 9 < 4 + c, soit c > 5. Donc 5 < c < 13.","L'inégalité triangulaire encadre le côté inconnu dans les deux sens."],
        figure:{ type:'axe', min:0, max:14, etiq:2, points:[{x:5,label:']5',c:C.rouge},{x:13,label:'13[',c:C.rouge},{x:9,label:'c possible',c:C.vert}] } },
    ] },

    { nom:'Le triangle quelconque : somme des angles', classe:'5ème', pages:[
      { titre:'Toujours 180°', texte:["Découpe un triangle en papier, arrache ses trois coins, et pose-les côte à côte : ils forment exactement un angle plat. Dans tout triangle, la somme des trois angles vaut 180°.","Pourquoi ? Trace par le sommet C la parallèle à (AB). Les angles en A et en B se retrouvent en C comme alternes-internes, et avec l'angle en C ils remplissent l'angle plat.","C'est vrai pour tous les triangles : petits, grands, aplatis, pointus."],
        figure:{ type:'triangle', noms:['A','B','C'], cotes:{}, angle:'C' },
        encart:{ type:'retenir', lignes:["A + B + C = 180°"] } },
      { titre:'Calculer le troisième angle', texte:["A = 48° et B = 67°. C = 180 − 48 − 67 = 180 − 115 = 65°.","On additionne les deux angles connus, on soustrait de 180. Vérification : 48 + 67 + 65 = 180 ✓.","Conséquences : un triangle ne peut pas avoir deux angles droits (90 + 90 = 180, il ne resterait rien), ni deux angles obtus. Au plus un angle droit ou obtus par triangle."],
        figure:{ type:'tableau', lignes:[['A','48°'],['B','67°'],['C','180 − 115 = 65°']] },
        encart:{ type:'piege', lignes:["Un triangle peut avoir deux angles obtus  ✗","Deux obtus dépasseraient déjà 180°  ✓"] } },
      { titre:'À toi', texte:["1. A = 112° et B = 31° : que vaut C ?","2. Les angles d'un triangle valent x, 2x et 3x : trouve-les.","3. Dans un triangle, un angle vaut 40° et les deux autres sont égaux : combien valent-ils ?"],
        figure:{ type:'tableau', lignes:[['1','112°, 31°, ?'],['2','x, 2x, 3x'],['3','40°, ?, ?']] },
        encart:{ type:'exercice', titre:'Indice', lignes:["2 : x + 2x + 3x = 180. 3 : c'est un triangle isocèle."] } },
      { titre:'Réponse', texte:["1. C = 180 − 143 = 37°.","2. 6x = 180, x = 30 : angles de 30°, 60° et 90°. C'est un triangle rectangle !","3. 40 + 2y = 180, y = 70 : les deux angles valent 70° chacun."],
        figure:{ type:'tableau', lignes:[['1','37°'],['2','30°, 60°, 90°'],['3','70° et 70°']] } },
    ] },

    { nom:'Le triangle isocèle', classe:'5ème–6ème', pages:[
      { titre:'Deux côtés égaux, deux angles égaux', texte:["Dans un triangle isocèle, les angles à la base (opposés aux côtés égaux) sont égaux. Un triangle isocèle a un axe de symétrie : la médiatrice de la base, qui passe par le sommet principal. Le pliage échange les deux angles à la base.","Réciproquement, un triangle qui a deux angles égaux est isocèle.","Connaissant l'angle au sommet, on trouve les angles à la base : (180 − sommet) ÷ 2. Connaissant un angle à la base, on trouve le sommet : 180 − 2 × base."],
        figure:{ type:'triangle', noms:['A','B','S'], cotes:{CA:'| |', BC:'| |', AB:'base'}, angle:'C', angleLabel:'sommet' },
        encart:{ type:'retenir', lignes:["angles à la base = (180 − sommet) ÷ 2      sommet = 180 − 2 × base"] } },
      { titre:'Exemples', texte:["Angle au sommet 40° : angles à la base (180 − 40) ÷ 2 = 70° chacun.","Angle à la base 25° : sommet 180 − 50 = 130°. Un triangle isocèle très aplati.","Attention à identifier le bon angle : le sommet principal est celui d'où partent les deux côtés égaux ; les angles à la base sont les deux autres."],
        figure:{ type:'tableau', lignes:[['sommet','40°','130°'],['base','70° et 70°','25° et 25°']] },
        encart:{ type:'piege', lignes:["Sommet 40° : angles à la base = 180 − 40 = 140° chacun  ✗","(180 − 40) ÷ 2 = 70° chacun  ✓"] } },
      { titre:'À toi', texte:["1. ABC isocèle en A (AB = AC), angle en B = 55° : que valent les angles en C et en A ?","2. Un triangle a des angles de 50° et 80°. Est-il isocèle ? En quel sommet ?","3. Un toit forme un triangle isocèle dont l'angle au sommet vaut 110° : quelle est la pente (angle à la base) ?"],
        figure:{ type:'triangle', noms:['B','C','A'], cotes:{CA:'| |', BC:'| |'}, angle:'B', angleLabel:'55°' },
        encart:{ type:'exercice', titre:'Indice', lignes:["Isocèle en A signifie que A est le sommet principal : B et C sont à la base."] } },
      { titre:'Réponse', texte:["1. C = 55° (angle à la base, comme B). A = 180 − 110 = 70°.","2. Troisième angle : 180 − 130 = 50°. Deux angles de 50° : isocèle, au sommet de l'angle de 80° (le côté opposé à 80° est la base).","3. Pente : (180 − 110) ÷ 2 = 35°."],
        figure:{ type:'tableau', lignes:[['1','C = 55°, A = 70°'],['2','isocèle, sommet à 80°'],['3','35°']] } },
    ] },

    { nom:'Le triangle rectangle', classe:'5ème', pages:[
      { titre:'Les deux angles aigus se partagent 90°', texte:["Dans un triangle rectangle, l'angle droit vaut 90°. Comme la somme fait 180°, les deux autres angles totalisent 90° : ils sont complémentaires.","Un angle aigu de 35° : l'autre vaut 90 − 35 = 55°.","Le côté opposé à l'angle droit est l'hypoténuse, le plus long. C'est le vocabulaire de Pythagore et de la trigonométrie, qui commencent ici."],
        figure:{ type:'triangle', rect:true, hyp:true, angle:'C', angleLabel:'35°', cotes:{BC:'hypoténuse'} },
        encart:{ type:'retenir', lignes:["Rectangle en A : B + C = 90°. L'hypoténuse est [BC]."] } },
      { titre:'Rectangle isocèle et demi-équilatéral', texte:["Rectangle isocèle : les deux angles aigus sont égaux, donc 45° chacun. C'est la moitié d'un carré coupé par une diagonale.","Un triangle rectangle avec un angle de 30° a un autre angle de 60° : c'est la moitié d'un triangle équilatéral coupé par une hauteur. Son petit côté vaut la moitié de l'hypoténuse.","Ces deux triangles sont les équerres de la trousse : 45-45-90 et 30-60-90."],
        figure:{ type:'triangle', rect:true, cotes:{AB:'| |', CA:'| |'}, angle:'B', angleLabel:'45°' },
        encart:{ type:'monde', lignes:["Les deux équerres d'un étui : l'une est un demi-carré (45°), l'autre un demi-triangle équilatéral (30° et 60°)."] } },
      { titre:'À toi', texte:["1. Triangle rectangle avec un angle de 28° : que vaut l'autre angle aigu ?","2. Un triangle a des angles de 90° et 45° : sa nature précise ?","3. Dans un triangle rectangle, un angle aigu est le quadruple de l'autre : que valent-ils ?"],
        figure:{ type:'triangle', rect:true, angle:'C', angleLabel:'28°', cotes:{} },
        encart:{ type:'exercice', titre:'Indice', lignes:["3 : x + 4x = 90."] } },
      { titre:'Réponse', texte:["1. 90 − 28 = 62°.","2. Troisième angle 45° : deux angles égaux, rectangle isocèle.","3. 5x = 90, x = 18 : angles de 18° et 72°."],
        figure:{ type:'tableau', lignes:[['1','62°'],['2','rectangle isocèle'],['3','18° et 72°']] },
        encart:{ type:'retenir', lignes:["somme des angles 180° · inégalité triangulaire (tester le plus grand côté) · isocèle : angles à la base égaux · rectangle : angles aigus complémentaires."] } },
    ] },
  ] };

/* ══════════════════════════════════════════════════════════════

LIVRES['Homothéties'] = { branch:'geometrie', level:'3ème', figure:{ type:'homothetie', k:2, anim:true },
  intro:"Un projecteur qui agrandit une diapositive sur un mur, une photocopie à 50 %, un zoom sur un plan : l'homothétie agrandit ou réduit une figure depuis un point fixe, en gardant sa forme. Ce livre apprend à la construire et à prévoir son effet sur les longueurs et les aires.",
  competences:[

    { nom:"Construire l'image par une homothétie", classe:'3ème', pages:[
      { titre:'Le projecteur', texte:["Une lampe en O éclaire une petite figure ; son ombre sur le mur est une figure agrandie, de même forme. Chaque point M de la figure envoie son ombre M′ dans le prolongement du rayon [OM).","L'homothétie de centre O et de rapport k envoie M sur le point M′ de la demi-droite [OM) tel que OM′ = k × OM. Si k = 3, M′ est trois fois plus loin de O que M.","Le centre O est le seul point qui ne bouge pas."],
        figure:{ type:'homothetie', k:2, anim:true },
        encart:{ type:'retenir', lignes:["M′ ∈ [OM) et OM′ = k × OM   (pour k > 0)"] } },
      { titre:'Construire point par point', texte:["Centre O, rapport 3, OM = 2 cm. On trace la demi-droite [OM), on mesure OM, on reporte 3 × 2 = 6 cm à partir de O : c'est M′.","Pour un triangle ABC : on construit A′, B′, C′ de la même façon, puis on relie. Les côtés du triangle image sont parallèles à ceux du triangle de départ.","Sur quadrillage : si A est à 2 cases à droite et 1 en haut de O, alors A′ (rapport 3) est à 6 cases à droite et 3 en haut."],
        figure:{ type:'axe', min:0, max:7, points:[{x:0,label:'O',c:C.or},{x:2,label:'M'},{x:6,label:'M′',c:C.vert}], legende:'OM′ = 3 × OM' },
        encart:{ type:'piege', lignes:["OM′ = OM + 3  ✗","OM′ = 3 × OM : on multiplie  ✓"] } },
      { titre:'Rapport négatif', texte:["Si k < 0, M′ est de l'AUTRE côté de O, sur la droite (OM), à la distance |k| × OM. Rapport −2 : M′ est à l'opposé de M par rapport à O, deux fois plus loin. La figure est retournée (un demi-tour) et agrandie.","Rapport −1 : c'est exactement la symétrie centrale de centre O.","Rapport entre 0 et 1 : réduction. Rapport 1 : la figure ne bouge pas."],
        figure:{ type:'axe', min:-5, max:5, points:[{x:0,label:'O',c:C.or},{x:2,label:'M'},{x:-4,label:'M′ (k = −2)',c:C.rouge}] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Centre O, OA = 3 cm. Où est A′ pour k = 2 ? k = 0,5 ? k = −1 ? k = −3 ?"] } },
      { titre:'Réponse', texte:["k = 2 : sur [OA), à 6 cm de O. k = 0,5 : sur [OA), à 1,5 cm de O (réduction, entre O et A).","k = −1 : de l'autre côté de O, à 3 cm : le symétrique de A par rapport à O. k = −3 : de l'autre côté, à 9 cm.","Le signe de k dit le côté, sa valeur absolue dit combien de fois plus loin."],
        figure:{ type:'axe', min:-10, max:7, etiq:1, points:[{x:0,label:'O',c:C.or},{x:3,label:'A'},{x:6,label:'k=2',c:C.vert},{x:1.5,label:'k=0,5',c:C.vert},{x:-3,label:'k=−1',c:C.rouge},{x:-9,label:'k=−3',c:C.rouge}] } },
    ] },

    { nom:'Les propriétés', classe:'3ème', pages:[
      { titre:'Longueurs × |k|, aires × k²', texte:["Une homothétie de rapport 3 triple toutes les longueurs : un côté de 2 cm devient 6 cm, un cercle de rayon 1 devient un cercle de rayon 3.","Mais l'aire est multipliée par 3² = 9 : la figure est trois fois plus large ET trois fois plus haute. Un carré de 1 cm² devient un carré de 9 cm².","Les angles ne changent pas. Les droites deviennent des droites parallèles. L'alignement et les milieux sont conservés. La figure image a la même forme, en plus grand ou plus petit."],
        figure:{ type:'carrelage', L:3, l:3, legende:'k = 3 : 9 fois plus de cases' },
        encart:{ type:'retenir', lignes:["longueurs × |k|   ·   aires × k²   ·   angles conservés   ·   droites parallèles à leurs images"] } },
      { titre:'Retrouver le centre et le rapport', texte:["Deux figures, l'une image de l'autre par une homothétie. Où est le centre ? À l'intersection des droites (AA′), (BB′), (CC′) : tous les rayons partent de O.","Le rapport : k = OA′ ÷ OA, ou k = A′B′ ÷ AB. Positif si les figures sont du même côté de O, négatif sinon.","Si A′B′ = 6 et AB = 4, alors |k| = 1,5 : les aires sont dans un rapport 1,5² = 2,25."],
        figure:{ type:'homothetie', k:2, anim:false },
        encart:{ type:'piege', lignes:["k = 3 → l'aire est triplée  ✗","l'aire est multipliée par 9  ✓"] } },
      { titre:'À toi', texte:["1. Un triangle de périmètre 12 cm et d'aire 6 cm² subit une homothétie de rapport 2 : périmètre et aire de l'image ?","2. Même triangle, rapport −0,5 : périmètre et aire ?","3. Une carte au 1/25 000 : de quelle homothétie s'agit-il, et par combien sont divisées les aires réelles sur la carte ?"],
        figure:{ type:'tableau', lignes:[['k','P','A'],['2','?','?'],['−0,5','?','?']] },
        encart:{ type:'exercice', titre:'Indice', lignes:["Le périmètre est une longueur : × |k|. L'aire : × k² (toujours positif)."] } },
      { titre:'Réponse', texte:["1. Périmètre 24 cm, aire 6 × 4 = 24 cm².","2. Périmètre 12 × 0,5 = 6 cm, aire 6 × 0,25 = 1,5 cm². Le signe négatif retourne la figure mais ne change ni les longueurs ni l'aire.","3. Réduction de rapport 1/25 000. Les aires sont divisées par 25 000² = 625 000 000 : 1 cm² sur la carte représente 6,25 km²."],
        figure:{ type:'tableau', lignes:[['k','P','A'],['2','24 cm','24 cm²'],['−0,5','6 cm','1,5 cm²']] },
        encart:{ type:'retenir', lignes:["OM′ = k × OM · k > 1 agrandit, 0 < k < 1 réduit, k < 0 retourne · k = −1 : symétrie centrale · longueurs × |k|, aires × k²."] } },
    ] },
  ] };

LIVRES['Translation et rotation'] = { branch:'geometrie', level:'4ème', figure:{ type:'deplacement', figure:[[1,4],[3,4],[3,6],[2,6]], vecteur:[4,-1], anim:true, legende:'glissement selon un vecteur' },
  intro:"Un tiroir qu'on tire, un ascenseur qui monte : une translation. Une porte qui pivote, une aiguille de montre, une grande roue : une rotation. Deux déplacements qui ne déforment rien. Ce livre apprend à les construire et à reconnaître ce qu'ils conservent.",
  competences:[

    { nom:'La translation', classe:'4ème', pages:[
      { titre:'Faire glisser sans tourner', texte:["Pousse un livre sur la table, tout droit, sans le tourner : chaque point du livre s'est déplacé de la même distance, dans la même direction et le même sens. C'est une translation.","Ce déplacement se décrit par un VECTEUR : une flèche qui indique la direction (horizontale, verticale, oblique), le sens (vers la droite, vers le haut…) et la longueur.","Tous les points bougent selon le même vecteur : les segments [AA′], [BB′], [CC′] sont parallèles, de même longueur et de même sens."],
        figure:{ type:'deplacement', figure:[[1,4],[3,4],[3,6],[2,6]], vecteur:[4,-1], anim:true, legende:'tous les points glissent pareil' },
        encart:{ type:'retenir', lignes:["Une translation est définie par un vecteur : direction, sens, longueur."] } },
      { titre:'Construire sur quadrillage', texte:["Le vecteur va « 3 cases à droite, 1 case en bas ». L'image de A(1 ; 4) : on ajoute 3 à l'abscisse, on retire 1 à l'ordonnée → A′(4 ; 3).","Pour une figure : on déplace chaque sommet du même vecteur, puis on relie dans le même ordre. On peut aussi déplacer un seul sommet et reconstruire la figure identique à partir de lui.","Sans quadrillage : on trace par chaque point la parallèle au vecteur, et on reporte sa longueur au compas dans le bon sens."],
        figure:{ type:'deplacement', figure:[[1,3],[2,5],[4,3]], vecteur:[3,1], legende:'3 à droite, 1 en bas' },
        encart:{ type:'piege', lignes:["Une translation est définie par un centre et un angle  ✗","Par un vecteur ; centre et angle, c'est la rotation  ✓"] } },
      { titre:'À toi', texte:["Vecteur : 2 cases à gauche, 3 cases en haut.","1. Image de M(5 ; 1) ? de N(0 ; 0) ?","2. P′(3 ; 7) est l'image de P : où est P ?","3. Un segment [AB] de 4 cm : longueur de [A′B′] ?"],
        figure:{ type:'deplacement', figure:[[5,6],[7,6],[6,4]], vecteur:[-2,-3], legende:'2 à gauche, 3 en haut' },
        encart:{ type:'exercice', titre:'Indice', lignes:["Pour le 2, fais le déplacement à l'envers."] } },
      { titre:'Réponse', texte:["1. M′(3 ; 4). N′(−2 ; 3).","2. P est 2 cases à droite et 3 en bas de P′ : P(5 ; 4).","3. A′B′ = 4 cm : la translation conserve les longueurs."],
        figure:{ type:'tableau', lignes:[['M(5 ; 1)','M′(3 ; 4)'],['N(0 ; 0)','N′(−2 ; 3)'],['P(5 ; 4)','P′(3 ; 7)']] } },
    ] },

    { nom:'La rotation', classe:'4ème', pages:[
      { titre:'Pivoter autour d\'un point', texte:["Une porte pivote autour de ses gonds ; l'aiguille d'une montre autour du centre du cadran. C'est une rotation : elle est définie par un CENTRE O, un ANGLE et un SENS (horaire, comme les aiguilles, ou anti-horaire).","L'image M′ de M vérifie : OM′ = OM (M′ est sur le cercle de centre O passant par M) et l'angle MOM′ est l'angle de la rotation.","Le centre est le seul point qui ne bouge pas. Un quart de tour = 90°, un demi-tour = 180°, un tour complet ramène chaque point sur lui-même."],
        figure:{ type:'deplacement', figure:[[6,2],[8,2],[8,3],[7,4]], angle:90, centre:[5,4], anim:true, legende:'quart de tour autour de O' },
        encart:{ type:'retenir', lignes:["OM′ = OM et angle MOM′ = angle de la rotation, dans le sens indiqué."] } },
      { titre:'Construire un quart de tour', texte:["Centre O, angle 90°, sens anti-horaire. Sur quadrillage : si M est à 3 cases à droite de O et 1 en haut, alors M′ est à 1 case à gauche et 3 en haut (on tourne le déplacement d'un quart de tour : « droite » devient « haut », « haut » devient « gauche »).","Sans quadrillage : on trace le cercle de centre O passant par M, on mesure l'angle de 90° au rapporteur à partir de [OM), on marque M′ sur le cercle.","Pour une figure : on tourne chaque sommet, puis on relie."],
        figure:{ type:'deplacement', figure:[[6,3],[8,3],[8,2]], angle:90, centre:[5,4], legende:'90° anti-horaire' },
        encart:{ type:'piege', lignes:["Une rotation de 180° et une symétrie centrale sont deux choses différentes  ✗","C'est la même transformation : le demi-tour  ✓"] } },
      { titre:'À toi', texte:["Centre O à l'origine, rotation de 90° dans le sens anti-horaire.","1. Image de A(2 ; 0) ? de B(0 ; 3) ? de C(2 ; 3) ?","2. Que devient la figure après quatre quarts de tour ?","3. Quel angle de rotation transforme A(2 ; 0) en A″(−2 ; 0) ?"],
        figure:{ type:'deplacement', figure:[[5,4],[7,4],[7,1]], angle:90, centre:[5,4], legende:'O à l\'origine' },
        encart:{ type:'exercice', titre:'Indice', lignes:["Un quart de tour anti-horaire envoie (x ; y) sur (−y ; x)."] } },
      { titre:'Réponse', texte:["1. A′(0 ; 2). B′(−3 ; 0). C′(−3 ; 2).","2. Quatre quarts de tour font 360° : la figure revient exactement sur elle-même.","3. Un demi-tour, 180° : A″ est le symétrique de A par rapport à O."],
        figure:{ type:'tableau', lignes:[['A(2 ; 0)','A′(0 ; 2)'],['B(0 ; 3)','B′(−3 ; 0)'],['C(2 ; 3)','C′(−3 ; 2)']] } },
    ] },

    { nom:'Ce qui est conservé', classe:'4ème', pages:[
      { titre:'Rien ne se déforme', texte:["Translation et rotation conservent les longueurs, les angles, les aires, l'alignement, le parallélisme et les milieux : la figure image est superposable à la figure de départ, c'est la même figure posée ailleurs.","Elles conservent aussi l'orientation : une main droite reste une main droite. (Contrairement à la symétrie axiale.)","C'est pour cela qu'on parle de déplacements : la figure ne change pas, seule sa position change."],
        figure:{ type:'deplacement', figure:[[1,3],[3,3],[3,4],[2,4],[2,6],[1,6]], vecteur:[5,-1], anim:true, legende:'le L reste un L' },
        encart:{ type:'retenir', lignes:["Conservés : longueurs, angles, aires, alignement, parallélisme, orientation."] } },
      { titre:'Reconnaître la transformation', texte:["Deux figures identiques : laquelle des transformations passe de l'une à l'autre ? Trace les segments [AA′], [BB′], [CC′].","S'ils sont tous parallèles, de même longueur et de même sens : translation. S'ils ne le sont pas, cherche un centre : les médiatrices de [AA′] et [BB′] se coupent au centre de rotation.","Si la figure est retournée (orientation inversée), ce n'est ni l'une ni l'autre : c'est une symétrie axiale."],
        figure:{ type:'tableau', lignes:[['[AA′] ∥ [BB′], même longueur','translation'],['sinon, centre commun','rotation'],['figure retournée','symétrie axiale']] },
        encart:{ type:'monde', lignes:["Les frises des papiers peints et les pavages du carrelage sont construits par translations ; les rosaces et les roues par rotations."] } },
      { titre:'À toi', texte:["ABC a un périmètre de 15 cm, une aire de 9 cm² et un angle de 50° en A. A′B′C′ est son image par une rotation de 70°.","1. Périmètre, aire et angle en A′ ?","2. Un pavage est fait de triangles identiques : quelle transformation passe d'un triangle à son voisin, si les deux sont dans la même orientation et parallèles ?"],
        figure:{ type:'deplacement', figure:[[1,3],[3,3],[2,5]], vecteur:[3,0], legende:'deux triangles d\'un pavage' },
        encart:{ type:'exercice', titre:'Indice', lignes:["L'angle de rotation (70°) ne change pas les angles DE la figure."] } },
      { titre:'Réponse', texte:["1. Périmètre 15 cm, aire 9 cm², angle en A′ = 50° : tout est conservé. L'angle de 70° dit de combien la figure a tourné, pas ce qu'elle contient.","2. Une translation : même orientation, côtés parallèles, déplacement identique pour tous les points.","Translation et rotation : deux façons de déplacer une figure sans la changer."],
        figure:{ type:'tableau', lignes:[['P','15 cm'],['A','9 cm²'],['angle A′','50°'],['pavage','translation']] },
        encart:{ type:'retenir', lignes:["translation : vecteur (direction, sens, longueur) · rotation : centre, angle, sens · les deux conservent tout, orientation comprise."] } },
    ] },
  ] };

/* ══════════════════════════════════════════════════════════════

LIVRES['Volumes et solides'] = { branch:'geometrie', level:'6ème–3ème', figure:{ type:'pave', l:'L', h:'h', p:'l', anim:true },
  intro:"Combien de litres dans un aquarium, de béton dans un pilier, d'air dans un ballon ? Ce livre apprend à reconnaître les solides usuels et à calculer leur volume, avec une seule idée à retenir : aire de la base fois hauteur, divisée par trois pour les solides pointus.",
  competences:[

    { nom:'Reconnaître un solide', classe:'6ème–3ème', pages:[
      { titre:'Deux grandes familles', texte:["Les solides « droits » : deux bases parallèles et identiques, reliées par des faces verticales. Si la base est un polygone, c'est un prisme droit (le cube et le pavé droit sont des prismes à base rectangulaire). Si la base est un disque, c'est un cylindre.","Les solides « pointus » : une seule base, et un sommet. Base polygonale : pyramide. Base circulaire : cône.","À part : la boule, sans face plane ni sommet ni arête."],
        figure:{ type:'pave', l:'', h:'', p:'', anim:true },
        encart:{ type:'retenir', lignes:["Deux bases → prisme ou cylindre. Une base et une pointe → pyramide ou cône."] } },
      { titre:'Faces, arêtes, sommets', texte:["Un pavé droit a 6 faces (rectangles), 12 arêtes, 8 sommets. Un cube : pareil, avec des faces carrées.","Un prisme à base triangulaire : 5 faces (2 triangles, 3 rectangles), 9 arêtes, 6 sommets. Une pyramide à base carrée : 5 faces (1 carré, 4 triangles), 8 arêtes, 5 sommets.","Un cylindre a 2 faces planes (les disques) et une face courbe, aucun sommet. Un cône : 1 disque, une face courbe, 1 sommet."],
        figure:{ type:'tableau', lignes:[['solide','faces','arêtes','sommets'],['pavé, cube','6','12','8'],['prisme triangulaire','5','9','6'],['pyramide base carrée','5','8','5']] },
        encart:{ type:'piege', lignes:["Un cylindre a des sommets  ✗","Aucun : ses bases sont des disques  ✓"] } },
      { titre:'Le patron et la perspective', texte:["Un patron est le solide déplié à plat : les faces attachées entre elles, qu'on replie pour reconstruire le solide. Le patron d'un cube : six carrés, en croix par exemple.","En perspective cavalière, on dessine la face avant en vraie grandeur, et les arêtes qui partent vers l'arrière, obliques et raccourcies (de moitié). Les arêtes cachées sont en pointillés.","Sur un dessin en perspective, les angles droits ne paraissent pas droits et les longueurs de fuite sont réduites : on ne mesure jamais sur la perspective."],
        figure:{ type:'pave', l:'face avant', h:'', p:'fuyante', anim:false },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un solide a une base hexagonale et un sommet : nom, nombre de faces, d'arêtes, de sommets ?","Un solide a deux bases pentagonales : nom, nombre de faces ?"] } },
      { titre:'Réponse', texte:["Pyramide à base hexagonale : 7 faces (1 hexagone + 6 triangles), 12 arêtes (6 à la base + 6 vers le sommet), 7 sommets.","Prisme à base pentagonale : 7 faces (2 pentagones + 5 rectangles), 15 arêtes, 10 sommets.","Pour une base à n côtés : la pyramide a n + 1 faces, le prisme n + 2."],
        figure:{ type:'tableau', lignes:[['pyramide hexagonale','7 faces','12 arêtes','7 sommets'],['prisme pentagonal','7 faces','15 arêtes','10 sommets']] } },
    ] },

    { nom:'Volume du cube et du pavé droit', classe:'6ème', pages:[
      { titre:'Compter les petits cubes', texte:["Un pavé de 5 cm × 3 cm × 2 cm. Remplis-le de cubes de 1 cm d'arête : 5 × 3 = 15 cubes par couche, 2 couches, 30 cubes. Son volume est 30 cm³.","V = L × l × h : c'est l'aire de la base (L × l) fois la hauteur (le nombre de couches).","Pour un cube d'arête 4 : V = 4 × 4 × 4 = 4³ = 64 cm³. C'est pour cela que « 4 au cube » s'appelle ainsi."],
        figure:{ type:'pave', l:'5 cm', h:'2 cm', p:'3 cm', legende:'5 × 3 × 2 = 30 cm³', anim:true },
        encart:{ type:'retenir', lignes:["Pavé : V = L × l × h      Cube : V = c³"] } },
      { titre:'Les unités', texte:["Un volume se mesure en cm³, dm³, m³ : le petit 3 rappelle qu'on a multiplié trois longueurs. Chaque rang vaut 1 000.","Et en litres : 1 L = 1 dm³, 1 mL = 1 cm³, 1 m³ = 1 000 L. Un aquarium de 60 × 30 × 40 cm contient 72 000 cm³ = 72 L.","Toutes les longueurs dans la même unité avant de multiplier."],
        figure:{ type:'pave', l:'60 cm', h:'40 cm', p:'30 cm', legende:'72 000 cm³ = 72 L' },
        encart:{ type:'piege', lignes:["Cube d'arête 4 : V = 4 × 3 = 12 cm³  ✗","V = 4³ = 64 cm³  ✓"] } },
      { titre:'À toi', texte:["1. Une boîte de 25 cm × 15 cm × 10 cm : volume en cm³, puis en litres.","2. Un cube de 27 cm³ : son arête ?","3. Une piscine de 8 m × 4 m × 1,5 m : combien de litres ? Combien de temps pour la remplir à 20 L/min ?"],
        figure:{ type:'pave', l:'8 m', h:'1,5 m', p:'4 m' },
        encart:{ type:'exercice', titre:'Indice', lignes:["1 m³ = 1 000 L. Pour le 2, quel nombre au cube donne 27 ?"] } },
      { titre:'Réponse', texte:["1. 25 × 15 × 10 = 3 750 cm³ = 3,75 L.","2. 3³ = 27, arête 3 cm.","3. 8 × 4 × 1,5 = 48 m³ = 48 000 L. À 20 L/min : 2 400 min = 40 h."],
        figure:{ type:'tableau', lignes:[['boîte','3 750 cm³','3,75 L'],['cube','27 cm³','arête 3 cm'],['piscine','48 m³','48 000 L, 40 h']] } },
    ] },

    { nom:'Volume du prisme et du cylindre', classe:'5ème', pages:[
      { titre:'Base × hauteur, toujours', texte:["Un prisme ou un cylindre, c'est une base qu'on « empile » sur une hauteur. Le volume est l'aire de la base multipliée par la hauteur : V = B × h. Le pavé n'était qu'un cas particulier (base rectangulaire).","Prisme à base triangulaire : base = triangle, aire = b × h ÷ 2. Cylindre : base = disque, aire = π × r².","Cylindre de rayon 2 cm et de hauteur 5 cm : B = π × 4 = 4π, V = 4π × 5 = 20π ≈ 62,8 cm³."],
        figure:{ type:'cercle', r:'2 cm', legende:'base : 4π · V = 4π × 5 = 20π cm³' },
        encart:{ type:'retenir', lignes:["V = aire de la base × hauteur"] } },
      { titre:'Attention à la hauteur et au rayon', texte:["La hauteur est perpendiculaire aux bases : pour un cylindre couché (un tuyau), c'est sa longueur.","Un cylindre de DIAMÈTRE 10 cm a un rayon de 5 cm : B = 25π, pas 100π. Le diamètre est le piège le plus fréquent.","Valeur exacte avec π, puis approchée : 20π cm³ ≈ 62,8 cm³. On n'arrondit qu'à la fin."],
        figure:{ type:'tableau', lignes:[['diamètre','10 cm'],['rayon','5 cm'],['base','25π cm²']] },
        encart:{ type:'piege', lignes:["V = π × r × h  ✗","V = π × r² × h : l'aire de la base contient r²  ✓"] } },
      { titre:'À toi', texte:["1. Un prisme droit à base triangulaire (base 6 cm, hauteur du triangle 4 cm), de hauteur 10 cm : volume ?","2. Une boîte de conserve de 8 cm de diamètre et 11 cm de haut : volume, en cm³ puis en mL ?","3. Un tuyau de 20 m de long et 5 cm de rayon intérieur : combien de litres d'eau contient-il ?"],
        figure:{ type:'cercle', r:'4 cm', d:'8 cm' },
        encart:{ type:'exercice', titre:'Indice', lignes:["Pour le 3, tout en cm : 20 m = 2 000 cm."] } },
      { titre:'Réponse', texte:["1. B = 6 × 4 ÷ 2 = 12 cm². V = 12 × 10 = 120 cm³.","2. r = 4 cm. B = 16π. V = 16π × 11 = 176π ≈ 553 cm³ = 553 mL (un peu plus qu'un demi-litre).","3. B = 25π cm². V = 25π × 2 000 = 50 000π ≈ 157 080 cm³ ≈ 157 L."],
        figure:{ type:'tableau', lignes:[['prisme','120 cm³'],['conserve','176π ≈ 553 mL'],['tuyau','≈ 157 L']] } },
    ] },

    { nom:'Volume de la pyramide et du cône', classe:'4ème', pages:[
      { titre:'Le tiers du prisme', texte:["Remplis une pyramide d'eau et verse-la dans le prisme de même base et de même hauteur : il faut trois pyramides pour le remplir. Même chose pour un cône et un cylindre.","Un solide pointu vaut le TIERS du solide droit de même base et de même hauteur : V = (1/3) × B × h.","La hauteur va du sommet perpendiculairement au plan de la base. Sur un cône, ce n'est pas la longueur du bord oblique (la génératrice)."],
        figure:{ type:'jauge', k:1, n:3, anim:true, legende:'3 pyramides = 1 prisme', total:'B × h' },
        encart:{ type:'retenir', lignes:["Pyramide, cône : V = (1/3) × B × h"] } },
      { titre:'Exemples', texte:["Pyramide à base carrée de côté 6 cm, hauteur 5 cm : B = 36, V = 36 × 5 ÷ 3 = 60 cm³.","Cône de rayon 3 cm et de hauteur 4 cm : B = 9π, V = 9π × 4 ÷ 3 = 12π ≈ 37,7 cm³.","Si on connaît la génératrice (bord oblique) et le rayon, la hauteur se calcule par Pythagore : génératrice² = rayon² + hauteur². Génératrice 5, rayon 3 : hauteur 4."],
        figure:{ type:'triangle', rect:true, hyp:true, cotes:{AB:'r = 3', CA:'h = 4', BC:'g = 5'} },
        encart:{ type:'piege', lignes:["V = B × h pour un cône (comme un cylindre)  ✗","On divise par 3 pour un solide pointu  ✓"] } },
      { titre:'À toi', texte:["1. La pyramide de Khéops : base carrée de 230 m de côté, hauteur 146 m. Volume ?","2. Un cornet de glace : cône de 3 cm de rayon et 12 cm de hauteur. Volume ?","3. Un cône a un rayon de 6 cm et une génératrice de 10 cm : hauteur, puis volume ?"],
        figure:{ type:'triangle', rect:true, hyp:true, cotes:{AB:'6', CA:'?', BC:'10'} },
        encart:{ type:'exercice', titre:'Indice', lignes:["3 : h² = 10² − 6²."] } },
      { titre:'Réponse', texte:["1. B = 230² = 52 900 m². V = 52 900 × 146 ÷ 3 ≈ 2 574 000 m³ : plus de 2,5 millions de mètres cubes de pierre.","2. B = 9π. V = 9π × 12 ÷ 3 = 36π ≈ 113 cm³.","3. h = √(100 − 36) = 8 cm. V = 36π × 8 ÷ 3 = 96π ≈ 302 cm³."],
        figure:{ type:'tableau', lignes:[['Khéops','≈ 2 574 000 m³'],['cornet','36π ≈ 113 cm³'],['cône','h = 8, V = 96π']] } },
    ] },

    { nom:'Volume de la boule', classe:'3ème', pages:[
      { titre:'La formule, et le rayon au cube', texte:["Une boule de rayon r a pour volume V = (4/3) × π × r³. On ne la retrouve pas par découpage simple : on l'admet, elle a été démontrée par Archimède.","Le rayon est au CUBE : doubler le rayon multiplie le volume par 8. Une orange deux fois plus large qu'une autre contient huit fois plus de jus.","Ne pas confondre avec l'aire de la sphère (sa surface) : 4πr². Le volume a un r³ et un 4/3."],
        figure:{ type:'cercle', r:'r', legende:'V = (4/3) π r³' },
        encart:{ type:'retenir', lignes:["Boule : V = (4/3) × π × r³      Sphère (surface) : A = 4 × π × r²"] } },
      { titre:'Calculer', texte:["Boule de rayon 3 cm : r³ = 27, V = (4/3) × π × 27 = 36π ≈ 113 cm³.","Ballon de 22 cm de diamètre : r = 11 cm, r³ = 1 331, V = (4/3) × π × 1 331 ≈ 5 575 cm³ ≈ 5,6 L d'air.","Demi-boule (un igloo, un bol) : la moitié du volume. Rayon 3 : 18π."],
        figure:{ type:'tableau', lignes:[['r','3 cm','11 cm'],['r³','27','1 331'],['V','36π ≈ 113 cm³','≈ 5 575 cm³']] },
        encart:{ type:'piege', lignes:["V = 4 × π × r²  ✗ (c'est l'aire de la sphère)","V = (4/3) × π × r³  ✓"] } },
      { titre:'À toi', texte:["1. Une bille de 1 cm de rayon : volume ?","2. Un bol en demi-sphère de 6 cm de rayon : contenance en mL ?","3. La Terre a un rayon d'environ 6 370 km : volume en km³ (écriture scientifique) ?"],
        figure:{ type:'cercle', r:'6 cm', legende:'demi-boule' },
        encart:{ type:'exercice', titre:'Indice', lignes:["3 : 6 370³ ≈ 2,58 × 10¹¹."] } },
      { titre:'Réponse', texte:["1. V = (4/3)π ≈ 4,19 cm³.","2. Boule entière : (4/3) × π × 216 = 288π ; demi : 144π ≈ 452 cm³ = 452 mL.","3. V ≈ (4/3) × π × 2,58 × 10¹¹ ≈ 1,08 × 10¹² km³, environ mille milliards de kilomètres cubes."],
        figure:{ type:'tableau', lignes:[['bille','≈ 4,19 cm³'],['bol','144π ≈ 452 mL'],['Terre','≈ 1,08 × 10¹² km³']] },
        encart:{ type:'retenir', lignes:["pavé L × l × h · cube c³ · prisme et cylindre B × h · pyramide et cône (1/3) B × h · boule (4/3) π r³ · 1 L = 1 dm³."] } },
    ] },
  ] };

LIVRES['Notions de fonctions'] = { branch:'fonctions', level:'3ème', figure:{ type:'machine', etapes:['× 3','− 2'], entree:'x', legende:'f : x ↦ 3x − 2' },
  intro:"Un distributeur : on met une pièce, un objet sort. Une fonction, c'est pareil : on entre un nombre, un nombre sort, toujours le même pour la même entrée. Ce livre installe le vocabulaire (image, antécédent), la notation, et les trois façons de décrire une fonction : une formule, un tableau, une courbe.",
  competences:[

    { nom:'La notation « flèche »', classe:'3ème', pages:[
      { titre:'Une machine à nombres', texte:["Le tarif d'un parking : 3 € par heure, moins 2 € de réduction avec un ticket de cinéma. Pour x heures, on paie 3x − 2 euros. À chaque durée correspond un prix, et un seul.","On dit que le prix est une fonction de la durée. On la note f, et on écrit f : x ↦ 3x − 2 : « à x, f associe 3x − 2 ». Ou plus court : f(x) = 3x − 2.","f est le nom de la machine ; x est ce qu'on met dedans ; f(x) est ce qui sort."],
        figure:{ type:'machine', etapes:['× 3','− 2'], entree:'x', valeurs:['2','6','4'], legende:'f(2) = 4' },
        encart:{ type:'retenir', lignes:["f(x) se lit « f de x » : c'est le nombre qui sort quand on entre x. Ce n'est PAS « f fois x »."] } },
      { titre:'Lire et écrire la notation', texte:["g : x ↦ x² + 1. La formule de sortie est x² + 1 ; on écrit g(x) = x² + 1. Pour x = 2 : g(2) = 4 + 1 = 5.","h(t) = 4,9t² : la lettre d'entrée peut être t (un temps), et la fonction donne la distance de chute d'un objet après t secondes. La lettre n'a pas d'importance, c'est la règle qui compte.","f(4) = 10 se lit : « l'image de 4 par f est 10 ». On y reviendra : 10 est l'image, 4 est l'antécédent."],
        figure:{ type:'tableau', lignes:[['écriture','sens'],['f : x ↦ 3x − 2','à x, f associe 3x − 2'],['f(x) = 3x − 2','la formule de f'],['f(2) = 4','l\'image de 2 est 4']] },
        encart:{ type:'piege', lignes:["f(4) signifie f × 4  ✗","f(4) est le résultat de la machine pour l'entrée 4  ✓"] } },
      { titre:'À toi', texte:["1. Écris avec la flèche la fonction qui à un nombre associe son double augmenté de 7.","2. k : x ↦ 5 − 2x. Écris k(x) et calcule k(3).","3. Le périmètre d'un carré en fonction de son côté c : écris la fonction P."],
        figure:{ type:'machine', etapes:['× 2','+ 7'], entree:'x' },
        encart:{ type:'exercice', titre:'Indice', lignes:["Pour le 3, P(c) = … (le côté fois 4)."] } },
      { titre:'Réponse', texte:["1. f : x ↦ 2x + 7.","2. k(x) = 5 − 2x. k(3) = 5 − 6 = −1.","3. P : c ↦ 4c, ou P(c) = 4c. Beaucoup de formules de géométrie sont des fonctions : l'aire d'un disque A(r) = πr², le volume d'un cube V(a) = a³."],
        figure:{ type:'tableau', lignes:[['1','f(x) = 2x + 7'],['2','k(3) = −1'],['3','P(c) = 4c']] } },
    ] },

    { nom:'Calculer une image', classe:'3ème', pages:[
      { titre:'Remplacer, puis calculer', texte:["L'image de a par f est f(a) : ce qui sort quand on entre a. Pour la calculer, on remplace CHAQUE x de la formule par a, et on applique les priorités.","f(x) = 3x − 2. f(5) = 3 × 5 − 2 = 13. f(0) = −2. f(1/3) = 1 − 2 = −1.","Un nombre a une seule image : la machine donne toujours le même résultat pour la même entrée."],
        figure:{ type:'tableau', lignes:[['x','0','1/3','5','10'],['f(x) = 3x − 2','−2','−1','13','28']] },
        encart:{ type:'retenir', lignes:["Image de a = f(a) : on remplace x par a partout, entre parenthèses."] } },
      { titre:'Les nombres négatifs et les carrés', texte:["f(x) = 3x − 2. f(−4) = 3 × (−4) − 2 = −12 − 2 = −14. Les parenthèses autour de −4 évitent d'écrire 3 × −4, source d'erreurs.","g(x) = x² + 1. g(−3) = (−3)² + 1 = 9 + 1 = 10. Le carré d'un négatif est positif. Sans parenthèses, on écrirait −3² + 1 = −8 : faux.","h(x) = 2x² − 5x. h(−1) = 2 × 1 − 5 × (−1) = 2 + 5 = 7."],
        figure:{ type:'tableau', lignes:[['g(−3)','(−3)² + 1','10'],['h(−1)','2·1 − 5·(−1)','7']] },
        encart:{ type:'piege', lignes:["g(−3) = −9 + 1 = −8  ✗","(−3)² = 9, donc g(−3) = 10  ✓"] } },
      { titre:'À toi', texte:["f(x) = 3x − 2, g(x) = x² + 1, h(x) = 2x² − 5x.","1. Calcule f(−2), g(0,5) et h(3).","2. Calcule g(−2) et g(2). Que remarques-tu ?","3. La chute libre : d(t) = 4,9t². Distance parcourue après 3 s ?"],
        figure:{ type:'tableau', lignes:[['f(−2)','?'],['g(0,5)','?'],['h(3)','?'],['d(3)','?']] },
        encart:{ type:'exercice', titre:'Indice', lignes:["Parenthèses autour de −2, et priorité du carré."] } },
      { titre:'Réponse', texte:["1. f(−2) = −6 − 2 = −8. g(0,5) = 0,25 + 1 = 1,25. h(3) = 18 − 15 = 3.","2. g(−2) = 5 et g(2) = 5 : deux nombres différents peuvent avoir la même image. Un nombre a une image, mais une image peut venir de plusieurs nombres.","3. d(3) = 4,9 × 9 = 44,1 m. En trois secondes, un objet lâché tombe de 44 m : la hauteur d'un immeuble de 14 étages."],
        figure:{ type:'tableau', lignes:[['f(−2)','−8'],['g(0,5)','1,25'],['h(3)','3'],['d(3)','44,1 m']] } },
    ] },

    { nom:'Déterminer un antécédent', classe:'3ème', pages:[
      { titre:'Le chemin inverse', texte:["Un antécédent de b par f est un nombre x tel que f(x) = b : une entrée qui donne la sortie b. Chercher un antécédent, c'est remonter la machine.","Antécédent de 10 par f(x) = 3x − 2 : on résout 3x − 2 = 10, donc 3x = 12, x = 4. L'antécédent de 10 est 4. Vérification : f(4) = 10 ✓.","Image : on calcule. Antécédent : on résout une équation."],
        figure:{ type:'machine', etapes:['× 3','− 2'], entree:'x = ?', valeurs:['4','12','10'], legende:'on remonte de 10 à 4' },
        encart:{ type:'retenir', lignes:["Antécédent de b : résoudre f(x) = b."] } },
      { titre:'Plusieurs antécédents, ou aucun', texte:["g(x) = x² + 1. Antécédents de 10 : x² + 1 = 10, x² = 9, x = 3 ou x = −3. Deux antécédents : 3 et −3 (on l'a vu, g(−3) = g(3)).","Antécédents de 0 par g : x² + 1 = 0, x² = −1, impossible. Le nombre 0 n'a aucun antécédent par g : la machine ne sort jamais 0.","Un nombre a toujours une seule image, mais il peut avoir zéro, un ou plusieurs antécédents."],
        figure:{ type:'tableau', lignes:[['nombre','antécédents par g'],['10','3 et −3'],['1','0'],['0','aucun']] },
        encart:{ type:'piege', lignes:["Antécédent de 10 par f : je calcule f(10) = 28  ✗","Je résous f(x) = 10 : x = 4  ✓"] } },
      { titre:'À toi', texte:["f(x) = 3x − 2, g(x) = x² + 1.","1. Antécédent de −8 par f ? de 0 par f ?","2. Antécédents de 5 par g ? de 1 par g ?","3. Parking : f(x) = 3x − 2 est le prix pour x heures. Avec 13 €, combien d'heures ?"],
        figure:{ type:'tableau', lignes:[['f(x) = −8','x = ?'],['f(x) = 0','x = ?'],['g(x) = 5','x = ?']] },
        encart:{ type:'exercice', titre:'Indice', lignes:["Pour g(x) = 5 : x² = 4, deux solutions."] } },
      { titre:'Réponse', texte:["1. 3x − 2 = −8 → x = −2. 3x − 2 = 0 → x = 2/3.","2. x² + 1 = 5 → x² = 4 → x = 2 ou −2. x² + 1 = 1 → x² = 0 → x = 0 (un seul).","3. 3x − 2 = 13 → x = 5 heures. C'est un antécédent dans la vraie vie : on connaît la sortie (le prix), on cherche l'entrée (la durée)."],
        figure:{ type:'tableau', lignes:[['f(x) = −8','−2'],['f(x) = 0','2/3'],['g(x) = 5','2 et −2'],['g(x) = 1','0']] } },
    ] },

    { nom:'Lire un tableau de valeurs', classe:'3ème', pages:[
      { titre:'Trois façons de décrire une fonction', texte:["Une formule : f(x) = 3x − 2. Un tableau de valeurs : des entrées en haut, leurs images en bas. Une courbe : chaque point a pour coordonnées (x ; f(x)).","Dans le tableau, l'image de 2 se lit sous le 2 : f(2) = 4. Les antécédents de 4 se lisent au-dessus de chaque 4 : ici, 2 seulement.","Un tableau ne donne que quelques valeurs ; la formule les donne toutes."],
        figure:{ type:'tableau', lignes:[['x','−1','0','1','2','3'],['f(x)','−5','−2','1','4','7']] },
        encart:{ type:'retenir', lignes:["Image : lire en dessous. Antécédent : lire au-dessus, et prendre TOUTES les colonnes qui conviennent."] } },
      { titre:'Le tableau mystère', texte:["Un tableau donne h(1) = 4, h(2) = 1, h(3) = 4. Que dire du nombre 4 ? Il a DEUX antécédents : 1 et 3. Et 2 a une image : 1.","On ne connaît pas la formule de h, et ça n'empêche rien : un tableau définit une fonction sur les valeurs qu'il contient.","Une même sortie pour deux entrées différentes est normal (comme g(−3) = g(3)). Deux sorties pour la même entrée est impossible : ce ne serait plus une fonction."],
        figure:{ type:'tableau', lignes:[['x','1','2','3'],['h(x)','4','1','4']] },
        encart:{ type:'piege', lignes:["Une fonction peut donner deux images à un même nombre  ✗","Une seule image ; mais plusieurs antécédents possibles  ✓"] } },
      { titre:'Lire sur une courbe', texte:["Sur la courbe de f, le point d'abscisse 2 a pour ordonnée f(2). Pour lire l'image de 2 : on part de 2 sur l'axe horizontal, on monte jusqu'à la courbe, on lit à gauche sur l'axe vertical.","Pour lire les antécédents de 4 : on part de 4 sur l'axe vertical, on va horizontalement jusqu'à la courbe (elle peut être coupée plusieurs fois !), on descend à chaque fois sur l'axe horizontal.","Une lecture graphique est approximative : on lit « environ 2,5 »."],
        figure:{ type:'repere', xmin:-2, xmax:4, ymin:-6, ymax:8, droites:[{a:3,b:-2,label:'f'}], points:[{x:2,y:4,label:'(2 ; 4)'}], anim:true },
        encart:{ type:'exercice', titre:'À toi', lignes:["Tableau : x → 0, 1, 2, 3, 4 ; k(x) → 3, 0, −1, 0, 3.","Image de 2 ? Antécédents de 0 ? de 3 ? de −1 ? Le nombre 5 a-t-il un antécédent dans ce tableau ?"] } },
      { titre:'Réponse', texte:["Image de 2 : −1. Antécédents de 0 : 1 et 3. Antécédents de 3 : 0 et 4. Antécédent de −1 : 2.","5 n'apparaît pas dans la ligne du bas : pas d'antécédent dans ce tableau (peut-être ailleurs, si on connaissait la formule).","On reconnaît k(x) = (x − 2)² − 1 : une courbe en U, symétrique, d'où les paires d'antécédents."],
        figure:{ type:'tableau', lignes:[['x','0','1','2','3','4'],['k(x)','3','0','−1','0','3']] },
        encart:{ type:'retenir', lignes:["x ↦ f(x) · image = sortie, unique, on calcule · antécédent = entrée, parfois plusieurs, on résout · formule, tableau, courbe : trois descriptions de la même fonction."] } },
    ] },
  ] };

LIVRES['Fonction linéaire'] = { branch:'fonctions', level:'3ème', figure:{ type:'repere', xmin:-3, xmax:3, ymin:-4, ymax:6, droites:[{a:2,b:0,label:'y = 2x'}], points:[{x:1,y:2,label:'(1 ; 2)'}], anim:true },
  intro:"Le prix au kilo, le taux de change, la vitesse constante : la proportionnalité, vue comme une fonction. f(x) = ax : on multiplie l'entrée par un nombre fixe. Sa courbe est une droite qui passe par l'origine. Ce livre relie ce que tu sais de la proportionnalité à ce nouveau langage.",
  competences:[

    { nom:'Reconnaître une fonction linéaire', classe:'3ème', pages:[
      { titre:'La proportionnalité en fonction', texte:["Les cerises coûtent 6 € le kilo. Pour x kilos, on paie 6x euros. La fonction prix : f(x) = 6x. C'est une fonction linéaire : f(x) = a × x, avec a = 6.","Une fonction linéaire, c'est exactement une situation de proportionnalité : le coefficient a est le coefficient de proportionnalité.","Pas de terme ajouté, pas de carré, pas de x au dénominateur : juste un nombre fois x."],
        figure:{ type:'tableau', lignes:[['x (kg)','1','2','3,5'],['f(x) (€)','6','12','21']], fleche:'× 6' },
        encart:{ type:'retenir', lignes:["Linéaire ⟺ f(x) = a x ⟺ proportionnalité de coefficient a."] } },
      { titre:'Qui est linéaire, qui ne l\'est pas', texte:["f(x) = −2x : oui, a = −2 (un coefficient négatif est permis). g(x) = 3x + 1 : non, à cause du + 1 (elle est affine, chapitre suivant). h(x) = x² : non, à cause du carré. k(x) = x/4 : oui, c'est (1/4)x, a = 0,25.","Dans un tableau : f(x) ÷ x doit être constant. Sur une courbe : une droite qui passe par l'origine (0 ; 0).","Test rapide : f(0) doit valoir 0. Si ce n'est pas le cas, ce n'est pas linéaire."],
        figure:{ type:'repere', xmin:-3, xmax:3, ymin:-4, ymax:6, droites:[{a:2,b:0,label:'2x',c:C.vert},{a:2,b:1,label:'2x + 1',c:C.rouge}] },
        encart:{ type:'piege', lignes:["f(x) = 2x + 3 est linéaire car il y a 2x  ✗","Non : le + 3 la rend affine ; linéaire = a x seulement  ✓"] } },
      { titre:'À toi', texte:["Parmi ces fonctions, lesquelles sont linéaires ? Donne a.","f(x) = 7x · g(x) = 7x − 7 · h(x) = x/3 · k(x) = 3/x · m(x) = −x · n(x) = 0,5x²","Puis : le tableau x → 2, 5, 8 ; y → 5, 12,5, 20 correspond-il à une fonction linéaire ?"],
        figure:{ type:'tableau', lignes:[['x','2','5','8'],['y','5','12,5','20']] },
        encart:{ type:'exercice', titre:'Indice', lignes:["3/x n'est pas un nombre fois x. Pour le tableau, calcule y ÷ x."] } },
      { titre:'Réponse', texte:["Linéaires : f (a = 7), h (a = 1/3), m (a = −1). Pas linéaires : g (+ 7), k (x au dénominateur), n (carré).","Tableau : 5 ÷ 2 = 2,5 ; 12,5 ÷ 5 = 2,5 ; 20 ÷ 8 = 2,5. Quotient constant : linéaire, y = 2,5x.","Un tableau de proportionnalité et une fonction linéaire, c'est le même objet vu de deux côtés."],
        figure:{ type:'tableau', lignes:[['linéaires','f, h, m'],['non','g, k, n'],['tableau','y = 2,5x']] } },
    ] },

    { nom:'Image et antécédent', classe:'3ème', pages:[
      { titre:'Multiplier, ou diviser', texte:["f(x) = −2x. Image de 5 : f(5) = −2 × 5 = −10. Une multiplication.","Antécédent de 22 par f(x) = 4x : on résout 4x = 22, x = 22 ÷ 4 = 5,5. Une division.","Image : on multiplie par a. Antécédent : on divise par a."],
        figure:{ type:'machine', etapes:['× 4'], entree:'x', valeurs:['5,5','22'], legende:'antécédent de 22 : 22 ÷ 4' },
        encart:{ type:'retenir', lignes:["image de x : a × x      antécédent de y : y ÷ a"] } },
      { titre:'Sur la courbe', texte:["La droite de f(x) = 2x passe par (1 ; 2), (2 ; 4), (−1 ; −2). Chaque point a pour coordonnées (x ; 2x).","Lire l'image de 1,5 : on monte de 1,5 jusqu'à la droite, on lit 3. Lire l'antécédent de −4 : on part de −4 à gauche, on va jusqu'à la droite, on descend sur −2.","Une droite par l'origine est coupée une seule fois par chaque horizontale (sauf si a = 0) : chaque nombre a exactement un antécédent."],
        figure:{ type:'repere', xmin:-3, xmax:3, ymin:-6, ymax:6, droites:[{a:2,b:0,label:'y = 2x'}], points:[{x:1.5,y:3,label:'(1,5 ; 3)'},{x:-2,y:-4,label:'(−2 ; −4)',c:C.rouge}], anim:true },
        encart:{ type:'piege', lignes:["Antécédent de 22 par f(x) = 4x : 4 × 22 = 88  ✗","22 ÷ 4 = 5,5  ✓"] } },
      { titre:'À toi', texte:["f(x) = −2x, g(x) = 0,4x.","1. f(−3) ? g(15) ?","2. Antécédent de 9 par f ? de 1 par g ?","3. Une voiture consomme 0,06 L par km. Combien pour 350 km ? Quelle distance avec 45 L ?"],
        figure:{ type:'tableau', lignes:[['f(−3)','?'],['g(15)','?'],['f(x) = 9','x = ?'],['g(x) = 1','x = ?']] },
        encart:{ type:'exercice', titre:'Indice', lignes:["3 : c(x) = 0,06x. Une image, puis un antécédent."] } },
      { titre:'Réponse', texte:["1. f(−3) = 6. g(15) = 6.","2. −2x = 9 → x = −4,5. 0,4x = 1 → x = 2,5.","3. c(350) = 21 L. Antécédent de 45 : 45 ÷ 0,06 = 750 km."],
        figure:{ type:'tableau', lignes:[['f(−3)','6'],['g(15)','6'],['f(x) = 9','−4,5'],['g(x) = 1','2,5'],['350 km','21 L'],['45 L','750 km']] } },
    ] },

    { nom:'Déterminer le coefficient', classe:'3ème', pages:[
      { titre:'Un seul point suffit', texte:["f est linéaire et f(4) = 6. Alors 4a = 6, donc a = 6 ÷ 4 = 1,5, et f(x) = 1,5x.","Plus généralement, si on connaît un couple (x₀ ; f(x₀)) avec x₀ ≠ 0, alors a = f(x₀) ÷ x₀. C'est le coefficient de proportionnalité.","Cas très pratique : a = f(1), l'image de 1."],
        figure:{ type:'tableau', lignes:[['x','4','1','x'],['f(x)','6','1,5','1,5x']], fleche:'÷ 4' },
        encart:{ type:'retenir', lignes:["a = f(x₀) ÷ x₀ pour n'importe quel point (x₀ ≠ 0) ; en particulier a = f(1)."] } },
      { titre:'Sur la courbe : la pente', texte:["a est la pente de la droite : quand x augmente de 1, f(x) augmente de a. Pour f(x) = 2x, on monte de 2 à chaque pas vers la droite. Pour f(x) = −0,5x, on descend de 0,5.","Pour lire a sur un graphique : on prend un point de la droite aux coordonnées faciles à lire, par exemple (3 ; 6), et a = 6 ÷ 3 = 2.","a > 0 : la droite monte. a < 0 : elle descend. a = 0 : c'est l'axe horizontal."],
        figure:{ type:'repere', xmin:-3, xmax:4, ymin:-4, ymax:8, droites:[{a:2,b:0,label:'a = 2',c:C.vert},{a:-0.5,b:0,label:'a = −0,5',c:C.rouge}] },
        encart:{ type:'piege', lignes:["f(4) = 6 donc a = 4 ÷ 6  ✗","a = f(x) ÷ x = 6 ÷ 4 = 1,5  ✓"] } },
      { titre:'À toi', texte:["1. f linéaire, f(5) = −15 : expression de f ?","2. g linéaire, sa droite passe par (2 ; 7) : g(x) ?","3. h linéaire, h(3) = 2 : h(x), puis h(9) ?"],
        figure:{ type:'repere', xmin:-1, xmax:4, ymin:-1, ymax:8, droites:[{a:3.5,b:0,label:'g'}], points:[{x:2,y:7,label:'(2 ; 7)'}] },
        encart:{ type:'exercice', titre:'Indice', lignes:["a = image ÷ antécédent."] } },
      { titre:'Réponse', texte:["1. a = −15 ÷ 5 = −3, f(x) = −3x.","2. a = 7 ÷ 2 = 3,5, g(x) = 3,5x.","3. a = 2 ÷ 3, h(x) = (2/3)x, et h(9) = 6. (On aurait aussi pu dire : 9 est le triple de 3, donc h(9) est le triple de 2.)"],
        figure:{ type:'tableau', lignes:[['f','−3x'],['g','3,5x'],['h','(2/3)x, h(9) = 6']] } },
    ] },

    { nom:'Résoudre un problème', classe:'3ème', pages:[
      { titre:'Le taux de change', texte:["1 € vaut 1,10 $. Pour convertir x euros en dollars : f(x) = 1,10x. C'est une fonction linéaire de coefficient 1,10 (le taux).","50 € valent f(50) = 55 $. Et 77 $ valent combien d'euros ? Antécédent de 77 : 77 ÷ 1,10 = 70 €.","Dans l'autre sens, la fonction g(x) = x ÷ 1,10 ≈ 0,909x convertit les dollars en euros : son coefficient est l'inverse."],
        figure:{ type:'tableau', lignes:[['euros','1','50','70'],['dollars','1,10','55','77']], fleche:'× 1,10' },
        encart:{ type:'methode', lignes:["1. Identifier l'entrée x et la sortie.","2. Le coefficient a est la sortie pour une unité d'entrée.","3. Écrire f(x) = a x ; image par ×, antécédent par ÷."] } },
      { titre:'Un graphique pour comparer', texte:["Deux vendeurs de pommes : A vend à 2,50 € le kilo, B à 3 € le kilo. f(x) = 2,5x et g(x) = 3x. Les deux droites partent de l'origine ; celle de B est plus raide (pente plus grande) : plus cher à toute quantité.","Une fonction linéaire ne permet pas de « dépasser » l'autre : deux droites par l'origine ne se recoupent jamais ailleurs qu'en O. Pour comparer des tarifs qui se croisent, il faut une part fixe : c'est la fonction affine.","Réduction de 20 % : h(x) = 0,8x. Une réduction en pourcentage est aussi une fonction linéaire."],
        figure:{ type:'repere', xmin:0, xmax:5, ymin:0, ymax:16, droites:[{a:2.5,b:0,label:'A : 2,5x',c:C.vert},{a:3,b:0,label:'B : 3x',c:C.rouge}] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un robinet débite 15 L par minute.","Écris la fonction volume V(t). Combien de litres en 12 min ? Combien de temps pour 180 L ? Que représente le coefficient ?"] } },
      { titre:'Réponse', texte:["V(t) = 15t. V(12) = 180 L. Antécédent de 180 : 180 ÷ 15 = 12 min. (Coïncidence de l'énoncé : c'est le même couple.)","Le coefficient 15 est le débit : les litres qui s'ajoutent à chaque minute. La pente de la droite, c'est la vitesse de remplissage.","Vitesse, débit, prix unitaire, taux de change : tous les coefficients de proportionnalité sont des pentes de fonctions linéaires."],
        figure:{ type:'jauge', k:3, n:4, anim:true, legende:'V(t) = 15t', total:'180 L à t = 12' },
        encart:{ type:'retenir', lignes:["f(x) = a x · droite par l'origine · a = f(1) = pente · image : × a · antécédent : ÷ a · c'est la proportionnalité."] } },
    ] },
  ] };
