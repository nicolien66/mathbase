        figure:{ type:'barre', n:5, k:3, etiquettes:['32','32','32','32','32'], legende:'3/5 de 160 = 96', total:'160 pages' } },
    ] },

    /* ─────────── 3 ─────────── */
    { nom:'Écriture décimale et encadrement', classe:'6ème', pages:[
      { titre:'Une fraction est une division', texte:["3 pizzas pour 4 amis. Chacun reçoit 3/4 de pizza. Combien est-ce, en nombre ? 3 ÷ 4 = 0,75 pizza.","Une fraction a/b est le résultat de la division a ÷ b. C'est pour ça que 3/4 et 0,75 sont le même nombre, écrit de deux façons.","Valeurs à connaître par cœur : 1/2 = 0,5 · 1/4 = 0,25 · 3/4 = 0,75 · 1/5 = 0,2 · 1/10 = 0,1 · 1/100 = 0,01."],
        figure:{ type:'axe', min:0, max:1, pas:0.25, etiq:1, points:[{x:0.25,label:'1/4'},{x:0.5,label:'1/2',c:C.or},{x:0.75,label:'3/4',c:C.vert}] },
        encart:{ type:'exemple', titre:'7/8 en écriture décimale', lignes:["7 ÷ 8 = 0,875","(7 = 8 × 0 + 7 ; 70 = 8 × 8 + 6 ; 60 = 8 × 7 + 4 ; 40 = 8 × 5)"] } },
      { titre:'Les divisions qui ne s\'arrêtent pas', texte:["1/3 = 1 ÷ 3 = 0,333… Les 3 continuent sans fin. 2/7 = 0,285714285714…","Ces fractions n'ont pas d'écriture décimale exacte. Écrire 1/3 = 0,33 est une approximation, pas une égalité.","Dans un calcul, on garde alors la fraction : elle est exacte. On n'arrondit qu'à la fin, si on veut un résultat concret (des euros, des mètres)."],
        figure:{ type:'tableau', lignes:[['fraction','1/3','2/3','1/6','1/7'],['décimal','0,333…','0,666…','0,1666…','0,142857…']] },
        encart:{ type:'piege', lignes:["3/4 = 0,34 (on colle les deux chiffres)  ✗","3/4 = 3 ÷ 4 = 0,75  ✓"] } },
      { titre:'Encadrer entre deux entiers', texte:["17/5 de pizza, c'est combien de pizzas entières ? 5 parts font une pizza. 17 = 5 × 3 + 2 : trois pizzas entières et 2 parts.","17/5 = 3 + 2/5. Donc 17/5 est entre 3 et 4 : 3 < 17/5 < 4.","La partie entière est le QUOTIENT de la division euclidienne du numérateur par le dénominateur ; le reste donne la fraction qui dépasse."],
        figure:{ type:'pizza', n:5, k:2, legende:'17/5 = 3 pizzas + 2/5' },
        encart:{ type:'exemple', titre:'Encadrer 23/4', lignes:["23 = 4 × 5 + 3","23/4 = 5 + 3/4","5 < 23/4 < 6"] } },
      { titre:'À toi', texte:["Un rouleau de 50 m de fil est coupé en morceaux de 6 m.","Écris la fraction 50/6, puis encadre-la entre deux entiers. Que représentent ces deux entiers pour le fil ?"],
        figure:{ type:'barre', n:9, k:8, etiquettes:['6','6','6','6','6','6','6','6','2'], legende:'50 m en morceaux de 6 m', total:'50 m' },
        encart:{ type:'exercice', titre:'Indice', lignes:["Cherche combien de fois 6 est contenu dans 50."] } },
      { titre:'Réponse', texte:["50 = 6 × 8 + 2. Donc 50/6 = 8 + 2/6, et 8 < 50/6 < 9.","8 est le nombre de morceaux entiers de 6 m qu'on peut couper. Il reste 2 m, soit 2/6 = 1/3 de morceau.","On ne peut pas couper 9 morceaux entiers : 9 × 6 = 54 > 50."],
        figure:{ type:'tableau', lignes:[['50 ÷ 6','quotient 8','reste 2'],['50/6','8 + 2/6','≈ 8,33']] },
        encart:{ type:'retenir', lignes:["a/b = a ÷ b · si a = b × q + r, alors a/b = q + r/b, donc q < a/b < q + 1"] } },
    ] },

    /* ─────────── 4 ─────────── */
    { nom:'Fractions égales et simplification', classe:'5ème', pages:[
      { titre:'La même part, coupée plus fin', texte:["Une demi-pizza : 1/2. Coupe chaque moitié en deux : tu as 4 parts, et la demi-pizza en fait 2. C'est 2/4. La même quantité.","Coupe encore chaque part en deux : 8 parts, la demi-pizza en fait 4 : 4/8. Toujours la même quantité.","1/2 = 2/4 = 4/8 = 8/16… Multiplier le numérateur ET le dénominateur par le même nombre, c'est couper chaque part plus fin sans changer la quantité."],
        figure:{ type:'pizza', n:8, k:4, anim:true, legende:'4/8 = 2/4 = 1/2' },
        encart:{ type:'retenir', lignes:["a/b = (a × k)/(b × k)   pour tout k ≠ 0"] } },
      { titre:'Simplifier, c\'est regrouper les parts', texte:["12/18 : 12 parts sur 18. Regroupe les parts par 6 : 12 parts font 2 paquets, 18 parts font 3 paquets. 12/18 = 2/3.","Diviser le numérateur ET le dénominateur par le même nombre, c'est fusionner les parts en paquets égaux. La quantité ne bouge pas.","On ne peut plus simplifier 2/3 : 2 et 3 n'ont aucun diviseur commun. La fraction est irréductible."],
        figure:{ type:'tableau', lignes:[['num.','12','6','2'],['dén.','18','9','3']], legende:'÷ 2, puis ÷ 3' },
        encart:{ type:'methode', lignes:["1. Chercher un diviseur commun au numérateur et au dénominateur (2, 3, 5, 10… ou directement le plus grand).","2. Diviser les deux par ce nombre.","3. Recommencer jusqu'à ce qu'il n'y ait plus de diviseur commun."] } },
      { titre:'Trouver le diviseur commun', texte:["Les critères de divisibilité aident : pair → par 2 ; somme des chiffres dans la table de 3 → par 3 ; se termine par 0 ou 5 → par 5.","36/48 : les deux sont pairs → 18/24 → encore pairs → 9/12 → tous deux dans la table de 3 → 3/4.","Plus vite : 36 et 48 sont dans la table de 12. 36/48 = 3/4 directement. Le plus grand diviseur commun (PGCD) simplifie en une fois."],
        figure:{ type:'tableau', lignes:[['36/48','18/24','9/12','3/4'],['','÷ 2','÷ 2','÷ 3']] },
        encart:{ type:'piege', lignes:["12/18 = 6/9, fini  ✗","6/9 = 2/3 : on continue tant qu'il y a un diviseur commun  ✓"] } },
      { titre:'Compléter des fractions égales', texte:["2/3 = ?/12. Pour passer de 3 à 12, on a multiplié par 4. On multiplie aussi le numérateur : 2 × 4 = 8. Donc 2/3 = 8/12.","5/? = 15/24. Pour passer de 5 à 15, on multiplie par 3. Donc ? = 24 ÷ 3 = 8. Et 5/8 = 15/24.","On cherche toujours par quoi on multiplie ou divise, et on applique la même chose en haut et en bas."],
        figure:{ type:'tableau', lignes:[['2','8'],['3','12']], fleche:'× 4' },
        encart:{ type:'exercice', titre:'À toi', lignes:["Simplifie 45/60 au maximum.","Puis complète : 3/4 = ?/60."] } },
      { titre:'Réponse', texte:["45/60 : les deux se terminent par 5 ou 0 → ÷ 5 : 9/12. Puis ÷ 3 : 3/4. (Ou directement ÷ 15.)","3/4 = ?/60 : de 4 à 60, on multiplie par 15. Donc ? = 3 × 15 = 45. On retrouve 45/60 = 3/4.","Deux fractions égales décrivent la même part du même tout : c'est pour cela qu'on peut les remplacer l'une par l'autre dans un calcul."],
        figure:{ type:'barre', n:4, k:3, legende:'3/4 = 45/60' },
        encart:{ type:'monde', lignes:["Sur une recette, « 6/8 de tasse » et « 3/4 de tasse » commandent la même quantité. Simplifier rend les mesures lisibles."] } },
    ] },

    /* ─────────── 5 ─────────── */
    { nom:'Comparer des fractions', classe:'5ème', pages:[
      { titre:'Même dénominateur : on compte les parts', texte:["5/7 et 4/7 : ce sont des parts de la même taille, des septièmes. Cinq parts, c'est plus que quatre.","5/7 > 4/7. Avec le même dénominateur, on compare simplement les numérateurs.","C'est comme comparer 5 pommes et 4 pommes : même unité, on compte."],
        figure:{ type:'barre', n:7, k:5, legende:'5/7 > 4/7' } },
      { titre:'Même numérateur : c\'est l\'inverse', texte:["2/5 et 2/9 : deux parts dans les deux cas. Mais une pizza coupée en 5 a des parts plus grosses qu'une pizza coupée en 9.","Deux grosses parts > deux petites parts. Donc 2/5 > 2/9.","Plus le dénominateur est grand, plus les parts sont petites. C'est le contraire de l'intuition « 9 est plus grand que 5 »."],
        figure:{ type:'pizza', n:9, k:2, legende:'2/9 : petites parts' },
        encart:{ type:'piege', lignes:["2/9 > 2/5 car 9 > 5  ✗","2/5 > 2/9 : les cinquièmes sont plus gros  ✓"] } },
      { titre:'Ni l\'un ni l\'autre : on recoupe', texte:["3/4 et 5/6 : parts différentes, nombres de parts différents. On les écrit avec le même dénominateur.","Un dénominateur commun à 4 et 6 : 12. 3/4 = 9/12 et 5/6 = 10/12. Comme 9 < 10, on a 3/4 < 5/6.","On peut aussi comparer à un repère : 3/4 est à 1/4 du tout, 5/6 est à 1/6 du tout. Il manque moins à 5/6 : il est plus grand."],
        figure:{ type:'axe', min:0, max:1, pas:0.0833333, etiq:1, points:[{x:0.75,label:'3/4'},{x:0.8333,label:'5/6',c:C.vert}] },
        encart:{ type:'methode', lignes:["1. Même dénominateur ? compare les numérateurs.","2. Même numérateur ? le plus petit dénominateur gagne.","3. Sinon, réduis au même dénominateur, ou compare à 1/2 et à 1."] } },
      { titre:'Comparer à 1/2 et à 1', texte:["7/12 et 3/8 : plutôt que chercher un dénominateur commun (24), compare chacune à 1/2.","7/12 : la moitié de 12 est 6, et 7 > 6, donc 7/12 > 1/2. 3/8 : la moitié de 8 est 4, et 3 < 4, donc 3/8 < 1/2.","Donc 3/8 < 1/2 < 7/12, et 3/8 < 7/12. Sans aucun calcul lourd."],
        figure:{ type:'axe', min:0, max:1, pas:0.125, etiq:1, points:[{x:0.375,label:'3/8',c:C.rouge},{x:0.5,label:'1/2',c:C.or},{x:0.5833,label:'7/12',c:C.vert}] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Range dans l'ordre croissant : 2/3, 3/5, 5/6."] } },
      { titre:'Réponse', texte:["Dénominateur commun à 3, 5 et 6 : 30. 2/3 = 20/30 ; 3/5 = 18/30 ; 5/6 = 25/30.","18 < 20 < 25, donc 3/5 < 2/3 < 5/6.","Vérification par les repères : il manque 2/5 à 3/5 pour faire 1, 1/3 à 2/3, et seulement 1/6 à 5/6. Le plus proche de 1 est bien 5/6."],
        figure:{ type:'tableau', lignes:[['2/3','20/30'],['3/5','18/30'],['5/6','25/30']] } },
    ] },

    /* ─────────── 6 ─────────── */
    { nom:'Additionner et soustraire des fractions', classe:'5ème–4ème', pages:[
      { titre:'On n\'additionne que des parts de même taille', texte:["2/9 de tarte au déjeuner, 5/9 au dîner. En tout ? Des neuvièmes plus des neuvièmes : 2 + 5 = 7 parts. 2/9 + 5/9 = 7/9.","Le dénominateur ne change pas : on n'a pas recoupé la tarte, on a juste compté les parts.","Comme 2 pommes + 5 pommes = 7 pommes, et pas 7 « pommes-pommes »."],
        figure:{ type:'barre', n:9, k:7, legende:'2/9 + 5/9 = 7/9' },
        encart:{ type:'piege', lignes:["1/3 + 1/6 = 2/9  ✗ : on a additionné des tiers et des sixièmes comme si c'était la même part, ET les dénominateurs","Les dénominateurs ne s'additionnent JAMAIS  ✓"] } },
      { titre:'Des tiers et des sixièmes : on recoupe', texte:["1/3 + 1/6 : un tiers de gâteau plus un sixième. Ce ne sont pas les mêmes parts, on ne peut pas compter.","Recoupe le tiers en deux : il devient 2/6. Maintenant tout est en sixièmes : 2/6 + 1/6 = 3/6.","3/6 se simplifie : 1/2. Un tiers plus un sixième font une moitié. Vérifie sur le dessin."],
        figure:{ type:'pizza', n:6, k:3, legende:'2/6 + 1/6 = 3/6 = 1/2' },
        encart:{ type:'retenir', lignes:["Même dénominateur d'abord. Quand l'un est multiple de l'autre, on transforme seulement l'autre fraction."] } },
      { titre:'Quand aucun n\'est multiple de l\'autre', texte:["3/4 − 1/6 : ni 4 ni 6 ne divise l'autre. Il faut un nombre qui soit dans la table de 4 ET dans celle de 6.","Multiples de 4 : 4, 8, 12… Multiples de 6 : 6, 12… Le premier commun est 12.","3/4 = 9/12 (× 3) et 1/6 = 2/12 (× 2). Alors 9/12 − 2/12 = 7/12.","Le produit 4 × 6 = 24 marche toujours aussi : 18/24 − 4/24 = 14/24 = 7/12. Plus gros, mais juste."],
        figure:{ type:'tableau', lignes:[['3/4','9/12'],['1/6','2/12'],['différence','7/12']] },
        encart:{ type:'methode', lignes:["1. Chercher un dénominateur commun (le plus petit multiple commun, ou le produit).","2. Transformer chaque fraction.","3. Additionner ou soustraire les numérateurs.","4. Simplifier le résultat."] } },
      { titre:'Avec des entiers et des négatifs', texte:["2 + 3/5 : l'entier 2, c'est 10/5. Donc 10/5 + 3/5 = 13/5.","−1/2 + 3/4 : en quarts, −1/2 = −2/4. Comme −2 + 3 = 1, on obtient 1/4.","3/4 − 5/4 = −2/4 = −1/2 : une fraction peut être négative, avec les mêmes règles que les nombres relatifs sur les numérateurs."],
        figure:{ type:'axe', min:-1, max:1, pas:0.25, etiq:1, points:[{x:-0.5,label:'−1/2',c:C.rouge},{x:0.25,label:'1/4',c:C.vert}], fleche:[-0.5, 0.25, '+ 3/4'] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Une randonnée : 1/3 du chemin le matin, 1/4 l'après-midi.","Quelle fraction du chemin a été faite ? Quelle fraction reste-t-il ?"] } },
      { titre:'Réponse', texte:["1/3 + 1/4 : dénominateur commun 12. 4/12 + 3/12 = 7/12 du chemin sont faits.","Il reste 1 − 7/12 = 12/12 − 7/12 = 5/12 du chemin.","Si la randonnée fait 12 km, il reste 5/12 × 12 = 5 km. Si elle fait 24 km, il reste 10 km : la fraction est la même, la distance dépend du tout."],
        figure:{ type:'barre', n:12, k:7, legende:'7/12 faits · 5/12 restants' },
        encart:{ type:'monde', lignes:["Les musiciens additionnent des fractions à chaque mesure : une noire (1/4) + une croche (1/8) = 3/8 de mesure."] } },
    ] },

    /* ─────────── 7 ─────────── */
    { nom:'Multiplier des fractions', classe:'4ème', pages:[
      { titre:'« Les deux tiers de la moitié »', texte:["Il reste la moitié d'un gâteau. Tu en manges les 2/3. Quelle fraction du gâteau entier as-tu mangée ?","Coupe la moitié en 3 parts : chaque part est 1/6 du gâteau (une moitié coupée en 3 fait 6 parts pour le tout). Tu prends 2 parts : 2/6 = 1/3.","« 2/3 de 1/2 », c'est 2/3 × 1/2 = 2/6. Le mot « de » se traduit par ×, comme « 3/4 de 20 »."],
        figure:{ type:'carrelage', L:3, l:2, legende:'2 cases sur 6 : 1/3' },
        encart:{ type:'retenir', lignes:["a/b × c/d = (a × c)/(b × d) : numérateurs ensemble, dénominateurs ensemble. Pas besoin de même dénominateur."] } },
      { titre:'Pourquoi on multiplie les dénominateurs', texte:["Un rectangle représente le tout. Coupe-le en 3 dans un sens, en 2 dans l'autre : 3 × 2 = 6 cases égales. Chaque case vaut 1/6.","Colorie 2 colonnes sur 3 et 1 ligne sur 2 : la zone commune fait 2 × 1 = 2 cases.","Le dénominateur 6 vient du découpage croisé (3 × 2), le numérateur 2 du nombre de cases prises (2 × 1). C'est exactement la règle."],
        figure:{ type:'carrelage', L:3, l:2, anim:true, legende:'3 × 2 = 6 cases' },
        encart:{ type:'exemple', titre:'2/3 × 5/7', lignes:["2 × 5 = 10 et 3 × 7 = 21","= 10/21"] } },
      { titre:'Simplifier avant, c\'est plus malin', texte:["4/9 × 3/8. Calcul direct : 12/72, puis simplifier par 12 : 1/6. Ça marche, mais 12/72 est lourd.","Avant de multiplier, regarde en croix : 4 (en haut) et 8 (en bas) → divisés par 4, ils deviennent 1 et 2. 3 (en haut) et 9 (en bas) → divisés par 3, 1 et 3.","Il reste 1/3 × 1/2 = 1/6. On a le droit parce que multiplier des fractions, c'est un seul grand quotient : (4 × 3)/(9 × 8), qu'on peut simplifier n'importe où."],
        figure:{ type:'tableau', lignes:[['4/9 × 3/8','→','1/3 × 1/2','=','1/6']] },
        encart:{ type:'piege', lignes:["2/3 × 5/7 = 10/10 (on a mis un dénominateur commun)  ✗","2/3 × 5/7 = 10/21  ✓ : la multiplication n'a pas besoin de dénominateur commun"] } },
      { titre:'Avec un entier, avec un signe', texte:["3 × 2/5 : l'entier 3 s'écrit 3/1. 3/1 × 2/5 = 6/5. Ou : trois fois deux cinquièmes font six cinquièmes.","−3/4 × 2/5 : d'abord le signe. Signes différents → négatif. Puis 3 × 2 = 6, 4 × 5 = 20 : −6/20 = −3/10.","(−1/2) × (−4/3) : deux négatifs → positif. 4/6 = 2/3."],
        figure:{ type:'tableau', lignes:[['×','+','−'],['+','+','−'],['−','−','+']], legende:'la règle des signes s\'applique' },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un terrain de 3/4 d'hectare. On en vend les 2/5.","Quelle fraction d'hectare est vendue ? Que reste-t-il au propriétaire ?"] } },
      { titre:'Réponse', texte:["Vendu : 2/5 de 3/4 = 2/5 × 3/4 = 6/20 = 3/10 d'hectare.","Il reste 3/4 − 3/10. Dénominateur commun 20 : 15/20 − 6/20 = 9/20 d'hectare.","Vérification : 3/10 + 9/20 = 6/20 + 9/20 = 15/20 = 3/4. ✓ Le tout initial est retrouvé."],
        figure:{ type:'carrelage', L:5, l:4, legende:'6 cases vendues sur 20 = 3/10' } },
    ] },

    /* ─────────── 8 ─────────── */
    { nom:'Inverse et division', classe:'4ème', pages:[
      { titre:'L\'inverse : ce qui ramène à 1', texte:["L'inverse de 3/5 est 5/3 : 3/5 × 5/3 = 15/15 = 1. On échange le haut et le bas.","L'inverse de 4 est 1/4 (4 × 1/4 = 1). L'inverse de 1/2 est 2. L'inverse de 1 est 1. Zéro n'a pas d'inverse : rien fois 0 ne fait 1.","Ne confonds pas avec l'opposé : l'opposé de 3/5 est −3/5, il ramène à 0 par addition. L'inverse ramène à 1 par multiplication."],
        figure:{ type:'tableau', lignes:[['nombre','3/5','4','1/2','−2/7'],['inverse','5/3','1/4','2','−7/2']] },
        encart:{ type:'monde', lignes:["Vitesse et temps sont inverses : à 1/2 h par km, on fait 2 km par heure. Échelle 1/24 : la réalité est 24 fois la maquette."] } },
      { titre:'Diviser par une fraction, c\'est chercher « combien de fois »', texte:["Un sac de 5/2 kg de café (2,5 kg) est réparti en sachets de 1/4 kg. Combien de sachets ? On cherche combien de fois 1/4 est contenu dans 5/2.","Dans 1 kg, il y a 4 quarts. Dans 5/2 kg, il y en a 5/2 × 4 = 10. Dix sachets.","Diviser par 1/4 revient à multiplier par 4, l'inverse de 1/4. C'est vrai pour toute fraction : diviser par a/b, c'est multiplier par b/a."],
        figure:{ type:'barre', n:10, k:10, legende:'10 sachets de 1/4 kg', total:'5/2 kg' },
        encart:{ type:'retenir', lignes:["a/b ÷ c/d = a/b × d/c"] } },
      { titre:'Pourquoi ça marche', texte:["Diviser par 2, c'est prendre la moitié : c'est multiplier par 1/2. Diviser par 1/2, c'est chercher combien de moitiés : deux par unité, c'est multiplier par 2.","Diviser par un nombre ou multiplier par son inverse, c'est la même opération, parce que « nombre × inverse = 1 » et que diviser par 1 ne change rien.","2/3 ÷ 4/5 = 2/3 × 5/4 = 10/12 = 5/6. Simplifie en croix si tu peux avant de multiplier."],
        figure:{ type:'tableau', lignes:[['÷ 2','= × 1/2'],['÷ 1/2','= × 2'],['÷ 4/5','= × 5/4']] },
        encart:{ type:'piege', lignes:["2/3 ÷ 4/5 = 8/15 (on a multiplié tel quel)  ✗","2/3 × 5/4 = 5/6 : on multiplie par l'INVERSE  ✓"] } },
      { titre:'Les écritures à étages', texte:["(3/4) / (2/5) est une fraction dont le numérateur et le dénominateur sont eux-mêmes des fractions. La grande barre signifie « divisé par ».","(3/4) / (2/5) = 3/4 ÷ 2/5 = 3/4 × 5/2 = 15/8.","Attention à la barre principale : 3 / (4/5) = 3 × 5/4 = 15/4, mais (3/4) / 5 = 3/4 × 1/5 = 3/20."],
        figure:{ type:'tableau', lignes:[['3 / (4/5)','15/4'],['(3/4) / 5','3/20']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Une bouteille de 3/4 L sert des verres de 1/8 L.","Combien de verres pleins ?"] } },
      { titre:'Réponse', texte:["3/4 ÷ 1/8 = 3/4 × 8/1 = 24/4 = 6 verres.","Autre façon de voir : 3/4 L = 6/8 L, et chaque verre prend 1/8 L : six verres.","Le résultat d'une division par une fraction plus petite que 1 est plus GRAND que le nombre de départ : c'est normal, on compte des parts plus petites que l'unité."],
        figure:{ type:'barre', n:8, k:6, legende:'6/8 L = 6 verres de 1/8 L', total:'1 L' } },
    ] },

    /* ─────────── 9 ─────────── */
    { nom:'Priorités et parenthèses', classe:'4ème', pages:[
      { titre:'Les mêmes priorités qu\'avec les entiers', texte:["1/2 + 1/2 × 3 : la multiplication passe avant l'addition. 1/2 × 3 = 3/2. Puis 1/2 + 3/2 = 4/2 = 2.","Avec des parenthèses, on commence par elles : (1/2 + 1/4) × 4. 1/2 + 1/4 = 3/4. Puis 3/4 × 4 = 3.","Parenthèses → × et ÷ → + et −. Les fractions n'y changent rien."],
        figure:{ type:'tableau', lignes:[['1/2 + 1/2 × 3'],['1/2 + 3/2'],['= 2']] },
        encart:{ type:'piege', lignes:["1/2 + 1/2 × 3 = 1 × 3 = 3  ✗","1/2 + 3/2 = 2  ✓"] } },
      { titre:'La barre de fraction cache des parenthèses', texte:["(1 + 2)/(3 + 3) : la barre sépare un haut et un bas qu'on calcule chacun de son côté, comme s'ils étaient entre parenthèses. 3/6 = 1/2.","Dans (2 + 1/3) × 3/4, la parenthèse d'abord : 2 + 1/3 = 6/3 + 1/3 = 7/3. Puis 7/3 × 3/4 = 21/12 = 7/4.","Quand un calcul est long, écris chaque étape sur une ligne : c'est là qu'on gagne les points."],
        figure:{ type:'tableau', lignes:[['(2 + 1/3) × 3/4'],['7/3 × 3/4'],['21/12 = 7/4']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Calcule A = 3/4 − 1/2 × 1/3 et B = (3/4 − 1/2) × 1/3.","Pourquoi les résultats sont-ils différents ?"] } },
      { titre:'Réponse', texte:["A : la multiplication d'abord. 1/2 × 1/3 = 1/6. Puis 3/4 − 1/6 = 9/12 − 2/12 = 7/12.","B : la parenthèse d'abord. 3/4 − 1/2 = 1/4. Puis 1/4 × 1/3 = 1/12.","Les parenthèses changent l'ordre des opérations, donc le résultat. Dans A, on retranche un sixième ; dans B, on prend le tiers d'un quart."],
        figure:{ type:'tableau', lignes:[['A','3/4 − 1/6','7/12'],['B','1/4 × 1/3','1/12']] } },
    ] },

    { nom:'Résoudre un problème', classe:'5ème–4ème', pages:[
      { titre:'Le tout vaut 1', texte:["Dans un problème de partage, le tout (le gâteau, le trajet, le budget) vaut 1. Les fractions prises s'additionnent ; ce qui reste est le complément à 1.","Randonnée : 1/3 le matin, 1/4 l'après-midi. Fait : 1/3 + 1/4 = 7/12. Reste : 1 − 7/12 = 5/12. Sur 12 km : 5 km.","Si la question porte sur des kilomètres, on ne convertit en kilomètres qu'à la fin, quand la fraction du reste est connue."],
        figure:{ type:'barre', n:12, k:7, legende:'7/12 faits · 5/12 restants', total:'12 km' },
        encart:{ type:'methode', lignes:["1. Repérer le tout et l'écrire 1.","2. Additionner les fractions prises (même dénominateur).","3. Soustraire de 1 pour le reste.","4. Multiplier par la quantité pour la valeur concrète."] } },
      { titre:'Les brioches du goûter', texte:["Une boulangerie prépare 24 brioches. Elle en vend les 3/4 le matin, puis 1/3 du RESTE l'après-midi. Combien en reste-t-il le soir ?","Matin : 3/4 de 24 = 18 vendues. Reste : 6.","Après-midi : 1/3 de 6 = 2 vendues. Reste le soir : 4 brioches.","Le piège : « 1/3 du reste » n'est pas « 1/3 de 24 ». Chaque fraction s'applique à la quantité indiquée."],
        figure:{ type:'barre', n:24, k:18, legende:'18 le matin, puis 2 sur les 6 restantes', total:'24 brioches' },
        encart:{ type:'piege', lignes:["3/4 + 1/3 = 13/12 vendues, plus que le tout  ✗","1/3 s'applique au reste (6), pas au tout (24)  ✓"] } },
      { titre:'Le terrain partagé', texte:["Un terrain est partagé : 2/5 pour la maison, 1/4 pour le jardin, le reste pour le potager. Quelle fraction pour le potager ?","Maison + jardin : 2/5 + 1/4 = 8/20 + 5/20 = 13/20. Potager : 1 − 13/20 = 7/20.","Si le terrain fait 800 m² : potager = 7/20 × 800 = 280 m². Vérifie que les trois parts (320 + 200 + 280) refont bien 800."],
        figure:{ type:'pizza', n:20, k:13, legende:'13/20 occupés · 7/20 pour le potager' },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un sac de 5/2 kg de café. On fait des sachets de 1/4 kg, puis on donne 1/5 des sachets.","Combien de sachets restent-ils ?"] } },
      { titre:'Réponse', texte:["Nombre de sachets : 5/2 ÷ 1/4 = 5/2 × 4 = 10 sachets.","On en donne 1/5 : 10 ÷ 5 = 2 sachets. Il en reste 8.","Ce problème mélange une division par une fraction (combien de sachets) et une fraction d'une quantité (combien on donne). Repère à chaque étape laquelle des deux opérations est en jeu."],
        figure:{ type:'barre', n:10, k:8, legende:'8 sachets restants sur 10' },
        encart:{ type:'retenir', lignes:["« fraction DE » → multiplier · « combien de fois » → diviser · « le reste » → complément à 1 ou à la quantité"] } },
    ] },
  ] };

LIVRES['Nombres relatifs'] = { branch:'nombres', level:'5ème–4ème', figure:{ type:'thermometre', min:-20, max:30, valeur:-18, valeurs:[-18, 4, 22, -5], pas:10, anim:true },
  intro:"Un congélateur à −18 °C, un parking au niveau −2, un compte en banque dans le rouge : les nombres négatifs servent à tout ce qui descend sous zéro. Ce livre les fait voir sur un thermomètre, un ascenseur et un relevé de compte.",
  competences:[
    { nom:'Repérer et ranger des relatifs', classe:'5ème', pages:[
      { titre:'De part et d\'autre du zéro', texte:["Sur un thermomètre, 0 °C sépare le froid du chaud. −18 °C est en dessous, +4 °C au-dessus.","Sur une droite graduée, c'est pareil : les négatifs à gauche de 0, les positifs à droite.","−18 est plus petit que 4, et plus petit que −5 : plus on descend, plus c'est petit."],
        figure:{ type:'thermometre', min:-20, max:30, valeur:-18, valeurs:[-18, 4, 22, -5], pas:10, anim:true },

      { titre:'L\'opposé et la distance à zéro', texte:["L'opposé de +4 est −4 : même distance de zéro (4), de l'autre côté.","Cette distance à zéro s'appelle aussi la valeur absolue : |−4| = 4.","Ranger des relatifs : −7 < −3 < 0 < 2. Attention : −7 est plus petit que −3, même si 7 > 3, car −7 est plus loin de zéro vers la gauche."],

        encart:{ type:'piege', lignes:["−3 < −7 car 3 < 7  ✗","−7 < −3 : −7 est plus à gauche  ✓"] } },

    { nom:'Distance entre deux points', classe:'5ème', pages:[
      { titre:'L\'écart entre deux températures', texte:["Congélateur −18 °C, frigo +4 °C. Quel est l'écart ? Il faut monter de 18 pour arriver à 0, puis de 4 : 18 + 4 = 22 °C.","Signes contraires : on ADDITIONNE les distances à zéro.","−8 °C la nuit, −3 °C le jour : même signe. L'écart est 8 − 3 = 5 °C. On SOUSTRAIT."],
        figure:{ type:'axe', min:-20, max:10, pas:5, etiq:5, points:[{x:-18,label:'−18',c:C.bleu},{x:4,label:'+4',c:C.rouge}], fleche:[-18, 4, '22'] },
        encart:{ type:'retenir', lignes:["Signes contraires : distance = somme des distances à zéro.","Même signe : distance = différence des distances à zéro."] } },
      { titre:'Sur une droite graduée', texte:["A a pour abscisse −4,2 et B a pour abscisse 3,3.","Signes contraires : AB = 4,2 + 3,3 = 7,5.","C(−8) et D(−3), même signe : CD = 8 − 3 = 5.","Une distance est toujours positive, même entre deux négatifs."],
        figure:{ type:'axe', min:-9, max:4, etiq:1, points:[{x:-8,label:'C'},{x:-3,label:'D'},{x:3.3,label:'B',c:C.vert},{x:-4.2,label:'A',c:C.vert}], fleche:[-8, -3, 'CD = 5'] },
        encart:{ type:'piege', lignes:["CD = −8 − (−3) = −5  ✗ (une distance n'est pas négative)","CD = 5  ✓"] } },

    { nom:'Additionner et soustraire', classe:'5ème', pages:[
      { titre:'L\'ascenseur du parking', texte:["Tu es au niveau −2. L'ascenseur monte de 5 étages : −2 + 5 = +3, tu es au 3e.","Du 3e, tu descends de 7 : 3 − 7 = −4. Descendre, c'est ajouter un nombre négatif : 3 + (−7) = −4.","Même signe : on additionne les distances et on garde le signe : (−3) + (−4) = −7.","Signes différents : on soustrait, et on garde le signe du plus fort : (−7) + (+3) = −4."],
        figure:{ type:'ascenseur', min:-4, max:5, depart:-2, arrivee:3, anim:true, legende:'−2 + 5 = +3' },
        encart:{ type:'monde', lignes:["Compte en banque : +50 (salaire), −80 (courses), +20 (remboursement). Solde : 50 − 80 + 20 = −10 €. Le compte est dans le rouge."] } },
      { titre:'Soustraire, c\'est ajouter l\'opposé', texte:["(−7) − (−3) : enlever une dette de 3 à une dette de 7. Il reste une dette de 4 : −4.","Règle : soustraire un nombre, c'est ajouter son opposé. (−7) − (−3) = (−7) + (+3) = −4.","Ensuite on peut simplifier l'écriture : 5 − 8 + 2 − 4. Positifs : 5 + 2 = 7. Négatifs : 8 + 4 = 12. Résultat : 7 − 12 = −5."],

        encart:{ type:'piege', lignes:["(−7) − (−3) = −10  ✗","(−7) + (+3) = −4  ✓"] } },

    { nom:'Multiplier et diviser', classe:'4ème', pages:[
      { titre:'La règle des signes', texte:["3 × (−4) : trois dettes de 4, soit une dette de 12 : −12. Positif fois négatif donne négatif.","(−3) × (−4) : enlever trois fois une dette de 4, c'est gagner 12 : +12. Négatif fois négatif donne positif.","Même règle pour la division : (−24) ÷ 6 = −4 et (−24) ÷ (−6) = 4.","On décide d'abord du signe, puis on multiplie les distances à zéro."],
        figure:{ type:'tableau', lignes:[['×','+','−'],['+','+','−'],['−','−','+']], legende:'la règle des signes' },
        encart:{ type:'retenir', lignes:["Même signe → +      Signes différents → −"] } },
      { titre:'Une chaîne de signes', texte:["(−2) × (−3) × (−1) × 4 : compte les facteurs négatifs. Il y en a 3, un nombre impair : le résultat est négatif.","Distances : 2 × 3 × 1 × 4 = 24. Résultat : −24.","Nombre PAIR de négatifs → positif. Nombre IMPAIR → négatif."],
        figure:{ type:'tableau', lignes:[['facteurs −','0','1','2','3','4'],['signe','+','−','+','−','+']] },
        encart:{ type:'exemple', titre:'Une dette de 48 € partagée entre 4 amis', lignes:["(−48) ÷ 4 = −12","chacun doit 12 €"] } },
    ] },
    { nom:'Priorités avec des relatifs', classe:'4ème', pages:[
      { titre:'Les priorités, puis les signes', texte:["3 − 2 × (−4) : la multiplication d'abord. 2 × (−4) = −8.","3 − (−8) = 3 + 8 = 11.","Un signe − devant une parenthèse change tous les signes à l'intérieur : −(5 − 8) = −5 + 8 = 3."],
        figure:{ type:'tableau', lignes:[['3 − 2 × (−4)'],['3 − (−8)'],['3 + 8 = 11']] },
        encart:{ type:'piege', lignes:["3 − 2 × (−4) = 1 × (−4) = −4  ✗","× avant − : 3 − (−8) = 11  ✓"] } },
    ] },
    { nom:'Résoudre un problème', classe:'5ème–4ème', pages:[
      { titre:'Traduire, calculer, interpréter', texte:["Quiz : +3 par bonne réponse, −2 par mauvaise. Léa a 6 bonnes et 5 mauvaises réponses.","Score : 6 × 3 + 5 × (−2) = 18 − 10 = 8 points.","Le signe du résultat a un sens : un score de −4 serait « en dessous de zéro », une température de −5 « sous zéro », un solde de −10 « une dette »."],
        figure:{ type:'compte', mouvements:[{l:'bonnes',v:18},{l:'mauvaises',v:-10}] },

LIVRES['Proportionnalité'] = { branch:'nombres', level:'6ème–3ème', figure:{ type:'route', dTotal:180, tTotal:2, bornes:4, anim:true, periode:8, legende:'90 km/h : 180 km en 2 h' },
  intro:"Le prix au kilo, la vitesse d'une voiture, l'échelle d'une carte, la recette pour neuf personnes : quand une grandeur double, l'autre double. Ce livre montre comment reconnaître, calculer et utiliser la proportionnalité.",
  competences:[
    { nom:'Reconnaître une situation de proportionnalité', classe:'5ème', pages:[
      { titre:'Le prix des places de cinéma', texte:["2 places coûtent 16 €, 5 places coûtent 40 €. Est-ce proportionnel ?","16 ÷ 2 = 8 et 40 ÷ 5 = 8 : chaque place coûte 8 €, quel que soit le nombre de places. Oui.","Le nombre 8 est le coefficient de proportionnalité : on passe des places au prix en multipliant toujours par 8."],
        figure:{ type:'tableau', lignes:[['places','2','5','10'],['prix (€)','16','40','80']], fleche:'× 8' },
        encart:{ type:'retenir', lignes:["Proportionnel = toujours le même coefficient. Si l'une double, l'autre double ; à 0, l'autre vaut 0."] } },
      { titre:'Ce qui n\'est PAS proportionnel', texte:["Abonnement au club : 10 € plus 2 € par séance. 1 séance : 12 €. 2 séances : 14 €. 14 ÷ 2 = 7 ≠ 12. Pas proportionnel : il y a une part fixe.","L'âge et la taille : à 10 ans, 1,40 m ; à 20 ans, on ne mesure pas 2,80 m.","Un tableau où les quotients diffèrent, une courbe qui ne passe pas par l'origine : ce n'est pas de la proportionnalité."],
        figure:{ type:'repere', xmin:0, xmax:5, ymin:0, ymax:20, droites:[{a:2,b:10,label:'10 + 2x',c:C.rouge},{a:3,b:0,label:'3x',c:C.vert}] },
        encart:{ type:'piege', lignes:["« 10 € plus 2 € par séance » : proportionnel  ✗","Le quotient prix ÷ séances change : pas proportionnel  ✓"] } },
    ] },
    { nom:'Compléter un tableau de proportionnalité', classe:'6ème', pages:[
      { titre:'Trois chemins vers la même case', texte:["4 cahiers coûtent 6 €. Combien pour 10 cahiers ?","Passage à l'unité : 1 cahier coûte 6 ÷ 4 = 1,50 €. Donc 10 cahiers : 10 × 1,50 = 15 €.","Coefficient : prix ÷ cahiers = 1,5. Donc 10 × 1,5 = 15 €.","Méthode additive : 10 = 4 + 4 + 2. 6 + 6 + 3 = 15 €. (2 cahiers = la moitié de 4 → 3 €.)"],
        figure:{ type:'tableau', lignes:[['cahiers','4','1','2','10'],['prix (€)','6','1,5','3','?']], legende:'? = 15' },
        encart:{ type:'methode', lignes:["Choisis le chemin le plus simple pour les nombres donnés : revenir à 1, multiplier par le coefficient, ou additionner des colonnes."] } },
      { titre:'La recette pour 9 personnes', texte:["Pour 6 personnes, 300 g de farine. Pour 9 personnes ?","Passage à l'unité : 300 ÷ 6 = 50 g par personne. 9 × 50 = 450 g.","Autre chemin : 9 = 6 + 3, et 3 personnes c'est la moitié de 6 → 150 g. 300 + 150 = 450 g."],
        figure:{ type:'tableau', lignes:[['personnes','6','3','9'],['farine (g)','300','150','450']] },
        encart:{ type:'piege', lignes:["3 kg → 7,50 €, donc 5 kg → 7,50 + 2 = 9,50 €  ✗","1 kg → 2,50 €, donc 5 kg → 12,50 €  ✓"] } },
    ] },
    { nom:'Le produit en croix', classe:'5ème', pages:[
      { titre:'Les diagonales sont égales', texte:["Dans un tableau de proportionnalité à quatre cases, les produits en croix sont égaux : 4 × 15 = 6 × 10 = 60.","Pour trouver une case manquante : 7 → 21 et x → 33. Alors 7 × 33 = 21 × x, donc x = 231 ÷ 21 = 11.","On multiplie les deux nombres de la diagonale complète, puis on divise par le nombre restant."],
        figure:{ type:'tableau', lignes:[['7','?'],['21','33']], legende:'7 × 33 = 21 × ?  →  ? = 11' },
        encart:{ type:'piege', lignes:["4 → 10 ; 6 → x : x = 4 × 10 ÷ 6  ✗","x = 6 × 10 ÷ 4 = 15 : on croise les diagonales  ✓"] } },
    ] },
    { nom:'Échelles et agrandissements', classe:'5ème', pages:[
      { titre:'Lire une carte', texte:["Échelle 1 : 50 000 : 1 cm sur la carte représente 50 000 cm dans la réalité, soit 500 m.","Entre A et B, 3 cm sur la carte : 3 × 50 000 = 150 000 cm = 1 500 m = 1,5 km.","Dans l'autre sens, 4 km réels = 400 000 cm → 400 000 ÷ 50 000 = 8 cm sur la carte."],
        figure:{ type:'carte', echelle:'1 : 50 000', mesure:'3 cm', legende:'3 cm sur la carte = 1,5 km' },
        encart:{ type:'monde', lignes:["Plans d'architecte (1 : 100), cartes routières (1 : 200 000), maquettes (1 : 24) : l'échelle est un coefficient de proportionnalité."] } },
      { titre:'Agrandir une photo', texte:["Une photo 10 cm × 15 cm est agrandie : sa largeur passe à 30 cm.","Coefficient d'agrandissement : 30 ÷ 10 = 3. Toutes les longueurs sont multipliées par 3.","La longueur devient 15 × 3 = 45 cm. Une photo 30 × 35 serait déformée."],
        figure:{ type:'carrelage', L:3, l:2, legende:'× 3 dans les deux sens' },
        encart:{ type:'piege', lignes:["Largeur +20 cm, donc longueur +20 cm : 35 cm  ✗","On multiplie, on n'ajoute pas : 15 × 3 = 45 cm  ✓"] } },
    ] },
    { nom:'Partager selon un ratio', classe:'5ème', pages:[
      { titre:'Le ratio 2 : 5', texte:["Lina et Sam se partagent 63 € selon le ratio 2 : 5. Pour 2 parts à Lina, 5 parts à Sam.","En tout : 2 + 5 = 7 parts. Une part vaut 63 ÷ 7 = 9 €.","Lina reçoit 2 × 9 = 18 €, Sam 5 × 9 = 45 €. Vérification : 18 + 45 = 63."],
        figure:{ type:'barre', n:7, k:2, etiquettes:['L','L','S','S','S','S','S'], legende:'7 parts de 9 €', total:'63 €' },
        encart:{ type:'piege', lignes:["Lina reçoit 2/5 de 63 €  ✗","Lina reçoit 2/7 de 63 € = 18 €  ✓"] } },
    ] },
    { nom:'Vitesse, distance et durée', classe:'4ème', pages:[
      { titre:'Une voiture à 90 km/h', texte:["À vitesse constante, la distance parcourue est proportionnelle au temps. La vitesse est le coefficient : 90 km chaque heure.","En 2 h : 90 × 2 = 180 km. En 1 h 30 = 1,5 h : 90 × 1,5 = 135 km.","v = d ÷ t. Donc d = v × t et t = d ÷ v."],
        figure:{ type:'route', dTotal:180, tTotal:2, bornes:4, anim:true, periode:8, legende:'d = 90 × t' },
        encart:{ type:'retenir', lignes:["v = d ÷ t     d = v × t     t = d ÷ v"] } },
      { titre:'Le coureur régulier', texte:["Un coureur parcourt 20 km à 8 km/h. Combien de temps ? t = 20 ÷ 8 = 2,5 h.","2,5 h, ce n'est pas 2 h 50 ! 0,5 h = 30 min. Donc 2 h 30.","Vitesse moyenne sur tout un trajet : distance totale ÷ durée totale, même si la vitesse a varié en route."],
        figure:{ type:'tableau', lignes:[['distance (km)','8','20'],['temps (h)','1','2,5']] },
        encart:{ type:'piege', lignes:["2,5 h = 2 h 50  ✗","2,5 h = 2 h 30  ✓ (0,5 h = 30 min)"] } },
    ] },
    { nom:'Débit et masse volumique', classe:'3ème', pages:[
      { titre:'Un robinet, un bloc de métal', texte:["Un robinet remplit 60 L en 4 min. Le débit : 60 ÷ 4 = 15 L/min. Chaque minute, 15 litres de plus.","Un bloc d'aluminium de 540 g occupe 200 cm³. Sa masse volumique : 540 ÷ 200 = 2,7 g/cm³. Chaque cm³ pèse 2,7 g.","Débit et masse volumique sont des coefficients de proportionnalité, avec une unité composée."],
        figure:{ type:'jauge', k:3, n:4, anim:true, legende:'15 L chaque minute', total:'60 L' },
        encart:{ type:'exemple', titre:'Masse de 500 cm³ d\'aluminium', lignes:["2,7 × 500 = 1350 g"] } },
    ] },
    { nom:'Résoudre un problème', classe:'6ème–5ème', pages:[
      { titre:'Le sirop à diluer', texte:["Sur la bouteille : 1 dose de sirop pour 7 doses d'eau. Avec 5 cL de sirop, combien d'eau ?","Sirop → eau : coefficient 7. 5 × 7 = 35 cL d'eau.","Dans un problème, on commence par vérifier que la situation est proportionnelle, on organise les données dans un tableau, puis on choisit la méthode."],
        figure:{ type:'tableau', lignes:[['sirop (cL)','1','5'],['eau (cL)','7','35']], fleche:'× 7' },
        encart:{ type:'piege', lignes:["5 + 7 = 12 cL d'eau  ✗","5 × 7 = 35 cL d'eau  ✓"] } },
    ] },
  ] };

LIVRES['Pourcentages'] = { branch:'nombres', level:'6ème–3ème', figure:{ type:'barre', n:10, k:3, legende:'30 % = 30/100' },

    { nom:'Exprimer une proportion en pourcentage', classe:'5ème', pages:[
      { titre:'Une part sur cent', texte:["40 %, c'est 40 pour 100 : la fraction 40/100, le nombre 0,4.","12 élèves sur 30 portent des lunettes. Quelle proportion ? 12 ÷ 30 = 0,4 = 40/100 = 40 %.","Pour passer d'une proportion à un pourcentage : on divise la partie par le total, puis on multiplie par 100."],

      { titre:'Le jean soldé', texte:["Un jean à 60 € est soldé à −30 %. La remise : 30 % de 60 = 18 €. Nouveau prix : 60 − 18 = 42 €.","Un ticket à 1,60 € augmente de 25 %. La hausse : 25 % de 1,60 = 0,40 €. Nouveau prix : 2 €.","On calcule la variation, puis on l'enlève (baisse) ou on l'ajoute (hausse)."],

    { nom:'Résoudre un problème', classe:'4ème', pages:[
      { titre:'Le comparateur de soldes', texte:["Article A : 60 € à −30 %. Article B : 55 € à −20 %. Lequel est le moins cher ?","A : 60 × 0,7 = 42 €. B : 55 × 0,8 = 44 €. A est le moins cher.","Un pourcentage de remise plus grand ne garantit pas le prix le plus bas : ce sont les prix finaux qu'on compare."],
        figure:{ type:'batons', data:[{l:'A',v:42,c:C.vertF},{l:'B',v:44}], max:60, legende:'42 € contre 44 €' } },
    ] },
  ] };

LIVRES['Théorème de Pythagore'] = { branch:'geometrie', level:'4ème–3ème', figure:{ type:'carresPythagore', anim:true },
  intro:"Une échelle contre un mur, la diagonale d'un écran, le fil d'un mât : partout où il y a un angle droit, le théorème de Pythagore relie les trois côtés. Ce livre le montre avec des carrés, puis l'applique.",
  competences:[
    { nom:"Repérer l'hypoténuse et énoncer le théorème", classe:'4ème', pages:[
      { titre:'Le côté en face de l\'angle droit', texte:["Dans un triangle rectangle, le côté opposé à l'angle droit s'appelle l'hypoténuse. C'est le plus long des trois.","Triangle ABC rectangle en A : l'hypoténuse est [BC], le côté qui ne touche pas A.","Les deux autres côtés, [AB] et [AC], sont les côtés de l'angle droit."],
        figure:{ type:'triangle', rect:true, hyp:true, cotes:{AB:'côté de l\'angle droit', CA:'côté', BC:'hypoténuse'} },
        encart:{ type:'piege', lignes:["L'hypoténuse est le côté qui touche l'angle droit  ✗","L'hypoténuse est EN FACE de l'angle droit  ✓"] } },
      { titre:'Le théorème, vu avec des carrés', texte:["Triangle rectangle de côtés 3, 4 et 5. Construis un carré sur chaque côté.","Carré sur le côté 3 : aire 9. Carré sur le côté 4 : aire 16. Carré sur l'hypoténuse 5 : aire 25.","9 + 16 = 25 : les deux petits carrés remplissent exactement le grand.","Théorème de Pythagore : dans un triangle rectangle en A, BC² = AB² + AC²."],
        figure:{ type:'carresPythagore', anim:true },
        encart:{ type:'retenir', lignes:["hypoténuse² = côté² + côté²"] } },
    ] },
    { nom:"Calculer l'hypoténuse", classe:'4ème', pages:[
      { titre:'Le fil du mât', texte:["Un mât de 4 m est tenu par un fil fixé au sol à 3 m du pied. Quelle est la longueur du fil ?","Le mât, le sol et le fil forment un triangle rectangle. Le fil est l'hypoténuse.","fil² = 4² + 3² = 16 + 9 = 25. Donc fil = √25 = 5 m."],
        figure:{ type:'echelle', h:'4 m', d:'3 m', l:'fil = ?', anim:true },
        encart:{ type:'methode', lignes:["1. Écrire l'égalité de Pythagore avec l'hypoténuse seule d'un côté.","2. Remplacer par les longueurs connues et calculer les carrés.","3. Additionner, puis prendre la racine carrée. Arrondir si besoin."] } },
      { titre:'La diagonale de l\'écran', texte:["Un écran mesure 40 cm sur 30 cm. Sa diagonale ?","d² = 40² + 30² = 1600 + 900 = 2500. d = √2500 = 50 cm.","Souvent la racine ne tombe pas juste : 6² + 8² = 100 donne 10, mais 5² + 7² = 74 donne √74 ≈ 8,6."],
        figure:{ type:'carrelage', L:4, l:3, unite:'0 cm', legende:'diagonale = 50 cm' },
        encart:{ type:'piege', lignes:["diagonale = 40 + 30 = 70 cm  ✗","d = √(40² + 30²) = 50 cm : on additionne les CARRÉS  ✓"] } },
    ] },
    { nom:"Calculer un côté de l'angle droit", classe:'4ème–3ème', pages:[
      { titre:'Quand on connaît l\'hypoténuse', texte:["Une échelle de 13 m est posée contre un mur, son pied à 5 m du mur. À quelle hauteur touche-t-elle le mur ?","L'échelle est l'hypoténuse : 13² = 5² + h². Donc h² = 13² − 5² = 169 − 25 = 144. h = 12 m.","Pour un côté de l'angle droit, on SOUSTRAIT : c'est l'hypoténuse qui est la plus grande."],
        figure:{ type:'echelle', h:'h = ?', d:'5 m', l:'13 m', anim:true },
        encart:{ type:'piege', lignes:["h² = 13² + 5² = 194  ✗","h² = 13² − 5² = 144, h = 12  ✓"] } },
    ] },
    { nom:'Réciproque et contraposée', classe:'3ème', pages:[
      { titre:'Prouver qu\'un angle est droit', texte:["Un triangle a pour côtés 5, 12 et 13. Est-il rectangle ? On ne peut pas le mesurer : on calcule.","Le plus grand côté est 13 : 13² = 169. Les deux autres : 5² + 12² = 25 + 144 = 169.","Égalité : d'après la réciproque de Pythagore, le triangle est rectangle, en l'angle opposé au côté 13."],
        figure:{ type:'triangle', rect:true, hyp:true, cotes:{AB:'12', CA:'5', BC:'13'} },
        encart:{ type:'monde', lignes:["Les maçons vérifient un angle droit avec la corde à 13 nœuds : 3, 4 et 5 intervalles forment un triangle rectangle."] } },
      { titre:'Prouver qu\'il n\'est PAS droit', texte:["Côtés 4, 6 et 8. Plus grand côté : 8² = 64. Les autres : 4² + 6² = 16 + 36 = 52.","64 ≠ 52 : si le triangle était rectangle, l'égalité serait vraie. Elle est fausse, donc le triangle n'est pas rectangle. C'est la contraposée.","Rédaction : « Si le triangle était rectangle, on aurait 8² = 4² + 6². Or 64 ≠ 52. Donc il n'est pas rectangle. »"],
        figure:{ type:'tableau', lignes:[['8²','64'],['4² + 6²','52'],['','≠']] },
        encart:{ type:'piege', lignes:["64 ≠ 52, on ne peut rien conclure  ✗","On conclut : pas rectangle (contraposée)  ✓"] } },
    ] },
    { nom:'Résoudre un problème', classe:'3ème', pages:[
      { titre:'Trouver le triangle rectangle', texte:["Dans un problème, l'angle droit se cache : mur et sol, bords d'un écran, hauteur et base d'un cône.","Fais un schéma, nomme le triangle, marque l'angle droit, repère l'hypoténuse.","Puis : addition pour l'hypoténuse, soustraction pour un autre côté, racine carrée, unité."],
        figure:{ type:'echelle', h:'mur', d:'sol', l:'échelle', anim:false },
        encart:{ type:'exemple', titre:'Une tente : hauteur 1,5 m, demi-largeur 2 m', lignes:["toile² = 1,5² + 2² = 2,25 + 4 = 6,25","toile = 2,5 m"] } },
    ] },
  ] };

LIVRES['Théorème de Thalès'] = { branch:'geometrie', level:'3ème', figure:{ type:'ombres', anim:true },
  intro:"Un bâton et un arbre au soleil ont des ombres proportionnelles à leur hauteur : c'est Thalès. Deux parallèles coupées par deux sécantes créent des longueurs proportionnelles. Ce livre montre la configuration, puis l'utilise dans les deux sens.",
  competences:[
    { nom:'Triangles imbriqués', classe:'3ème', pages:[
      { titre:'L\'ombre de l\'arbre', texte:["Un bâton de 1 m fait une ombre de 1,5 m. Au même moment, un arbre fait une ombre de 9 m. Hauteur de l'arbre ?","Les rayons du soleil sont parallèles : le petit triangle (bâton, ombre) est une réduction du grand (arbre, ombre).","Hauteur / ombre est le même rapport : H / 9 = 1 / 1,5. Donc H = 9 ÷ 1,5 = 6 m."],
        figure:{ type:'ombres', anim:true },
        encart:{ type:'monde', lignes:["Thalès aurait mesuré la pyramide de Khéops ainsi, vers 600 av. J.-C., avec un bâton et son ombre."] } },
      { titre:'La configuration et les trois rapports', texte:["M sur [AB], N sur [AC], et (MN) ∥ (BC). Le triangle AMN est une réduction du triangle ABC.","Théorème de Thalès : AM/AB = AN/AC = MN/BC.","Petit côté sur grand côté, toujours en partant du sommet commun A. AM = 3, AB = 9, BC = 12 : MN/12 = 3/9, donc MN = 12 × 3 ÷ 9 = 4."],
        figure:{ type:'triangle', noms:['A','B','C'], cotes:{AB:'AB = 9', CA:'AC', BC:'BC = 12'}, fond:'rgba(130,200,230,0.08)' },
        encart:{ type:'piege', lignes:["AM/AB = MN/NC  ✗","AM/AB = MN/BC : on compare au côté entier du grand triangle  ✓"] } },
    ] },
    { nom:'Triangles opposés (le papillon)', classe:'3ème', pages:[
      { titre:'Deux triangles qui se touchent par la pointe', texte:["B, A, M alignés et C, A, N alignés, avec (BC) ∥ (MN). Les triangles ABC et AMN sont opposés par le sommet A : un papillon.","Les mêmes rapports : AM/AB = AN/AC = MN/BC.","AB = 10, AM = 8, BC = 10 : MN/10 = 8/10, donc MN = 8 cm."],
        figure:{ type:'tableau', lignes:[['AM','AN','MN'],['AB','AC','BC'],['8/10','','?/10']], legende:'MN = 8' },
        encart:{ type:'methode', lignes:["1. Vérifier l'alignement des points et le parallélisme.","2. Écrire les trois rapports en partant du sommet commun.","3. Produit en croix avec deux rapports connus."] } },
    ] },
    { nom:'La réciproque de Thalès', classe:'3ème', pages:[
      { titre:'Prouver que deux droites sont parallèles', texte:["AM = 3, AB = 9, AN = 2, AC = 6. (MN) et (BC) sont-elles parallèles ?","AM/AB = 3/9 = 1/3 et AN/AC = 2/6 = 1/3. Les rapports sont égaux.","Les points A, M, B et A, N, C sont alignés dans le même ordre. D'après la réciproque de Thalès, (MN) ∥ (BC).","Deux conditions : rapports égaux ET même ordre des points."],
        figure:{ type:'tableau', lignes:[['AM/AB','3/9','1/3'],['AN/AC','2/6','1/3']], legende:'égaux → parallèles' },
        encart:{ type:'piege', lignes:["Rapports égaux, donc parallèles (sans vérifier l'ordre des points)  ✗","Rapports égaux ET points dans le même ordre  ✓"] } },
    ] },
    { nom:'Triangles semblables', classe:'3ème', pages:[
      { titre:'Mêmes angles, côtés proportionnels', texte:["Deux triangles sont semblables quand ils ont les mêmes angles : l'un est l'agrandissement de l'autre.","Leurs côtés sont proportionnels, avec un rapport k. Si k = 2, chaque longueur double.","Mais l'aire est multipliée par k² = 4 : deux fois plus long ET deux fois plus large."],
        figure:{ type:'homothetie', k:2, anim:true },
        encart:{ type:'piege', lignes:["k = 2 → aire doublée  ✗","aire × k² = × 4  ✓"] } },
    ] },
  ] };

LIVRES['Trigonométrie'] = { branch:'geometrie', level:'4ème–3ème', figure:{ type:'rampe', montee:'1 m', avance:'10 m', angle:'x', anim:true },
  intro:"La pente d'une rampe, l'inclinaison d'une échelle, la hauteur d'une tour mesurée depuis le sol : dans un triangle rectangle, cosinus, sinus et tangente relient un angle à deux côtés.",
  competences:[
    { nom:'Repérer les côtés par rapport à un angle', classe:'4ème', pages:[
      { titre:'Opposé, adjacent, hypoténuse', texte:["Dans un triangle rectangle, l'hypoténuse ne change pas : en face de l'angle droit.","Pour un angle aigu donné, le côté OPPOSÉ est en face de lui ; le côté ADJACENT le touche, sans être l'hypoténuse.","Si on change d'angle, opposé et adjacent s'échangent."],
        figure:{ type:'triangle', rect:true, hyp:true, angle:'C', angleLabel:'angle', cotes:{AB:'opposé', CA:'adjacent', BC:'hypoténuse'} },
        encart:{ type:'piege', lignes:["L'adjacent est le côté le plus proche : l'hypoténuse  ✗","L'hypoténuse n'est jamais l'adjacent  ✓"] } },
    ] },
    { nom:'Le cosinus', classe:'4ème', pages:[
      { titre:'cos = adjacent / hypoténuse', texte:["Le cosinus d'un angle aigu est le rapport adjacent ÷ hypoténuse : un nombre entre 0 et 1, sans unité.","Hypoténuse 12, angle 60° : cos(60°) = adjacent/12. cos(60°) = 0,5, donc adjacent = 12 × 0,5 = 6.","Angle inconnu : adjacent 5, hypoténuse 10. cos(x) = 0,5. À la calculatrice, x = cos⁻¹(0,5) = 60°."],
        figure:{ type:'triangle', rect:true, hyp:true, angle:'C', angleLabel:'60°', cotes:{CA:'adjacent = 6', BC:'12'} },
        encart:{ type:'piege', lignes:["cos(x) = 0,5 donc x = 0,5°  ✗","x = cos⁻¹(0,5) = 60°  ✓"] } },
    ] },
    { nom:'Le sinus', classe:'3ème', pages:[
      { titre:'sin = opposé / hypoténuse', texte:["Le sinus est le rapport opposé ÷ hypoténuse.","Opposé 3, hypoténuse 6 : sin(x) = 0,5, donc x = sin⁻¹(0,5) = 30°.","Longueur inconnue : hypoténuse 10 et angle 30° : opposé = 10 × sin(30°) = 5."],
        figure:{ type:'triangle', rect:true, hyp:true, angle:'C', angleLabel:'30°', cotes:{AB:'opposé = 3', BC:'6'} },
        encart:{ type:'retenir', lignes:["sin = opp/hyp     cos = adj/hyp     tan = opp/adj   (SOH CAH TOA)"] } },
    ] },
    { nom:'La tangente', classe:'3ème', pages:[
      { titre:'tan = opposé / adjacent', texte:["La tangente n'utilise pas l'hypoténuse : c'est le rapport opposé ÷ adjacent. Elle peut dépasser 1.","Opposé 5, adjacent 5 : tan(x) = 1, x = 45°.","Une tour : depuis un point à 50 m du pied, on voit le sommet sous un angle de 40°. Hauteur = 50 × tan(40°) ≈ 42 m."],
        figure:{ type:'rampe', montee:'42 m', avance:'50 m', angle:'40°' },
        encart:{ type:'monde', lignes:["Les géomètres mesurent la hauteur d'un bâtiment sans y monter : une distance au sol, un angle, une tangente."] } },
    ] },
    { nom:'Résoudre un problème', classe:'3ème', pages:[
      { titre:'L\'angle de la rampe', texte:["Une rampe d'accès monte de 1 m pour 10 m au sol. Quel est son angle ?","Montée = opposé, avancée = adjacent : on n'a pas l'hypoténuse, donc tangente. tan(x) = 1/10 = 0,1.","x = tan⁻¹(0,1) ≈ 5,7°. La norme pour les fauteuils roulants est 5 % au plus, soit environ 2,9° : cette rampe est trop raide."],
        figure:{ type:'rampe', montee:'1 m', avance:'10 m', angle:'x ≈ 5,7°', anim:true },
        encart:{ type:'methode', lignes:["1. Schéma, angle droit, angle connu ou cherché.","2. Nommer les côtés par rapport à l'angle.","3. Choisir la formule qui contient les deux côtés en jeu."] } },
    ] },
  ] };

LIVRES['Équations'] = { branch:'algebre', level:'4ème–3ème', figure:{ type:'balance', g:'2x + 3', d:'7', anim:false, note:'équilibre' },
  intro:"Une équation est une balance en équilibre : ce qu'on fait d'un côté, on le fait de l'autre. Ce livre part de la balance et va jusqu'aux équations avec des x².",
  competences:[
    { nom:'Vérifier une solution', classe:'4ème', pages:[
      { titre:'Tester un nombre', texte:["2 est-il solution de −3x + 10 = 1 ? On remplace x par 2 dans chaque membre, séparément.","Gauche : −3 × 2 + 10 = 4. Droite : 1. Comme 4 ≠ 1, le nombre 2 n'est pas solution.","3 est-il solution de 4x − 5 = 7 ? Gauche : 4 × 3 − 5 = 7. Droite : 7. Égaux : 3 est solution."],
        figure:{ type:'balance', g:'−3·2 + 10 = 4', d:'1', anim:true, note:'déséquilibre : 2 n\'est pas solution' },
        encart:{ type:'piege', lignes:["On remplace x et on « résout » ce qu'on obtient  ✗","On calcule chaque membre et on compare  ✓"] } },
    ] },
    { nom:'Résoudre une équation simple', classe:'4ème', pages:[
      { titre:'La balance', texte:["2x + 3 = 7 : à gauche, deux paquets inconnus et 3 kg ; à droite, 7 kg. La balance est équilibrée.","Enlève 3 kg de chaque côté : 2x = 4. Toujours équilibrée.","Partage chaque côté en deux : x = 2. Chaque paquet pèse 2 kg.","Vérification : 2 × 2 + 3 = 7. ✓"],
        figure:{ type:'balance', g:'2x + 3', d:'7', note:'−3 de chaque côté, puis ÷ 2' },
        encart:{ type:'methode', lignes:["1. Ajouter ou soustraire le même nombre des deux côtés pour isoler le terme en x.","2. Diviser (ou multiplier) les deux côtés par le coefficient de x.","3. Vérifier."] } },
      { titre:'Dans l\'ordre inverse des priorités', texte:["3x + 5 = 20. Pour calculer 3x + 5, on multiplie puis on ajoute. Pour défaire, on retire d'abord le 5, puis on divise par 3.","3x = 15, puis x = 5.","x/4 − 2 = 1 : on ajoute 2, puis on multiplie par 4 : x = 12."],
        figure:{ type:'machine', etapes:['× 3','+ 5'], entree:'x', valeurs:['5','15','20'], legende:'on remonte la machine à l\'envers' },
        encart:{ type:'piege', lignes:["3x + 5 = 20 → x = 20 ÷ 3 + 5  ✗","3x = 15 → x = 5 : on enlève le 5 d'abord  ✓"] } },
    ] },
    { nom:'Des x des deux côtés', classe:'4ème', pages:[
      { titre:'Rassembler les x d\'un côté', texte:["5x + 2 = 2x + 14 : des inconnues des deux côtés de la balance. On enlève 2x de chaque côté : 3x + 2 = 14.","Puis on enlève 2 : 3x = 12. Puis on divise : x = 4.","Un terme qui change de côté change de signe : 5x − 2x = 14 − 2."],
        figure:{ type:'balance', g:'5x + 2', d:'2x + 14', note:'−2x de chaque côté' },
        encart:{ type:'exemple', titre:'7x − 4 = 3x + 12', lignes:["7x − 3x = 12 + 4","4x = 16","x = 4"] } },
    ] },
    { nom:'Équations avec parenthèses', classe:'4ème', pages:[
      { titre:'Développer d\'abord', texte:["2(x + 1) = 5x − 7. On développe la parenthèse : 2x + 2 = 5x − 7.","Puis on rassemble : 2 + 7 = 5x − 2x, soit 9 = 3x, donc x = 3.","3(x − 2) = 12 : on peut aussi diviser les deux côtés par 3 : x − 2 = 4, x = 6."],
        figure:{ type:'tableau', lignes:[['2(x + 1) = 5x − 7'],['2x + 2 = 5x − 7'],['9 = 3x'],['x = 3']] },
        encart:{ type:'piege', lignes:["3(x − 2) = 12 → 3x − 2 = 12  ✗","3x − 6 = 12 → x = 6  ✓"] } },
    ] },
    { nom:'Équations avec des x²', classe:'4ème–3ème', pages:[
      { titre:'Deux nombres ont le même carré', texte:["5x² = 80. On isole x² : x² = 16. Quels nombres ont pour carré 16 ? 4, mais aussi −4, car (−4)² = 16.","Deux solutions : 4 et −4. Si x² = 0, une seule : 0. Si x² = −9, aucune : un carré n'est jamais négatif.","Produit nul : (x − 3)(x + 7) = 0. Un produit est nul quand l'un des facteurs est nul : x = 3 ou x = −7."],
        figure:{ type:'axe', min:-5, max:5, etiq:1, points:[{x:-4,label:'−4',c:C.vert},{x:4,label:'4',c:C.vert}], legende:'x² = 16' },
        encart:{ type:'piege', lignes:["x² = 16 → x = 4  ✗ (il en manque une)","x = 4 ou x = −4  ✓"] } },
    ] },
  ] };

LIVRES['Bases des probabilités'] = { branch:'proba', level:'5ème–3ème', figure:{ type:'roue', anim:true, secteurs:[{label:'rouge',frac:0.5,c:C.rougeF},{label:'bleu',frac:0.3,c:C.bleuF},{label:'vert',frac:0.2,c:C.vertF}] },
  intro:"Un dé, une pièce, une urne, une roue de kermesse : le hasard se calcule. Ce livre part des expériences concrètes pour définir la probabilité, l'événement contraire et les expériences à deux épreuves.",
  competences:[
    { nom:"Les issues d'une expérience", classe:'5ème', pages:[
      { titre:'Tout ce qui peut arriver', texte:["On lance un dé. Les résultats possibles, les issues, sont 1, 2, 3, 4, 5 et 6. Cet ensemble est l'univers.","Un événement regroupe certaines issues : « obtenir un nombre pair » = {2, 4, 6}. « Obtenir un multiple de 3 » = {3, 6}.","Une issue est un résultat unique ; un événement peut en contenir plusieurs."],
        figure:{ type:'de', anim:true, legende:'6 issues possibles' },
        encart:{ type:'piege', lignes:["« Obtenir un nombre pair » est une issue  ✗","C'est un événement : il contient 3 issues  ✓"] } },
    ] },
    { nom:"L'échelle des probabilités", classe:'5ème–4ème', pages:[
      { titre:'Entre 0 et 1', texte:["Une probabilité est un nombre entre 0 et 1. 0 : impossible (obtenir 7 avec un dé). 1 : certain (obtenir moins de 7). 0,5 : une chance sur deux.","Une probabilité s'écrit en fraction (1/6), en décimal (0,17) ou en pourcentage (17 %).","La somme des probabilités de toutes les issues vaut toujours 1."],
        figure:{ type:'axe', min:0, max:1, pas:0.25, etiq:1, points:[{x:0,label:'impossible',c:C.rouge},{x:0.5,label:'1 chance sur 2',c:C.or},{x:1,label:'certain',c:C.vert}] },
        encart:{ type:'exemple', titre:'Roue : rouge 0,5, bleu 0,3, vert ?', lignes:["0,5 + 0,3 = 0,8","P(vert) = 1 − 0,8 = 0,2"] } },
    ] },
    { nom:"Calculer la probabilité d'un événement", classe:'5ème–4ème', pages:[
      { titre:'Favorables sur possibles', texte:["Quand toutes les issues ont la même chance (dé équilibré, boules identiques), P = nombre d'issues favorables ÷ nombre d'issues possibles.","Jeu de 32 cartes, tirer un as : 4 as sur 32 cartes, P = 4/32 = 1/8.","Urne avec 3 boules rouges et 7 bleues : P(rouge) = 3/10. On divise par le TOTAL des boules, pas par les bleues."],
        figure:{ type:'urne', rouges:3, bleues:7, anim:true, legende:'P(rouge) = 3/10' },
        encart:{ type:'piege', lignes:["P(rouge) = 3/7  ✗","P(rouge) = 3/10  ✓"] } },
      { titre:'La roue de la kermesse', texte:["Une roue a 8 secteurs égaux : 3 gagnants, 5 perdants. P(gagner) = 3/8.","Si les secteurs ne sont pas égaux, on utilise les angles : un secteur de 90° sur 360° a une probabilité de 90/360 = 1/4.","Probabilité d'un événement = somme des probabilités des issues qui le composent."],
        figure:{ type:'roue', anim:true, secteurs:[{label:'G',frac:0.125,c:C.vertF},{label:'P',frac:0.125},{label:'G',frac:0.125,c:C.vertF},{label:'P',frac:0.125},{label:'P',frac:0.125},{label:'G',frac:0.125,c:C.vertF},{label:'P',frac:0.125},{label:'P',frac:0.125}], legende:'3 secteurs gagnants sur 8' } },
    ] },
    { nom:"L'événement contraire", classe:'4ème–3ème', pages:[
      { titre:'Tout le reste', texte:["L'événement contraire de « tirer un as » est « ne pas tirer un as ». L'un ou l'autre se produit toujours.","P(non A) = 1 − P(A). P(pas un as) = 1 − 1/8 = 7/8.","Très utile pour « au moins un » : le contraire de « au moins un 6 en deux lancers » est « aucun 6 »."],
        figure:{ type:'disque', parts:[{label:'as 1/8',frac:0.125,c:C.orF},{label:'pas un as 7/8',frac:0.875}] },
        encart:{ type:'piege', lignes:["Contraire de « obtenir 6 » : « obtenir 1 »  ✗","Contraire : « ne pas obtenir 6 » = {1, 2, 3, 4, 5}  ✓"] } },
    ] },
    { nom:'De la fréquence à la probabilité', classe:'3ème', pages:[
      { titre:'Quand on ne peut pas raisonner', texte:["Une punaise tombe-t-elle plus souvent pointe en l'air ou sur le côté ? Impossible à calculer : les issues ne sont pas équiprobables.","On la lance 1000 fois : pointe en l'air 380 fois. Fréquence : 380/1000 = 0,38. On estime P(pointe en l'air) ≈ 0,38.","Plus on répète, plus la fréquence se stabilise autour de la probabilité. Avec 10 lancers, l'estimation serait très imprécise."],
        figure:{ type:'batons', data:[{l:'10 lancers',v:50},{l:'100',v:42},{l:'1000',v:38,c:C.vertF}], max:60, legende:'fréquence (%) de « pointe en l\'air »' },
        encart:{ type:'monde', lignes:["Les assureurs, la météo, les sondages : la plupart des probabilités du monde réel sont des fréquences observées sur un grand nombre de cas."] } },
    ] },
    { nom:'Une expérience à deux épreuves', classe:'3ème', pages:[
      { titre:'Deux pièces, quatre chemins', texte:["On lance deux pièces. Les issues sont des couples : PP, PF, FP, FF. Quatre issues équiprobables.","« Exactement un pile » : PF et FP, deux chemins sur quatre. P = 2/4 = 1/2.","« Deux piles » : un seul chemin, P = 1/4. Un arbre ou un tableau permet de ne rien oublier."],
        figure:{ type:'arbre', n1:[{l:'P',p:'1/2'},{l:'F',p:'1/2'}], n2:[{l:'P',p:'1/2'},{l:'F',p:'1/2'}] },
        encart:{ type:'piege', lignes:["P(exactement un pile) = 1/4  ✗","PF et FP : 2/4 = 1/2  ✓"] } },
      { titre:'Tirages avec remise', texte:["Urne : 2 rouges, 3 bleues. On tire une boule, on la remet, on tire à nouveau. P(rouge puis rouge) ?","Chaque tirage : P(rouge) = 2/5. Le long du chemin rouge-rouge, on multiplie : 2/5 × 2/5 = 4/25.","Dé puis pièce : 6 × 2 = 12 issues. P(6 et pile) = 1/12."],
        figure:{ type:'arbre', n1:[{l:'R',p:'2/5'},{l:'B',p:'3/5'}], n2:[{l:'R',p:'2/5'},{l:'B',p:'3/5'}] },
        encart:{ type:'retenir', lignes:["Sur un arbre, on MULTIPLIE le long d'un chemin, on ADDITIONNE les chemins favorables."] } },
    ] },
  ] };

LIVRES['Nombres relatifs'] = { branch:'nombres', level:'5ème–4ème', figure:{ type:'thermometre', min:-20, max:30, valeur:-18, valeurs:[-18, 4, 22, -5], pas:10, anim:true },
  intro:"Un congélateur à −18 °C, un parking au niveau −2, un compte en banque dans le rouge, la mer Morte à −430 m : dès qu'une grandeur peut descendre sous zéro, il faut des nombres négatifs. Ce livre les fait voir sur un thermomètre, un ascenseur et un relevé de compte, puis explique pourquoi les règles de calcul sont ce qu'elles sont.",
  competences:[

    { nom:'Repérer et ranger des relatifs', classe:'5ème', pages:[
      { titre:'Pourquoi inventer des nombres négatifs ?', texte:["Un thermomètre marque 0 °C quand l'eau gèle. Mais il fait parfois plus froid : on a besoin de nombres EN DESSOUS de zéro. On écrit −5 °C : cinq degrés sous zéro.","Les nombres positifs (+4, +22) sont au-dessus de zéro ; les négatifs (−5, −18) en dessous. Ensemble, ce sont les nombres relatifs. Zéro n'est ni positif ni négatif.","Le signe fait partie du nombre : −18 n'est pas « 18 avec un moins », c'est un nombre à lui, 18 crans sous zéro."],
        figure:{ type:'thermometre', min:-20, max:30, valeur:-18, valeurs:[-18, 4, 22, -5], pas:10, anim:true },
        encart:{ type:'monde', lignes:["Températures, altitudes (la mer Morte est à −430 m), niveaux de parking (−2), soldes bancaires (−50 €), dates (Jules César est né en −100), scores au golf (−3)."] } },
      { titre:'Sur une droite graduée', texte:["Couche le thermomètre : tu obtiens une droite graduée. Zéro au milieu, les positifs à droite, les négatifs à gauche.","Chaque nombre a sa place, son abscisse. −3 est à 3 crans à gauche de 0, +2 à 2 crans à droite.","L'opposé d'un nombre est à la même distance de zéro, de l'autre côté : l'opposé de +4 est −4, l'opposé de −7 est +7. L'opposé de 0 est 0."],
        figure:{ type:'axe', min:-8, max:8, etiq:2, points:[{x:-4,label:'−4',c:C.bleu, vers:4},{x:4,label:'+4',c:C.bleu}], anim:true },
        encart:{ type:'retenir', lignes:["Négatifs à gauche de 0, positifs à droite. Opposé = même distance à zéro, de l'autre côté."] } },
      { titre:'Ranger : plus à gauche, plus petit', texte:["−7 °C ou −3 °C, lequel fait le plus froid ? −7 : il est plus bas sur le thermomètre, plus à gauche sur la droite. Donc −7 < −3.","C'est le piège des relatifs : 7 est plus grand que 3, mais −7 est plus PETIT que −3, parce qu'il est plus loin de zéro vers le froid.","Règle : deux positifs se rangent comme d'habitude ; un négatif est toujours plus petit qu'un positif ; entre deux négatifs, le plus petit est celui qui est le plus loin de zéro."],
        figure:{ type:'axe', min:-8, max:5, etiq:1, points:[{x:-7,label:'−7',c:C.rouge},{x:-3,label:'−3',c:C.rouge},{x:0,label:'0',c:C.or},{x:2,label:'2',c:C.vert}] },
        encart:{ type:'piege', lignes:["−3 < −7 car 3 < 7  ✗","−7 < −3 : −7 est plus loin dans les négatifs  ✓"] } },
      { titre:'La distance à zéro', texte:["La distance à zéro d'un nombre est le nombre sans son signe : −18 et +18 ont tous deux une distance à zéro de 18.","C'est ce qu'on lit sur le thermomètre : « il fait 18 degrés » sous ou au-dessus de zéro.","Pour ranger des négatifs, on range leurs distances à zéro à l'envers : plus la distance est grande, plus le nombre est petit."],
        figure:{ type:'tableau', lignes:[['nombre','−18','+4','−5','0','+22'],['dist. à 0','18','4','5','0','22']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Voici les températures d'une semaine : lundi −4, mardi 3, mercredi −9, jeudi 0, vendredi −1.","Range-les de la plus froide à la plus chaude. Quel jour l'opposé de la température de lundi a-t-il été atteint ?"] } },
      { titre:'Réponse', texte:["Les négatifs d'abord, du plus loin de zéro au plus proche : −9 (mercredi) < −4 (lundi) < −1 (vendredi). Puis 0 (jeudi), puis 3 (mardi).","−9 < −4 < −1 < 0 < 3.","L'opposé de −4 est +4 : aucun jour n'a atteint exactement +4 ; le plus proche est mardi avec 3."],
        figure:{ type:'axe', min:-10, max:5, etiq:1, points:[{x:-9,label:'me',c:C.rouge},{x:-4,label:'lu',c:C.rouge},{x:-1,label:'ve',c:C.rouge},{x:0,label:'je',c:C.or},{x:3,label:'ma',c:C.vert}] } },
    ] },

    { nom:'Distance entre deux points', classe:'5ème', pages:[
      { titre:'Du congélateur au frigo', texte:["Le congélateur est à −18 °C, le frigo à +4 °C. De combien de degrés faut-il réchauffer un aliment qui passe de l'un à l'autre ?","On monte de −18 à 0 : 18 degrés. Puis de 0 à 4 : 4 degrés. En tout, 18 + 4 = 22 degrés.","Quand les deux nombres sont de signes CONTRAIRES, zéro est entre eux : la distance est la SOMME des deux distances à zéro."],
        figure:{ type:'axe', min:-20, max:10, pas:5, etiq:5, points:[{x:-18,label:'−18',c:C.bleu},{x:4,label:'+4',c:C.rouge}], fleche:[-18, 4, '22'] },
        encart:{ type:'monde', lignes:["Écart entre le sommet de l'Everest (+8 849 m) et le fond de la fosse des Mariannes (−10 935 m) : 8 849 + 10 935 = 19 784 m."] } },
      { titre:'Deux nombres du même côté', texte:["La nuit, −8 °C ; le jour, −3 °C. L'écart ? Les deux sont sous zéro, du même côté. On monte de −8 à −3 : 5 degrés.","Quand les deux nombres sont du MÊME signe, la distance est la DIFFÉRENCE des deux distances à zéro : 8 − 3 = 5.","Une distance est toujours positive ou nulle : on mesure un écart, pas une direction."],
        figure:{ type:'axe', min:-10, max:2, etiq:1, points:[{x:-8,label:'−8',c:C.bleu},{x:-3,label:'−3',c:C.bleu}], fleche:[-8, -3, '5'] },
        encart:{ type:'retenir', lignes:["Signes contraires : distance = somme des distances à zéro.","Même signe : distance = grande distance − petite distance."] } },
      { titre:'Avec des points sur une droite graduée', texte:["A a pour abscisse −4,2 et B a pour abscisse 3,3. Signes contraires : AB = 4,2 + 3,3 = 7,5.","C(−8) et D(−3), même signe : CD = 8 − 3 = 5.","E(1,5) et F(6), même signe : EF = 6 − 1,5 = 4,5. Ça marche aussi avec deux positifs, bien sûr : c'est la soustraction habituelle."],
        figure:{ type:'axe', min:-9, max:7, etiq:1, points:[{x:-8,label:'C'},{x:-3,label:'D'},{x:-4.2,label:'A',c:C.vert},{x:3.3,label:'B',c:C.vert},{x:1.5,label:'E',c:C.or},{x:6,label:'F',c:C.or}] },
        encart:{ type:'piege', lignes:["CD = −8 − (−3) = −5  ✗ : une distance n'est jamais négative","CD = 5  ✓"] } },
      { titre:'Le milieu d\'un segment', texte:["Le milieu de [CD] avec C(−8) et D(−3) est à mi-chemin : CD = 5, donc à 2,5 de chacun. Abscisse du milieu : −8 + 2,5 = −5,5.","Autre méthode : le milieu a pour abscisse la moyenne des deux abscisses : (−8 + (−3)) ÷ 2 = −11 ÷ 2 = −5,5.","Pour A(−4,2) et B(3,3) : (−4,2 + 3,3) ÷ 2 = −0,9 ÷ 2 = −0,45."],
        figure:{ type:'axe', min:-9, max:0, etiq:1, points:[{x:-8,label:'C'},{x:-3,label:'D'},{x:-5.5,label:'milieu',c:C.vert}] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un plongeur est à −12 m, un oiseau à +9 m au-dessus de l'eau. Un sous-marin est à −40 m.","Distance plongeur-oiseau ? Distance plongeur-sous-marin ?"] } },
      { titre:'Réponse', texte:["Plongeur (−12) et oiseau (+9) : signes contraires, la surface est entre eux. 12 + 9 = 21 m.","Plongeur (−12) et sous-marin (−40) : même signe, tous deux sous l'eau. 40 − 12 = 28 m.","Sur le dessin, on voit bien que zéro (la surface) est un repère de passage dans le premier cas, et pas dans le second."],
        figure:{ type:'axe', min:-45, max:15, pas:5, etiq:15, points:[{x:-40,label:'sous-marin',c:C.bleu},{x:-12,label:'plongeur',c:C.bleu},{x:9,label:'oiseau',c:C.vert}] } },
    ] },

    { nom:'Additionner et soustraire', classe:'5ème', pages:[
      { titre:'L\'ascenseur du parking', texte:["Tu es au niveau −2 du parking. L'ascenseur monte de 5 étages : tu arrives au 3e. −2 + 5 = +3.","Du 3e, tu descends de 7 : tu arrives au niveau −4. 3 − 7 = −4.","Ajouter un positif, c'est monter ; ajouter un négatif, c'est descendre : 3 + (−7) = 3 − 7 = −4. Descendre de 7 et ajouter −7, c'est la même chose."],
        figure:{ type:'ascenseur', min:-4, max:5, depart:-2, arrivee:3, anim:true, legende:'−2 + 5 = +3' },
        encart:{ type:'monde', lignes:["Solde bancaire : 50 − 80 + 20 = −10 €. Le compte est « dans le rouge » de 10 €."] } },
      { titre:'Les deux règles de l\'addition', texte:["MÊME SIGNE : deux dettes s'additionnent en une dette plus grosse. (−3) + (−4) = −7. On additionne les distances à zéro et on garde le signe commun.","SIGNES DIFFÉRENTS : une dette de 7 et un gain de 3 se compensent en partie. (−7) + (+3) = −4. On soustrait la petite distance de la grande, et on garde le signe de la plus grande.","Deux opposés s'annulent : (−5) + (+5) = 0."],
        figure:{ type:'compte', mouvements:[{l:'dette',v:-7},{l:'gain',v:3}] },
        encart:{ type:'exemple', titre:'(−9) + (+12) et (−9) + (−12)', lignes:["signes différents : 12 − 9 = 3, signe du plus fort (+12) → +3","même signe : 9 + 12 = 21, signe commun → −21"] } },
      { titre:'Soustraire, c\'est ajouter l\'opposé', texte:["(−7) − (−3) : tu as une dette de 7 et on t'ENLÈVE une dette de 3. Tu es soulagé de 3 : il reste une dette de 4. Résultat −4.","Enlever une dette de 3, c'est comme recevoir 3 : (−7) − (−3) = (−7) + (+3) = −4.","C'est la règle : soustraire un nombre, c'est ajouter son opposé. Elle transforme toute soustraction en addition, et on retrouve les règles de la page précédente."],
        figure:{ type:'tableau', lignes:[['(−7) − (−3)','(−7) + (+3)','−4'],['5 − (+8)','5 + (−8)','−3'],['2 − (−6)','2 + (+6)','8']] },
        encart:{ type:'piege', lignes:["(−7) − (−3) = −10 (on a additionné les dettes)  ✗","(−7) + (+3) = −4  ✓"] } },
      { titre:'Simplifier l\'écriture, puis regrouper', texte:["Une longue suite : (+5) − (+8) + (+2) − (+4). D'abord on simplifie : on enlève les parenthèses et les signes + inutiles. 5 − 8 + 2 − 4.","Puis on regroupe : les positifs ensemble, 5 + 2 = 7 ; les négatifs ensemble, 8 + 4 = 12.","Enfin : 7 − 12 = −5. Regrouper évite de faire les calculs un par un et de perdre un signe en route."],
        figure:{ type:'compte', mouvements:[{l:'+5',v:5},{l:'−8',v:-8},{l:'+2',v:2},{l:'−4',v:-4}] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Relevé de compte : +120 (salaire), −85 (courses), −40 (essence), +30 (remboursement), −60 (téléphone).","Quel est le solde final ? Le compte est-il dans le rouge ?"] } },
      { titre:'Réponse', texte:["Positifs : 120 + 30 = 150. Négatifs : 85 + 40 + 60 = 185.","Solde : 150 − 185 = −35 €. Les dépenses dépassent les rentrées de 35 € : le compte est dans le rouge.","Vérification en suivant l'ordre : 120 − 85 = 35 ; 35 − 40 = −5 ; −5 + 30 = 25 ; 25 − 60 = −35. ✓"],
        figure:{ type:'compte', mouvements:[{l:'salaire',v:120},{l:'courses',v:-85},{l:'essence',v:-40},{l:'rembours.',v:30},{l:'tél.',v:-60}] } },
    ] },

    { nom:'Multiplier et diviser', classe:'4ème', pages:[
      { titre:'Trois dettes de 4 euros', texte:["3 × (−4) : trois fois une dette de 4, c'est une dette de 12. 3 × (−4) = −12.","Et (−4) × 3, c'est la même chose : −12. Un positif fois un négatif donne un négatif.","Un positif fois un positif donne un positif, comme d'habitude : 3 × 4 = 12."],
        figure:{ type:'compte', mouvements:[{l:'dette',v:-4},{l:'dette',v:-4},{l:'dette',v:-4}] },
        encart:{ type:'exemple', titre:'La température baisse de 2 °C par heure pendant 5 h', lignes:["5 × (−2) = −10","elle a baissé de 10 °C"] } },
      { titre:'Moins par moins : pourquoi plus ?', texte:["(−3) × (−4) : « moins trois fois une dette de 4 ». Avoir « moins trois » dettes, c'est en avoir enlevé trois. Enlever trois dettes de 4, c'est gagner 12.","Autre façon de voir : on descend la table. 3 × (−4) = −12, 2 × (−4) = −8, 1 × (−4) = −4, 0 × (−4) = 0. À chaque cran, on ajoute 4. Le cran suivant : (−1) × (−4) = 4, puis (−2) × (−4) = 8.","Un négatif fois un négatif donne un positif. Ce n'est pas une convention arbitraire : c'est la seule règle qui garde la table régulière."],
        figure:{ type:'tableau', lignes:[['3 × (−4)','−12'],['2 × (−4)','−8'],['1 × (−4)','−4'],['0 × (−4)','0'],['(−1) × (−4)','+4'],['(−2) × (−4)','+8']] },
        encart:{ type:'retenir', lignes:["Même signe → résultat positif.   Signes différents → résultat négatif."] } },
      { titre:'La division suit la même règle', texte:["Une dette de 48 € partagée entre 4 amis : (−48) ÷ 4 = −12. Chacun doit 12 €.","(−24) ÷ (−6) = 4, car 4 × (−6) = −24. Même signe, résultat positif.","24 ÷ (−6) = −4, car (−4) × (−6) = 24. On peut toujours vérifier une division en multipliant."],
        figure:{ type:'tableau', lignes:[['×  ou  ÷','+','−'],['+','+','−'],['−','−','+']], legende:'la règle des signes' },
        encart:{ type:'methode', lignes:["1. Décider du signe du résultat avec la règle des signes.","2. Multiplier ou diviser les distances à zéro.","3. Écrire le résultat avec son signe."] } },
      { titre:'Plusieurs facteurs : on compte les moins', texte:["(−2) × (−3) × (−1) × 4. Deux à deux : (−2) × (−3) = 6 ; 6 × (−1) = −6 ; −6 × 4 = −24.","Plus rapide : compte les facteurs négatifs. Il y en a 3, un nombre impair, donc le résultat est négatif. Puis 2 × 3 × 1 × 4 = 24. Résultat : −24.","Chaque paire de négatifs donne un positif. S'il en reste un seul non apparié, le résultat est négatif. Pair → +, impair → −."],
        figure:{ type:'tableau', lignes:[['nb de facteurs −','0','1','2','3','4'],['signe','+','−','+','−','+']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Calcule (−5) × 2 × (−3) × (−1) et (−60) ÷ (−4) ÷ (−3).","Puis : un ascenseur descend de 3 étages par minute pendant 4 min. Où est-il, parti du niveau +5 ?"] } },
      { titre:'Réponse', texte:["(−5) × 2 × (−3) × (−1) : trois négatifs → négatif. 5 × 2 × 3 × 1 = 30. Résultat −30.","(−60) ÷ (−4) = 15, puis 15 ÷ (−3) = −5. (Ou : deux négatifs au départ, un troisième ensuite → négatif, 60 ÷ 4 ÷ 3 = 5, donc −5.)","Ascenseur : 4 × (−3) = −12. Depuis +5 : 5 + (−12) = −7. Il est au niveau −7."],
        figure:{ type:'ascenseur', min:-8, max:6, depart:5, arrivee:-7, anim:true, legende:'5 + 4 × (−3) = −7' } },
    ] },

    { nom:'Priorités avec des relatifs', classe:'4ème', pages:[
      { titre:'Les priorités ne changent pas', texte:["3 − 2 × (−4) : la multiplication d'abord, comme toujours. 2 × (−4) = −8.","Ensuite 3 − (−8) = 3 + 8 = 11.","Parenthèses, puis × et ÷, puis + et −. Les signes négatifs n'ajoutent qu'une chose : la règle des signes à chaque multiplication."],
        figure:{ type:'tableau', lignes:[['3 − 2 × (−4)'],['3 − (−8)'],['3 + 8 = 11']] },
        encart:{ type:'piege', lignes:["3 − 2 × (−4) = 1 × (−4) = −4  ✗ (on a soustrait avant de multiplier)","× avant − : 3 − (−8) = 11  ✓"] } },
      { titre:'Le signe moins devant une parenthèse', texte:["−(5 − 8) : c'est l'opposé de (5 − 8) = −3, donc +3. On peut aussi distribuer le moins : −(5 − 8) = −5 + 8 = 3. Tous les signes de l'intérieur changent.","+(5 − 8) : un plus devant une parenthèse ne change rien : 5 − 8 = −3.","2 − (3 − 7) : 3 − 7 = −4, puis 2 − (−4) = 6. Ou : 2 − 3 + 7 = 6. Même résultat."],
        figure:{ type:'tableau', lignes:[['−(a − b)','= −a + b'],['−(a + b)','= −a − b'],['+(a − b)','= a − b']] },
        encart:{ type:'exemple', titre:'−4 − (−2 + 6) × (−1)', lignes:["parenthèse : −2 + 6 = 4","4 × (−1) = −4","−4 − (−4) = 0"] } },
      { titre:'Un calcul complet, étape par étape', texte:["A = −3 + (−2)² × 5 − (−10) ÷ 2. Regarde d'abord la puissance : (−2)² = (−2) × (−2) = 4.","Puis les produits et quotients : 4 × 5 = 20 ; (−10) ÷ 2 = −5.","Il reste −3 + 20 − (−5) = −3 + 20 + 5 = 22.","Une ligne par étape, et on souligne ce qu'on calcule : c'est ainsi qu'on ne perd pas un signe."],
        figure:{ type:'tableau', lignes:[['−3 + (−2)² × 5 − (−10) ÷ 2'],['−3 + 4 × 5 − (−5)'],['−3 + 20 + 5'],['22']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Calcule B = 5 − (−3) × 2 + (−8) ÷ (−4)."] } },
      { titre:'Réponse', texte:["Produits et quotients d'abord : (−3) × 2 = −6 ; (−8) ÷ (−4) = 2.","B = 5 − (−6) + 2 = 5 + 6 + 2 = 13.","Erreur fréquente : calculer 5 − (−3) = 8 en premier, puis 8 × 2. La soustraction attend son tour."],
        figure:{ type:'tableau', lignes:[['5 − (−3) × 2 + (−8) ÷ (−4)'],['5 − (−6) + 2'],['13']] } },
    ] },

    { nom:'Résoudre un problème', classe:'5ème–4ème', pages:[
      { titre:'Traduire la situation avec des signes', texte:["Un quiz : +3 points par bonne réponse, −2 par mauvaise. Léa a 6 bonnes réponses et 5 mauvaises. Son score ?","Gains : 6 × 3 = 18. Pertes : 5 × (−2) = −10. Score : 18 + (−10) = 8 points.","La première étape est toujours de donner un signe à chaque donnée selon son sens : ce qui monte, gagne, réchauffe → + ; ce qui descend, perd, refroidit → −."],
        figure:{ type:'compte', mouvements:[{l:'6 bonnes',v:18},{l:'5 mauvaises',v:-10}] },
        encart:{ type:'methode', lignes:["1. Donner un signe à chaque donnée.","2. Écrire le calcul complet avant de calculer.","3. Calculer avec les priorités et la règle des signes.","4. Interpréter le signe du résultat dans la situation."] } },
      { titre:'Interpréter le signe du résultat', texte:["Tom a 4 bonnes réponses et 8 mauvaises : 4 × 3 + 8 × (−2) = 12 − 16 = −4. Un score négatif : il a perdu plus qu'il n'a gagné.","Une température qui passe de −3 °C à −9 °C a VARIÉ de −9 − (−3) = −6 °C : elle a baissé de 6 degrés. Le signe − du résultat dit « baisse ».","La variation est arrivée − départ. Si elle est positive, ça a monté ; si elle est négative, ça a baissé."],
        figure:{ type:'thermometre', min:-15, max:10, valeur:-9, valeurs:[-3, -9], pas:5, anim:true },
        encart:{ type:'exemple', titre:'La dette partagée', lignes:["une dette de 48 € entre 4 amis : (−48) ÷ 4 = −12","chacun doit 12 € (résultat négatif = dette)"] } },
      { titre:'À toi', texte:["Un plongeur descend à −15 m, remonte de 6 m, redescend de 11 m, puis remonte de 9 m.","1. À quelle profondeur finit-il ?","2. Quelle est sa variation totale de profondeur ?","3. À quelle profondeur était-il le plus bas ?"],
        figure:{ type:'axe', min:-25, max:0, pas:5, etiq:5, points:[{x:-15,label:'départ',c:C.bleu}] },
        encart:{ type:'exercice', titre:'Indice', lignes:["Écris chaque déplacement avec son signe et suis-le sur l'axe."] } },
      { titre:'Réponse', texte:["Positions successives : −15, puis −15 + 6 = −9, puis −9 − 11 = −20, puis −20 + 9 = −11. Il finit à −11 m.","Variation totale : arrivée − départ = −11 − (−15) = +4. Il est remonté de 4 m par rapport à sa première position. (Ou : 6 − 11 + 9 = 4.)","Le plus bas : −20 m, atteint après la seconde descente."],
        figure:{ type:'axe', min:-25, max:0, pas:5, etiq:5, points:[{x:-15,label:'1'},{x:-9,label:'2',c:C.vert},{x:-20,label:'3',c:C.rouge},{x:-11,label:'fin',c:C.or}] },
        encart:{ type:'retenir', lignes:["Position finale = départ + somme des déplacements signés · variation = arrivée − départ"] } },
