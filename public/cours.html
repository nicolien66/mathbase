      { titre:'Litres et mètres cubes : le pont', texte:["Une bouteille d'un litre remplit exactement un cube de 1 dm d'arête : 1 L = 1 dm³. C'est le lien entre les contenances (litres) et les volumes (unités cubes).","Conséquences : 1 mL = 1 cm³ (une seringue de 5 mL, c'est 5 cm³). 1 m³ = 1 000 L (une piscine de 50 m³ contient 50 000 L). 1 cL = 10 cm³.","Une bouteille de 1,5 L = 1,5 dm³ = 1 500 cm³."],
        figure:{ type:'tableau', lignes:[['1 L','1 dm³'],['1 mL','1 cm³'],['1 m³','1 000 L'],['1,5 L','1 500 cm³']] },
        encart:{ type:'piege', lignes:["1,5 L = 150 cm³  ✗","1,5 L = 1 500 cm³ : 1 L = 1 000 cm³  ✓"] } },
      { titre:'Comparer des volumes', texte:["8,434 dm³ ; 8,409 dm³ ; 8 380 000 mm³. En cm³ : 8 434 ; 8 409 ; 8 380. Ordre : 8 380 000 mm³ < 8,409 dm³ < 8,434 dm³.","Les millimètres cubes trompent : 8 380 000 semble énorme, c'est le plus petit des trois. Six chiffres de plus pour deux rangs.","Toujours la même règle : même unité, puis on compare."],
        figure:{ type:'batons', data:[{l:'8 380 000 mm³',v:8380},{l:'8,409 dm³',v:8409},{l:'8,434 dm³',v:8434,c:C.vertF}], max:8500, legende:'en cm³' },
        encart:{ type:'exercice', titre:'À toi', lignes:["Convertis : 2,5 m³ en L · 350 cm³ en dL · 0,75 L en mm³ · 4 200 mL en dm³.","Un aquarium de 60 cm × 30 cm × 40 cm : combien de litres ?"] } },
      { titre:'Réponse', texte:["2,5 m³ = 2 500 L. 350 cm³ = 350 mL = 3,5 dL. 0,75 L = 750 cm³ = 750 000 mm³. 4 200 mL = 4,2 L = 4,2 dm³.","Aquarium : 60 × 30 × 40 = 72 000 cm³ = 72 dm³ = 72 L.","Le calcul en cm donne des cm³ ; le passage aux litres se fait par 1 000 cm³ = 1 L."],
        figure:{ type:'pave', l:'60 cm', h:'40 cm', p:'30 cm', legende:'72 000 cm³ = 72 L' } },

    { nom:'Résoudre un problème', classe:'6ème', pages:[
      { titre:'Le ruban à partager', texte:["Un ruban de 2,4 m est coupé en morceaux de 30 cm. Combien de morceaux ? Diviser 2,4 par 30 n'a pas de sens : ce ne sont pas les mêmes unités.","2,4 m = 240 cm. 240 ÷ 30 = 8 morceaux. Le nombre de morceaux est sans unité : c'est un compte.","Étape 1, toujours : mettre toutes les données dans la même unité. Étape 2 : l'opération. Étape 3 : la réponse avec la bonne unité (ou sans, pour un nombre d'objets)."],

        encart:{ type:'piege', lignes:["2,4 ÷ 30 = 0,08 morceau  ✗","240 ÷ 30 = 8 morceaux  ✓"] } },
      { titre:'Des problèmes du quotidien', texte:["Une bouteille de 75 cL remplit combien de verres de 15 cL ? 75 ÷ 15 = 5 verres.","Un jardin de 12 m × 25 m coûte 40 € le m² : 300 m² × 40 = 12 000 €. Un terrain de 0,5 ha au même prix : 5 000 m² × 40 = 200 000 €.","Une baignoire de 180 L, un robinet à 12 L/min : 180 ÷ 12 = 15 minutes."],
        figure:{ type:'tableau', lignes:[['75 cL ÷ 15 cL','5 verres'],['300 m² × 40 €','12 000 €'],['180 L ÷ 12 L/min','15 min']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un carreleur pose des carreaux de 20 cm × 20 cm dans une pièce de 4 m × 3,5 m.","Combien de carreaux ? Si un carreau coûte 2,50 €, quel est le prix total ?"] } },
      { titre:'Réponse', texte:["Aire de la pièce : 4 × 3,5 = 14 m² = 140 000 cm². Aire d'un carreau : 20 × 20 = 400 cm². Nombre : 140 000 ÷ 400 = 350 carreaux.","Autre chemin : 400 ÷ 20 = 20 carreaux sur la longueur, 350 ÷ 20 = 17,5 sur la largeur ; 20 × 17,5 = 350. (Le 17,5 signifie qu'il y aura des découpes.)","Prix : 350 × 2,50 = 875 €."],
        figure:{ type:'carrelage', L:8, l:7, legende:'350 carreaux de 20 cm' },
        encart:{ type:'retenir', lignes:["longueurs : × 10 par rang · aires : × 100 · volumes : × 1 000 · 1 L = 1 dm³, 1 mL = 1 cm³ · même unité avant tout calcul."] } },

LIVRES['Aires et figures'] = { branch:'nombres', level:'6ème', figure:{ type:'carrelage', L:6, l:4, anim:true, legende:'24 carreaux : l\'aire' },
  intro:"Clôturer un jardin ou le recouvrir de pelouse, ce sont deux questions différentes : le périmètre (le tour) et l'aire (la surface). Ce livre distingue les deux, retrouve chaque formule au lieu de la réciter, et l'applique aux figures usuelles.",
  competences:[

    { nom:'Reconnaître une figure', classe:'6ème', pages:[
      { titre:'Les quadrilatères : quatre côtés, plusieurs familles', texte:["Un rectangle a quatre angles droits. Un losange a quatre côtés de même longueur. Un carré a les deux : quatre angles droits ET quatre côtés égaux. Un carré est donc un rectangle particulier, et un losange particulier.","Un parallélogramme a ses côtés opposés parallèles ; rectangle, losange et carré en sont des cas particuliers. Un trapèze n'a qu'une paire de côtés parallèles.","Sur une figure, on lit le codage : petits carrés pour les angles droits, traits identiques pour les côtés égaux."],
        figure:{ type:'tableau', lignes:[['figure','angles droits','côtés égaux'],['rectangle','4','2 à 2'],['losange','non','4'],['carré','4','4']] },
        encart:{ type:'piege', lignes:["Un carré n'est pas un rectangle  ✗","Un carré est un rectangle particulier : il a bien 4 angles droits  ✓"] } },
      { titre:'Triangles et cercle', texte:["Triangle rectangle : un angle droit. Isocèle : deux côtés égaux. Équilatéral : trois côtés égaux (et trois angles de 60°). Quelconque : rien de spécial.","Le cercle : tous les points à la même distance du centre. Cette distance est le rayon r. Le diamètre d traverse le cercle en passant par le centre : d = 2r.","Le disque est la surface à l'intérieur du cercle. On mesure le périmètre du cercle et l'aire du disque."],
        figure:{ type:'cercle', r:'3 cm', d:'6 cm', anim:true },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un quadrilatère a 4 angles droits et des côtés de 3, 5, 3 et 5 cm. Quelle est sa nature précise ?","Un triangle a un angle droit et deux côtés de 4 cm. Sa nature ?"] } },
      { titre:'Réponse', texte:["4 angles droits → rectangle. Côtés 3, 5, 3, 5 : pas tous égaux, donc pas un carré. C'est un rectangle (non carré).","Un angle droit ET deux côtés égaux : un triangle rectangle isocèle. Ses deux angles aigus valent 45° chacun. C'est la moitié d'un carré de 4 cm.","Le nom le plus précis dit tout ce qu'on sait de la figure."],
        figure:{ type:'triangle', rect:true, cotes:{AB:'4 cm', CA:'4 cm', BC:'√32 ≈ 5,7'} } },
    ] },

    { nom:'Aire et périmètre du carré', classe:'6ème', pages:[
      { titre:'Le tour et la surface', texte:["Un carré de 6 cm de côté. Le PÉRIMÈTRE, c'est la longueur du tour : 6 + 6 + 6 + 6 = 4 × 6 = 24 cm. C'est ce qu'il faut de ruban pour en faire le tour.","L'AIRE, c'est la surface : combien de carreaux de 1 cm de côté il faut pour le recouvrir. 6 rangées de 6 carreaux : 6 × 6 = 36 cm². C'est ce qu'il faut de peinture.","Même figure, deux questions, deux formules, deux unités : cm pour le tour, cm² pour la surface."],
        figure:{ type:'carrelage', L:6, l:6, unite:' cm', anim:true, legende:'P = 24 cm · A = 36 cm²' },
        encart:{ type:'retenir', lignes:["Carré de côté c :   P = 4 × c        A = c × c = c²"] } },
      { titre:'Dans l\'autre sens', texte:["Un carré a un périmètre de 32 cm. Son côté ? 32 ÷ 4 = 8 cm. Son aire ? 8 × 8 = 64 cm².","Un carré a une aire de 49 cm². Son côté ? Le nombre qui, multiplié par lui-même, donne 49 : 7 cm. Son périmètre : 28 cm.","Deux carrés : côté 3 et côté 6. Périmètres 12 et 24 (× 2). Aires 9 et 36 (× 4 !). Doubler le côté quadruple l'aire."],
        figure:{ type:'tableau', lignes:[['côté','3','6','8'],['périmètre','12','24','32'],['aire','9','36','64']] },
        encart:{ type:'piege', lignes:["Aire du carré de côté 6 : 4 × 6 = 24 cm²  ✗","6 × 6 = 36 cm² ; 4 × 6 est le périmètre  ✓"] } },
      { titre:'À toi', texte:["1. Un carré de 12,5 cm de côté : périmètre et aire ?","2. Un potager carré a une aire de 81 m². Combien de mètres de grillage pour en faire le tour ?","3. On triple le côté d'un carré. Par combien sont multipliés le périmètre ? l'aire ?"],
        figure:{ type:'carrelage', L:9, l:9, unite:' m', legende:'81 m²' },
        encart:{ type:'exercice', titre:'Indice', lignes:["9 × 9 = 81. Pour le 3, teste avec un côté de 1 puis de 3."] } },
      { titre:'Réponse', texte:["1. P = 4 × 12,5 = 50 cm. A = 12,5 × 12,5 = 156,25 cm².","2. Côté : 9 m (9 × 9 = 81). Grillage : 4 × 9 = 36 m.","3. Côté × 3 : périmètre × 3 (de 4 à 12), aire × 9 (de 1 à 9). L'aire suit le carré du coefficient."],
        figure:{ type:'tableau', lignes:[['côté','1','3'],['P','4','12'],['A','1','9']] } },
    ] },

    { nom:'Aire et périmètre du rectangle', classe:'6ème', pages:[
      { titre:'Compter les carreaux', texte:["Un rectangle de 7 cm de long et 3 cm de large. Recouvre-le de carreaux de 1 cm : 3 rangées de 7 carreaux, 7 × 3 = 21 carreaux. Aire : 21 cm².","La formule A = L × l ne fait que compter les carreaux : autant de rangées que de largeur, autant de carreaux par rangée que de longueur.","Périmètre : 7 + 3 + 7 + 3 = 20 cm. Deux longueurs et deux largeurs : P = 2 × (L + l) = 2 × 10 = 20."],
        figure:{ type:'carrelage', L:7, l:3, unite:' cm', anim:true, legende:'21 carreaux · tour = 20 cm' },
        encart:{ type:'retenir', lignes:["Rectangle L × l :   P = 2 × (L + l)        A = L × l"] } },
      { titre:'Même périmètre, aires différentes', texte:["Avec 20 m de grillage, on peut faire un enclos de 9 × 1 (aire 9 m²), de 7 × 3 (21 m²), de 5 × 5 (25 m²). Même tour, surfaces très différentes !","Le carré est le rectangle qui enferme le plus d'aire pour un périmètre donné.","Périmètre et aire ne sont pas liés : on ne peut pas déduire l'un de l'autre sans connaître la forme."],
        figure:{ type:'tableau', lignes:[['L × l','9 × 1','7 × 3','5 × 5'],['P','20','20','20'],['A','9','21','25']] },
        encart:{ type:'piege', lignes:["P = 7 + 3 = 10 cm  ✗ (il y a quatre côtés)","P = 2 × (7 + 3) = 20 cm  ✓"] } },
      { titre:'Retrouver une dimension', texte:["Un rectangle de 24 cm² d'aire et 8 cm de long. Sa largeur : 24 ÷ 8 = 3 cm. (Puisque A = L × l, alors l = A ÷ L.)","Un rectangle de 30 cm de périmètre et 9 cm de long. Demi-périmètre : 15 cm = L + l, donc l = 15 − 9 = 6 cm.","Un terrain de 1 200 m² et 40 m de large : longueur 30 m, périmètre 2 × (40 + 30) = 140 m."],
        figure:{ type:'tableau', lignes:[['A = 24, L = 8','l = 24 ÷ 8 = 3'],['P = 30, L = 9','l = 15 − 9 = 6']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Une chambre de 4 m × 3,5 m. Combien de m² de moquette ? Combien de mètres de plinthes (on enlève 90 cm pour la porte) ?","Un écran 16:9 mesure 80 cm de large : hauteur et aire ?"] } },
      { titre:'Réponse', texte:["Moquette : 4 × 3,5 = 14 m². Plinthes : 2 × (4 + 3,5) = 15 m, moins 0,90 m de porte : 14,10 m.","Écran : 16:9 signifie 16 de large pour 9 de haut. Hauteur = 80 × 9 ÷ 16 = 45 cm. Aire = 80 × 45 = 3 600 cm² = 0,36 m².","La moquette est une aire (m²), les plinthes un périmètre (m) : c'est tout le chapitre en une chambre."],
        figure:{ type:'carrelage', L:8, l:7, legende:'4 m × 3,5 m = 14 m²' } },
    ] },

    { nom:'Aire et périmètre du triangle', classe:'6ème', pages:[
      { titre:'Un triangle rectangle, c\'est un demi-rectangle', texte:["Prends un rectangle 4 × 3 et coupe-le par sa diagonale : deux triangles rectangles identiques. Chacun a une aire moitié : 4 × 3 ÷ 2 = 6 cm².","Pour un triangle rectangle, les deux côtés de l'angle droit jouent le rôle de la longueur et de la largeur : A = (côté × côté) ÷ 2.","Le périmètre, lui, se calcule comme toujours : la somme des trois côtés. Triangle 3-4-5 : 12 cm."],
        figure:{ type:'triangle', rect:true, cotes:{AB:'4 cm', CA:'3 cm', BC:'5 cm'}, fond:C.bleuF },
        encart:{ type:'retenir', lignes:["Triangle rectangle : A = (côté × côté) ÷ 2.   Tout triangle : A = (base × hauteur) ÷ 2."] } },
      { titre:'Pourquoi base × hauteur ÷ 2 marche pour tous', texte:["Un triangle quelconque de base 8 et de hauteur 5 (la hauteur est perpendiculaire à la base, du sommet opposé jusqu'à la base). Trace la hauteur : elle coupe le triangle en deux triangles rectangles.","Chacun est un demi-rectangle. Ensemble, ils font la moitié du rectangle 8 × 5 : A = 8 × 5 ÷ 2 = 20 cm².","N'importe quel côté peut servir de base, à condition de prendre la hauteur qui lui correspond."],
        figure:{ type:'triangle', noms:['A','B','C'], cotes:{AB:'base 8', CA:'', BC:''}, angle:'C', angleLabel:'h = 5', fond:C.vertF },
        encart:{ type:'piege', lignes:["A = 3 × 4 = 12 cm² pour le triangle rectangle 3-4-5  ✗","A = 3 × 4 ÷ 2 = 6 cm² : on divise par 2  ✓"] } },
      { titre:'À toi', texte:["1. Un triangle rectangle de côtés 6 cm, 8 cm et 10 cm : périmètre et aire ?","2. Un triangle de base 12 cm et de hauteur 7 cm : aire ?","3. Un triangle a une aire de 30 cm² et une base de 10 cm : hauteur ?"],
        figure:{ type:'triangle', rect:true, cotes:{AB:'8', CA:'6', BC:'10'} },
        encart:{ type:'exercice', titre:'Indice', lignes:["Pour le 3, si A = b × h ÷ 2, alors h = 2A ÷ b."] } },
      { titre:'Réponse', texte:["1. P = 6 + 8 + 10 = 24 cm. A = 6 × 8 ÷ 2 = 24 cm². (Même nombre, unités différentes : une coïncidence du triangle 6-8-10.)","2. A = 12 × 7 ÷ 2 = 42 cm².","3. h = 2 × 30 ÷ 10 = 6 cm."],
        figure:{ type:'tableau', lignes:[['6-8-10','P = 24 cm','A = 24 cm²'],['b 12, h 7','','A = 42 cm²'],['A 30, b 10','','h = 6 cm']] } },
    ] },

    { nom:'Aire et périmètre du cercle', classe:'6ème', pages:[
      { titre:'Le nombre π', texte:["Mesure le tour d'une assiette avec un mètre ruban, puis son diamètre. Divise : tu trouves toujours à peu près 3,14. Quel que soit le cercle. Ce rapport est le nombre π (pi) ≈ 3,141 59…","Périmètre du cercle = π × diamètre = 2 × π × rayon. Un cercle de rayon 3 cm : P = 2 × π × 3 = 6π ≈ 18,84 cm.","On garde la valeur exacte avec π (6π) quand c'est possible, et on donne une valeur approchée à la fin."],
        figure:{ type:'cercle', r:'3 cm', d:'6 cm', anim:true, legende:'P = 6π ≈ 18,84 cm' },
        encart:{ type:'monde', lignes:["Une roue de vélo de 70 cm de diamètre avance de π × 70 ≈ 220 cm à chaque tour. Un compteur de vélo compte les tours et multiplie."] } },
      { titre:'L\'aire du disque', texte:["Coupe un disque en beaucoup de petites parts, et range-les tête-bêche : on obtient presque un rectangle, de longueur la moitié du tour (π × r) et de largeur le rayon r. Aire ≈ π × r × r = π × r².","Rayon 3 cm : A = π × 3² = 9π ≈ 28,26 cm².","Attention à ne pas confondre : le périmètre utilise r une fois (2πr), l'aire utilise r au carré (πr²)."],
        figure:{ type:'pizza', n:12, k:12, legende:'des parts rangées → un rectangle π r × r' },
        encart:{ type:'retenir', lignes:["P = 2 × π × r        A = π × r²"] } },
      { titre:'Rayon, diamètre : bien lire l\'énoncé', texte:["Un disque de 10 cm de DIAMÈTRE : le rayon est 5 cm. A = π × 5² = 25π ≈ 78,5 cm². Erreur classique : utiliser 10 dans la formule (→ 314 cm², quatre fois trop).","Un cercle de 31,4 cm de tour : diamètre = 31,4 ÷ π ≈ 10 cm, rayon 5 cm.","Demi-disque de rayon 4 : aire = π × 16 ÷ 2 = 8π. Périmètre = demi-tour + diamètre = 4π + 8."],
        figure:{ type:'cercle', r:'5 cm', d:'10 cm' },
        encart:{ type:'exercice', titre:'À toi', lignes:["Une pizza de 32 cm de diamètre : aire ? Une pizza de 26 cm coûte 9 €, celle de 32 cm coûte 12 € : laquelle est la plus rentable au cm² ?"] } },
      { titre:'Réponse', texte:["32 cm de diamètre → rayon 16. A = π × 256 ≈ 804 cm². 26 cm → rayon 13. A = π × 169 ≈ 531 cm².","Prix au cm² : 9 ÷ 531 ≈ 1,7 centime ; 12 ÷ 804 ≈ 1,5 centime. La grande pizza est plus rentable.","L'aire grandit comme le carré du rayon : une pizza 23 % plus large a 51 % de surface en plus."],
        figure:{ type:'batons', data:[{l:'26 cm',v:531},{l:'32 cm',v:804,c:C.vertF}], max:900, legende:'aire en cm²' } },
    ] },

    { nom:'Les unités', classe:'6ème', pages:[
      { titre:'cm pour le tour, cm² pour la surface', texte:["Un périmètre est une longueur : on peut le parcourir, le mesurer au mètre ruban. Unité : mm, cm, m, km.","Une aire est une surface : on la recouvre. Unité : mm², cm², m², km², ha. Le petit 2 rappelle qu'on a multiplié deux longueurs.","Écrire « aire = 36 cm » est faux, même si le nombre est bon : sans le carré, on parle d'une longueur."],
        figure:{ type:'tableau', lignes:[['périmètre','24 cm','longueur'],['aire','36 cm²','surface']] },
        encart:{ type:'piege', lignes:["Périmètre = 24 cm² · aire = 36 cm  ✗","Périmètre = 24 cm · aire = 36 cm²  ✓"] } },
      { titre:'Même unité avant de calculer', texte:["Un rectangle de 1,2 m de long et 80 cm de large. Aire = 1,2 × 80 ? Non : 1,2 m = 120 cm, aire = 120 × 80 = 9 600 cm². Ou 1,2 × 0,8 = 0,96 m². Les deux sont justes : 9 600 cm² = 0,96 m².","Un terrain de 20 m × 15 m : 300 m² = 3 ares = 0,03 ha.","Pour convertir une aire, un rang = × 100."],
        figure:{ type:'carrelage', L:12, l:8, legende:'120 cm × 80 cm = 9 600 cm² = 0,96 m²' },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un rectangle de 2,5 m sur 60 cm : périmètre en m, aire en m² puis en cm²."] } },
      { titre:'Réponse', texte:["En m : 2,5 m et 0,6 m. P = 2 × (2,5 + 0,6) = 6,2 m. A = 2,5 × 0,6 = 1,5 m².","En cm² : 1,5 m² = 15 000 cm². (Ou directement 250 × 60 = 15 000.)","Périmètre en m (une longueur), aire en m² (deux longueurs multipliées)."],
        figure:{ type:'tableau', lignes:[['P','6,2 m'],['A','1,5 m²','15 000 cm²']] } },
    ] },

    { nom:'Résoudre un problème', classe:'6ème', pages:[
      { titre:'La chambre à moquette', texte:["Une chambre de 4 m × 3,5 m. La moquette coûte 12 € le m². Prix ? On recouvre une surface : c'est l'aire. 4 × 3,5 = 14 m². Prix : 14 × 12 = 168 €.","Si la question avait été « des plinthes à 3 € le mètre », on aurait pris le périmètre : 15 m × 3 = 45 €.","Le premier réflexe : la question porte-t-elle sur le TOUR (clôture, plinthe, bordure, ruban) ou sur la SURFACE (moquette, peinture, pelouse, carrelage) ?"],
        figure:{ type:'carrelage', L:8, l:7, legende:'14 m² × 12 € = 168 €' },
        encart:{ type:'piege', lignes:["Prix = périmètre × 12 = 15 × 12 = 180 €  ✗","Prix = aire × 12 = 14 × 12 = 168 €  ✓"] } },
      { titre:'Des figures composées', texte:["Une pièce en L : un rectangle de 6 × 4 auquel on a retiré un coin de 2 × 2. Aire = 24 − 4 = 20 m². On découpe ou on complète, puis on additionne ou on soustrait.","Une fenêtre : un rectangle de 1 m × 1,5 m surmonté d'un demi-disque de rayon 0,5 m. Aire = 1,5 + π × 0,25 ÷ 2 ≈ 1,5 + 0,39 = 1,89 m².","Le périmètre d'une figure composée suit le contour réel : attention aux côtés qui disparaissent quand deux figures se touchent."],
        figure:{ type:'carrelage', L:6, l:4, legende:'6 × 4 moins un coin 2 × 2' },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un jardin rectangulaire de 20 m × 12 m contient un bassin circulaire de 3 m de rayon. On sème du gazon partout ailleurs, à 0,80 € le m².","Surface de gazon ? Prix ?"] } },
      { titre:'Réponse', texte:["Jardin : 20 × 12 = 240 m². Bassin : π × 3² = 9π ≈ 28,3 m². Gazon : 240 − 28,3 ≈ 211,7 m².","Prix : 211,7 × 0,80 ≈ 169,40 €.","On garde la valeur exacte (240 − 9π) jusqu'au bout et on n'arrondit que pour le prix."],
        figure:{ type:'carrelage', L:10, l:6, legende:'240 m² − 9π m² ≈ 211,7 m²' },
        encart:{ type:'retenir', lignes:["carré : P = 4c, A = c² · rectangle : P = 2(L + l), A = L × l · triangle : A = b × h ÷ 2 · disque : P = 2πr, A = πr² · tour → cm, surface → cm²."] } },
    ] },
  ] };

/* ══════════════════════════════════════════════════════════════

LIVRES['Repérage temps & durées'] = { branch:'nombres', level:'6ème–5ème', figure:{ type:'horloge', h:9, m:40, anim:true },
  intro:"Le temps ne se compte pas en base 10 : soixante secondes font une minute, soixante minutes une heure, vingt-quatre heures un jour. Ce livre apprend à convertir, à calculer une durée ou une heure d'arrivée, et à ne plus confondre 1,5 h et 1 h 50.",
  competences:[

    { nom:'Les unités de temps', classe:'6ème', pages:[
      { titre:'Pourquoi 60 ?', texte:["1 jour = 24 heures. 1 heure = 60 minutes. 1 minute = 60 secondes. Ces nombres viennent des Babyloniens, qui comptaient en base 60 : 60 se divise par 2, 3, 4, 5, 6, 10, 12, 15, 20 et 30, ce qui rend les partages faciles.","Conséquence : les règles des décimaux ne marchent pas. 1 h 30 n'est pas 1,30 h. Un demi-heure, c'est 30 min ; un quart d'heure, 15 min.","1 h = 3 600 s. 1 jour = 1 440 min = 86 400 s."],
        figure:{ type:'horloge', h:10, m:15, anim:true },
        encart:{ type:'retenir', lignes:["1 j = 24 h · 1 h = 60 min · 1 min = 60 s · 1 h = 3 600 s"] } },
      { titre:'Convertir dans les deux sens', texte:["Vers une unité plus petite : on multiplie. 2 h 15 min en minutes : 2 × 60 + 15 = 135 min. 3 min 20 s en secondes : 3 × 60 + 20 = 200 s.","Vers une unité plus grande : division euclidienne par 60. 150 min = 2 × 60 + 30 → 2 h 30 min. 500 s = 8 × 60 + 20 → 8 min 20 s.","Le reste de la division euclidienne donne les minutes ou secondes restantes ; le quotient, les heures ou minutes."],
        figure:{ type:'tableau', lignes:[['2 h 15','135 min'],['150 min','2 h 30'],['500 s','8 min 20 s']] },
        encart:{ type:'piege', lignes:["150 min = 1 h 50  ✗","150 = 2 × 60 + 30 → 2 h 30  ✓"] } },
      { titre:'À toi', texte:["1. Convertis 4 h 05 en minutes, puis 2 min 45 s en secondes.","2. Convertis 200 min en h min, puis 1 000 s en min s.","3. Combien de secondes dans une journée ? Combien de minutes dans une semaine ?"],
        figure:{ type:'tableau', lignes:[['4 h 05','? min'],['200 min','? h ? min'],['1 000 s','? min ? s']] },
        encart:{ type:'exercice', titre:'Indice', lignes:["Division euclidienne par 60 pour remonter d'unité."] } },
      { titre:'Réponse', texte:["1. 4 h 05 = 245 min. 2 min 45 s = 165 s.","2. 200 = 3 × 60 + 20 → 3 h 20 min. 1 000 = 16 × 60 + 40 → 16 min 40 s.","3. Une journée : 24 × 3 600 = 86 400 s. Une semaine : 7 × 24 × 60 = 10 080 min."],
        figure:{ type:'tableau', lignes:[['4 h 05','245 min'],['200 min','3 h 20'],['1 000 s','16 min 40 s'],['1 jour','86 400 s']] } },
    ] },

    { nom:'Calculer une durée', classe:'6ème', pages:[
      { titre:'Découper le trajet', texte:["Un film commence à 14 h 25 et finit à 16 h 10. Durée ? Soustraire 14 h 25 de 16 h 10 colonne par colonne est piégeux (10 − 25 ?).","On découpe : de 14 h 25 à 15 h, il y a 35 min. De 15 h à 16 h, 1 h. De 16 h à 16 h 10, 10 min. Total : 1 h 45 min.","Passer par les heures pleines transforme un calcul difficile en trois calculs faciles."],
        figure:{ type:'axe', min:14, max:17, points:[{x:14.42,label:'14 h 25'},{x:15,label:'15 h',c:C.or},{x:16,label:'16 h',c:C.or},{x:16.17,label:'16 h 10',c:C.vert}], fleche:[14.42, 16.17, '1 h 45'] },
        encart:{ type:'methode', lignes:["1. Du départ à l'heure pleine suivante.","2. Les heures entières.","3. De la dernière heure pleine à l'arrivée. Additionner."] } },
      { titre:'La méthode de la soustraction, avec l\'emprunt', texte:["On peut aussi poser 16 h 10 − 14 h 25. Les minutes : 10 − 25 impossible ; on emprunte 1 h = 60 min : 70 − 25 = 45 min. Les heures : 15 − 14 = 1 h. Résultat 1 h 45.","C'est la même chose qu'une soustraction posée, mais on emprunte 60 et non 10.","Les deux méthodes donnent 1 h 45. Prends celle qui te paraît la plus sûre ; découper évite les emprunts."],
        figure:{ type:'tableau', lignes:[['16 h 10','→','15 h 70'],['− 14 h 25','','− 14 h 25'],['','','1 h 45']] },
        encart:{ type:'piege', lignes:["16 h 10 − 14 h 25 = 2 h 15 (on a fait 25 − 10)  ✗","1 h 45  ✓"] } },
      { titre:'Passer minuit', texte:["Un train part à 22 h 40 et arrive à 6 h 15 le lendemain. De 22 h 40 à minuit : 1 h 20. De minuit à 6 h 15 : 6 h 15. Total : 7 h 35.","Minuit est l'heure pleine qui remet le compteur à zéro : on découpe là.","Une durée de sommeil, un vol de nuit, une garde : passer minuit se traite toujours en deux morceaux."],
        figure:{ type:'tableau', lignes:[['22 h 40 → 0 h','1 h 20'],['0 h → 6 h 15','6 h 15'],['total','7 h 35']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un match commence à 20 h 45 et finit à 22 h 37 : durée ?","Léa s'endort à 22 h 50 et se réveille à 7 h 05 : combien a-t-elle dormi ?"] } },
      { titre:'Réponse', texte:["Match : 20 h 45 → 21 h : 15 min ; 21 h → 22 h : 1 h ; 22 h → 22 h 37 : 37 min. Total 1 h 52.","Sommeil : 22 h 50 → 0 h : 1 h 10 ; 0 h → 7 h 05 : 7 h 05. Total 8 h 15.","Dans les deux cas, on est passé par des heures pleines : 21 h et 22 h, puis minuit."],
        figure:{ type:'tableau', lignes:[['match','1 h 52'],['sommeil','8 h 15']] } },
    ] },

    { nom:"Calculer une heure d'arrivée", classe:'6ème–5ème', pages:[
      { titre:'Départ plus durée', texte:["Le bus part à 8 h 50 et roule 1 h 25. Arrivée ? On additionne heures et minutes séparément : 8 + 1 = 9 h, 50 + 25 = 75 min.","75 min, c'est plus qu'une heure : 75 = 60 + 15, on convertit. 9 h 75 = 10 h 15. Le bus arrive à 10 h 15.","Autre chemin : 8 h 50 + 10 min = 9 h, puis + 1 h 15 = 10 h 15. On complète d'abord jusqu'à l'heure pleine."],
        figure:{ type:'horloge', h:8, m:50, anim:true },
        encart:{ type:'piege', lignes:["8 h 50 + 1 h 25 = 9 h 75  ✗ (pas fini)","9 h 75 = 10 h 15  ✓"] } },
      { titre:'Retrouver l\'heure de départ', texte:["Un gâteau doit cuire 1 h 40 et être prêt à 19 h. Quand l'enfourner ? On recule : 19 h − 1 h 40. 19 h − 1 h = 18 h, puis − 40 min = 17 h 20.","Ou : 19 h − 40 min = 18 h 20, puis − 1 h = 17 h 20. L'ordre n'a pas d'importance, tant qu'on enlève tout.","Départ = arrivée − durée. Arrivée = départ + durée. Durée = arrivée − départ. Trois formules pour la même relation."],
        figure:{ type:'tableau', lignes:[['19 h','− 1 h','18 h'],['18 h','− 40 min','17 h 20']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un vol décolle à 23 h 35 et dure 3 h 50 : heure d'atterrissage ?","Pour arriver au collège à 8 h 05 avec 35 min de trajet, à quelle heure partir ?"] } },
      { titre:'Réponse', texte:["Vol : 23 h 35 + 25 min = minuit, reste 3 h 25 → atterrissage à 3 h 25 le lendemain.","Collège : 8 h 05 − 35 min. 8 h 05 − 5 min = 8 h, puis − 30 min = 7 h 30. Partir à 7 h 30.","Passer minuit ou reculer avant l'heure pleine : même réflexe, on découpe à l'heure ronde."],
        figure:{ type:'horloge', h:7, m:30 } },
    ] },

    { nom:'Heures décimales', classe:'5ème', pages:[
      { titre:'2,4 h, ce n\'est pas 2 h 40', texte:["Une calculatrice dit qu'un trajet dure 2,4 h. La partie décimale, 0,4, est une fraction d'heure : 0,4 h = 0,4 × 60 min = 24 min. Donc 2,4 h = 2 h 24 min.","Pourquoi ? 0,4 h = 4/10 d'heure. Et 4/10 de 60 min = 24 min.","Repères : 0,25 h = 15 min ; 0,5 h = 30 min ; 0,75 h = 45 min ; 0,1 h = 6 min."],
        figure:{ type:'tableau', lignes:[['0,1 h','0,25 h','0,5 h','0,75 h','0,4 h'],['6 min','15 min','30 min','45 min','24 min']] },
        encart:{ type:'piege', lignes:["2,4 h = 2 h 40  ✗","0,4 × 60 = 24 : 2 h 24  ✓"] } },
      { titre:'Dans l\'autre sens', texte:["1 h 45 en heures décimales : 45 min = 45/60 h = 0,75 h. Donc 1 h 45 = 1,75 h.","2 h 20 : 20/60 = 1/3 ≈ 0,333 h. Donc 2 h 20 ≈ 2,33 h. Ici l'écriture décimale n'est pas exacte.","On a besoin des heures décimales pour les calculs de vitesse : 90 km/h × 1,75 h = 157,5 km. On n'a pas le droit de multiplier 90 par 1,45 (qui serait 1 h 27)."],
        figure:{ type:'tableau', lignes:[['1 h 45','45/60','1,75 h'],['2 h 20','20/60','≈ 2,33 h'],['3 h 06','6/60','3,1 h']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Convertis 3,7 h en h min, et 0,15 h en minutes.","Convertis 2 h 36 et 5 h 12 en heures décimales."] } },
      { titre:'Réponse', texte:["3,7 h : 0,7 × 60 = 42 min → 3 h 42. 0,15 h = 0,15 × 60 = 9 min.","2 h 36 : 36/60 = 0,6 → 2,6 h. 5 h 12 : 12/60 = 0,2 → 5,2 h.","Multiplier par 60 pour aller vers les minutes, diviser par 60 pour revenir aux heures décimales."],
        figure:{ type:'tableau', lignes:[['3,7 h','3 h 42'],['0,15 h','9 min'],['2 h 36','2,6 h'],['5 h 12','5,2 h']] } },
    ] },

    { nom:'Résoudre un problème', classe:'6ème', pages:[
      { titre:'Additionner des durées', texte:["Le marathon en relais : trois coureurs mettent 1 h 12, 58 min et 1 h 05. Temps total ?","Minutes : 12 + 58 + 5 = 75 min = 1 h 15. Heures : 1 + 0 + 1 = 2 h. Total : 2 h + 1 h 15 = 3 h 15.","On additionne les minutes, on convertit les paquets de 60 en heures, on additionne les heures."],
        figure:{ type:'batons', data:[{l:'coureur 1',v:72},{l:'coureur 2',v:58},{l:'coureur 3',v:65}], max:80, legende:'en minutes · total 195 min = 3 h 15' },
        encart:{ type:'piege', lignes:["1 h 12 + 58 min = 1 h 70  ✗ (pas fini)","1 h 70 = 2 h 10  ✓"] } },
      { titre:'Un emploi du temps', texte:["Cours de 8 h 30 à 12 h 20, pause, puis de 13 h 50 à 16 h 40. Temps de cours ? Matin : 8 h 30 → 12 h 20 = 3 h 50. Après-midi : 13 h 50 → 16 h 40 = 2 h 50. Total : 6 h 40.","Pause déjeuner : 12 h 20 → 13 h 50 = 1 h 30.","Sur une semaine de 4 jours pareils : 4 × 6 h 40 = 24 h 160 min = 26 h 40."],
        figure:{ type:'tableau', lignes:[['matin','3 h 50'],['après-midi','2 h 50'],['total','6 h 40'],['× 4 jours','26 h 40']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un cycliste roule 1 h 35 le matin, fait une pause de 25 min, puis roule 2 h 45. Il est parti à 9 h 10.","Temps total sur le vélo ? Heure d'arrivée ?"] } },
      { titre:'Réponse', texte:["Sur le vélo : 1 h 35 + 2 h 45 = 3 h 80 min = 4 h 20.","Durée totale de la sortie : 4 h 20 + 25 min = 4 h 45. Arrivée : 9 h 10 + 4 h 45 = 13 h 55.","Vérification par étapes : 9 h 10 + 1 h 35 = 10 h 45 ; + 25 min = 11 h 10 ; + 2 h 45 = 13 h 55. ✓"],
        figure:{ type:'horloge', h:13, m:55 },
        encart:{ type:'retenir', lignes:["1 h = 60 min = 3 600 s · découper aux heures pleines · convertir les paquets de 60 · 0,5 h = 30 min, pas 50 · arrivée = départ + durée."] } },
    ] },
  ] };


/* ══════════════════════════════════════════════════════════════
   ENCHAÎNEMENT D'OPÉRATIONS — livre complet

LIVRES["Enchaînement d'opérations"] = { branch:'algebre', level:'6ème–4ème', figure:{ type:'machine', etapes:['× 3','+ 5'], entree:'7', valeurs:['7','21','26'], legende:'7 × 3 + 5 = 26' },
  intro:"Trois billets de 20 € plus un billet de 10 € : 3 × 20 + 10. Si on calcule de gauche à droite, on trouve 3 × 30 = 90 €, ce qui est faux. Un calcul à plusieurs opérations obéit à des priorités. Ce livre les explique, puis apprend à traduire une phrase en calcul et un calcul en phrase.",
  competences:[

    { nom:'Priorité de la multiplication et de la division', classe:'6ème', pages:[
      { titre:'Pourquoi une règle est nécessaire', texte:["Tu achètes 3 cahiers à 2 € et 1 stylo à 5 €. Total : 3 × 2 + 5. Si on lit de gauche à droite : 3 × 2 = 6, puis 6 + 5 = 11 €. Juste.","Maintenant 5 + 3 × 2 (le stylo d'abord). De gauche à droite : 5 + 3 = 8, puis 8 × 2 = 16 €. Faux ! Le stylo ne coûte pas le double.","Pour que 5 + 3 × 2 et 3 × 2 + 5 donnent le même prix, on décide : la multiplication se fait AVANT l'addition, où qu'elle soit placée. 5 + 3 × 2 = 5 + 6 = 11."],
        figure:{ type:'tableau', lignes:[['5 + 3 × 2'],['5 + 6'],['11']] },
        encart:{ type:'retenir', lignes:["× et ÷ passent avant + et −, quelle que soit leur place dans le calcul."] } },
      { titre:'Et pour la division', texte:["18 − 12 ÷ 4 : la division d'abord. 12 ÷ 4 = 3, puis 18 − 3 = 15. (Et non 6 ÷ 4 = 1,5.)","Entre deux opérations de MÊME priorité, on va de gauche à droite : 24 ÷ 4 × 2 = 6 × 2 = 12, et non 24 ÷ 8 = 3. De même 10 − 4 + 2 = 6 + 2 = 8, et non 10 − 6 = 4.","Souligne les produits et quotients avant de commencer : tu vois d'un coup d'œil dans quel ordre calculer."],
        figure:{ type:'tableau', lignes:[['24 ÷ 4 × 2','de gauche à droite','12'],['10 − 4 + 2','de gauche à droite','8'],['18 − 12 ÷ 4','÷ d\'abord','15']] },
        encart:{ type:'piege', lignes:["20 − 2 × 5 = 18 × 5 = 90  ✗","20 − 10 = 10  ✓"] } },
      { titre:'À toi', texte:["Calcule, en écrivant chaque étape :","A = 7 + 5 × 4        B = 36 ÷ 6 − 2        C = 3 × 8 − 24 ÷ 3        D = 100 − 20 × 4 + 5"],
        figure:{ type:'tableau', lignes:[['A','7 + 5 × 4'],['B','36 ÷ 6 − 2'],['C','3 × 8 − 24 ÷ 3'],['D','100 − 20 × 4 + 5']] },
        encart:{ type:'exercice', titre:'Indice', lignes:["Dans C, il y a deux opérations prioritaires : on les calcule toutes les deux avant la soustraction."] } },
      { titre:'Réponse', texte:["A = 7 + 20 = 27.","B = 6 − 2 = 4.","C = 24 − 8 = 16.","D = 100 − 80 + 5 = 20 + 5 = 25. (Pas 100 − 85 = 15 : − et + se font de gauche à droite.)"],
        figure:{ type:'tableau', lignes:[['A','27'],['B','4'],['C','16'],['D','25']] } },
    ] },

    { nom:'Calculer avec des parenthèses', classe:'6ème', pages:[
      { titre:'Les parenthèses forcent l\'ordre', texte:["Et si on veut vraiment calculer 5 + 3 d'abord, puis multiplier par 2 (par exemple deux lots contenant un stylo à 5 € et un cahier à 3 €) ? On l'écrit avec des parenthèses : (5 + 3) × 2 = 8 × 2 = 16.","Les parenthèses sont prioritaires sur tout : on calcule d'abord ce qu'elles contiennent, puis on continue avec les règles habituelles.","7 + 3 × (8 − 5) : parenthèse, 8 − 5 = 3. Puis multiplication, 3 × 3 = 9. Puis addition, 7 + 9 = 16."],
        figure:{ type:'tableau', lignes:[['7 + 3 × (8 − 5)'],['7 + 3 × 3'],['7 + 9'],['16']] },
        encart:{ type:'retenir', lignes:["Parenthèses → puis × et ÷ → puis + et −. À chaque niveau, de gauche à droite."] } },
      { titre:'Parenthèses dans des parenthèses', texte:["2 × (10 − (3 + 4)) : on commence par la parenthèse la plus INTÉRIEURE. 3 + 4 = 7. Puis 10 − 7 = 3. Puis 2 × 3 = 6.","On peut utiliser des crochets pour y voir clair : 2 × [10 − (3 + 4)]. Même règle : de l'intérieur vers l'extérieur.","Réécris le calcul à chaque étape, en remplaçant seulement ce que tu viens de calculer. Une ligne = une opération."],
        figure:{ type:'tableau', lignes:[['2 × (10 − (3 + 4))'],['2 × (10 − 7)'],['2 × 3'],['6']] },
        encart:{ type:'piege', lignes:["7 + 3 × (8 − 5) = 10 × 3 = 30  ✗ (on a additionné avant de multiplier)","7 + 9 = 16  ✓"] } },
      { titre:'À toi', texte:["Calcule :","E = (12 − 4) × (3 + 2)        F = 50 − (8 + 2 × 6)        G = 4 × [20 − (7 − 2) × 3]","Puis : place des parenthèses dans 8 − 2 × 3 + 1 pour obtenir 19, puis pour obtenir 1."],
        figure:{ type:'tableau', lignes:[['E','(12 − 4) × (3 + 2)'],['F','50 − (8 + 2 × 6)'],['G','4 × [20 − (7 − 2) × 3]']] },
        encart:{ type:'exercice', titre:'Indice', lignes:["Sans parenthèses, 8 − 2 × 3 + 1 = 3. Cherche ce qu'il faut regrouper pour obtenir 19, puis 1."] } },
      { titre:'Réponse', texte:["E = 8 × 5 = 40. F = 50 − (8 + 12) = 50 − 20 = 30. G = 4 × [20 − 5 × 3] = 4 × [20 − 15] = 4 × 5 = 20.","Pour 19 : (8 − 2) × 3 + 1 = 6 × 3 + 1 = 19. Pour 1 : 8 − (2 × 3 + 1) = 8 − 7 = 1.","D'autres placements donnent d'autres résultats : (8 − 2) × (3 + 1) = 24, 8 − 2 × (3 + 1) = 0. Les mêmes nombres et les mêmes signes, cinq résultats possibles : ce sont les parenthèses qui décident."],
        figure:{ type:'tableau', lignes:[['8 − 2 × 3 + 1','3'],['(8 − 2) × 3 + 1','19'],['8 − (2 × 3 + 1)','1'],['(8 − 2) × (3 + 1)','24'],['8 − 2 × (3 + 1)','0']] } },
    ] },

    { nom:'Traduire une phrase par une expression', classe:'5ème', pages:[
      { titre:'Le vocabulaire des opérations', texte:["« La somme de 3 et 4 » : 3 + 4. « La différence de 9 et 5 » : 9 − 5. « Le produit de 5 par 6 » : 5 × 6. « Le quotient de 20 par 4 » : 20 ÷ 4.","Chaque mot désigne une opération et ses deux nombres. « De… et… », « de… par… » encadrent les deux termes.","« Le double de 7 » : 2 × 7. « Le tiers de 12 » : 12 ÷ 3. « Le carré de 5 » : 5 × 5."],
        figure:{ type:'tableau', lignes:[['somme','+'],['différence','−'],['produit','×'],['quotient','÷']] },
        encart:{ type:'retenir', lignes:["Le premier mot de la phrase nomme l'opération qui se fait en DERNIER."] } },
      { titre:'Le premier mot est la dernière opération', texte:["« Le produit de 5 par la somme de 3 et 4 ». Le premier mot est « produit » : c'est l'opération principale, celle qui englobe le reste. On multiplie 5 par… quelque chose. Ce quelque chose est « la somme de 3 et 4 », qu'il faut calculer avant : parenthèses. 5 × (3 + 4) = 35.","« La somme du produit de 5 par 3 et de 4 » : le premier mot est « somme ». On additionne… le produit de 5 par 3, et 4. 5 × 3 + 4 = 19. Pas besoin de parenthèses : le produit est déjà prioritaire.","Deux phrases qui contiennent les mêmes nombres et les mêmes mots, deux calculs différents."],
        figure:{ type:'tableau', lignes:[['produit de 5 par la somme de 3 et 4','5 × (3 + 4)','35'],['somme du produit de 5 par 3 et de 4','5 × 3 + 4','19']] },
        encart:{ type:'piege', lignes:["« Le produit de 5 par la somme de 3 et 4 » : 5 × 3 + 4  ✗","5 × (3 + 4) : la somme doit être faite d'abord  ✓"] } },
      { titre:'Dans l\'autre sens : lire un calcul', texte:["20 ÷ (4 + 1) : la dernière opération est la division (la parenthèse se fait avant). C'est « le quotient de 20 par la somme de 4 et 1 ».","20 ÷ 4 + 1 : la dernière opération est l'addition. C'est « la somme du quotient de 20 par 4 et de 1 ».","Pour lire un calcul, on cherche l'opération qui se fait en dernier : c'est elle qui donne le premier mot."],
        figure:{ type:'tableau', lignes:[['20 ÷ (4 + 1)','le quotient de 20 par la somme de 4 et 1'],['20 ÷ 4 + 1','la somme du quotient de 20 par 4 et de 1']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Écris l'expression : « la différence entre le produit de 6 par 2 et 5 », puis « le double de la somme de 8 et 3 ».","Lis en phrase : (10 − 4) × 3, puis 10 − 4 × 3."] } },
      { titre:'Réponse', texte:["« La différence entre le produit de 6 par 2 et 5 » : 6 × 2 − 5 = 7. « Le double de la somme de 8 et 3 » : 2 × (8 + 3) = 22.","(10 − 4) × 3 : « le produit de la différence de 10 et 4 par 3 » (= 18). 10 − 4 × 3 : « la différence de 10 et du produit de 4 par 3 » (= −2).","Dans un problème, cette traduction est l'étape décisive : « 3 lots de 2 stylos à 1,50 € et 1 gomme à 0,80 € » devient 3 × 2 × 1,50 + 0,80."],
        figure:{ type:'tableau', lignes:[['6 × 2 − 5','7'],['2 × (8 + 3)','22'],['(10 − 4) × 3','18'],['10 − 4 × 3','−2']] },
        encart:{ type:'retenir', lignes:["Parenthèses → × ÷ → + − · même priorité : de gauche à droite · premier mot de la phrase = dernière opération."] } },
    ] },
  ] };

/* ══════════════════════════════════════════════════════════════
   CALCUL LITTÉRAL — livre complet
   ══════════════════════════════════════════════════════════════ */
LIVRES['Calcul littéral'] = { branch:'algebre', level:'5ème–3ème', figure:{ type:'machine', etapes:['× 3','+ 5'], entree:'x', legende:'3x + 5' },
  intro:"Un programme de calcul qu'on applique à n'importe quel nombre, l'aire d'un rectangle dont on ne connaît pas encore la largeur, une formule de prix : dès qu'un nombre est inconnu ou peut changer, on le remplace par une lettre. Ce livre apprend à écrire, réduire, développer et factoriser des expressions avec des lettres.",
  competences:[

    { nom:'Le programme de calcul', classe:'5ème', pages:[
      { titre:'Une machine à calculer', texte:["« Choisis un nombre. Multiplie-le par 3. Ajoute 5. » Avec 4 : 4 × 3 = 12, 12 + 5 = 17. Avec 10 : 35. Avec 0 : 5.","Plutôt que refaire le calcul pour chaque nombre, on décrit la machine une fois pour toutes. On appelle x le nombre de départ : après « × 3 », on a 3x ; après « + 5 », on a 3x + 5.","3x + 5 est une expression littérale : elle contient une lettre. Elle dit tout ce que fait le programme, pour tous les nombres à la fois."],
        figure:{ type:'machine', etapes:['× 3','+ 5'], entree:'x', valeurs:['4','12','17'], legende:'3x + 5 avec x = 4' },
        encart:{ type:'retenir', lignes:["3x signifie 3 × x : on n'écrit pas le signe × entre un nombre et une lettre, ni entre deux lettres."] } },
      { titre:'L\'ordre des instructions compte', texte:["« Ajoute 5, puis multiplie par 3. » Avec x : après « + 5 », on a x + 5 ; après « × 3 », il faut multiplier TOUTE la somme : 3(x + 5). Les parenthèses sont obligatoires.","Avec 4 : 3 × (4 + 5) = 27, et non 17. Deux programmes, deux expressions, deux résultats.","Tester avec un nombre concret est le meilleur moyen de vérifier qu'on a bien traduit le programme."],
        figure:{ type:'machine', etapes:['+ 5','× 3'], entree:'x', valeurs:['4','9','27'], legende:'3(x + 5) avec x = 4' },
        encart:{ type:'piege', lignes:["« Ajoute 5 puis multiplie par 3 » : 3x + 5  ✗","3(x + 5) : la multiplication porte sur toute la somme  ✓"] } },
      { titre:'Calculer la valeur d\'une expression', texte:["Calculer 2x² − 3x + 1 pour x = 4 : on remplace CHAQUE x par 4, entre parenthèses si nécessaire, et on applique les priorités. 2 × 4² − 3 × 4 + 1 = 2 × 16 − 12 + 1 = 32 − 12 + 1 = 21.","Pour x = −2 : 2 × (−2)² − 3 × (−2) + 1 = 2 × 4 + 6 + 1 = 15. Les parenthèses autour de −2 évitent les erreurs de signe.","Une expression n'a pas une valeur : elle en a une pour chaque valeur de x."],
        figure:{ type:'tableau', lignes:[['x','0','1','4','−2'],['2x² − 3x + 1','1','0','21','15']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Programme : « choisis un nombre, retire 2, multiplie le résultat par 4, ajoute le nombre de départ. » Écris l'expression, puis teste avec 5 et avec −1."] } },
      { titre:'Réponse', texte:["x → x − 2 → 4(x − 2) → 4(x − 2) + x.","Avec 5 : 4 × 3 + 5 = 17. Avec −1 : 4 × (−3) + (−1) = −12 − 1 = −13.","On peut aussi réduire l'expression : 4(x − 2) + x = 4x − 8 + x = 5x − 8. Test : 5 × 5 − 8 = 17 ✓. Réduire, c'est la compétence suivante."],
        figure:{ type:'machine', etapes:['− 2','× 4','+ x'], entree:'x', valeurs:['5','3','12','17'] } },
    ] },

    { nom:'Réduire une expression', classe:'5ème–4ème', pages:[
      { titre:'Les termes semblables', texte:["3 pommes + 2 pommes = 5 pommes. 3 pommes + 2 poires : on ne peut rien simplifier. En calcul littéral, c'est pareil : 3x + 2x = 5x, mais 3x + 2y reste 3x + 2y.","Des termes semblables ont exactement la même partie littérale : 3x et 2x (des x), 4x² et −x² (des x²), 7 et −3 (des nombres). Mais x et x² ne sont pas semblables : 3x + 2x² ne se réduit pas.","Réduire, c'est regrouper les termes semblables en additionnant leurs coefficients (les nombres devant)."],
        figure:{ type:'tableau', lignes:[['famille','x²','x','nombres'],['4x² + 3x − x² + 2x + 7 − 3','4 − 1 = 3','3 + 2 = 5','7 − 3 = 4'],['réduit','3x²','+ 5x','+ 4']] },
        encart:{ type:'retenir', lignes:["x + x = 2x   ·   x × x = x²   ·   3x + 2x = 5x   ·   3x × 2x = 6x²"] } },
      { titre:'x + x et x × x', texte:["x + x : deux fois le même nombre, c'est 2x. Avec x = 5 : 5 + 5 = 10 = 2 × 5 ✓.","x × x : le nombre multiplié par lui-même, c'est x². Avec x = 5 : 25, et non 10.","2x et x² sont différents : 2 × 5 = 10, 5² = 25. Un seul cas où ils coïncident : x = 2 (et x = 0). Confondre les deux est l'erreur la plus fréquente du chapitre."],
        figure:{ type:'tableau', lignes:[['x','1','2','3','5'],['2x','2','4','6','10'],['x²','1','4','9','25']] },
        encart:{ type:'piege', lignes:["5x + 3 − 2x + 7 = 13x (on a tout additionné)  ✗","5x − 2x = 3x et 3 + 7 = 10 : 3x + 10  ✓"] } },
      { titre:'Avec des signes moins', texte:["7x − 4 − 9x + 6 : les x : 7 − 9 = −2, donc −2x. Les nombres : −4 + 6 = 2. Résultat : −2x + 2.","Le signe fait partie du terme : dans 7x − 4 − 9x + 6, les termes sont +7x, −4, −9x, +6. On les déplace avec leur signe.","On range le résultat : d'abord les x² s'il y en a, puis les x, puis les nombres. Ce n'est pas obligatoire, mais c'est l'usage et ça évite d'oublier des termes."],
        figure:{ type:'tableau', lignes:[['7x − 4 − 9x + 6'],['(7 − 9)x + (−4 + 6)'],['−2x + 2']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Réduis : A = 6x + 2 − x + 9 ; B = 3x² − 5x + x² + 5x ; C = 4a + 3b − a − 5b ; D = 2x × 3x + x."] } },
      { titre:'Réponse', texte:["A = 5x + 11.","B = 4x² + 0x = 4x². (Les x s'annulent.)","C = 3a − 2b.","D : 2x × 3x = 6x² (on multiplie les coefficients et les lettres), donc D = 6x² + x, qu'on ne peut pas réduire davantage."],
        figure:{ type:'tableau', lignes:[['A','5x + 11'],['B','4x²'],['C','3a − 2b'],['D','6x² + x']] } },
    ] },

    { nom:'Développer : la distributivité', classe:'4ème', pages:[
      { titre:'Un rectangle coupé en deux', texte:["Un rectangle de largeur 3 et de longueur x + 4. Son aire : 3(x + 4). Coupe-le en deux rectangles : l'un de 3 par x (aire 3x), l'autre de 3 par 4 (aire 12). Aire totale : 3x + 12.","Donc 3(x + 4) = 3x + 12. Le 3 a été distribué sur chaque terme de la parenthèse. C'est la distributivité : k(a + b) = ka + kb.","Développer, c'est transformer un produit en somme. Avec un moins : 5(x − 2) = 5x − 10. Avec un moins devant : −2(x + 3) = −2x − 6."],
        figure:{ type:'carrelage', L:7, l:3, legende:'3 × (x + 4) = 3x + 12' },
        encart:{ type:'retenir', lignes:["k(a + b) = ka + kb      k(a − b) = ka − kb"] } },
      { titre:'La double distributivité', texte:["(x + 2)(x + 3) : un rectangle de côtés x + 2 et x + 3. Coupe-le en quatre : x·x, x·3, 2·x, 2·3. Aire : x² + 3x + 2x + 6 = x² + 5x + 6.","Règle : chaque terme de la première parenthèse multiplie chaque terme de la seconde. Quatre produits, puis on réduit.","(2x − 1)(x + 4) = 2x·x + 2x·4 − 1·x − 1·4 = 2x² + 8x − x − 4 = 2x² + 7x − 4. Les signes suivent la règle des signes."],
        figure:{ type:'tableau', lignes:[['×','x','+ 3'],['x','x²','3x'],['+ 2','2x','6']], legende:'x² + 3x + 2x + 6' },
        encart:{ type:'piege', lignes:["(x + 2)(x + 3) = x² + 6 (on a oublié les termes croisés)  ✗","x² + 3x + 2x + 6 = x² + 5x + 6  ✓"] } },
      { titre:'Pourquoi développer', texte:["Pour calculer vite : 7 × 103 = 7 × (100 + 3) = 700 + 21 = 721.","Pour comparer deux expressions : 3(x + 4) et 3x + 12 sont égales pour tout x ; on ne le voit qu'en développant.","Pour résoudre : dans 2(x + 1) = 5x − 7, il faut développer avant de rassembler les x."],
        figure:{ type:'tableau', lignes:[['7 × 103','7 × (100 + 3)','721'],['12 × 99','12 × (100 − 1)','1 188']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Développe et réduis : 4(2x − 5) ; −3(x + 6) ; (x + 5)(x − 2) ; (3x + 1)(2x + 4)."] } },
      { titre:'Réponse', texte:["4(2x − 5) = 8x − 20.","−3(x + 6) = −3x − 18.","(x + 5)(x − 2) = x² − 2x + 5x − 10 = x² + 3x − 10.","(3x + 1)(2x + 4) = 6x² + 12x + 2x + 4 = 6x² + 14x + 4.","Vérifie l'une d'elles avec x = 1 : (1 + 5)(1 − 2) = −6, et 1 + 3 − 10 = −6 ✓."],
        figure:{ type:'tableau', lignes:[['4(2x − 5)','8x − 20'],['−3(x + 6)','−3x − 18'],['(x + 5)(x − 2)','x² + 3x − 10'],['(3x + 1)(2x + 4)','6x² + 14x + 4']] } },
    ] },

    { nom:'Factoriser avec un facteur commun', classe:'4ème–3ème', pages:[
      { titre:'Le chemin inverse', texte:["Développer : 3(x + 4) → 3x + 12. Factoriser : 3x + 12 → 3(x + 4). On transforme une somme en produit, en mettant en évidence ce qui est commun aux termes.","Dans 3x + 12, chaque terme est un multiple de 3 : 3x = 3 × x et 12 = 3 × 4. On sort le 3 : 3(x + 4).","Vérification : on redéveloppe. 3(x + 4) = 3x + 12 ✓. Une factorisation se vérifie toujours en développant."],
        figure:{ type:'tableau', lignes:[['développer','3(x + 4)','→','3x + 12'],['factoriser','3x + 12','→','3(x + 4)']] },
        encart:{ type:'retenir', lignes:["ka + kb = k(a + b) : on cherche ce qui divise TOUS les termes."] } },
      { titre:'Le facteur commun peut contenir la lettre', texte:["6x² + 9x : 3 divise 6 et 9, mais x divise aussi 6x² et 9x. Le facteur commun le plus grand est 3x. 6x² = 3x × 2x et 9x = 3x × 3. Donc 6x² + 9x = 3x(2x + 3).","S'arrêter à 3(2x² + 3x) n'est pas faux, mais ce n'est pas fini : on peut encore sortir x.","Le facteur commun peut même être une parenthèse : (x + 1)(2x − 3) + (x + 1)(x + 5) = (x + 1)[(2x − 3) + (x + 5)] = (x + 1)(3x + 2)."],
        figure:{ type:'tableau', lignes:[['6x² + 9x','3x × 2x + 3x × 3','3x(2x + 3)']] },
        encart:{ type:'piege', lignes:["6x² + 9x = 3(2x² + 3x), terminé  ✗","3x(2x + 3) : on sort aussi le x  ✓"] } },
      { titre:'À quoi sert de factoriser', texte:["À résoudre : x² − 5x = 0 devient x(x − 5) = 0, donc x = 0 ou x = 5 (produit nul).","À calculer de tête : 17 × 23 + 17 × 77 = 17 × (23 + 77) = 17 × 100 = 1 700.","À simplifier une fraction : (6x + 9)/3 = 3(2x + 3)/3 = 2x + 3."],
        figure:{ type:'tableau', lignes:[['17 × 23 + 17 × 77','17 × 100','1 700']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Factorise : 5x + 20 ; 4x² − 6x ; 12x² + 8x ; (2x + 1)(x − 4) + (2x + 1)(3x + 2)."] } },
      { titre:'Réponse', texte:["5x + 20 = 5(x + 4).","4x² − 6x = 2x(2x − 3).","12x² + 8x = 4x(3x + 2).","(2x + 1)(x − 4) + (2x + 1)(3x + 2) = (2x + 1)[(x − 4) + (3x + 2)] = (2x + 1)(4x − 2) = 2(2x + 1)(2x − 1)."],
        figure:{ type:'tableau', lignes:[['5x + 20','5(x + 4)'],['4x² − 6x','2x(2x − 3)'],['12x² + 8x','4x(3x + 2)']] } },
    ] },

    { nom:'Les identités remarquables', classe:'3ème', pages:[
      { titre:'(a + b)² : le carré d\'une somme', texte:["Un carré de côté a + b. Coupe-le : un carré a × a, un carré b × b, et deux rectangles a × b. Aire totale : a² + 2ab + b².","Donc (a + b)² = a² + 2ab + b². Le terme du milieu, le DOUBLE produit, est celui qu'on oublie : (a + b)² n'est pas a² + b².","(x + 5)² = x² + 2 × x × 5 + 25 = x² + 10x + 25. Vérifie avec x = 1 : 6² = 36, et 1 + 10 + 25 = 36 ✓."],
        figure:{ type:'carrelage', L:5, l:5, legende:'(a + b)² = a² + 2ab + b²' },
        encart:{ type:'piege', lignes:["(x + 5)² = x² + 25  ✗","(x + 5)² = x² + 10x + 25 : le double produit  ✓"] } },
      { titre:'Les deux autres', texte:["(a − b)² = a² − 2ab + b². Même chose avec un moins au double produit : (x − 3)² = x² − 6x + 9. Le dernier terme est TOUJOURS positif : (−3)² = 9.","(a + b)(a − b) = a² − b² : les termes croisés s'annulent (+ab − ab). (x + 5)(x − 5) = x² − 25.","Trois formules, dans les deux sens : pour développer vite, et pour factoriser une expression sans facteur commun apparent."],
        figure:{ type:'tableau', lignes:[['(a + b)²','a² + 2ab + b²'],['(a − b)²','a² − 2ab + b²'],['(a + b)(a − b)','a² − b²']] },
        encart:{ type:'retenir', lignes:["Repère a et b, applique la formule terme à terme, vérifie avec x = 1 ou x = 2."] } },
      { titre:'Factoriser avec a² − b²', texte:["x² − 25 : pas de facteur commun. Mais x² − 25 = x² − 5², une différence de deux carrés : (x − 5)(x + 5).","4x² − 9 = (2x)² − 3² = (2x − 3)(2x + 3).","x² + 10x + 25 = x² + 2·x·5 + 5² = (x + 5)² : on reconnaît un carré parfait quand le terme du milieu est bien le double produit."],
        figure:{ type:'tableau', lignes:[['x² − 25','(x − 5)(x + 5)'],['4x² − 9','(2x − 3)(2x + 3)'],['x² + 10x + 25','(x + 5)²']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Développe : (x + 7)² ; (2x − 1)² ; (3x + 4)(3x − 4).","Factorise : x² − 49 ; 9x² − 1 ; x² − 6x + 9."] } },
      { titre:'Réponse', texte:["(x + 7)² = x² + 14x + 49. (2x − 1)² = 4x² − 4x + 1. (3x + 4)(3x − 4) = 9x² − 16.","x² − 49 = (x − 7)(x + 7). 9x² − 1 = (3x − 1)(3x + 1). x² − 6x + 9 = (x − 3)².","Dans (2x − 1)², a = 2x, donc a² = 4x² et 2ab = 2 × 2x × 1 = 4x. Bien identifier a avec son coefficient."],
        figure:{ type:'tableau', lignes:[['(x + 7)²','x² + 14x + 49'],['(2x − 1)²','4x² − 4x + 1'],['x² − 49','(x − 7)(x + 7)'],['x² − 6x + 9','(x − 3)²']] } },
    ] },

    { nom:'Le calcul malin', classe:'3ème', pages:[
      { titre:'Calculer de tête avec les identités', texte:["102 × 98 : écris 102 = 100 + 2 et 98 = 100 − 2. Alors 102 × 98 = (100 + 2)(100 − 2) = 100² − 2² = 10 000 − 4 = 9 996. Sans poser.","31² = (30 + 1)² = 900 + 2 × 30 + 1 = 961. 29² = (30 − 1)² = 900 − 60 + 1 = 841.","Chaque fois qu'un nombre est proche d'un nombre rond, une identité remarquable fait le calcul."],
        figure:{ type:'tableau', lignes:[['102 × 98','100² − 2²','9 996'],['31²','30² + 2·30 + 1','961'],['29²','30² − 2·30 + 1','841']] },
        encart:{ type:'piege', lignes:["31² = 30² + 1² = 901  ✗","31² = 900 + 60 + 1 = 961 : le double produit  ✓"] } },
      { titre:'À toi', texte:["Calcule sans poser : 51² ; 48 × 52 ; 999² ; 1 001 × 999.","Puis vérifie l'un des résultats à la calculatrice."],
        figure:{ type:'tableau', lignes:[['51²','?'],['48 × 52','?'],['999²','?'],['1 001 × 999','?']] },
        encart:{ type:'exercice', titre:'Indice', lignes:["51 = 50 + 1 ; 48 et 52 encadrent 50 ; 999 = 1 000 − 1."] } },
      { titre:'Réponse', texte:["51² = 2 500 + 100 + 1 = 2 601. 48 × 52 = 50² − 2² = 2 496.","999² = 1 000 000 − 2 000 + 1 = 998 001. 1 001 × 999 = 1 000 000 − 1 = 999 999.","Ces calculs impressionnent, mais ils ne sont que les identités remarquables lues à l'envers."],
        figure:{ type:'tableau', lignes:[['51²','2 601'],['48 × 52','2 496'],['999²','998 001'],['1 001 × 999','999 999']] } },
    ] },

    { nom:'Résoudre un problème', classe:'4ème', pages:[
      { titre:'L\'aire du panneau', texte:["Un panneau rectangulaire a une largeur inconnue x, et une longueur qui dépasse la largeur de 3 : x + 3. Son aire : x(x + 3) = x² + 3x. Son périmètre : 2(x + x + 3) = 4x + 6.","Si on apprend que x = 2 m : aire 2² + 6 = 10 m², périmètre 14 m. L'expression littérale a tout préparé.","Une longueur inconnue → une lettre. Les autres longueurs → des expressions en fonction de cette lettre. Puis les formules habituelles."],

      { titre:'Réponse', texte:["Rectangle : (x + 2)(x − 2) = x² − 4.","Carré : x². Le rectangle a une aire plus PETITE, de 4 exactement, quel que soit x.","Une identité remarquable dit le résultat d'un coup : (x + 2)(x − 2) = x² − 2². Le calcul littéral répond à une question qu'aucun exemple numérique ne pouvait régler seul."],

LIVRES['Inéquations'] = { branch:'algebre', level:'3ème', figure:{ type:'axe', min:-4, max:4, points:[{x:-2,label:'−2',c:C.or}], legende:'x < −2' },

  competences:[

    { nom:'Résoudre une inéquation', classe:'3ème', pages:[

      { titre:'Les mêmes gestes qu\'une équation…', texte:["2x + 5 ≤ 11. On enlève 5 des deux côtés : 2x ≤ 6. On divise par 2 : x ≤ 3.","Pourquoi c'est permis ? Si Léa a moins de billes que Tom, et qu'on leur en donne 5 à chacun, Léa en a toujours moins. Et si on double leurs billes, toujours moins. L'ordre est conservé.","Vérifie avec un nombre : x = 0 donne 5 ≤ 11 ✓ ; x = 4 donne 13 ≤ 11 ✗. Cohérent avec x ≤ 3."],
        figure:{ type:'tableau', lignes:[['2x + 5 ≤ 11'],['2x ≤ 6'],['x ≤ 3']] },
        encart:{ type:'monde', lignes:["Un ascenseur supporte 300 kg. Avec un chariot de 40 kg et des cartons de 20 kg : 40 + 20n ≤ 300, donc n ≤ 13 cartons."] } },
      { titre:'… sauf une : multiplier par un négatif', texte:["3 < 5, c'est vrai. Multiplie par −1 : −3 et −5. Or −3 > −5 ! Le sens s'est retourné. Multiplier ou diviser par un nombre NÉGATIF inverse l'inégalité.","−2x + 3 > 7 : on enlève 3, −2x > 4. On divise par −2, et on RETOURNE le signe : x < −2.","Vérifie : x = −3 donne 6 + 3 = 9 > 7 ✓. x = 0 donne 3 > 7 ✗. C'est bien x < −2."],
        figure:{ type:'axe', min:-6, max:6, points:[{x:3,label:'3',c:C.vert},{x:5,label:'5',c:C.vert},{x:-3,label:'−3',c:C.rouge},{x:-5,label:'−5',c:C.rouge}], legende:'3 < 5 mais −3 > −5' },
        encart:{ type:'piege', lignes:["−2x > 4 → x > −2  ✗","x < −2 : diviser par −2 retourne le signe  ✓"] } },
      { titre:'Éviter la division par un négatif', texte:["Autre façon de résoudre −2x + 3 > 7 : mettre les x du côté où ils seront positifs. 3 − 7 > 2x, soit −4 > 2x, soit −2 > x, c'est-à-dire x < −2. Même résultat, sans retourner de signe.","Les deux méthodes sont valables. La seconde évite l'oubli le plus fréquent.","Quand les x sont des deux côtés : 5x − 2 ≥ 8x + 7. On rassemble : −2 − 7 ≥ 8x − 5x, −9 ≥ 3x, x ≤ −3."],
        figure:{ type:'tableau', lignes:[['−2x + 3 > 7'],['3 − 7 > 2x'],['−4 > 2x'],['x < −2']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Résous : 3x − 4 < 11 ; −5x ≥ 20 ; 7 − 2x ≤ 1 ; 4x + 3 > 6x − 5."] } },
      { titre:'Réponse', texte:["3x − 4 < 11 : 3x < 15, x < 5.","−5x ≥ 20 : on divise par −5, x ≤ −4.","7 − 2x ≤ 1 : 7 − 1 ≤ 2x, 6 ≤ 2x, x ≥ 3.","4x + 3 > 6x − 5 : 3 + 5 > 2x, 8 > 2x, x < 4.","Teste chaque solution avec un nombre : c'est la seule vérification qui détecte un signe retourné à tort."],
        figure:{ type:'tableau', lignes:[['3x − 4 < 11','x < 5'],['−5x ≥ 20','x ≤ −4'],['7 − 2x ≤ 1','x ≥ 3'],['4x + 3 > 6x − 5','x < 4']] } },
    ] },

    { nom:'Représenter les solutions', classe:'3ème', pages:[
      { titre:'Colorier la droite graduée', texte:["Les solutions de x < 3 : tous les nombres à gauche de 3. On les représente en coloriant la demi-droite à gauche de 3.","Pour x ≥ 1 : on colorie à droite de 1, et 1 est compris.","Un crochet indique si la borne fait partie des solutions : [ ou ] tourné vers la partie coloriée si la borne est comprise (≤, ≥), tourné vers l'extérieur si elle est exclue (<, >)."],

        encart:{ type:'retenir', lignes:["< ou > : borne exclue, crochet vers l'extérieur.   ≤ ou ≥ : borne comprise, crochet vers l'intérieur."] } },
      { titre:'Deux bornes', texte:["−1 < x ≤ 4 : les nombres strictement plus grands que −1 ET plus petits ou égaux à 4. On colorie entre −1 et 4 ; −1 exclu (crochet ouvert), 4 compris (crochet fermé).","Un colis doit peser plus de 1 kg et au plus 5 kg : 1 < m ≤ 5.","Sur la droite, on voit d'un coup si un nombre convient : 4 oui, −1 non, 0 oui."],

      { titre:'Un problème complet', texte:["Abonnement A : 15 € + 2 € par film. Abonnement B : 3 € par film. À partir de combien de films A est-il moins cher ?","A < B : 15 + 2x < 3x, donc 15 < x. Pour plus de 15 films, A est moins cher. À 15 films exactement, ils coûtent pareil (45 €).","Les solutions sont les entiers 16, 17, 18… : dans un problème concret, on garde les solutions qui ont un sens (un nombre entier de films, une longueur positive)."],
        figure:{ type:'repere', xmin:0, xmax:25, ymin:0, ymax:60, droites:[{a:2,b:15,label:'A',c:C.rouge},{a:3,b:0,label:'B',c:C.vert}], points:[{x:15,y:45,label:'15 films'}] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un taxi facture 4 € de prise en charge plus 1,50 € par km. Avec 25 €, quelle distance maximale ?","Représente les solutions de −2 ≤ x < 3."] } },
      { titre:'Réponse', texte:["4 + 1,5d ≤ 25, donc 1,5d ≤ 21, d ≤ 14. On peut faire au plus 14 km.","−2 ≤ x < 3 : on colorie de −2 (compris, crochet fermé) à 3 (exclu, crochet ouvert).","Une inéquation se résout comme une équation, à une règle près ; elle se lit sur une droite graduée, avec des crochets qui disent si les bornes comptent."],
        figure:{ type:'axe', min:-4, max:5, points:[{x:-2,label:'[−2',c:C.vert},{x:3,label:'3[',c:C.rouge}], legende:'−2 ≤ x < 3' },
        encart:{ type:'retenir', lignes:["mêmes gestes qu'une équation · × ou ÷ par un négatif : on retourne le signe · borne comprise ≤ ≥, exclue < > · vérifier avec un nombre."] } },

LIVRES['Géométrie'] = { branch:'geometrie', level:'6ème', figure:{ type:'paralleles', angles:[] },
  intro:"Un rail de chemin de fer, le bord d'une règle, la trajectoire d'un laser : la géométrie commence par nommer précisément ce qu'on voit. Ce livre installe le vocabulaire et les notations, les droites perpendiculaires et parallèles, puis le codage des figures, sur lesquels tout le reste s'appuie.",
  competences:[

    { nom:'Droite, segment, demi-droite', classe:'6ème', pages:[
      { titre:'Trois objets, un même trait', texte:["Une droite est illimitée des deux côtés : on n'en dessine qu'un morceau, mais elle continue. Un rail de chemin de fer à perte de vue en donne l'idée. Notation : (AB), avec des parenthèses, si elle passe par A et B.","Un segment a deux extrémités : c'est le morceau entre A et B, ni plus ni moins. Le bord d'une table. Notation : [AB], avec des crochets.","Une demi-droite a une origine et continue à l'infini d'un seul côté : un rayon laser qui part de A et passe par B. Notation : [AB), crochet du côté de l'origine, parenthèse du côté ouvert."],
        figure:{ type:'tableau', lignes:[['droite','(AB)','illimitée des deux côtés'],['segment','[AB]','deux extrémités'],['demi-droite','[AB)','origine A, illimitée vers B']] },
        encart:{ type:'retenir', lignes:["Parenthèse = ça continue. Crochet = ça s'arrête. AB sans rien = la longueur du segment."] } },
      { titre:'AB, (AB), [AB] : trois choses différentes', texte:["AB sans symbole désigne la LONGUEUR du segment [AB] : un nombre, avec une unité. On écrit AB = 5 cm. On n'écrit jamais [AB] = 5 cm : un segment n'est pas un nombre.","Deux points suffisent à définir une droite : il n'en passe qu'une par A et B. C'est pour cela que (AB) suffit à la nommer. On peut aussi l'appeler (d) ou (d′).","Trois points sur une même droite sont alignés. Un point qui est sur la droite « appartient » à la droite : C ∈ (AB)."],
        figure:{ type:'tableau', lignes:[['(AB)','un objet : la droite'],['[AB]','un objet : le segment'],['AB','un nombre : 5 cm']] },
        encart:{ type:'piege', lignes:["[AB] = 5 cm  ✗ (un segment n'est pas un nombre)","AB = 5 cm  ✓"] } },
      { titre:'Le milieu', texte:["Le milieu I du segment [AB] est le point de [AB] situé à égale distance de A et de B : AI = IB = AB ÷ 2.","Deux conditions : I est SUR le segment, et à égale distance des extrémités. Un point à égale distance de A et B mais hors du segment n'est pas le milieu.","Si AB = 8 cm, alors AI = 4 cm. Sur une figure, le milieu se code par deux petits traits identiques sur [AI] et [IB]."],
        figure:{ type:'axe', min:0, max:8, etiq:2, points:[{x:0,label:'A'},{x:8,label:'B'},{x:4,label:'I',c:C.vert}], legende:'AI = IB = 4' },
        encart:{ type:'exercice', titre:'À toi', lignes:["Que désignent (MN), [MN], MN et [NM) ? Quelle différence entre [MN) et [NM) ?","I est le milieu de [RS] et RI = 3,5 cm : que vaut RS ?"] } },
      { titre:'Réponse', texte:["(MN) : la droite passant par M et N. [MN] : le segment d'extrémités M et N. MN : sa longueur. [NM) : la demi-droite d'origine N passant par M.","[MN) part de M vers N ; [NM) part de N vers M : origines différentes, sens opposés. Ce ne sont pas les mêmes demi-droites. (Alors que [MN] et [NM] sont le même segment.)","RS = 2 × RI = 7 cm."],
        figure:{ type:'tableau', lignes:[['[MN)','origine M, vers N'],['[NM)','origine N, vers M'],['[MN] = [NM]','même segment']] } },
    ] },

    { nom:'Perpendiculaires et parallèles', classe:'6ème', pages:[
      { titre:'Deux positions particulières', texte:["Deux droites qui se coupent en formant un angle droit sont perpendiculaires. Un mur et le sol, les deux traits d'une croix « + ». Notation : (d) ⊥ (d′). On code l'angle droit par un petit carré.","Deux droites qui ne se coupent jamais, même prolongées à l'infini, sont parallèles : les deux rails, les lignes d'un cahier. Notation : (d) ∥ (d′). Elles sont partout à la même distance l'une de l'autre.","Deux droites du plan sont soit sécantes (elles se coupent en un point), soit parallèles. Les perpendiculaires sont des sécantes particulières."],
        figure:{ type:'paralleles', angles:[] },
        encart:{ type:'monde', lignes:["Un carreleur trace des perpendiculaires pour aligner ses rangs ; un architecte trace des parallèles pour les murs. Toute construction commence par ces deux gestes."] } },
      { titre:'Tracer avec l\'équerre', texte:["Perpendiculaire à (d) passant par A : on pose un côté de l'angle droit de l'équerre sur (d), on fait glisser l'équerre jusqu'à ce que l'autre côté touche A, on trace.","Parallèle à (d) passant par A : on trace d'abord une perpendiculaire à (d), puis une perpendiculaire à cette perpendiculaire passant par A. Deux angles droits successifs ramènent dans la direction de (d).","Ou bien : on pose l'équerre sur (d), une règle contre l'équerre, et on fait glisser l'équerre le long de la règle jusqu'à A."],
        figure:{ type:'tableau', lignes:[['perpendiculaire','1 angle droit'],['parallèle','2 angles droits, ou glisser l\'équerre']] },
        encart:{ type:'retenir', lignes:["Par un point donné, il passe UNE seule perpendiculaire à (d), et UNE seule parallèle à (d)."] } },
      { titre:'Deux propriétés qui servent partout', texte:["Si deux droites sont perpendiculaires à une même troisième, elles sont parallèles entre elles. Deux murs perpendiculaires au sol sont parallèles.","Si deux droites sont parallèles, toute perpendiculaire à l'une est perpendiculaire à l'autre. Une traverse perpendiculaire à un rail l'est aussi à l'autre rail.","Si deux droites sont parallèles à une même troisième, elles sont parallèles entre elles."],
        figure:{ type:'tableau', lignes:[['(d1) ⊥ (Δ) et (d2) ⊥ (Δ)','⟹ (d1) ∥ (d2)'],['(d1) ∥ (d2) et (Δ) ⊥ (d1)','⟹ (Δ) ⊥ (d2)'],['(d1) ∥ (Δ) et (d2) ∥ (Δ)','⟹ (d1) ∥ (d2)']] },
        encart:{ type:'piege', lignes:["(d1) ⊥ (d2) et (d2) ⊥ (d3), donc (d1) ⊥ (d3)  ✗","(d1) ∥ (d3) : deux perpendiculaires à (d2) sont parallèles  ✓"] } },
      { titre:'À toi', texte:["1. Sur une figure, (AB) ⊥ (AC) et (DE) ⊥ (AC). Que peut-on dire de (AB) et (DE) ? Justifie.","2. (d) ∥ (d′) et (Δ) coupe (d) en formant un angle droit. Que fait (Δ) avec (d′) ?","3. Combien de parallèles à (d) passent par un point A qui n'est pas sur (d) ?"],
        figure:{ type:'paralleles', angles:[] },
        encart:{ type:'exercice', titre:'Indice', lignes:["Cite la propriété utilisée à chaque fois : c'est ce qu'on attend dans une justification."] } },
      { titre:'Réponse', texte:["1. (AB) et (DE) sont toutes deux perpendiculaires à (AC), donc elles sont parallèles : (AB) ∥ (DE).","2. (Δ) ⊥ (d) et (d) ∥ (d′), donc (Δ) ⊥ (d′).","3. Une seule. C'est ce qui rend la construction à l'équerre possible : il n'y a pas de choix à faire."],
        figure:{ type:'tableau', lignes:[['1','(AB) ∥ (DE)'],['2','(Δ) ⊥ (d′)'],['3','une seule parallèle']] } },
    ] },

    { nom:'Le vocabulaire des figures', classe:'6ème', pages:[
      { titre:'Lire le codage', texte:["Sur une figure, on ne mesure pas : on lit. Un petit carré dans un angle signifie « angle droit ». Deux segments marqués d'un même trait (ou double trait) ont la même longueur. Deux angles marqués d'un même arc sont égaux.","Le codage dit ce qui est VRAI par construction. Un dessin peut être imprécis ; le codage, non.","Si rien n'est codé, on ne sait rien : deux segments qui « ont l'air » égaux ne le sont pas forcément."],
        figure:{ type:'triangle', rect:true, cotes:{AB:'| |', CA:'| |'}, noms:['A','B','C'] },
        encart:{ type:'piege', lignes:["Deux segments semblent égaux sur le dessin, donc ils sont égaux  ✗","Seul le codage (ou une longueur donnée) permet de l'affirmer  ✓"] } },
      { titre:'Les quadrilatères', texte:["Rectangle : quatre angles droits. Losange : quatre côtés de même longueur. Carré : les deux à la fois, quatre angles droits et quatre côtés égaux.","Un carré est donc un rectangle particulier ET un losange particulier. Quand on demande « la nature la plus précise », on donne le nom qui dit le plus : carré plutôt que rectangle.","Parallélogramme : côtés opposés parallèles deux à deux. Rectangle, losange et carré en sont tous des cas particuliers."],
        figure:{ type:'tableau', lignes:[['','4 angles droits','4 côtés égaux'],['rectangle','oui','non'],['losange','non','oui'],['carré','oui','oui']] },
        encart:{ type:'retenir', lignes:["Carré ⊂ rectangle et carré ⊂ losange ; tous ⊂ parallélogramme."] } },
      { titre:'Les triangles, et construire', texte:["Triangle isocèle : deux côtés égaux (et deux angles égaux, à la base). Équilatéral : trois côtés égaux (et trois angles de 60°). Rectangle : un angle droit. Rectangle isocèle : les deux.","Construire un triangle de côtés 5, 4 et 3 cm : on trace [AB] de 5 cm, puis un arc de cercle de centre A et de rayon 4 cm, un arc de centre B et de rayon 3 cm ; leur intersection est C. Le compas reporte des longueurs.","Construire un rectangle 6 × 4 : on trace [AB] de 6 cm, deux perpendiculaires en A et en B à l'équerre, on reporte 4 cm sur chacune."],
        figure:{ type:'triangle', noms:['A','B','C'], cotes:{AB:'5 cm', CA:'4 cm', BC:'3 cm'} },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un quadrilatère a ses quatre côtés codés égaux et un angle codé droit. Quelle est sa nature précise ?","Un triangle a deux côtés codés égaux et un angle droit entre eux. Que valent ses angles ?"] } },
      { titre:'Réponse', texte:["Quatre côtés égaux → losange. Un angle droit dans un losange entraîne les quatre (ses angles opposés sont égaux, ses angles consécutifs supplémentaires) → c'est un carré.","Triangle rectangle isocèle : l'angle droit vaut 90°, les deux autres se partagent 90° à égalité : 45° chacun. C'est un demi-carré.","Le codage a permis de conclure sans mesurer : c'est le sens du chapitre."],
        figure:{ type:'triangle', rect:true, cotes:{AB:'| |', CA:'| |', BC:''}, angle:'B', angleLabel:'45°' },
        encart:{ type:'retenir', lignes:["(AB) droite · [AB] segment · [AB) demi-droite · AB longueur · ⊥ et ∥ · deux perpendiculaires à une même droite sont parallèles · on lit le codage, on ne mesure pas."] } },
    ] },
  ] };

LIVRES['Symétrie axiale'] = { branch:'geometrie', level:'6ème', figure:{ type:'symetrie', figure:[[1,2],[4,2],[3,5],[1,4]], anim:true, legende:'pliage le long de (d)' },
  intro:"Un papillon, un visage, un reflet dans l'eau : la symétrie axiale est un pliage. Ce livre montre ce qui se passe quand on plie, apprend à construire le symétrique d'un point puis d'une figure, et explique ce que la symétrie conserve.",

      { titre:'Plier la feuille', texte:["Trace une droite (d) sur une feuille, un point A d'un côté, et plie la feuille le long de (d). Le point A s'imprime de l'autre côté : c'est son symétrique A′.","Que voit-on en dépliant ? Le segment [AA′] traverse (d) à angle droit, et A et A′ sont à la même distance de (d). La droite (d) est la médiatrice de [AA′].","Un point situé SUR l'axe ne bouge pas quand on plie : il est son propre symétrique."],
        figure:{ type:'symetrie', figure:[[1,2],[4,2],[3,5],[1,4]], anim:true, legende:'chaque point passe de l\'autre côté' },
        encart:{ type:'retenir', lignes:["(AA′) ⊥ (d) et A, A′ à égale distance de (d) : (d) est la médiatrice de [AA′]."] } },
      { titre:'La construction, sur quadrillage', texte:["A est à 3 cases à gauche de l'axe (vertical), sur une ligne donnée. A′ est à 3 cases à DROITE de l'axe, sur la même ligne. On compte les cases jusqu'à l'axe, on recompte de l'autre côté.","Si l'axe est horizontal : on compte vers le haut et vers le bas. Si l'axe est en diagonale (à 45°), on suit les diagonales des cases : 3 cases en diagonale d'un côté, 3 de l'autre.","Erreur courante : continuer à s'éloigner du même côté. A′ est de l'AUTRE côté de l'axe, jamais du même."],
        figure:{ type:'symetrie', figure:[[1,3],[3,3],[3,6]], legende:'même ligne, à égale distance de l\'axe' },
        encart:{ type:'piege', lignes:["A est 2 cases à gauche de l'axe, A′ est 2 cases plus à gauche  ✗","A′ est 2 cases à DROITE de l'axe  ✓"] } },
      { titre:'La construction, sans quadrillage', texte:["Avec l'équerre : trace la perpendiculaire à (d) passant par A. Elle coupe (d) en H. Mesure AH, reporte la même longueur de l'autre côté de H : c'est A′. Vérifie : HA′ = HA.","Avec le compas seul : pique en deux points quelconques M et N de (d). Trace un arc de centre M et de rayon MA, un arc de centre N et de rayon NA, de l'autre côté de (d). Ils se coupent en A′.","La méthode au compas marche parce que tout point de l'axe est à égale distance de A et de A′."],
        figure:{ type:'tableau', lignes:[['équerre','perpendiculaire, puis reporter AH'],['compas','deux arcs depuis deux points de (d)']] },

      { titre:'Réponse', texte:["A′ : 4 cases à droite de l'axe, sur la même ligne que A. B′ : 1 case à gauche, même ligne que B. C′ = C : un point de l'axe est son propre symétrique.","AA′ = 4 + 4 = 8 cases : le double de la distance de A à l'axe.","Le symétrique d'un point à droite est à gauche, et réciproquement : le pliage échange les deux côtés."],

    { nom:'Les propriétés de la symétrie axiale', classe:'6ème', pages:[
      { titre:'Ce qui ne change pas', texte:["Quand on plie, la figure ne se déforme pas : la symétrie axiale conserve les longueurs, les angles, les aires et l'alignement. L'image d'un triangle est un triangle superposable au premier.","Le symétrique d'un segment est un segment de même longueur. Le symétrique d'un cercle est un cercle de même rayon (son centre est le symétrique du centre). Le symétrique d'une droite est une droite.","Conséquence pratique : pour construire l'image d'une figure, il suffit de construire l'image de ses points remarquables (sommets, centre) et de relier."],
        figure:{ type:'symetrie', figure:[[1,2],[4,2],[3,5],[1,4]], anim:true, legende:'même forme, même taille, retournée' },

      { titre:'La figure est retournée', texte:["Une main droite a pour symétrique une main gauche : on ne peut pas les superposer en glissant, il faut retourner la feuille. La symétrie axiale inverse l'orientation.","Sur une figure : si les sommets A, B, C se lisent dans le sens des aiguilles d'une montre, leurs images A′, B′, C′ se lisent dans l'autre sens.","C'est la différence avec la symétrie centrale et la translation, qui gardent l'orientation."],
        figure:{ type:'symetrie', figure:[[1,2],[3,2],[3,3],[2,3],[2,5],[1,5]], legende:'un « L » devient un « L » retourné' },
        encart:{ type:'monde', lignes:["Le texte d'une ambulance est écrit à l'envers sur le capot pour se lire à l'endroit dans le rétroviseur : le miroir est un axe de symétrie."] } },
      { titre:'Axe de symétrie d\'une figure', texte:["Une figure a un axe de symétrie quand le pliage le long de cet axe la superpose à elle-même. Un rectangle en a deux (les médiatrices des côtés), un carré quatre (deux médiatrices, deux diagonales), un cercle une infinité.","Un triangle isocèle en a un (la médiatrice de la base), un équilatéral trois, un triangle quelconque aucun.","Utiliser une symétrie pour justifier : si (d) est l'axe de symétrie d'un triangle ABC avec A sur l'axe, alors AB = AC, car B et C sont symétriques."],
        figure:{ type:'tableau', lignes:[['rectangle','2 axes'],['carré','4 axes'],['triangle isocèle','1 axe'],['cercle','une infinité']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["A′B′C′ est le symétrique de ABC par rapport à (d). AB = 6 cm, l'angle en C vaut 40°, l'aire de ABC vaut 12 cm².","Que valent A′B′, l'angle en C′, l'aire de A′B′C′ ? Combien d'axes de symétrie a un losange non carré ?"] } },
      { titre:'Réponse', texte:["A′B′ = 6 cm (longueurs conservées). Angle en C′ : 40° (angles conservés). Aire : 12 cm² (aires conservées).","Un losange non carré a 2 axes de symétrie : ses deux diagonales. (Ses médiatrices de côtés ne sont pas des axes, sauf s'il est carré.)","Une justification par symétrie tient en une phrase : « B′ est le symétrique de B, donc A′B′ = AB car la symétrie axiale conserve les longueurs. »"],
        figure:{ type:'tableau', lignes:[['A′B′','6 cm'],['angle C′','40°'],['aire','12 cm²'],['losange','2 axes']] },
        encart:{ type:'retenir', lignes:["pliage · (d) médiatrice de [AA′] · même ligne, de l'autre côté sur quadrillage · longueurs, angles, aires conservés · orientation inversée."] } },

LIVRES['Symétrie centrale'] = { branch:'geometrie', level:'5ème', figure:{ type:'symetrie', centre:true, figure:[[6,2],[9,2],[8,4]], anim:true, legende:'demi-tour autour de O' },
  intro:"Une carte à jouer, un S, une hélice à deux pales : ces figures se retrouvent identiques après un demi-tour. La symétrie centrale est ce demi-tour autour d'un point. Ce livre apprend à la construire et à utiliser ses propriétés, dont le parallélisme.",

      { titre:'La construction, sans quadrillage', texte:["Trace la droite (AO) et prolonge-la au-delà de O. Au compas, pique en O avec l'écartement OA, et reporte de l'autre côté : c'est A′.","Pour une figure, on fait de même pour chaque sommet, puis on relie dans le même ordre.","Vérification : les segments [AA′], [BB′], [CC′] passent tous par O et ont O pour milieu."],
        figure:{ type:'tableau', lignes:[['1','tracer (AO), prolonger'],['2','reporter OA de l\'autre côté de O'],['3','recommencer pour chaque sommet']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Sur un quadrillage, O est au centre. A est 3 cases à gauche et 2 au-dessus de O. B est 1 case à droite de O, sur sa ligne.","Où sont A′ et B′ ? Que vaut AA′ si une case fait 1 cm (pense à Pythagore) ?"] } },
      { titre:'Réponse', texte:["A′ : 3 cases à droite et 2 en dessous de O. B′ : 1 case à gauche de O, sur sa ligne.","AO : déplacement de 3 et 2, donc AO = √(3² + 2²) = √13 ≈ 3,6 cm. AA′ = 2 × AO = 2√13 ≈ 7,2 cm.","Le symétrique d'un point situé à droite de O est à gauche ; d'un point au-dessus, en dessous : tout s'inverse."],
        figure:{ type:'symetrie', centre:true, figure:[[2,2],[4,2],[2,4]], legende:'A′ symétrique de A' } },

    { nom:'Les propriétés de la symétrie centrale', classe:'5ème', pages:[
      { titre:'Ce qui est conservé', texte:["Un demi-tour ne déforme pas : la symétrie centrale conserve les longueurs, les angles, les aires, l'alignement. L'image d'un triangle est un triangle superposable.","Contrairement à la symétrie axiale, elle conserve aussi l'ORIENTATION : une main droite reste une main droite, juste tournée. On peut superposer la figure et son image en tournant le calque, sans le retourner.","Le symétrique d'un cercle est un cercle de même rayon ; le symétrique d'un segment est un segment de même longueur."],
        figure:{ type:'symetrie', centre:true, figure:[[6,2],[8,2],[8,3],[7,3],[7,5],[6,5]], anim:true, legende:'un « L » reste un « L », tourné' },

        figure:{ type:'symetrie', centre:true, figure:[[6,2],[9,3]], legende:'(A′B′) ∥ (AB)' },

      { titre:'Centre de symétrie d\'une figure', texte:["Une figure a un centre de symétrie si un demi-tour autour de ce point la superpose à elle-même. Un parallélogramme (donc un rectangle, un losange, un carré) en a un : le point où ses diagonales se coupent.","Un cercle a son centre pour centre de symétrie. Un triangle n'en a jamais. Les lettres S, N, Z, H, O ont un centre de symétrie ; A, T, E n'en ont pas.","Reconnaître un centre de symétrie, c'est repérer que chaque point a son « opposé » à égale distance de l'autre côté du centre."],
        figure:{ type:'tableau', lignes:[['parallélogramme','centre : intersection des diagonales'],['cercle','son centre'],['triangle','aucun'],['S, N, Z, H','oui'],['A, T, E','non']] },

      { titre:'Réponse', texte:["A′B′ = 5 cm, B′C′ = 7 cm, angle en A′ = 35° : longueurs et angles conservés.","(B′C′) ∥ (BC) : l'image d'une droite par une symétrie centrale est une droite parallèle. C'est la propriété qui distingue la symétrie centrale.","Les deux symétries conservent les mêmes choses ; seule la centrale garde l'orientation et rend les droites parallèles à leurs images."],
        figure:{ type:'tableau', lignes:[['','axiale','centrale'],['longueurs, angles, aires','oui','oui'],['orientation','inversée','conservée'],['droite et image','sécantes en général','parallèles']] },
        encart:{ type:'retenir', lignes:["demi-tour autour de O · O milieu de [AA′] · même déplacement de A à O puis de O à A′ · tout conservé, orientation comprise · droites images parallèles."] } },
