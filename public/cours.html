LIVRES['Fonction affine'] = { branch:'fonctions', level:'3ème', figure:{ type:'repere', xmin:-3, xmax:3, ymin:-2, ymax:6, droites:[{a:2,b:1,label:'y = 2x + 1'}], points:[{x:0,y:1,label:'b = 1'}], anim:true },
  intro:"Un abonnement plus un prix à la minute, un taxi avec prise en charge, un plombier avec déplacement : une part fixe plus une part proportionnelle. f(x) = ax + b. Sa courbe est une droite qui ne passe plus par l'origine. Ce livre apprend à lire a et b, à calculer dans les deux sens, et à retrouver une fonction affine à partir de deux points.",
  competences:[

    { nom:'Identifier a et b', classe:'3ème', pages:[
      { titre:'Une part fixe, une part qui varie', texte:["Forfait téléphone : 10 € par mois, plus 0,05 € par minute. Pour x minutes : f(x) = 0,05x + 10. Même sans appeler, on paie 10 €.","f(x) = ax + b est une fonction affine. a (ici 0,05) est le coefficient directeur : ce que coûte chaque unité de plus. b (ici 10) est l'ordonnée à l'origine : ce qu'on paie pour x = 0, car f(0) = b.","Si b = 0, on retrouve une fonction linéaire. Si a = 0, la fonction est constante : f(x) = b quel que soit x."],
        figure:{ type:'repere', xmin:0, xmax:200, ymin:0, ymax:24, droites:[{a:0.05,b:10,label:'0,05x + 10'}], points:[{x:0,y:10,label:'b = 10'}] },
        encart:{ type:'retenir', lignes:["f(x) = a x + b   ·   a = coefficient directeur (pente)   ·   b = f(0) = ordonnée à l'origine"] } },
      { titre:'Lire a et b dans une formule', texte:["f(x) = −3x + 7 : a = −3, b = 7. g(x) = 7 − 3x : la même fonction, écrite dans l'autre ordre ! a = −3 (le nombre devant x, avec son signe), b = 7.","h(x) = x − 4 : a = 1 (il y a un x seul), b = −4. k(x) = 5 − x : a = −1, b = 5. m(x) = 2x : a = 2, b = 0 (linéaire).","On repère le terme en x pour a, le terme sans x pour b, quel que soit l'ordre."],
        figure:{ type:'tableau', lignes:[['f(x)','a','b'],['7 − 3x','−3','7'],['x − 4','1','−4'],['5 − x','−1','5'],['2x','2','0']] },
        encart:{ type:'piege', lignes:["f(x) = 7 − 3x : a = 7 et b = −3  ✗","a est DEVANT x : a = −3, b = 7  ✓"] } },
      { titre:'Lire a et b sur une droite', texte:["b : là où la droite coupe l'axe vertical (l'axe des ordonnées), puisque f(0) = b.","a : la pente. On part d'un point de la droite, on avance de 1 vers la droite, et on regarde de combien on monte (ou descend) pour retrouver la droite : c'est a. Ou on avance de plusieurs unités et on divise.","Droite qui passe par (0 ; 1) et (2 ; 5) : b = 1 ; de 0 à 2 on monte de 4, donc a = 4 ÷ 2 = 2. f(x) = 2x + 1."],
        figure:{ type:'repere', xmin:-3, xmax:3, ymin:-2, ymax:6, droites:[{a:2,b:1,label:'y = 2x + 1'}], points:[{x:0,y:1,label:'b = 1'},{x:2,y:5,label:'(2 ; 5)',c:C.vert}], anim:true },
        encart:{ type:'exercice', titre:'À toi', lignes:["Donne a et b : f(x) = 4x − 9 ; g(x) = 12 − 0,5x ; h(x) = −x ; k(x) = 3.","Une droite passe par (0 ; −2) et (3 ; 4) : a et b ?"] } },
      { titre:'Réponse', texte:["f : a = 4, b = −9. g : a = −0,5, b = 12. h : a = −1, b = 0 (linéaire). k : a = 0, b = 3 (constante).","Droite : b = −2 (le point sur l'axe vertical). De x = 0 à x = 3, on monte de −2 à 4, soit 6 : a = 6 ÷ 3 = 2. Équation : y = 2x − 2.","Lire un graphique, c'est lire b sur l'axe et a par un déplacement."],
        figure:{ type:'repere', xmin:-2, xmax:4, ymin:-4, ymax:6, droites:[{a:2,b:-2,label:'y = 2x − 2'}], points:[{x:0,y:-2,label:'(0 ; −2)'},{x:3,y:4,label:'(3 ; 4)',c:C.vert}] } },
    ] },

    { nom:'Calculer des images', classe:'3ème', pages:[
      { titre:'Multiplication d\'abord, addition ensuite', texte:["f(x) = −3x + 7. f(2) = −3 × 2 + 7 = −6 + 7 = 1. La multiplication avant l'addition, comme toujours.","f(−2) = −3 × (−2) + 7 = 6 + 7 = 13. Parenthèses autour du −2.","f(0) = 7 = b, f(1) = 4 = a + b. Deux valeurs faciles pour vérifier une formule."],
        figure:{ type:'tableau', lignes:[['x','−2','0','1','2'],['−3x + 7','13','7','4','1']] },
        encart:{ type:'piege', lignes:["f(3) = 2 × 3 + 1 = 2 × 4 = 8  ✗","2 × 3 + 1 = 7 : la multiplication d'abord  ✓"] } },
      { titre:'Le tableau d\'une fonction affine', texte:["f(x) = 2x + 1 : x → 0, 1, 2, 3 donne 1, 3, 5, 7. Chaque fois que x augmente de 1, f(x) augmente de 2 : de a. Le tableau n'est pas proportionnel (3 ÷ 1 ≠ 5 ÷ 2), mais les ACCROISSEMENTS le sont.","C'est la propriété clé : quand x augmente de h, f(x) augmente de a × h. Elle permettra de retrouver a à partir de deux points.","Sur le forfait : 100 minutes de plus coûtent toujours 5 € de plus, qu'on parte de 0 ou de 300 minutes."],
        figure:{ type:'tableau', lignes:[['x','0','1','2','3'],['2x + 1','1','3','5','7'],['+1 en x','','+2','+2','+2']] },
        encart:{ type:'retenir', lignes:["Quand x augmente de 1, f(x) augmente de a. Les accroissements sont proportionnels."] } },
      { titre:'À toi', texte:["f(x) = −3x + 7, g(x) = 0,05x + 10.","1. f(5) ? f(−1) ? f(1/3) ?","2. g(120) ? g(0) ? Que représentent-ils dans le forfait téléphone ?","3. Un taxi : 4 € de prise en charge et 1,50 € par km. Écris t(x) et calcule t(12)."],
        figure:{ type:'tableau', lignes:[['f(5)','?'],['f(−1)','?'],['g(120)','?'],['t(12)','?']] },
        encart:{ type:'exercice', titre:'Indice', lignes:["Prise en charge = part fixe = b."] } },
      { titre:'Réponse', texte:["1. f(5) = −8. f(−1) = 10. f(1/3) = −1 + 7 = 6.","2. g(120) = 6 + 10 = 16 € : la facture pour 120 minutes. g(0) = 10 € : l'abonnement sans appel.","3. t(x) = 1,5x + 4. t(12) = 18 + 4 = 22 €."],
        figure:{ type:'tableau', lignes:[['f(5)','−8'],['f(−1)','10'],['g(120)','16 €'],['t(12)','22 €']] } },
    ] },

    { nom:'Déterminer un antécédent', classe:'3ème', pages:[
      { titre:'Une équation du premier degré', texte:["Antécédent de 9 par f(x) = 2x + 1 : on résout 2x + 1 = 9. On enlève b : 2x = 8. On divise par a : x = 4.","Vérification : f(4) = 9 ✓. Pour une fonction affine avec a ≠ 0, chaque nombre a exactement un antécédent : la droite coupe chaque horizontale une seule fois.","Antécédent de y : x = (y − b) ÷ a. On retire la part fixe, puis on divise par le prix unitaire."],
        figure:{ type:'machine', etapes:['× 2','+ 1'], entree:'x = ?', valeurs:['4','8','9'], legende:'on remonte : − 1 puis ÷ 2' },
        encart:{ type:'retenir', lignes:["Antécédent de y : résoudre a x + b = y, soit x = (y − b) ÷ a."] } },
      { titre:'Dans une situation', texte:["Forfait g(x) = 0,05x + 10. Avec un budget de 18 €, combien de minutes ? 0,05x + 10 = 18, 0,05x = 8, x = 160 minutes.","Taxi t(x) = 1,5x + 4. Une course a coûté 25 € : 1,5x + 4 = 25, 1,5x = 21, x = 14 km.","On connaît la sortie (le prix), on cherche l'entrée (la quantité) : c'est un antécédent."],
        figure:{ type:'tableau', lignes:[['0,05x + 10 = 18','x = 160 min'],['1,5x + 4 = 25','x = 14 km']] },
        encart:{ type:'piege', lignes:["Antécédent de 9 par f : je calcule f(9) = 19  ✗","Je résous f(x) = 9 : x = 4  ✓"] } },
      { titre:'À toi', texte:["f(x) = −3x + 7, g(x) = 0,05x + 10.","1. Antécédent de −8 par f ? de 7 par f ?","2. Antécédent de 12,50 par g ?","3. Pour quelle valeur de x a-t-on f(x) = 0 ? Que représente ce nombre sur la droite de f ?"],
        figure:{ type:'repere', xmin:-1, xmax:4, ymin:-4, ymax:8, droites:[{a:-3,b:7,label:'f'}] },
        encart:{ type:'exercice', titre:'Indice', lignes:["f(x) = 0 : le point où la droite coupe l'axe horizontal."] } },
      { titre:'Réponse', texte:["1. −3x + 7 = −8 → −3x = −15 → x = 5. −3x + 7 = 7 → x = 0.","2. 0,05x + 10 = 12,5 → 0,05x = 2,5 → x = 50 minutes.","3. −3x + 7 = 0 → x = 7/3 ≈ 2,33. C'est l'abscisse du point où la droite coupe l'axe des x : à gauche f est positive, à droite négative."],
        figure:{ type:'repere', xmin:-1, xmax:4, ymin:-4, ymax:8, droites:[{a:-3,b:7,label:'f'}], points:[{x:2.333,y:0,label:'7/3',c:C.vert}] } },
    ] },

    { nom:'Déterminer une fonction affine', classe:'3ème', pages:[
      { titre:'Deux points suffisent', texte:["Une fonction affine est une droite ; deux points déterminent une droite. Donc deux couples (x ; f(x)) suffisent à retrouver a et b.","f affine, f(1) = 5 et f(3) = 11. Quand x passe de 1 à 3 (+2), f(x) passe de 5 à 11 (+6). Chaque unité de x fait gagner 6 ÷ 2 = 3 : a = 3.","Puis b : f(1) = 3 × 1 + b = 5, donc b = 2. f(x) = 3x + 2. Vérification avec l'autre point : f(3) = 11 ✓."],
        figure:{ type:'repere', xmin:-1, xmax:4, ymin:-1, ymax:13, droites:[{a:3,b:2,label:'3x + 2'}], points:[{x:1,y:5,label:'(1 ; 5)'},{x:3,y:11,label:'(3 ; 11)',c:C.vert}] },
        encart:{ type:'retenir', lignes:["a = (f(x₂) − f(x₁)) ÷ (x₂ − x₁) : variation de f sur variation de x. Puis b avec un des points."] } },
      { titre:'La formule de a, et son sens', texte:["a = Δf ÷ Δx : la différence des images sur la différence des antécédents. L'ordre doit être le même en haut et en bas : (11 − 5) ÷ (3 − 1) ou (5 − 11) ÷ (1 − 3), les deux donnent 3.","Erreur classique : (3 − 1) ÷ (11 − 5) = 1/3, l'inverse. Le haut, ce sont les images ; le bas, les x.","a est la pente : de combien on monte quand on avance de 1. Si f(x₂) < f(x₁) alors que x₂ > x₁, a est négatif : la droite descend."],
        figure:{ type:'tableau', lignes:[['x','1','3','Δx = 2'],['f(x)','5','11','Δf = 6'],['a','','','6 ÷ 2 = 3']] },
        encart:{ type:'piege', lignes:["a = (3 − 1) ÷ (11 − 5)  ✗","a = (11 − 5) ÷ (3 − 1) : images en haut  ✓"] } },
      { titre:'À toi', texte:["1. f affine, f(2) = 7 et f(5) = 16 : f(x) ?","2. g affine, g(0) = 4 et g(4) = −4 : g(x) ?","3. Un plombier facture 70 € pour 1 h de travail et 130 € pour 3 h. Prix du déplacement (part fixe) et taux horaire ?"],
        figure:{ type:'tableau', lignes:[['1','(2 ; 7), (5 ; 16)'],['2','(0 ; 4), (4 ; −4)'],['3','(1 ; 70), (3 ; 130)']] },
        encart:{ type:'exercice', titre:'Indice', lignes:["Pour le 2, b est déjà donné : g(0) = b."] } },
      { titre:'Réponse', texte:["1. a = (16 − 7) ÷ (5 − 2) = 3. 3 × 2 + b = 7, b = 1. f(x) = 3x + 1.","2. b = 4. a = (−4 − 4) ÷ (4 − 0) = −2. g(x) = −2x + 4.","3. a = (130 − 70) ÷ (3 − 1) = 30 € par heure. 30 × 1 + b = 70, b = 40 € de déplacement. p(x) = 30x + 40."],
        figure:{ type:'tableau', lignes:[['f','3x + 1'],['g','−2x + 4'],['plombier','30x + 40']] } },
    ] },

    { nom:'Résoudre un problème', classe:'3ème', pages:[
      { titre:'Modéliser un tarif', texte:["Tout tarif « part fixe + prix unitaire » est une fonction affine : b est la part fixe, a le prix unitaire. Forfait : f(x) = 0,05x + 10. Taxi : t(x) = 1,5x + 4. Location de vélo : 5 € puis 2 € de l'heure, v(x) = 2x + 5.","Une fois la fonction écrite : une image répond à « combien ça coûte pour… », un antécédent à « combien peut-on avoir avec… ».","Un tarif proportionnel (b = 0) est linéaire ; un tarif forfaitaire (a = 0) est constant."],
        figure:{ type:'repere', xmin:0, xmax:8, ymin:0, ymax:24, droites:[{a:2,b:5,label:'2x + 5'}], points:[{x:0,y:5,label:'5 €'}] },
        encart:{ type:'methode', lignes:["1. Repérer la part fixe (b) et le prix unitaire (a).","2. Écrire f(x) = a x + b.","3. Image pour un coût, antécédent pour une quantité, équation pour comparer."] } },
      { titre:'Comparer deux offres', texte:["Cinéma : carte A à 15 € puis 2 € par film, ou tarif B sans carte à 3 € par film. A(x) = 2x + 15, B(x) = 3x.","Quand A est-elle moins chère ? 2x + 15 < 3x, soit 15 < x : à partir du 16e film. À 15 films exactement, 45 € des deux côtés : les droites se croisent en (15 ; 45).","Sur le graphique, la droite de B (linéaire, plus raide) part plus bas mais finit plus haut : la part fixe de A est rattrapée par son prix unitaire plus faible."],
        figure:{ type:'repere', xmin:0, xmax:25, ymin:0, ymax:60, droites:[{a:2,b:15,label:'A',c:C.rouge},{a:3,b:0,label:'B',c:C.vert}], points:[{x:15,y:45,label:'(15 ; 45)'}] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Salle de sport : formule 1 à 40 € par mois sans frais ; formule 2 à 25 € par mois plus 120 € d'inscription.","Écris les deux fonctions (x en mois). À partir de combien de mois la formule 2 est-elle la moins chère ?"] } },
      { titre:'Réponse', texte:["f₁(x) = 40x (linéaire). f₂(x) = 25x + 120 (affine).","f₂ < f₁ : 25x + 120 < 40x, 120 < 15x, x > 8. À partir du 9e mois, la formule 2 est moins chère. À 8 mois, égalité : 320 €.","Ce raisonnement (deux droites, leur point de croisement) revient dans toutes les comparaisons de tarifs."],
        figure:{ type:'repere', xmin:0, xmax:14, ymin:0, ymax:560, droites:[{a:40,b:0,label:'f₁',c:C.rouge},{a:25,b:120,label:'f₂',c:C.vert}], points:[{x:8,y:320,label:'(8 ; 320)'}] },
        encart:{ type:'retenir', lignes:["f(x) = a x + b · b = f(0), a = pente · image : calculer · antécédent : résoudre · a = Δf ÷ Δx · comparer = chercher le point de croisement."] } },
    ] },
  ] };

LIVRES['Bases des probabilités'] = { branch:'proba', level:'5ème–3ème', figure:{ type:'roue', anim:true, secteurs:[{label:'rouge',frac:0.5,c:C.rougeF},{label:'bleu',frac:0.3,c:C.bleuF},{label:'vert',frac:0.2,c:C.vertF}] },
  intro:"On ne sait pas quel côté d'une pièce va tomber. Mais on sait qu'à la longue, ce sera pile une fois sur deux. Le hasard a des règles. Ce livre part du dé, de la pièce, de l'urne et de la roue de kermesse pour construire la probabilité, l'événement contraire, et les expériences à deux étapes.",
  competences:[

    { nom:"Les issues d'une expérience", classe:'5ème', pages:[
      { titre:'Ce qui peut arriver', texte:["On lance un dé à six faces. On ne sait pas ce qui va sortir, mais on sait tout ce qui PEUT sortir : 1, 2, 3, 4, 5 ou 6. Chacun de ces résultats est une issue. L'ensemble des issues est l'univers : {1, 2, 3, 4, 5, 6}.","Une pièce : deux issues, pile et face. Une roue à 8 secteurs : 8 issues. Une urne avec 10 boules : 10 issues (une par boule, même si des boules ont la même couleur).","Lister les issues sans en oublier est la première étape de tout calcul de probabilité."],
        figure:{ type:'de', anim:true, legende:'6 issues' },
        encart:{ type:'retenir', lignes:["Issue = un résultat possible. Univers = l'ensemble de toutes les issues."] } },
      { titre:'Un événement regroupe des issues', texte:["« Obtenir un nombre pair » avec un dé : ce n'est pas une issue, c'est un ÉVÉNEMENT, réalisé par les issues 2, 4 et 6. On écrit A = {2, 4, 6}.","« Obtenir un multiple de 3 » : {3, 6}. « Obtenir moins de 7 » : toutes les issues, événement certain. « Obtenir 7 » : aucune issue, événement impossible.","Une issue est un événement à un seul résultat. Un événement peut en contenir zéro, un, plusieurs, ou tous."],
        figure:{ type:'tableau', lignes:[['événement','issues'],['pair','2, 4, 6'],['multiple de 3','3, 6'],['moins de 7','1 à 6 (certain)'],['obtenir 7','aucune (impossible)']] },
        encart:{ type:'piege', lignes:["« Obtenir un nombre pair » est une issue  ✗","C'est un événement, réalisé par 3 issues  ✓"] } },
      { titre:'À toi', texte:["Une urne contient 3 boules rouges, 2 bleues et 1 verte. On tire une boule.","1. Combien d'issues ? Quel est l'univers si on ne s'intéresse qu'à la couleur ?","2. Liste les issues de l'événement « ne pas tirer une rouge ».","3. Avec un dé, donne les issues de « obtenir un nombre premier »."],
        figure:{ type:'urne', rouges:3, bleues:3, legende:'6 boules' },
        encart:{ type:'exercice', titre:'Indice', lignes:["Nombres premiers entre 1 et 6 : 2, 3, 5."] } },
      { titre:'Réponse', texte:["1. 6 issues (une par boule). Si on ne regarde que la couleur : {rouge, bleu, vert}, mais ces trois issues n'ont pas la même chance (3 boules rouges contre 1 verte).","2. Les 2 bleues et la verte : 3 issues favorables.","3. {2, 3, 5}."],
        figure:{ type:'tableau', lignes:[['1','6 boules'],['2','2 bleues + 1 verte'],['3','2, 3, 5']] } },
    ] },

    { nom:"L'échelle des probabilités", classe:'5ème–4ème', pages:[
      { titre:'Un nombre entre 0 et 1', texte:["La probabilité d'un événement mesure sa chance de se produire : un nombre entre 0 et 1. 0 : impossible (obtenir 7 avec un dé). 1 : certain (obtenir moins de 7). 0,5 : une chance sur deux (pile).","On l'écrit en fraction (1/6), en décimal (≈ 0,17) ou en pourcentage (17 %). Les trois disent la même chose.","Plus la probabilité est proche de 1, plus l'événement est probable. Une probabilité de 1,2 ou de −0,3 n'existe pas."],
        figure:{ type:'axe', min:0, max:1, pas:0.25, etiq:1, points:[{x:0,label:'impossible',c:C.rouge},{x:0.5,label:'1 chance sur 2',c:C.or},{x:1,label:'certain',c:C.vert}] },
        encart:{ type:'retenir', lignes:["0 ≤ P ≤ 1   ·   P(impossible) = 0   ·   P(certain) = 1"] } },
      { titre:'La somme fait 1', texte:["Une roue a trois secteurs : rouge (P = 0,5), bleu (P = 0,3) et vert. Une des trois couleurs sort à coup sûr : les probabilités des issues s'additionnent en 1. P(vert) = 1 − 0,5 − 0,3 = 0,2.","Pour un dé équilibré, chaque face a une probabilité de 1/6, et 6 × 1/6 = 1.","Cette règle permet de trouver une probabilité manquante, et de vérifier un calcul : si les probabilités des issues ne font pas 1, il y a une erreur."],
        figure:{ type:'roue', anim:true, secteurs:[{label:'0,5',frac:0.5,c:C.rougeF},{label:'0,3',frac:0.3,c:C.bleuF},{label:'?',frac:0.2,c:C.vertF}], legende:'0,5 + 0,3 + ? = 1' },
        encart:{ type:'piege', lignes:["Une probabilité peut valoir 1,2  ✗","Jamais : toujours entre 0 et 1  ✓"] } },
      { titre:'À toi', texte:["1. Situe sur l'échelle : « il pleuvra demain à Brest en novembre », « obtenir 6 avec un dé », « le soleil se lèvera demain », « tirer une boule noire d'une urne sans boule noire ».","2. Un sac contient des jetons : P(jaune) = 0,45, P(bleu) = 0,35, le reste est rouge. P(rouge) ?","3. Écris 3/8 en décimal et en pourcentage."],
        figure:{ type:'axe', min:0, max:1, pas:0.25, etiq:1, points:[] },
        encart:{ type:'exercice', titre:'Indice', lignes:["2 : la somme fait 1."] } },
      { titre:'Réponse', texte:["1. Pluie à Brest en novembre : probable, environ 0,6. Obtenir 6 : 1/6 ≈ 0,17, peu probable. Le soleil : 1, certain. Boule noire : 0, impossible.","2. P(rouge) = 1 − 0,45 − 0,35 = 0,20.","3. 3/8 = 0,375 = 37,5 %."],
        figure:{ type:'axe', min:0, max:1, pas:0.25, etiq:1, points:[{x:0,label:'noire',c:C.rouge},{x:0.17,label:'6'},{x:0.6,label:'pluie',c:C.or},{x:1,label:'soleil',c:C.vert}] } },
    ] },

    { nom:"Calculer la probabilité d'un événement", classe:'5ème–4ème', pages:[
      { titre:'Favorables sur possibles', texte:["Quand toutes les issues ont la même chance (dé équilibré, boules indiscernables au toucher, roue à secteurs égaux), on dit qu'il y a équiprobabilité. Alors : P(A) = nombre d'issues favorables à A ÷ nombre d'issues possibles.","Dé, « obtenir un nombre pair » : 3 issues favorables (2, 4, 6) sur 6. P = 3/6 = 1/2.","Jeu de 32 cartes, « tirer un as » : 4 as sur 32 cartes. P = 4/32 = 1/8."],
        figure:{ type:'disque', parts:[{label:'as 4',frac:0.125,c:C.orF},{label:'autres 28',frac:0.875}], legende:'P(as) = 4/32 = 1/8' },
        encart:{ type:'retenir', lignes:["Équiprobabilité :  P = favorables ÷ possibles"] } },
      { titre:'L\'urne : diviser par le total', texte:["Urne : 3 rouges, 7 bleues. P(rouge) = 3 ÷ 10 = 0,3. On divise par le TOTAL des boules (10), pas par le nombre de bleues.","P(bleue) = 7/10. Vérification : 3/10 + 7/10 = 1 ✓.","Si l'énoncé dit « 3 rouges et 7 bleues », le nombre total (10) n'est pas écrit : c'est à toi de le calculer avant de diviser."],
        figure:{ type:'urne', rouges:3, bleues:7, anim:true, legende:'P(rouge) = 3/10' },
        encart:{ type:'piege', lignes:["P(rouge) = 3/7  ✗","P(rouge) = 3/10 : on divise par le total  ✓"] } },
      { titre:'Quand les secteurs ne sont pas égaux', texte:["Une roue de kermesse a un secteur « gagné » de 90° et le reste « perdu ». Il n'y a pas équiprobabilité entre gagné et perdu, mais chaque degré a la même chance : P(gagné) = 90 ÷ 360 = 1/4.","La probabilité est proportionnelle à l'angle (ou à l'aire) du secteur.","Roue à 8 secteurs égaux dont 3 gagnants : P = 3/8. Là, on compte les secteurs."],
        figure:{ type:'roue', anim:true, secteurs:[{label:'G',frac:0.125,c:C.vertF},{label:'P',frac:0.125},{label:'G',frac:0.125,c:C.vertF},{label:'P',frac:0.125},{label:'P',frac:0.125},{label:'G',frac:0.125,c:C.vertF},{label:'P',frac:0.125},{label:'P',frac:0.125}], legende:'3 gagnants sur 8' },
        encart:{ type:'exercice', titre:'À toi', lignes:["Jeu de 32 cartes : P(tirer un cœur) ? P(tirer une figure : roi, dame, valet) ? P(tirer le roi de cœur) ?","Urne : 5 rouges, 3 vertes, 2 noires. P(verte) ? P(pas noire) ?"] } },
      { titre:'Réponse', texte:["Cœur : 8 sur 32 = 1/4. Figure : 12 sur 32 = 3/8. Roi de cœur : 1/32.","Urne : total 10. P(verte) = 3/10. P(pas noire) = 8/10 = 4/5 (les rouges et les vertes).","Toujours : compter les possibles, compter les favorables, simplifier."],
        figure:{ type:'tableau', lignes:[['cœur','8/32 = 1/4'],['figure','12/32 = 3/8'],['roi de cœur','1/32'],['verte','3/10'],['pas noire','8/10']] } },
    ] },

    { nom:"L'événement contraire", classe:'4ème–3ème', pages:[
      { titre:'Tout le reste', texte:["L'événement contraire de A, noté « non A », est réalisé exactement quand A ne l'est pas. Contraire de « tirer un as » : « ne pas tirer un as ». Contraire de « obtenir 6 » : « obtenir 1, 2, 3, 4 ou 5 ».","A ou non-A se produit toujours, et jamais les deux : P(A) + P(non A) = 1. Donc P(non A) = 1 − P(A).","P(pas un as) = 1 − 1/8 = 7/8. Plus rapide que de compter 28 cartes sur 32."],
        figure:{ type:'disque', parts:[{label:'A : 1/8',frac:0.125,c:C.orF},{label:'non A : 7/8',frac:0.875}] },
        encart:{ type:'retenir', lignes:["P(non A) = 1 − P(A)"] } },
      { titre:'Ne pas confondre contraire et opposé', texte:["Le contraire de « obtenir 6 » n'est pas « obtenir 1 » : c'est tout ce qui n'est pas 6. Le contraire de « rouge » dans une urne rouge-bleu-vert n'est pas « bleu » : c'est « bleu ou vert ».","Le contraire d'« au moins un » est « aucun ». Le contraire de « moins de 3 » est « 3 ou plus ».","On l'utilise quand le contraire est plus simple à compter : « au moins une fille parmi trois enfants » se calcule par 1 − P(trois garçons)."],
        figure:{ type:'tableau', lignes:[['événement','contraire'],['obtenir 6','obtenir 1, 2, 3, 4 ou 5'],['au moins un 6','aucun 6'],['moins de 3','3 ou plus'],['rouge','bleu ou vert']] },
        encart:{ type:'piege', lignes:["Contraire de « obtenir 6 » : « obtenir 1 »  ✗","« Ne pas obtenir 6 » = {1, 2, 3, 4, 5}  ✓"] } },
      { titre:'À toi', texte:["1. Urne : 5 rouges, 3 vertes, 2 noires. P(pas rouge) par le contraire ?","2. Roue : P(gagner) = 0,15. P(perdre) ?","3. Dé : quel est le contraire de « obtenir un multiple de 3 » ? Sa probabilité ?"],
        figure:{ type:'urne', rouges:5, bleues:5, legende:'10 boules' },
        encart:{ type:'exercice', titre:'Indice', lignes:["1 − P(A) à chaque fois."] } },
      { titre:'Réponse', texte:["1. P(rouge) = 5/10, donc P(pas rouge) = 1 − 1/2 = 1/2. (Vérification : 3 vertes + 2 noires = 5 sur 10.)","2. P(perdre) = 1 − 0,15 = 0,85.","3. Contraire : « obtenir 1, 2, 4 ou 5 ». P = 4/6 = 2/3 (et 1 − 2/6 = 2/3 ✓)."],
        figure:{ type:'tableau', lignes:[['pas rouge','1/2'],['perdre','0,85'],['pas multiple de 3','2/3']] } },
    ] },

    { nom:'De la fréquence à la probabilité', classe:'3ème', pages:[
      { titre:'Quand on ne peut pas compter', texte:["Une punaise lancée retombe pointe en l'air ou sur le côté. Les deux issues n'ont pas la même chance, et rien ne permet de calculer : pas d'équiprobabilité, pas de formule.","On l'a lancée 1 000 fois : pointe en l'air 380 fois. La fréquence de « pointe en l'air » est 380/1 000 = 0,38. On ESTIME que P(pointe en l'air) ≈ 0,38.","La fréquence n'est pas la probabilité : c'est une mesure qui s'en approche."],
        figure:{ type:'batons', data:[{l:'pointe en l\'air',v:380,c:C.vertF},{l:'sur le côté',v:620}], max:700, legende:'1 000 lancers' },
        encart:{ type:'retenir', lignes:["Fréquence = nombre de fois ÷ nombre d'essais. Avec beaucoup d'essais, fréquence ≈ probabilité."] } },
      { titre:'Plus on répète, plus c\'est précis', texte:["Lance une pièce 10 fois : tu peux obtenir 7 piles (fréquence 0,7). Cent fois : environ 45 à 55 piles. Dix mille fois : entre 4 900 et 5 100, une fréquence très proche de 0,5.","La fréquence se stabilise autour de la probabilité quand le nombre d'essais grandit. C'est la loi des grands nombres.","Avec 10 lancers de punaise, on ne saurait presque rien. Avec 1 000, on a une bonne estimation. Il n'y a jamais de certitude, seulement une précision qui s'améliore."],
        figure:{ type:'batons', data:[{l:'10 lancers',v:70},{l:'100',v:54},{l:'10 000',v:50.3,c:C.vertF}], max:80, legende:'fréquence (%) de pile' },
        encart:{ type:'monde', lignes:["Météo (« 70 % de risque de pluie »), assurance, médecine, sondages : la plupart des probabilités du monde réel sont des fréquences observées sur un grand nombre de cas."] } },
      { titre:'À toi', texte:["Un joueur de basket a réussi 342 lancers francs sur 450 cette saison.","1. Estime la probabilité qu'il réussisse son prochain lancer.","2. Un autre joueur a réussi 8 sur 10. Est-il « meilleur » ? Que manque-t-il pour le dire ?","3. Une pièce donne 60 piles sur 100 lancers : est-elle truquée ?"],
        figure:{ type:'batons', data:[{l:'joueur 1',v:76,c:C.vertF},{l:'joueur 2',v:80}], max:100, legende:'réussite en %' },
        encart:{ type:'exercice', titre:'Indice', lignes:["Compare le nombre d'essais, pas seulement les fréquences."] } },
      { titre:'Réponse', texte:["1. 342/450 = 0,76. P ≈ 0,76 (76 %).","2. Sa fréquence est plus haute (0,8), mais sur 10 lancers seulement : trop peu pour conclure. Après 450 lancers, on saura. Une fréquence n'est fiable qu'avec beaucoup d'essais.","3. 60 sur 100 est possible avec une pièce équilibrée (les écarts de cet ordre arrivent). Pour soupçonner un trucage, il faudrait 6 000 piles sur 10 000."],
        figure:{ type:'tableau', lignes:[['342/450','0,76'],['8/10','pas assez d\'essais'],['60/100','pas concluant']] } },
    ] },

    { nom:'Une expérience à deux épreuves', classe:'3ème', pages:[
      { titre:'Deux pièces : quatre chemins', texte:["On lance deux pièces. Résultat : un COUPLE, comme (pile, face). Les issues sont PP, PF, FP, FF : quatre, toutes équiprobables. Attention : PF et FP sont deux issues différentes (la première pièce n'est pas la seconde).","« Exactement un pile » : PF et FP, 2 sur 4, P = 1/2. « Deux piles » : PP, 1/4. « Au moins un pile » : 3/4 (ou 1 − P(FF) = 1 − 1/4).","Un arbre ou un tableau liste tous les couples sans en oublier."],
        figure:{ type:'arbre', n1:[{l:'P',p:'1/2'},{l:'F',p:'1/2'}], n2:[{l:'P',p:'1/2'},{l:'F',p:'1/2'}] },
        encart:{ type:'piege', lignes:["Deux pièces : les issues sont « 2 piles, 1 pile, 0 pile », chacune 1/3  ✗","PP, PF, FP, FF : « 1 pile » compte deux chemins, P = 1/2  ✓"] } },
      { titre:'Multiplier le long d\'un chemin', texte:["Urne : 2 rouges, 3 bleues. On tire une boule, on la remet, on retire. P(rouge puis rouge) ? Chaque tirage a P(rouge) = 2/5. Le long du chemin rouge-rouge, on multiplie : 2/5 × 2/5 = 4/25.","P(une rouge et une bleue, dans n'importe quel ordre) : chemins RB et BR, 2/5 × 3/5 + 3/5 × 2/5 = 12/25. On ADDITIONNE les chemins favorables.","Dé puis pièce : 6 × 2 = 12 couples. P(6 et pile) = 1/6 × 1/2 = 1/12."],
        figure:{ type:'arbre', n1:[{l:'R',p:'2/5'},{l:'B',p:'3/5'}], n2:[{l:'R',p:'2/5'},{l:'B',p:'3/5'}] },
        encart:{ type:'retenir', lignes:["Sur un arbre : on MULTIPLIE le long d'un chemin, on ADDITIONNE les chemins favorables."] } },
      { titre:'Sans remise : le second tirage change', texte:["Même urne, mais on ne remet pas la boule. Premier tirage : P(rouge) = 2/5. S'il était rouge, il reste 1 rouge et 3 bleues sur 4 : P(rouge au second) = 1/4. Chemin RR : 2/5 × 1/4 = 2/20 = 1/10.","Les probabilités du second niveau dépendent du premier. L'arbre reste le bon outil : on écrit sur chaque branche la probabilité du moment.","Avec remise, les deux tirages sont indépendants ; sans remise, ils ne le sont pas."],
        figure:{ type:'arbre', n1:[{l:'R',p:'2/5'},{l:'B',p:'3/5'}], n2:[{l:'R',p:'1/4 ou 2/4'},{l:'B',p:'3/4 ou 2/4'}] },
        encart:{ type:'exercice', titre:'À toi', lignes:["On lance un dé deux fois. P(deux 6) ? P(au moins un 6) ? P(la somme fait 3) ?"] } },
      { titre:'Réponse', texte:["Deux 6 : 1/6 × 1/6 = 1/36.","Au moins un 6 : contraire de « aucun 6 » : 1 − 5/6 × 5/6 = 1 − 25/36 = 11/36.","Somme 3 : couples (1 ; 2) et (2 ; 1), 2 chemins sur 36 : 1/18."],
        figure:{ type:'tableau', lignes:[['deux 6','1/36'],['au moins un 6','11/36'],['somme 3','2/36 = 1/18']] },
        encart:{ type:'retenir', lignes:["issues et événements · 0 ≤ P ≤ 1, somme = 1 · favorables/possibles · P(non A) = 1 − P(A) · fréquence ≈ probabilité à la longue · arbre : × sur un chemin, + entre chemins."] } },
    ] },
  ] };

LIVRES['Organisation des données'] = { branch:'stats', level:'6ème', figure:{ type:'batons', data:[{l:'bus',v:10},{l:'vélo',v:6},{l:'à pied',v:16},{l:'voiture',v:14}] },
  intro:"Comment viennent les élèves au collège ? Un sondage, une liste de réponses en vrac, puis un tableau, puis un diagramme : les données brutes deviennent lisibles. Ce livre apprend à compter (effectifs), à comparer (fréquences), à lire et à construire les diagrammes.",
  competences:[

    { nom:'Analyser des données', classe:'6ème', pages:[
      { titre:'Des réponses en vrac au tableau', texte:["On a demandé à 46 élèves comment ils viennent au collège. Les réponses arrivent en vrac : bus, vélo, à pied, bus, voiture… On les trie dans un tableau : bus 10, vélo 6, à pied 16, voiture 14.","Chaque nombre est un EFFECTIF : combien d'élèves dans la catégorie. La somme des effectifs est l'effectif total : 10 + 6 + 16 + 14 = 46.","Le tableau répond déjà à des questions : la catégorie la plus fréquente (à pied), la moins fréquente (vélo)."],
        figure:{ type:'tableau', lignes:[['moyen','bus','vélo','à pied','voiture','total'],['effectif','10','6','16','14','46']] },
        encart:{ type:'retenir', lignes:["Effectif = nombre d'individus dans la catégorie. Effectif total = somme des effectifs."] } },
      { titre:'La fréquence : comparer des groupes de tailles différentes', texte:["10 élèves en bus sur 46 : la fréquence est 10/46 ≈ 0,22, soit 22 %. Dans un autre collège, 30 élèves en bus sur 200 : 15 %. Le second collège a plus d'élèves en bus, mais une proportion plus faible.","Fréquence = effectif ÷ effectif total. En fraction, en décimal ou en pourcentage. La somme des fréquences fait toujours 1 (100 %).","Les effectifs disent « combien », les fréquences disent « quelle part »."],
        figure:{ type:'tableau', lignes:[['moyen','bus','vélo','à pied','voiture'],['effectif','10','6','16','14'],['fréquence','22 %','13 %','35 %','30 %']] },
        encart:{ type:'piege', lignes:["Fréquence = total ÷ effectif  ✗","Fréquence = effectif ÷ total  ✓"] } },
      { titre:'Lire un diagramme', texte:["Diagramme en bâtons : la hauteur de chaque bâton est l'effectif (lire sur l'axe vertical). Le plus haut bâton est la catégorie la plus fréquente.","Diagramme circulaire : chaque secteur est une catégorie, son angle est proportionnel à l'effectif. Un quart de disque = 25 % du total ; un demi-disque = 50 %.","Un graphique se lit avec son titre, sa légende et ses axes : sans l'échelle de l'axe, un bâton ne dit rien."],
        figure:{ type:'batons', data:[{l:'bus',v:10},{l:'vélo',v:6},{l:'à pied',v:16,c:C.vertF},{l:'voiture',v:14}], legende:'le plus haut : à pied' },
        encart:{ type:'exercice', titre:'À toi', lignes:["Résultats d'un sondage sur le sport préféré (60 élèves) : foot 24, basket 12, natation 9, autre 15.","Vérifie le total. Calcule la fréquence de chaque sport en %. Quel sport dépasse un tiers des élèves ?"] } },
      { titre:'Réponse', texte:["Total : 24 + 12 + 9 + 15 = 60 ✓.","Foot : 24/60 = 40 %. Basket : 20 %. Natation : 15 %. Autre : 25 %. Somme : 100 % ✓.","Un tiers, c'est 33 % : seul le foot dépasse (40 %)."],
        figure:{ type:'disque', parts:[{label:'foot 40 %',frac:0.4,c:C.vertF},{label:'basket 20 %',frac:0.2,c:C.bleuF},{label:'natation 15 %',frac:0.15,c:C.orF},{label:'autre 25 %',frac:0.25}] } },
    ] },

    { nom:'Construire un diagramme', classe:'6ème', pages:[
      { titre:'Le diagramme en bâtons', texte:["Un bâton par catégorie, tous de même largeur, séparés. La hauteur est l'effectif, lue sur un axe vertical gradué régulièrement.","Choisir l'échelle : l'effectif maximal est 16 ; si l'axe fait 8 cm, on prend 1 cm pour 2 élèves. Le bâton « bus » (10 élèves) mesure 10 ÷ 2 = 5 cm.","Titre, nom des catégories sous chaque bâton, graduations sur l'axe : sans cela, le diagramme ne se lit pas."],
        figure:{ type:'batons', data:[{l:'bus',v:10},{l:'vélo',v:6},{l:'à pied',v:16},{l:'voiture',v:14}], legende:'1 cm pour 2 élèves' },
        encart:{ type:'piege', lignes:["1 cm pour 2 élèves : bâton « bus » de 10 cm  ✗","10 ÷ 2 = 5 cm  ✓"] } },
      { titre:'Le diagramme circulaire', texte:["Le disque entier représente le total (100 %, 360°). Chaque secteur a un angle proportionnel à l'effectif : angle = effectif ÷ total × 360.","Bus : 10/46 × 360 ≈ 78°. À pied : 16/46 × 360 ≈ 125°. On vérifie que la somme des angles fait 360°.","On trace au rapporteur, secteur après secteur, à partir d'un rayon. Un diagramme circulaire montre les PARTS d'un tout ; un diagramme en bâtons COMPARE des quantités."],
        figure:{ type:'disque', parts:[{label:'bus 78°',frac:0.217,c:C.bleuF},{label:'vélo 47°',frac:0.13,c:C.orF},{label:'à pied 125°',frac:0.348,c:C.vertF},{label:'voiture 110°',frac:0.304}] },
        encart:{ type:'retenir', lignes:["angle du secteur = effectif ÷ total × 360°"] } },
      { titre:'À toi', texte:["Sports préférés (60 élèves) : foot 24, basket 12, natation 9, autre 15.","1. Calcule l'angle de chaque secteur pour un diagramme circulaire.","2. Pour un diagramme en bâtons avec 1 cm pour 4 élèves, quelle hauteur pour chaque bâton ?","3. Quel diagramme choisir pour montrer que le foot est « presque la moitié » ?"],
        figure:{ type:'batons', data:[{l:'foot',v:24},{l:'basket',v:12},{l:'natation',v:9},{l:'autre',v:15}] },
        encart:{ type:'exercice', titre:'Indice', lignes:["Foot : 24/60 × 360."] } },
      { titre:'Réponse', texte:["1. Foot : 144°. Basket : 72°. Natation : 54°. Autre : 90°. Somme : 360° ✓.","2. Foot 6 cm, basket 3 cm, natation 2,25 cm, autre 3,75 cm.","3. Le circulaire : on voit que le secteur foot (144°) approche le demi-disque (180°). Les parts d'un tout se voient mieux sur un disque."],
        figure:{ type:'disque', parts:[{label:'foot 144°',frac:0.4,c:C.vertF},{label:'basket 72°',frac:0.2,c:C.bleuF},{label:'natation 54°',frac:0.15,c:C.orF},{label:'autre 90°',frac:0.25}] },
        encart:{ type:'retenir', lignes:["effectif = combien · fréquence = effectif/total, somme 1 · bâtons : hauteur = effectif, choisir l'échelle · circulaire : angle = fréquence × 360°."] } },
    ] },
  ] };

LIVRES['Statistiques'] = { branch:'stats', level:'5ème–4ème', figure:{ type:'batons', data:[{l:'8',v:8},{l:'11',v:11},{l:'12',v:12},{l:'14',v:14},{l:'15',v:15}], max:20, legende:'moyenne 12' },
  intro:"Cinq notes, dix températures, mille salaires : comment résumer une série de nombres en un ou deux ? La moyenne, la médiane et l'étendue répondent chacune à une question différente. Ce livre explique laquelle choisir, et pourquoi la moyenne peut mentir.",
  competences:[

    { nom:'La fréquence', classe:'5ème', pages:[
      { titre:'Une part du total', texte:["Dans une classe de 30 élèves, 18 pratiquent un sport. Effectif : 18. Fréquence : 18 ÷ 30 = 0,6, soit 60 %.","La fréquence rend comparables des groupes de tailles différentes : 18 sur 30 (60 %) contre 40 sur 80 (50 %). Plus d'élèves sportifs dans le second groupe, mais une proportion plus faible.","La somme des fréquences de toutes les catégories vaut 1, ou 100 %."],
        figure:{ type:'barre', n:10, k:6, legende:'18/30 = 60 %', total:'30 élèves' },
        encart:{ type:'retenir', lignes:["fréquence = effectif ÷ effectif total   ·   somme des fréquences = 1"] } },
      { titre:'Fréquence d\'une valeur dans une série', texte:["Notes d'un devoir : 8, 11, 12, 12, 14, 12, 15, 8, 12, 10. Effectif de la note 12 : 4. Effectif total : 10. Fréquence de 12 : 4/10 = 40 %.","On peut regrouper en tableau : valeur 8 (effectif 2), 10 (1), 11 (1), 12 (4), 14 (1), 15 (1). Les effectifs font 10, les fréquences font 100 %.","Fréquence cumulée : la part des notes inférieures ou égales à 12 est (2 + 1 + 1 + 4)/10 = 80 %."],
        figure:{ type:'tableau', lignes:[['note','8','10','11','12','14','15'],['effectif','2','1','1','4','1','1'],['fréquence','20 %','10 %','10 %','40 %','10 %','10 %']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Sur 200 clients, 120 ont payé par carte, 50 en espèces, le reste par chèque.","Fréquence de chaque moyen de paiement ? Quelle part n'a pas payé en espèces ?"] } },
      { titre:'Réponse', texte:["Chèque : 200 − 170 = 30. Carte : 60 %. Espèces : 25 %. Chèque : 15 %.","Pas en espèces : 100 − 25 = 75 % (ou 60 + 15).","La somme 60 + 25 + 15 = 100 % confirme qu'aucune catégorie n'a été oubliée."],
        figure:{ type:'disque', parts:[{label:'carte 60 %',frac:0.6,c:C.bleuF},{label:'espèces 25 %',frac:0.25,c:C.orF},{label:'chèque 15 %',frac:0.15}] } },
    ] },

    { nom:'La moyenne', classe:'4ème', pages:[
      { titre:'Répartir équitablement', texte:["Cinq amis ont 8, 11, 12, 14 et 15 billes. S'ils mettaient tout en commun et se partageaient équitablement, chacun aurait (8 + 11 + 12 + 14 + 15) ÷ 5 = 60 ÷ 5 = 12 billes. C'est la moyenne.","Moyenne = somme des valeurs ÷ nombre de valeurs. Elle « nivelle » : les grandes valeurs donnent aux petites.","La moyenne est toujours entre le minimum et le maximum de la série. Si tu trouves 25 pour des notes entre 8 et 15, il y a une erreur."],
        figure:{ type:'batons', data:[{l:'8',v:8},{l:'11',v:11},{l:'12',v:12,c:C.vertF},{l:'14',v:14},{l:'15',v:15}], max:20, legende:'nivelé à 12' },
        encart:{ type:'retenir', lignes:["moyenne = somme des valeurs ÷ nombre de valeurs"] } },
      { titre:'Ce que la moyenne ne dit pas', texte:["Deux séries : 10, 10, 10, 10 et 0, 5, 15, 20. Même moyenne, 10. La première est régulière, la seconde très dispersée. La moyenne ne voit pas la dispersion.","Salaires d'une petite entreprise : 1 500, 1 600, 1 700, 1 800 et 12 000 (le patron). Moyenne : 3 720 €. Aucun employé ne gagne ça : une seule grande valeur tire la moyenne vers le haut.","La moyenne est sensible aux valeurs extrêmes. Pour ces cas, on regarde la médiane."],
        figure:{ type:'batons', data:[{l:'1 500',v:1500},{l:'1 600',v:1600},{l:'1 700',v:1700},{l:'1 800',v:1800},{l:'12 000',v:12000,c:C.rougeF}], max:13000, legende:'moyenne 3 720 : personne ne la gagne' },
        encart:{ type:'piege', lignes:["Moyenne de 12 ; 15 ; 9 ; 16 = 52 ÷ 3  ✗","52 ÷ 4 = 13 : on divise par le NOMBRE de valeurs  ✓"] } },
      { titre:'À toi', texte:["1. Températures de la semaine : 12, 15, 9, 16, 14, 11, 7. Moyenne ?","2. Un élève a 11, 13 et 9. Quelle note au quatrième devoir pour avoir 12 de moyenne ?","3. Après cinq matchs, une équipe a marqué 2 buts en moyenne. Combien en tout ?"],
        figure:{ type:'batons', data:[{l:'lu',v:12},{l:'ma',v:15},{l:'me',v:9},{l:'je',v:16},{l:'ve',v:14},{l:'sa',v:11},{l:'di',v:7}], max:18, legende:'°C' },
        encart:{ type:'exercice', titre:'Indice', lignes:["2 : la somme des quatre notes doit valoir 4 × 12 = 48."] } },
      { titre:'Réponse', texte:["1. Somme 84, ÷ 7 = 12 °C.","2. Somme visée 48. Il a déjà 33. Il lui faut 48 − 33 = 15.","3. 2 × 5 = 10 buts. La moyenne fois le nombre de valeurs redonne la somme."],
        figure:{ type:'tableau', lignes:[['1','12 °C'],['2','15'],['3','10 buts']] } },
    ] },

    { nom:'La moyenne pondérée', classe:'5ème–3ème', pages:[
      { titre:'Quand les valeurs n\'ont pas le même poids', texte:["Contrôle coefficient 3 : 14. Interro coefficient 1 : 8. Moyenne ? Le contrôle « compte triple » : c'est comme trois notes de 14 et une de 8. (14 + 14 + 14 + 8) ÷ 4 = 50 ÷ 4 = 12,5.","Écrit avec les coefficients : (14 × 3 + 8 × 1) ÷ (3 + 1) = 50 ÷ 4 = 12,5. On multiplie chaque valeur par son coefficient, on additionne, on divise par la SOMME des coefficients.","Diviser par 2 (le nombre de notes) donnerait 11 : faux, car les deux notes ne pèsent pas pareil."],
        figure:{ type:'tableau', lignes:[['note','14','8'],['coef','3','1'],['produit','42','8']], legende:'50 ÷ 4 = 12,5' },
        encart:{ type:'retenir', lignes:["moyenne pondérée = Σ (valeur × coefficient) ÷ Σ coefficients"] } },
      { titre:'Avec des effectifs', texte:["Notes d'une classe : 10 (5 élèves), 14 (10 élèves), 18 (5 élèves). Les effectifs jouent le rôle des coefficients : (10 × 5 + 14 × 10 + 18 × 5) ÷ (5 + 10 + 5) = (50 + 140 + 90) ÷ 20 = 280 ÷ 20 = 14.","C'est la moyenne des 20 notes individuelles, calculée sans les écrire une à une.","Un tableau valeur / effectif se traite toujours ainsi : ligne des produits, somme, division par l'effectif total."],
        figure:{ type:'tableau', lignes:[['note','10','14','18'],['effectif','5','10','5'],['produit','50','140','90']], legende:'280 ÷ 20 = 14' },
        encart:{ type:'piege', lignes:["(10 + 14 + 18) ÷ 3 = 14 : par chance juste ici, mais faux en général  ✗","Σ (note × effectif) ÷ effectif total  ✓"] } },
      { titre:'À toi', texte:["1. Maths coef 4 : 12 ; français coef 3 : 9 ; sport coef 1 : 16. Moyenne ?","2. Un commerçant vend 30 articles à 5 €, 20 à 8 € et 10 à 12 €. Prix moyen d'un article ?","3. Une classe de 25 a 11 de moyenne, une autre de 15 a 13. Moyenne des 40 élèves ?"],
        figure:{ type:'tableau', lignes:[['coef','4','3','1'],['note','12','9','16']] },

   Les leçons ci-dessus sont celles des maths. Si la matière courante
   apporte sa propre banque, elle s'y substitue entièrement : on ne veut
   pas voir Pythagore dans l'espace physique-chimie.
   LESSONS et BRANCHES sont des const : on les vide et on les remplit,
   plutôt que de les réaffecter. */
(function remplacerBanqueMatiere() {
  if (!window.MB_MAT || MB_MAT.estMaths()) return;
  const banque = (window.COURS_PAR_MATIERE || {})[MB_MAT.id];
  if (!banque || !banque.lecons || !banque.lecons.length) return;
  LESSONS.length = 0;
  banque.lecons.forEach(l => LESSONS.push(l));
  if (banque.branches && banque.branches.length) {
    BRANCHES.length = 0;
    banque.branches.forEach(b => BRANCHES.push(b));
  }
  window.MB_SANS_COURS = false;
})();

// ─── LECTEUR DE PAGES ─────────────────────────────────────
let currentLesson = null;
let currentStep   = 0;
let animTimer     = null;
let t0            = 0;

const canvas  = document.getElementById('board');
const ctx     = canvas.getContext('2d');

function resizeCanvas() {
  const wrap = canvas.parentElement;
  canvas.width  = wrap.clientWidth;
  /* Cadre plus haut que 16:9 pour laisser de la place à l'encart ; borné
     pour que les commandes restent visibles sous le tableau. */
  canvas.height = Math.round(Math.min(wrap.clientWidth * 0.68, window.innerHeight - 190));
  if (currentLesson) renderFrame();
}
function renderFrame() {
  const page = currentLesson.steps[currentStep];
  const t = (performance.now() - t0) / 1000;
  if (page.draw) page.draw(ctx, canvas.width, canvas.height, 1);
  else dessinerPage(ctx, canvas.width, canvas.height, page, t);
}
/* Une page dont l'illustration est animée se redessine en boucle,
   lentement ; les autres ne sont dessinées qu'une fois. */
function boucle() {
  cancelAnimationFrame(animTimer);
  renderFrame();
  const page = currentLesson.steps[currentStep];
  if (page.figure && page.figure.anim) animTimer = requestAnimationFrame(boucle);
}
/* ── Progression de lecture ──────────────────────────────────
   Enregistrée par élève (serveur si connecté, sinon localStorage) :
   dernière page vue et lecture terminée, par livre. */
const PROG = {};
const PROG_CLE = 'mb_cours_prog_' + (window.MB_MAT ? MB_MAT.id : 'maths');
function progLocale(){ try { return JSON.parse(localStorage.getItem(PROG_CLE) || '{}'); } catch(e){ return {}; } }
function progServeur(){ return !!(window.MB_AUTH && MB_AUTH.user() && !MB_AUTH.isDemo()); }
async function chargerProgression(){
  Object.assign(PROG, progLocale());
  if (!progServeur()) return;
  try {
    const res = await MB_AUTH.apiFetch('/cours/progression?matiere=' + encodeURIComponent(MB_MAT.id));
    if (res.ok){ const d = await res.json(); Object.assign(PROG, d.progression || {}); }
  } catch(e){}
}
let progTimer = null;
function enregistrerProgression(){
  if (!currentLesson) return;
  const total = currentLesson.steps.length, page = currentStep + 1;
  const p = PROG[currentLesson.id] || { page: 0, total, terminee: false };
  p.page = Math.max(p.page, page); p.total = total; p.terminee = p.terminee || page >= total;
  p.derniere = page;
  PROG[currentLesson.id] = p;
  try { localStorage.setItem(PROG_CLE, JSON.stringify(PROG)); } catch(e){}
  if (!progServeur()) return;
  clearTimeout(progTimer);
  progTimer = setTimeout(() => {
    MB_AUTH.apiFetch('/cours/progression', { method:'POST', body: JSON.stringify({ matiere: MB_MAT.id, lecon: currentLesson.id, page: p.derniere, total, terminee: p.terminee }) }).catch(() => {});
  }, 800);
}

/* ── Boutons « s'entraîner » : vers la séance filtrée sur la famille ── */
function montrerExos(page){
  const host = document.getElementById('player-exos');
  const fam = currentLesson.familles || [];
  const derniere = currentStep === currentLesson.steps.length - 1;
  const aToi = page.encart && page.encart.type === 'exercice';
  if (!fam.length || !(aToi || derniere)){ host.hidden = true; host.innerHTML = ''; return; }
  const lien = f => { const h = 'app.html#entrainement?chapitre=' + encodeURIComponent(currentLesson.chapter) + '&famille=' + encodeURIComponent(f); return window.MB_MAT ? MB_MAT.lien(h) : h; };
  host.innerHTML = '<span class="player-exos-l">S\'entraîner</span>' + fam.slice(0, 4).map(f => `<a href="${lien(f)}">${f} →</a>`).join('');
  host.hidden = false;
}

function startStep() {
  cancelAnimationFrame(animTimer);
  const page = currentLesson.steps[currentStep];
  t0 = performance.now();
  montrerExos(page);
  enregistrerProgression();
  document.getElementById('player-caption').textContent = page.caption || '';
  document.getElementById('step-label').textContent = `Page ${currentStep+1} / ${currentLesson.steps.length}`;
  document.getElementById('ctrl-step-label').textContent = `${currentStep+1} / ${currentLesson.steps.length}`;
  document.getElementById('btn-prev').disabled = currentStep === 0;
  document.getElementById('btn-next').disabled = currentStep === currentLesson.steps.length-1;
  buildProgressDots();
  updateProgress();
  boucle();
}
function buildProgressDots() {
  const dotsEl = document.getElementById('progress-dots');
  const n = currentLesson.steps.length;
  dotsEl.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'progress-dot' + (i < currentStep ? ' done' : i===currentStep ? ' current' : '');
    d.style.left = (n > 1 ? i / (n-1) * 100 : 50) + '%';
    d.onclick = () => jumpTo(i);
    dotsEl.appendChild(d);
  }
}
function updateProgress() {
  const n = currentLesson.steps.length;
  document.getElementById('progress-fill').style.width = ((currentStep + 1) / n) * 100 + '%';
}
function nextStep() {
  if (currentStep < currentLesson.steps.length - 1) { currentStep++; startStep(); }
  else {
    /* dernière page : on passe à la compétence suivante du chapitre */
    const g = chapterGroups().find(x => x.chapter === (currentLesson.chapter || currentLesson.title));
    const i = g ? g.lessons.indexOf(currentLesson) : -1;
    if (g && i >= 0 && i < g.lessons.length - 1) openLesson(g.lessons[i + 1].id, 0);
  }
}
function prevStep() {
  if (currentStep > 0) { currentStep--; startStep(); }
}
function jumpTo(i) { currentStep = i; startStep(); }
function openLesson(id, start) {
  currentLesson = LESSONS.find(l => l.id === id);
  if (!currentLesson) return;
  const p = PROG[currentLesson.id];
  /* Reprise : on rouvre à la dernière page vue, sauf si le livre était fini (on repart du début) ou si on a demandé une page précise. */
  const reprise = (start == null && p && !p.terminee && p.derniere > 1) ? p.derniere - 1 : (start || 0);
  currentStep  = Math.min(reprise, currentLesson.steps.length - 1);
  const player = document.getElementById('player');
  player.classList.add('open');
  document.getElementById('player-title').textContent = currentLesson.title;
  document.body.style.overflow = 'hidden';
  setTimeout(() => { resizeCanvas(); startStep(); }, 60);
}
function closePlayer() {
  cancelAnimationFrame(animTimer);
  document.getElementById('player').classList.remove('open');
  if (currentLesson && document.getElementById('sommaire').classList.contains('open')) openChapitre(currentLesson.chapter);
  buildGrid();
  document.body.style.overflow = document.getElementById('sommaire').classList.contains('open') ? 'hidden' : '';
}

/* ─── PAGE CHAPITRE : le choix des vidéos ─── */
function chapterGroups(){
  const map = new Map();
  LESSONS.forEach(l => {
    const key = l.chapter || l.title;
    if (!map.has(key)) map.set(key, { chapter:key, branch:l.branch, lessons:[] });
    map.get(key).lessons.push(l);
  });
  return [...map.values()];
}

function openChapitre(name){
  const g = chapterGroups().find(x => x.chapter === name);
  if (!g) return;
  const meta = branchMeta(g.branch);
  const som = document.getElementById('sommaire');
  som.style.setProperty('--bc', meta.color);
  const multi = g.lessons.length > 1;
  document.getElementById('som-tag').textContent =
    meta.label + (multi ? ` — ${g.lessons.length - 1} compétences` : ' — 1 vidéo');
  document.getElementById('som-title').textContent = g.chapter;
  document.getElementById('som-desc').textContent = multi
    ? 'Commencez par la vue d\'ensemble, puis suivez les compétences dans l\'ordre. Chaque page explique une idée avec une image tirée de la vie réelle, un exemple, et le piège à éviter. Les flèches tournent les pages.'
    : g.lessons[0].desc;
  const totalN = g.lessons.reduce((a,l)=>a+l.steps.length,0);
  document.getElementById('som-meta').innerHTML =
    `<span>📖 ${g.lessons.length - 1} compétences</span><span>${totalN} pages au total</span>`;
  const list = document.getElementById('som-list');
  list.innerHTML = '';
  g.lessons.forEach(l => {
    const it = document.createElement('div');
    it.className = 'som-video';
    it.style.setProperty('--bc', meta.color);
    it.innerHTML = `
      <div class="som-video-play">▶</div>
      <div class="som-video-body">
        <div class="som-video-tag">${l.competence ? 'compétence ' + l.competence + ' / ' + (g.lessons.length - 1) + ' · ' : ''}${l.level}</div>
        <div class="som-video-title">${l.title}</div>
        <div class="som-video-desc">${l.desc}</div>
        <div class="som-video-meta">📖 ${l.duration}${badgeProg(l)}</div>
      </div>`;
    if (PROG[l.id] && PROG[l.id].terminee) it.classList.add('lu');
    it.onclick = () => openLesson(l.id);
    list.appendChild(it);
  });
  som.classList.add('open');
  som.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

function badgeProg(l){
  const p = PROG[l.id]; if (!p) return '';
  if (p.terminee) return '<span class="som-video-prog">✓ lu</span>';
  return '<span class="som-video-prog">page ' + p.derniere + ' / ' + p.total + ' · reprendre</span>';
}
function closeSommaire(){
  document.getElementById('sommaire').classList.remove('open');
  document.body.style.overflow = '';
}

// keyboard
document.addEventListener('keydown', e => {
  const playerOpen = document.getElementById('player').classList.contains('open');
  if (e.key === 'Escape') {
    if (playerOpen) closePlayer();
    else if (document.getElementById('sommaire').classList.contains('open')) closeSommaire();
    return;
  }
  if (!playerOpen) return;
  if (e.key==='ArrowRight' || e.key===' ') { e.preventDefault(); nextStep(); }
  if (e.key==='ArrowLeft')  prevStep();
});

window.addEventListener('resize', resizeCanvas);

// ─── FILTRE PAR BRANCHE ──────────────────────────────────
let activeBranch = 'all';

function buildFilter() {
  const bar = document.getElementById('filter-bar');
  if (!bar) return;   // barre retirée : matière sans cours animés
  const all = [{ id:'all', label:'Tout', color:'#c8b97a' }, ...BRANCHES];
  bar.innerHTML = '';
  all.forEach(b => {
    const groups = chapterGroups();
    const count = b.id === 'all' ? groups.length : groups.filter(g => g.branch === b.id).length;
    if (b.id !== 'all' && count === 0) return;
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (b.id === activeBranch ? ' active' : '');
    btn.style.setProperty('--bc', b.color);
    btn.innerHTML = `<span class="filter-dot"></span>${b.label} <span class="filter-count">${count}</span>`;
    btn.onclick = () => { activeBranch = b.id; buildFilter(); buildGrid(); };
    bar.appendChild(btn);
  });
}

// ─── BUILD CARD GRID ─────────────────────────────────────
function chapterCard(g) {
  const meta = branchMeta(g.branch);
  const first = g.lessons[0];
  const multi = g.lessons.length > 1;
  const card = document.createElement('div');
  card.className = 'lesson-card';
  card.style.setProperty('--bc', meta.color);
  const desc = multi ? g.lessons.filter(v => v.competence).map(v => '▸ ' + v.title).join('<br>') : first.desc;
  card.innerHTML = `
    <div class="lesson-tag">${multi ? meta.label + ' · ' + (g.lessons.length - 1) + ' compétences' : first.tag}</div>
    <div class="lesson-title">${g.chapter}</div>
    <div class="lesson-desc">${desc}</div>
    <div class="lesson-meta">
      <span class="lesson-meta-item">📖 ${g.lessons.reduce((a,l)=>a+l.steps.length,0)} pages</span>
      <span class="lesson-prog">${(() => { const c = g.lessons.filter(l => l.competence); const lus = c.filter(l => PROG[l.id] && PROG[l.id].terminee).length; return lus ? '✓ ' + lus + ' / ' + c.length + ' compétences lues' : ''; })()}</span>
      <div class="lesson-play-icon">▶</div>
    </div>`;
  card.onclick = () => openChapitre(g.chapter);
  return card;
}

function buildGrid() {
  // Matière sans cours animés : l'état vide affiché plus haut doit rester.
  if (window.MB_SANS_COURS) return;
  const host = document.getElementById('lesson-host');
  host.innerHTML = '';
  const branches = activeBranch === 'all' ? BRANCHES.map(b => b.id) : [activeBranch];
  branches.forEach(bid => {
    const items = chapterGroups().filter(g => g.branch === bid);
    if (!items.length) return;
    const meta = branchMeta(bid);
    const section = document.createElement('div');
    section.className = 'lesson-section';
    section.innerHTML = `<div class="section-head" style="--bc:${meta.color}">
        <span class="section-dot"></span>${meta.label}
        <span class="section-count">${items.length} chapitres</span>
      </div>`;
    const grid = document.createElement('div');
    grid.className = 'lesson-grid';
    items.forEach(g => grid.appendChild(chapterCard(g)));
    section.appendChild(grid);
    host.appendChild(section);
  });
}

buildFilter();
chargerProgression().then(buildGrid);
resizeCanvas();

/* ── Lien profond : cours.html?open=Titre ouvre directement le cours ── */
(function(){
  const wanted = new URLSearchParams(location.search).get('open');
  if (!wanted) return;
  const norm = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const g = chapterGroups().find(x => norm(x.chapter) === norm(wanted));
  if (g) { openChapitre(g.chapter); return; }
  const l = LESSONS.find(x => norm(x.title) === norm(wanted));
  if (l) openChapitre(l.chapter || l.title);
})();
</script>
