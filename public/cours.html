LIVRES['Entiers & décimaux'] = { branch:'nombres', level:'6ème', figure:{ type:'tableau', lignes:[['centaines','dizaines','unités',',','dixièmes','centièmes'],['6','8','7',',','5','4']] },
  intro:"Un prix de 12,35 €, un temps de 9,58 s, une taille de 1,72 m : les nombres décimaux sont partout. Ce livre apprend à les lire vraiment (que vaut chaque chiffre ?), à les comparer, à les arrondir, puis à poser les quatre opérations sans jamais perdre la virgule.",
  competences:[

    { nom:'Lire et écrire les nombres', classe:'6ème', pages:[
      { titre:'Chaque chiffre a une place, et la place donne la valeur', texte:["Dans 687, le 6 vaut 600, le 8 vaut 80, le 7 vaut 7. Le même chiffre 6 dans 68 ne vaut que 60 : c'est sa position qui décide.","Les positions, de droite à gauche : unités, dizaines, centaines, puis mille, dizaines de mille, centaines de mille, puis millions…","On groupe les chiffres par trois à partir de la droite pour lire les grands nombres : 4 300 050 se lit « 4 millions 300 mille 50 »."],
        figure:{ type:'tableau', lignes:[['millions','mille','unités'],['4','300','050']] },
        encart:{ type:'monde', lignes:["Population de la France : 68 000 000 (68 millions). Distance Terre-Lune : 384 400 km. Les groupes de trois chiffres rendent ces nombres lisibles."] } },
      { titre:'Chiffre des centaines, nombre de centaines', texte:["Dans 68 754, le CHIFFRE des centaines est 7 : c'est ce qui est écrit à la place des centaines.","Le NOMBRE de centaines, c'est combien de paquets de 100 il y a dans 68 754. On coupe juste avant les dizaines : 687 paquets de 100 (et il reste 54). 68 754 = 687 × 100 + 54.","Même chose pour les dizaines : le chiffre est 5, le nombre de dizaines est 6 875."],
        figure:{ type:'tableau', lignes:[['','chiffre','nombre'],['centaines','7','687'],['dizaines','5','6 875'],['mille','8','68']] },
        encart:{ type:'piege', lignes:["Nombre de centaines de 68 754 : 7  ✗","687 : tous les chiffres à gauche des dizaines  ✓"] } },
      { titre:'Après la virgule', texte:["Une baguette à 1,20 € : 1 euro et 20 centièmes d'euro. Le 2 après la virgule vaut 2 dixièmes (20 centimes), le 0 vaut 0 centième.","Après la virgule, de gauche à droite : dixièmes (1/10), centièmes (1/100), millièmes (1/1000). Chaque place vaut dix fois moins que la précédente.","12,35 = 12 + 3/10 + 5/100 = 12 + 35/100. Un nombre décimal est un entier plus une fraction de dénominateur 10, 100, 1000…"],
        figure:{ type:'tableau', lignes:[['dizaines','unités',',','dixièmes','centièmes'],['1','2',',','3','5']] },
        encart:{ type:'retenir', lignes:["12,35 = 1 × 10 + 2 × 1 + 3 × 0,1 + 5 × 0,01"] } },
      { titre:'Écrire un nombre en chiffres', texte:["« Quatre millions trois cent mille cinquante » : on place chaque classe. Millions : 4. Mille : 300. Unités : 050. Résultat : 4 300 050.","Le piège : les zéros. « Trois cent mille » n'est pas « trois cents » : 300 000, pas 300. Et « cinquante » occupe la classe des unités, il faut écrire 050 pour tenir la place.","« Douze unités et sept centièmes » : 12,07. Le zéro des dixièmes est obligatoire, sinon on écrirait 12,7, sept dixièmes, dix fois plus."],
        figure:{ type:'tableau', lignes:[['millions','mille','unités'],['4','300','050']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Écris en chiffres : « sept millions huit mille douze » et « cinq unités et trois millièmes ».","Dans 47 396, quel est le nombre de dizaines ?"] } },
      { titre:'Réponse', texte:["Sept millions huit mille douze : millions 7, mille 008, unités 012 → 7 008 012.","Cinq unités et trois millièmes : 5,003 (dixièmes 0, centièmes 0, millièmes 3).","Nombre de dizaines de 47 396 : on coupe avant les unités → 4 739 dizaines (47 396 = 4 739 × 10 + 6)."],
        figure:{ type:'tableau', lignes:[['7','008','012'],['5',',','003']] } },
    ] },

    { nom:'Comparer et ranger des décimaux', classe:'6ème', pages:[
      { titre:'3,7 ou 3,68 : lequel est le plus grand ?', texte:["À première vue, 68 est plus grand que 7. Mais 3,7, c'est 3,70 : 70 centièmes. Et 3,68, c'est 68 centièmes. 70 > 68, donc 3,7 > 3,68.","Pour comparer, on écrit les deux nombres avec le MÊME nombre de chiffres après la virgule, en ajoutant des zéros à droite. Ça ne change pas la valeur : 3,7 = 3,70 = 3,700.","Puis on compare les parties entières ; si elles sont égales, les dixièmes ; puis les centièmes…"],
        figure:{ type:'axe', min:3.6, max:3.8, pas:0.01, etiq:0.1, points:[{x:3.68,label:'3,68',c:C.rouge},{x:3.7,label:'3,7',c:C.vert}] },
        encart:{ type:'piege', lignes:["3,68 > 3,7 car 68 > 7  ✗","3,70 > 3,68 : on compare 70 et 68  ✓"] } },
      { titre:'Ranger dans l\'ordre', texte:["0,5 ; 0,45 ; 0,52 dans l'ordre croissant. Même nombre de décimales : 0,50 ; 0,45 ; 0,52.","Parties entières égales (0). Dixièmes : 5, 4, 5. Le 4 est le plus petit : 0,45 vient en premier. Entre 0,50 et 0,52 : centièmes 0 et 2, donc 0,50 < 0,52.","0,45 < 0,5 < 0,52. Croissant : du plus petit au plus grand. Décroissant : l'inverse."],
        figure:{ type:'axe', min:0.4, max:0.6, pas:0.01, etiq:0.1, points:[{x:0.45,label:'0,45'},{x:0.5,label:'0,5',c:C.or},{x:0.52,label:'0,52',c:C.vert}] },
        encart:{ type:'monde', lignes:["Sprint : 9,58 s (Bolt) ; 9,63 s ; 9,69 s. Le plus petit temps gagne : 9,58 < 9,63 < 9,69."] } },
      { titre:'Intercaler un nombre', texte:["Entre 2,3 et 2,4, y a-t-il un nombre ? Oui : 2,35, ou 2,31, ou 2,399… Il y en a une infinité.","Il suffit d'ajouter un chiffre : 2,3 = 2,30 et 2,4 = 2,40 ; entre 30 et 40 centièmes, il y a 31, 32… 39.","Entre deux décimaux, même très proches, on peut toujours en glisser un autre. Ce n'est pas vrai pour les entiers : rien entre 2 et 3."],
        figure:{ type:'axe', min:2.3, max:2.4, pas:0.01, etiq:0.1, points:[{x:2.3,label:'2,3'},{x:2.4,label:'2,4'},{x:2.35,label:'2,35',c:C.vert}] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Range dans l'ordre décroissant : 7,09 ; 7,9 ; 7,1 ; 7,099.","Donne un nombre entre 7,09 et 7,1."] } },
      { titre:'Réponse', texte:["Avec trois décimales : 7,090 ; 7,900 ; 7,100 ; 7,099. Décroissant : 7,900 > 7,100 > 7,099 > 7,090.","Soit : 7,9 > 7,1 > 7,099 > 7,09.","Entre 7,09 = 7,090 et 7,1 = 7,100 : 7,095, par exemple (ou 7,091, 7,099…)."],
        figure:{ type:'axe', min:7.08, max:7.11, pas:0.001, etiq:0.01, points:[{x:7.09,label:'7,09'},{x:7.099,label:'7,099',c:C.or},{x:7.1,label:'7,1',c:C.vert}] } },
    ] },

    { nom:'Encadrer et arrondir', classe:'6ème', pages:[
      { titre:'Encadrer : entre quels nombres simples ?', texte:["7,83 est entre 7 et 8 : 7 < 7,83 < 8. C'est un encadrement à l'unité.","Entre 7,8 et 7,9 : encadrement au dixième. Entre 7,83 et 7,84 : on ne peut pas, 7,83 est déjà exact au centième.","Encadrer, c'est situer un nombre entre deux voisins « ronds ». Le voisin du dessous s'obtient en coupant les chiffres, celui du dessus en ajoutant 1 à la dernière place gardée."],
        figure:{ type:'axe', min:7, max:8, pas:0.1, etiq:1, points:[{x:7.83,label:'7,83',c:C.or}] },
        encart:{ type:'exemple', titre:'Encadrer 12,375', lignes:["à l'unité : 12 < 12,375 < 13","au dixième : 12,3 < 12,375 < 12,4","au centième : 12,37 < 12,375 < 12,38"] } },
      { titre:'Arrondir : choisir le plus proche', texte:["7,83 arrondi au dixième : entre 7,8 et 7,9, lequel est le plus proche ? 7,83 est à 0,03 de 7,8 et à 0,07 de 7,9. On arrondit à 7,8.","La règle sans mesurer : on regarde le chiffre SUIVANT la place voulue. S'il vaut 0, 1, 2, 3 ou 4, on garde. S'il vaut 5, 6, 7, 8 ou 9, on augmente de 1.","7,86 au dixième : le chiffre suivant est 6 → on monte à 7,9. 7,83 : le suivant est 3 → on garde 7,8."],
        figure:{ type:'axe', min:7.8, max:7.9, pas:0.01, etiq:0.1, points:[{x:7.83,label:'7,83',c:C.vert},{x:7.86,label:'7,86',c:C.rouge}] },
        encart:{ type:'retenir', lignes:["Chiffre suivant ≥ 5 → on monte. Chiffre suivant < 5 → on garde."] } },
      { titre:'Les cas qui piègent', texte:["2,97 arrondi au dixième : le suivant est 7, on monte le 9 à 10. 2,9 + 0,1 = 3,0. Réponse : 3,0 (ou 3).","4,5 arrondi à l'unité : le suivant est 5, on monte : 5.","0,0349 arrondi au centième : le chiffre suivant les centièmes est 4, on garde : 0,03. Le 9 plus loin ne compte pas : on ne regarde QUE le chiffre juste après."],
        figure:{ type:'tableau', lignes:[['nombre','2,97','4,5','0,0349'],['arrondi','3,0 (dixième)','5 (unité)','0,03 (centième)']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un plein a coûté 63,478 €. Arrondis au centime. Puis à l'euro.","Un sprinter a couru en 10,952 s. Arrondis au centième, puis au dixième."] } },
      { titre:'Réponse', texte:["63,478 € au centime : suivant = 8 → 63,48 €. À l'euro : suivant = 4 → 63 €.","10,952 s au centième : suivant = 2 → 10,95 s. Au dixième : suivant = 5 → 11,0 s.","Remarque : au dixième, 10,952 devient 11,0 et non 10,9. Le 5 fait basculer, et 10,9 + 0,1 = 11,0."],
        figure:{ type:'axe', min:10.9, max:11, pas:0.01, etiq:0.1, points:[{x:10.952,label:'10,952',c:C.or},{x:11,label:'11,0',c:C.vert}] } },
    ] },

    { nom:'Multiplier et diviser par 10, 100, 1000', classe:'6ème', pages:[
      { titre:'Dix fois plus grand', texte:["3,25 × 10 : chaque chiffre vaut dix fois plus, il monte d'une place. Les 3 unités deviennent 3 dizaines, les 2 dixièmes deviennent 2 unités… On obtient 32,5.","Ce qu'on voit : la virgule s'est déplacée d'un rang vers la droite. Par 100 : deux rangs. Par 1000 : trois rangs.","S'il manque des chiffres, on complète avec des zéros : 4,5 × 100 = 450 (on a besoin d'un zéro pour le deuxième rang)."],
        figure:{ type:'tableau', lignes:[['','dizaines','unités',',','dixièmes','centièmes'],['3,25','','3',',','2','5'],['× 10','3','2',',','5','']] },
        encart:{ type:'piege', lignes:["4,5 × 100 = 4,500  ✗ (ajouter des zéros après la virgule ne change rien)","4,5 × 100 = 450  ✓"] } },
      { titre:'Dix fois plus petit', texte:["3,25 ÷ 10 : chaque chiffre descend d'une place. Les 3 unités deviennent 3 dixièmes. On obtient 0,325.","La virgule se déplace d'un rang vers la GAUCHE. Par 1000 : trois rangs. 3,25 ÷ 1000 = 0,00325 : on complète avec des zéros devant.","Multiplier par 0,1, c'est diviser par 10 ; multiplier par 0,01, c'est diviser par 100."],
        figure:{ type:'tableau', lignes:[['3,25 ÷ 10','0,325'],['3,25 ÷ 100','0,0325'],['3,25 ÷ 1000','0,00325']] },
        encart:{ type:'retenir', lignes:["× 10, 100, 1000 : virgule vers la droite (1, 2, 3 rangs).   ÷ 10, 100, 1000 : vers la gauche."] } },
      { titre:'Où ça sert : les conversions', texte:["2,5 m en cm : 1 m = 100 cm, donc 2,5 × 100 = 250 cm.","350 g en kg : 1 kg = 1000 g, donc 350 ÷ 1000 = 0,350 kg = 0,35 kg.","Un prix au kilo et un poids en grammes : 800 g de fromage à 18 € le kg. 800 g = 0,8 kg, et 0,8 × 18 = 14,40 €."],
        figure:{ type:'tableau', lignes:[['km','hm','dam','m','dm','cm','mm'],['','','','2',',5','0','']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Calcule 0,047 × 1000, puis 5 200 ÷ 100, puis 0,6 × 0,01.","Convertis 1,25 L en mL et 4 500 m en km."] } },
      { titre:'Réponse', texte:["0,047 × 1000 = 47 (trois rangs à droite). 5 200 ÷ 100 = 52 (deux rangs à gauche). 0,6 × 0,01 = 0,6 ÷ 100 = 0,006.","1,25 L = 1,25 × 1000 mL = 1 250 mL.","4 500 m = 4 500 ÷ 1000 km = 4,5 km."],
        figure:{ type:'tableau', lignes:[['0,047 × 1000','47'],['5 200 ÷ 100','52'],['0,6 × 0,01','0,006']] } },
    ] },

    { nom:'Poser une addition ou une soustraction', classe:'6ème', pages:[
      { titre:'Aligner les virgules, pas les chiffres', texte:["12,5 + 3,78. Si on aligne les chiffres à droite, on additionne des dixièmes (5) avec des centièmes (8) : faux.","On aligne les VIRGULES : ainsi les unités sont sous les unités, les dixièmes sous les dixièmes. 12,5 s'écrit 12,50 pour compléter.","12,50 + 3,78 = 16,28. La virgule du résultat est sous les autres."],
        figure:{ type:'tableau', lignes:[['1','2',',','5','0'],['+','3',',','7','8'],['1','6',',','2','8']] },
        encart:{ type:'piege', lignes:["12,5 + 3,78 = 15,83 (chiffres alignés à droite)  ✗","12,50 + 3,78 = 16,28 (virgules alignées)  ✓"] } },
      { titre:'La soustraction, avec les retenues', texte:["20,4 − 7,65. On complète : 20,40 − 7,65. Colonne des centièmes : 0 − 5 impossible, on emprunte : 10 − 5 = 5, retenue 1.","Dixièmes : 4 − 6 − 1 (retenue) : impossible, on emprunte : 14 − 7 = 7, retenue 1. Unités : 0 − 7 − 1 : on emprunte : 10 − 8 = 2, retenue 1. Dizaines : 2 − 0 − 1 = 1.","Résultat : 12,75. Vérification par addition : 12,75 + 7,65 = 20,40. ✓"],
        figure:{ type:'tableau', lignes:[['2','0',',','4','0'],['−','7',',','6','5'],['1','2',',','7','5']] },
        encart:{ type:'methode', lignes:["1. Écrire les nombres l'un sous l'autre, virgules alignées.","2. Compléter par des zéros à droite.","3. Calculer colonne par colonne, de droite à gauche, avec les retenues.","4. Placer la virgule du résultat sous les autres. Vérifier."] } },
      { titre:'Estimer avant, vérifier après', texte:["Avant de poser 12,5 + 3,78, estime : environ 12 + 4 = 16. Si tu trouves 15,83 ou 162,8, tu sais qu'il y a une erreur.","L'ordre de grandeur est un garde-fou : il ne remplace pas le calcul, il le contrôle.","Pour une soustraction : 20,4 − 7,65 ≈ 20 − 8 = 12. On a trouvé 12,75 : cohérent."],
        figure:{ type:'axe', min:10, max:20, etiq:2, points:[{x:16.28,label:'16,28',c:C.vert},{x:12.75,label:'12,75',c:C.or}] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Course : 3 tours en 45,8 s, 46,15 s et 44,9 s. Temps total ?","Différence entre le tour le plus lent et le plus rapide ?"] } },
      { titre:'Réponse', texte:["Total : 45,80 + 46,15 + 44,90 = 136,85 s. (Estimation : 46 + 46 + 45 = 137, cohérent.)","Le plus lent : 46,15 s. Le plus rapide : 44,90 s. Différence : 46,15 − 44,90 = 1,25 s.","136,85 s = 2 min 16,85 s, puisque 120 s font 2 minutes."],
        figure:{ type:'batons', data:[{l:'tour 1',v:45.8},{l:'tour 2',v:46.15,c:C.rougeF},{l:'tour 3',v:44.9,c:C.vertF}], max:50, legende:'écart : 1,25 s' } },
    ] },

    { nom:'Multiplier des décimaux', classe:'6ème', pages:[
      { titre:'Multiplier sans les virgules, puis les replacer', texte:["2,4 × 0,3. On multiplie comme des entiers : 24 × 3 = 72.","2,4 a 1 chiffre après la virgule, 0,3 en a 1 : en tout 2. Le résultat doit avoir 2 chiffres après la virgule : 0,72.","Pourquoi ? 2,4 = 24 ÷ 10 et 0,3 = 3 ÷ 10. Le produit est 24 × 3 ÷ 100 = 72 ÷ 100 = 0,72. Les deux « ÷ 10 » font un « ÷ 100 »."],
        figure:{ type:'tableau', lignes:[['2,4','1 décimale'],['× 0,3','1 décimale'],['0,72','2 décimales']] },
        encart:{ type:'piege', lignes:["2,4 × 0,3 = 7,2  ✗","2,4 × 0,3 = 0,72 : deux décimales en tout  ✓"] } },
      { titre:'Une multiplication posée', texte:["38,5 × 1,8 (le plein : 38,5 litres à 1,80 € le litre). On pose 385 × 18.","385 × 8 = 3080 ; 385 × 10 = 3850 ; total 6930.","Décimales : 1 + 1 = 2. Résultat : 69,30. Le plein coûte 69,30 €. Estimation : 40 × 2 = 80, cohérent."],
        figure:{ type:'tableau', lignes:[['','3','8','5'],['×','','1','8'],['3','0','8','0'],['3','8','5','·'],['6','9','3','0']] },
        encart:{ type:'monde', lignes:["Prix au kilo × poids, prix au litre × volume, longueur × largeur d'une pièce : la multiplication de décimaux est le calcul le plus courant du quotidien."] } },
      { titre:'Multiplier par un nombre plus petit que 1', texte:["Multiplier par 0,5, c'est prendre la moitié : 60 × 0,5 = 30. Le résultat est plus petit que 60.","Multiplier ne fait pas toujours grandir ! Multiplier par un nombre entre 0 et 1 rend plus petit. 0,3 × 0,2 = 0,06, plus petit que chacun des deux.","Multiplier par 0,25, c'est prendre le quart ; par 0,1, le dixième ; par 1,5, une fois et demie."],
        figure:{ type:'barre', n:10, k:5, legende:'60 × 0,5 = 30', total:'60' },
        encart:{ type:'exercice', titre:'À toi', lignes:["1,2 kg de cerises à 6,50 € le kg : prix ?","Une pièce de 4,5 m sur 3,2 m : aire ?","Estime chaque résultat avant de calculer."] } },
      { titre:'Réponse', texte:["Cerises : 1,2 × 6,50. Estimation : 1 × 6,5 ≈ 7. Calcul : 12 × 650 = 7 800, trois décimales (1 + 2) → 7,800 = 7,80 €.","Pièce : 4,5 × 3,2. Estimation : 4 × 3 = 12 (un peu plus). Calcul : 45 × 32 = 1 440, deux décimales → 14,40 m².","Les zéros finaux après la virgule peuvent être supprimés : 7,80 = 7,8 et 14,40 = 14,4."],
        figure:{ type:'carrelage', L:9, l:6, legende:'4,5 m × 3,2 m = 14,4 m²' } },
    ] },

    { nom:'Diviser un décimal', classe:'6ème', pages:[
      { titre:'Partager 7,5 en 6 parts', texte:["7,5 L de jus pour 6 verres. 7 ÷ 6 = 1, reste 1 : chaque verre reçoit 1 L, il reste 1 L, soit 10 dixièmes, plus les 5 dixièmes : 15 dixièmes.","15 ÷ 6 = 2, reste 3 : chaque verre reçoit 2 dixièmes, il reste 3 dixièmes = 30 centièmes. 30 ÷ 6 = 5 : chaque verre reçoit 5 centièmes.","7,5 ÷ 6 = 1,25 L. La virgule se place au quotient au moment où on passe aux dixièmes."],
        figure:{ type:'jauge', k:5, n:6, legende:'7,5 L ÷ 6 = 1,25 L par verre', total:'7,5 L' },
        encart:{ type:'methode', lignes:["1. Poser comme avec des entiers.","2. Quand on abaisse le chiffre des dixièmes, écrire la virgule au quotient.","3. Ajouter des zéros au dividende tant qu'il y a un reste, si l'on veut continuer."] } },
      { titre:'Les divisions qui ne s\'arrêtent pas', texte:["10 ÷ 3 = 3,333… Le reste vaut toujours 1, le chiffre 3 revient sans fin. Aucune écriture décimale exacte.","On donne alors une valeur approchée : 10 ÷ 3 ≈ 3,33 (au centième) ou 3,3 (au dixième). Le symbole ≈ dit « environ ».","Dans un problème d'argent, on s'arrête au centime ; en longueur, au millimètre. C'est la situation qui décide de la précision."],
        figure:{ type:'tableau', lignes:[['10 ÷ 3','3,333…'],['≈ (dixième)','3,3'],['≈ (centième)','3,33'],['≈ (millième)','3,333']] },
        encart:{ type:'piege', lignes:["10 ÷ 3 = 3,3 (au centième)  ✗","10 ÷ 3 ≈ 3,33 (au centième)  ✓"] } },
      { titre:'Diviser par un décimal', texte:["4,5 ÷ 1,5 : on ne divise pas directement par un décimal. On multiplie les deux nombres par 10 : 45 ÷ 15 = 3. Le quotient ne change pas (même rapport).","2,4 ÷ 0,03 : on multiplie par 100 pour rendre le diviseur entier : 240 ÷ 3 = 80.","Diviser par un nombre plus petit que 1 rend plus grand : 2,4 ÷ 0,03 = 80. Normal : combien de fois 0,03 dans 2,4 ? Beaucoup."],
        figure:{ type:'tableau', lignes:[['4,5 ÷ 1,5','45 ÷ 15','3'],['2,4 ÷ 0,03','240 ÷ 3','80']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un ruban de 9,6 m coupé en 8 : longueur d'un morceau ?","28 € pour 3 personnes : part de chacun, au centime ?"] } },
      { titre:'Réponse', texte:["9,6 ÷ 8 : 9 ÷ 8 = 1 reste 1 ; 16 dixièmes ÷ 8 = 2. Résultat 1,2 m.","28 ÷ 3 = 9,333… Au centime : 9,33 €. Remarque : 3 × 9,33 = 27,99, il manque 1 centime : l'arrondi fait perdre un peu. On dira 9,33 € chacun, ou l'un paiera 9,34 €.","Le partage exact 28/3 est une fraction ; 9,33 n'en est qu'une approximation."],
        figure:{ type:'barre', n:8, k:8, etiquettes:['1,2','1,2','1,2','1,2','1,2','1,2','1,2','1,2'], total:'9,6 m' } },
    ] },

    { nom:'Résoudre un problème', classe:'6ème', pages:[
      { titre:'Comprendre, choisir, calculer, répondre', texte:["La monnaie du libraire : un livre coûte 12,35 €, tu donnes 20 €. Combien te rend-il ?","On cherche ce qui reste quand on enlève 12,35 de 20 : une soustraction. 20,00 − 12,35 = 7,65 €.","Les mots-clés orientent : « il reste », « de plus que » → soustraction ; « chacun coûte », « le litre » → multiplication ; « partager », « par personne » → division."],

      { titre:'Deux opérations à la suite', texte:["Le plein : 38,5 L à 1,80 € le litre, et tu paies avec un billet de 100 €. Combien te rend-on ?","Prix du plein : 38,5 × 1,80 = 69,30 €. Monnaie : 100 − 69,30 = 30,70 €.","Dans un problème à étapes, chaque résultat intermédiaire sert au suivant : on l'écrit, avec son unité, avant de continuer."],

      { titre:'À toi', texte:["Une famille achète 3 pizzas à 8,90 €, 2 boissons à 2,45 € et un dessert à 4,60 €. Elle paie avec 50 €.","1. Combien coûtent les pizzas ? Les boissons ?","2. Quel est le total ?","3. Combien lui rend-on ?"],

      { titre:'Réponse', texte:["Pizzas : 3 × 8,90 = 26,70 €. Boissons : 2 × 2,45 = 4,90 €.","Total : 26,70 + 4,90 + 4,60 = 36,20 €. (Estimation 37 : cohérent.)","Monnaie : 50,00 − 36,20 = 13,80 €."],
        figure:{ type:'tableau', lignes:[['pizzas','26,70'],['boissons','4,90'],['dessert','4,60'],['total','36,20'],['rendu','13,80']] },

LIVRES['Proportionnalité'] = { branch:'nombres', level:'6ème–3ème', figure:{ type:'route', dTotal:180, tTotal:2, bornes:4, anim:true, periode:8, legende:'90 km/h : 180 km en 2 h' },
  intro:"Le prix au kilo, la vitesse d'une voiture, l'échelle d'une carte, la recette pour neuf personnes : quand une grandeur double, l'autre double. Ce livre apprend à reconnaître cette régularité, à s'en servir avec plusieurs méthodes, et à ne pas la voir là où elle n'est pas.",
  competences:[

    { nom:'Reconnaître une situation de proportionnalité', classe:'5ème', pages:[
      { titre:'Les places de cinéma', texte:["2 places coûtent 16 €, 5 places coûtent 40 €, 10 places coûtent 80 €. Chaque fois, prix ÷ places = 8 : une place coûte 8 €, quel que soit le nombre acheté.","On dit que le prix est proportionnel au nombre de places. Le nombre 8 est le coefficient de proportionnalité : on passe des places au prix en multipliant toujours par 8.","Conséquence : si le nombre de places double, le prix double ; s'il triple, le prix triple ; 0 place, 0 €."],
        figure:{ type:'tableau', lignes:[['places','2','5','10'],['prix (€)','16','40','80']], fleche:'× 8' },
        encart:{ type:'retenir', lignes:["Proportionnel = un seul et même coefficient pour toutes les colonnes. Le test : tous les quotients (2e ligne ÷ 1re ligne) sont égaux."] } },
      { titre:'Le club de sport : pas proportionnel', texte:["Inscription au club : 10 € d'abonnement, plus 2 € par séance. 1 séance : 12 €. 2 séances : 14 €. 5 séances : 20 €.","Testons : 12 ÷ 1 = 12, 14 ÷ 2 = 7, 20 ÷ 5 = 4. Les quotients changent : ce n'est PAS proportionnel. Doubler les séances ne double pas le prix, à cause des 10 € fixes.","Autre exemple : l'âge et la taille. À 10 ans, 1,40 m ; à 20 ans, on ne mesure pas 2,80 m."],
        figure:{ type:'repere', xmin:0, xmax:6, ymin:0, ymax:24, droites:[{a:2,b:10,label:'club : 10 + 2x',c:C.rouge},{a:3,b:0,label:'proportionnel : 3x',c:C.vert}] },
        encart:{ type:'piege', lignes:["« 2 € par séance », donc c'est proportionnel  ✗","Il y a une part fixe (10 €) : les quotients diffèrent  ✓"] } },
      { titre:'Le graphique dit tout', texte:["Si on place les points (places ; prix) dans un repère, une situation proportionnelle donne des points ALIGNÉS avec l'origine : une droite qui passe par (0 ; 0).","Le club de sport donne aussi une droite, mais qui ne passe pas par l'origine : elle commence à 10 €.","L'âge et la taille ne donnent même pas une droite. Alignés ET par l'origine : les deux conditions sont nécessaires."],
        figure:{ type:'repere', xmin:0, xmax:6, ymin:0, ymax:24, droites:[{a:3,b:0,label:'y = 3x'}], points:[{x:2,y:6,label:'(2 ; 6)'},{x:4,y:12,label:'(4 ; 12)'}], anim:true },
        encart:{ type:'exercice', titre:'À toi', lignes:["Tarif d'un parking : 1 h → 2 €, 3 h → 6 €, 5 h → 10 €, journée (10 h) → 15 €.","Le tarif est-il proportionnel à la durée ? Jusqu'où l'est-il ?"] } },
      { titre:'Réponse', texte:["2 ÷ 1 = 2, 6 ÷ 3 = 2, 10 ÷ 5 = 2 : proportionnel jusqu'à 5 h, à 2 € l'heure.","Mais 15 ÷ 10 = 1,5 ≠ 2 : la journée est un forfait, moins cher que 10 × 2 = 20 €. Sur l'ensemble du tarif, ce n'est pas proportionnel.","Beaucoup de tarifs réels sont proportionnels « par morceaux », avec des forfaits ou des dégressivités."],
        figure:{ type:'tableau', lignes:[['heures','1','3','5','10'],['prix (€)','2','6','10','15'],['quotient','2','2','2','1,5']] } },
    ] },

    { nom:'Compléter un tableau de proportionnalité', classe:'6ème', pages:[
      { titre:'Passer par l\'unité', texte:["4 cahiers coûtent 6 €. Combien pour 10 cahiers ?","Premier chemin, la règle de trois : combien coûte 1 cahier ? 6 ÷ 4 = 1,50 €. Alors 10 cahiers coûtent 10 × 1,50 = 15 €.","On divise pour revenir à 1, puis on multiplie. C'est le chemin qui marche toujours, même sans tableau."],
        figure:{ type:'tableau', lignes:[['cahiers','4','1','10'],['prix (€)','6','1,5','15']] },
        encart:{ type:'monde', lignes:["Le prix affiché « au kilo » ou « au litre » dans les rayons est exactement le passage à l'unité : il permet de comparer des paquets de tailles différentes."] } },
      { titre:'Le coefficient et la méthode additive', texte:["Deuxième chemin : le coefficient. Prix ÷ cahiers = 6 ÷ 4 = 1,5. Pour n'importe quel nombre de cahiers, prix = cahiers × 1,5. Donc 10 × 1,5 = 15 €.","Troisième chemin : les colonnes s'additionnent et se multiplient. 10 cahiers = 4 + 4 + 2. Or 2 cahiers = la moitié de 4 → 3 €. Donc 6 + 6 + 3 = 15 €.","Les trois chemins donnent 15 € : choisis le plus simple avec les nombres que tu as."],
        figure:{ type:'tableau', lignes:[['cahiers','4','2','8','10'],['prix (€)','6','3','12','15']], legende:'4 + 4 + 2 → 6 + 6 + 3' },
        encart:{ type:'methode', lignes:["Nombres simples entre eux (4 → 8) : multiplier la colonne.","Une colonne « 1 » facile à obtenir : passage à l'unité.","Beaucoup de colonnes à remplir : calculer le coefficient une fois."] } },
      { titre:'La recette pour 9 personnes', texte:["Pour 6 personnes : 300 g de farine, 4 œufs, 75 cL de lait. Pour 9 personnes ?","Farine : 300 ÷ 6 = 50 g par personne, × 9 = 450 g. Lait : 75 ÷ 6 = 12,5 cL par personne, × 9 = 112,5 cL.","Œufs : 4 ÷ 6 × 9 = 6 œufs. Ici la méthode additive est plus jolie : 9 = 6 + 3, et 3 personnes c'est la moitié de 6 → 2 œufs. 4 + 2 = 6."],
        figure:{ type:'tableau', lignes:[['personnes','6','3','9'],['farine (g)','300','150','450'],['œufs','4','2','6'],['lait (cL)','75','37,5','112,5']] },
        encart:{ type:'piege', lignes:["3 kg → 7,50 €, donc 5 kg → 7,50 + 2 = 9,50 €  ✗ (on a ajouté des kilos à des euros)","1 kg → 2,50 €, donc 5 kg → 12,50 €  ✓"] } },
      { titre:'À toi', texte:["Une voiture consomme 6 L pour 100 km.","1. Combien pour 250 km ?","2. Avec 45 L dans le réservoir, quelle distance peut-elle parcourir ?","3. Complète : 30 km → ? L."],
        figure:{ type:'tableau', lignes:[['km','100','250','?','30'],['litres','6','?','45','?']] },
        encart:{ type:'exercice', titre:'Indice', lignes:["Le coefficient litres ÷ km vaut 0,06. Ou passe par 50 km → 3 L."] } },
      { titre:'Réponse', texte:["250 km : 250 = 100 + 100 + 50, donc 6 + 6 + 3 = 15 L. (Ou 250 × 0,06 = 15.)","45 L : 45 ÷ 0,06 = 750 km. (Ou : 6 L → 100 km, donc 1 L → 16,67 km, et 45 × 16,67 ≈ 750.)","30 km : 30 × 0,06 = 1,8 L. (Ou : 30 km, c'est 3/10 de 100 km → 3/10 de 6 L = 1,8 L.)"],
        figure:{ type:'tableau', lignes:[['km','100','250','750','30'],['litres','6','15','45','1,8']] } },
    ] },

    { nom:'Le produit en croix', classe:'5ème', pages:[
      { titre:'Les diagonales du tableau', texte:["Dans un tableau de proportionnalité, 4 → 10 et 6 → 15 (coefficient 2,5). Multiplie en croix : 4 × 15 = 60 et 10 × 6 = 60. Égaux !","Ce n'est pas un hasard : 10 = 4 × k et 15 = 6 × k. Alors 4 × 15 = 4 × 6 × k et 10 × 6 = 4 × k × 6. Les deux produits contiennent les mêmes facteurs.","Dans tout tableau de proportionnalité à 4 cases, les produits des diagonales sont égaux : a × d = b × c."],
        figure:{ type:'tableau', lignes:[['4','6'],['10','15']], legende:'4 × 15 = 10 × 6 = 60' },
        encart:{ type:'retenir', lignes:["Si a/b et c/d sont proportionnels, alors a × d = b × c."] } },
      { titre:'Trouver la case manquante', texte:["7 → 21 et x → 33. Les diagonales sont égales : 7 × 33 = 21 × x, donc 231 = 21 × x, donc x = 231 ÷ 21 = 11.","Méthode : multiplie les deux nombres de la diagonale complète (7 et 33), puis divise par le nombre qui reste (21).","C'est exactement le passage à l'unité en une seule ligne : x = 33 × 7 ÷ 21."],
        figure:{ type:'tableau', lignes:[['7','?'],['21','33']], legende:'? = 7 × 33 ÷ 21 = 11' },
        encart:{ type:'piege', lignes:["4 → 10 ; 6 → x : x = 4 × 10 ÷ 6  ✗ (ce sont les mêmes lignes, pas des diagonales)","x = 6 × 10 ÷ 4 = 15  ✓"] } },
      { titre:'Quand l\'utiliser, quand l\'éviter', texte:["Le produit en croix est imbattable quand les nombres ne se prêtent pas au calcul mental : 3,7 kg → 9,25 €, combien pour 5,2 kg ? x = 5,2 × 9,25 ÷ 3,7 = 13 €.","Mais pour 4 → 10 et 8 → x, il est plus simple de doubler : x = 20. Le produit en croix donnerait le même résultat, plus lentement.","Vérifie toujours l'ordre de grandeur : 5,2 kg, c'est un peu plus que 3,7 kg, donc un peu plus que 9,25 €. 13 € est cohérent ; 3 € ou 30 € ne le seraient pas."],
        figure:{ type:'tableau', lignes:[['kg','3,7','5,2'],['€','9,25','13']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Sur un plan, 2,5 cm représentent 8 m.","Quelle longueur réelle pour 6 cm ? Combien de cm pour 20 m ?"] } },
      { titre:'Réponse', texte:["6 cm : x = 6 × 8 ÷ 2,5 = 48 ÷ 2,5 = 19,2 m.","20 m : y = 20 × 2,5 ÷ 8 = 50 ÷ 8 = 6,25 cm.","Contrôle : 6 cm, c'est un peu plus du double de 2,5 cm, donc un peu plus de 16 m : 19,2 m convient."],
        figure:{ type:'tableau', lignes:[['plan (cm)','2,5','6','6,25'],['réel (m)','8','19,2','20']] } },
    ] },

    { nom:'Échelles et agrandissements', classe:'5ème', pages:[
      { titre:'Lire une carte', texte:["Échelle 1 : 50 000. Cela signifie : 1 cm sur la carte = 50 000 cm dans la réalité. Toutes les longueurs de la carte sont 50 000 fois plus petites que les vraies.","Entre A et B, on mesure 3 cm. Réalité : 3 × 50 000 = 150 000 cm = 1 500 m = 1,5 km.","L'échelle est un coefficient de proportionnalité entre les longueurs réelles et les longueurs dessinées."],
        figure:{ type:'carte', echelle:'1 : 50 000', mesure:'3 cm', legende:'3 cm ↔ 1,5 km' },
        encart:{ type:'monde', lignes:["Cartes de randonnée : 1 : 25 000 (1 cm = 250 m). Cartes routières : 1 : 200 000 (1 cm = 2 km). Plans de maison : 1 : 100 (1 cm = 1 m)."] } },
      { titre:'Dans l\'autre sens, et l\'échelle inconnue', texte:["Une randonnée fait 4 km. Sur la carte au 1 : 25 000, ça fait 400 000 cm ÷ 25 000 = 16 cm.","Échelle inconnue : sur un plan, un mur de 6 m mesure 3 cm. 6 m = 600 cm, et 600 ÷ 3 = 200 : l'échelle est 1 : 200.","Réalité = carte × échelle. Carte = réalité ÷ échelle. Et toujours convertir dans la même unité avant de diviser."],
        figure:{ type:'tableau', lignes:[['plan (cm)','1','3','16'],['réel (cm)','200','600','']] },
        encart:{ type:'piege', lignes:["6 m et 3 cm : échelle 1 : 2  ✗","600 cm ÷ 3 cm = 200 : échelle 1 : 200  ✓"] } },
      { titre:'Agrandir une photo sans la déformer', texte:["Une photo 10 cm × 15 cm est agrandie : sa largeur passe à 30 cm. Coefficient : 30 ÷ 10 = 3.","Toutes les longueurs sont multipliées par 3 : la longueur devient 15 × 3 = 45 cm. Une photo de 30 × 35 serait déformée (les visages écrasés).","Agrandissement : coefficient > 1. Réduction : coefficient < 1 (une maquette au 1/24 a un coefficient 1/24)."],
        figure:{ type:'homothetie', k:2, anim:true },
        encart:{ type:'exercice', titre:'À toi', lignes:["Une maquette de voiture est au 1/24. La vraie voiture mesure 4,32 m.","Longueur de la maquette ? Si ses roues font 2,5 cm, diamètre des vraies roues ?"] } },
      { titre:'Réponse', texte:["Maquette : 4,32 m = 432 cm, et 432 ÷ 24 = 18 cm.","Roues : 2,5 × 24 = 60 cm de diamètre pour la vraie voiture.","Attention aux aires : si les longueurs sont divisées par 24, les aires (la surface du capot, par exemple) sont divisées par 24² = 576."],
        figure:{ type:'tableau', lignes:[['maquette','18 cm','2,5 cm'],['réel','432 cm','60 cm']], fleche:'× 24' } },
    ] },

    { nom:'Partager selon un ratio', classe:'5ème', pages:[
      { titre:'Le ratio 2 : 5', texte:["Lina et Sam se partagent 63 € dans le ratio 2 : 5. Cela veut dire : chaque fois que Lina reçoit 2 parts, Sam en reçoit 5.","En tout, 2 + 5 = 7 parts. Une part vaut 63 ÷ 7 = 9 €.","Lina : 2 × 9 = 18 €. Sam : 5 × 9 = 45 €. Vérification : 18 + 45 = 63. ✓"],
        figure:{ type:'barre', n:7, k:2, etiquettes:['L','L','S','S','S','S','S'], legende:'7 parts de 9 €', total:'63 €' },
        encart:{ type:'piege', lignes:["Lina reçoit 2/5 de 63 €  ✗","Lina reçoit 2/7 de 63 € = 18 € : le total des parts est 7  ✓"] } },
      { titre:'Un ratio dans la vie', texte:["Un mortier se prépare avec du ciment et du sable dans le ratio 1 : 3. Pour 20 kg de mortier : 4 parts, 5 kg chacune → 5 kg de ciment, 15 kg de sable.","Un jus : sirop et eau dans le ratio 1 : 7. Avec 5 cL de sirop, il faut 5 × 7 = 35 cL d'eau. Ici on connaît une part, on cherche l'autre.","Deux questions différentes : partager un TOTAL (on divise par la somme des parts), ou compléter à partir d'une QUANTITÉ connue (on multiplie par le rapport)."],
        figure:{ type:'tableau', lignes:[['ciment','1','5'],['sable','3','15'],['total','4','20']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un héritage de 120 000 € est partagé entre trois enfants dans le ratio 2 : 3 : 5.","Combien reçoit chacun ?"] } },
      { titre:'Réponse', texte:["Parts : 2 + 3 + 5 = 10. Une part : 120 000 ÷ 10 = 12 000 €.","Premier : 2 × 12 000 = 24 000 €. Deuxième : 3 × 12 000 = 36 000 €. Troisième : 5 × 12 000 = 60 000 €.","Vérification : 24 000 + 36 000 + 60 000 = 120 000. ✓ Un ratio à trois nombres se traite exactement comme à deux."],
        figure:{ type:'barre', n:10, k:2, etiquettes:['1','1','2','2','2','3','3','3','3','3'], total:'120 000 €' } },
    ] },

    { nom:'Vitesse, distance et durée', classe:'4ème', pages:[
      { titre:'Une voiture à 90 km/h', texte:["Une voiture roule à 90 km/h : elle parcourt 90 km chaque heure. En 2 h, 180 km. En 3 h, 270 km. La distance est proportionnelle au temps, et la vitesse est le coefficient.","v = d ÷ t : la vitesse moyenne, c'est la distance divisée par la durée. En 2 h pour 180 km : 180 ÷ 2 = 90 km/h.","D'où d = v × t (distance = vitesse × temps) et t = d ÷ v (temps = distance ÷ vitesse)."],
        figure:{ type:'route', dTotal:180, tTotal:2, bornes:4, anim:true, periode:8, legende:'d = 90 × t' },
        encart:{ type:'retenir', lignes:["v = d ÷ t      d = v × t      t = d ÷ v"] } },
      { titre:'Les heures ne sont pas décimales', texte:["Combien de km en 1 h 30 à 90 km/h ? 1 h 30 = 1,5 h (30 min = une demi-heure). 90 × 1,5 = 135 km.","Le coureur régulier : 20 km à 8 km/h. t = 20 ÷ 8 = 2,5 h. Et 2,5 h, ce n'est PAS 2 h 50 : 0,5 h = 30 min, donc 2 h 30.","Conversion : minutes → heures, on divise par 60 (45 min = 0,75 h). Heures décimales → minutes, on multiplie la partie décimale par 60 (0,2 h = 12 min)."],
        figure:{ type:'tableau', lignes:[['minutes','15','20','30','45'],['heures','0,25','0,33','0,5','0,75']] },
        encart:{ type:'piege', lignes:["2,5 h = 2 h 50  ✗","2,5 h = 2 h 30  ✓ (0,5 h = 30 min)"] } },
      { titre:'Changer d\'unité de vitesse', texte:["90 km/h en m/s : 90 km = 90 000 m, 1 h = 3 600 s. 90 000 ÷ 3 600 = 25 m/s. La voiture avance de 25 m chaque seconde.","Un sprinter à 10 m/s : 10 × 3 600 = 36 000 m par heure = 36 km/h.","La vitesse moyenne sur un trajet complet, c'est distance totale ÷ durée totale, même si on a roulé à des vitesses différentes."],
        figure:{ type:'tableau', lignes:[['km/h','36','90','108'],['m/s','10','25','30']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Aller : 120 km en 1 h 30. Retour : les mêmes 120 km en 2 h (bouchons).","Vitesse moyenne à l'aller ? Au retour ? Sur l'aller-retour ?"] } },
      { titre:'Réponse', texte:["Aller : 120 ÷ 1,5 = 80 km/h. Retour : 120 ÷ 2 = 60 km/h.","Aller-retour : 240 km en 3,5 h : 240 ÷ 3,5 ≈ 68,6 km/h.","Ce n'est PAS la moyenne de 80 et 60 (70), parce que le retour a duré plus longtemps : il pèse plus dans la moyenne."],
        figure:{ type:'tableau', lignes:[['','aller','retour','total'],['km','120','120','240'],['h','1,5','2','3,5'],['km/h','80','60','≈ 68,6']] } },
    ] },

    { nom:'Débit et masse volumique', classe:'3ème', pages:[
      { titre:'Le robinet', texte:["Un robinet remplit un seau de 60 L en 4 min. Son débit : 60 ÷ 4 = 15 L/min. Chaque minute, 15 litres de plus. Le volume est proportionnel au temps.","Remplir une baignoire de 180 L : 180 ÷ 15 = 12 min.","Débit = volume ÷ durée. On le donne en L/min, L/s, m³/h… selon la situation."],
        figure:{ type:'jauge', k:3, n:4, anim:true, legende:'15 L chaque minute', total:'60 L' },
        encart:{ type:'monde', lignes:["Débit d'une douche : environ 10 L/min. Dix minutes = 100 L, autant qu'un bain modeste."] } },
      { titre:'Lourd ou léger : la masse volumique', texte:["Un bloc d'aluminium de 200 cm³ pèse 540 g. Un bloc de 400 cm³ pèse 1 080 g. La masse est proportionnelle au volume : 2,7 g pour chaque cm³.","ρ = m ÷ V : la masse volumique. Aluminium : 2,7 g/cm³. Eau : 1 g/cm³. Fer : 7,9 g/cm³. Bois de chêne : environ 0,7 g/cm³.","Un objet flotte sur l'eau si sa masse volumique est plus petite que celle de l'eau : le bois flotte, le fer coule."],
        figure:{ type:'batons', data:[{l:'chêne',v:0.7},{l:'eau',v:1,c:C.bleuF},{l:'alu',v:2.7},{l:'fer',v:7.9,c:C.rougeF}], max:8, legende:'masse volumique en g/cm³' },
        encart:{ type:'exercice', titre:'À toi', lignes:["Une bille de fer de 5 cm³ : sa masse ? Un lingot d'aluminium de 2,7 kg : son volume ?","Un robinet a un débit de 0,4 L/s : combien de temps pour 100 L ?"] } },
      { titre:'Réponse', texte:["Bille : m = 7,9 × 5 = 39,5 g.","Lingot : V = m ÷ ρ = 2 700 ÷ 2,7 = 1 000 cm³, soit 1 L (1 dm³).","Robinet : t = 100 ÷ 0,4 = 250 s = 4 min 10 s."],
        figure:{ type:'tableau', lignes:[['','fer','alu'],['g/cm³','7,9','2,7'],['V (cm³)','5','1 000'],['m (g)','39,5','2 700']] } },

    { nom:'Résoudre un problème', classe:'6ème–5ème', pages:[
      { titre:'Une démarche en quatre temps', texte:["1. Est-ce proportionnel ? (Un prix au kilo, oui. Un abonnement plus un prix à l'unité, non.)","2. Organiser les données dans un tableau, avec les unités.","3. Choisir la méthode : passage à l'unité, coefficient, additive, produit en croix.","4. Calculer, vérifier l'ordre de grandeur, répondre par une phrase."],
        figure:{ type:'tableau', lignes:[['sirop (cL)','1','5'],['eau (cL)','7','35']], fleche:'× 7' },
        encart:{ type:'exemple', titre:'Le sirop à diluer', lignes:["1 dose de sirop pour 7 doses d'eau","5 cL de sirop → 5 × 7 = 35 cL d'eau"] } },
      { titre:'Comparer deux offres', texte:["Paquet A : 750 g de pâtes à 1,80 €. Paquet B : 1,2 kg à 2,70 €. Lequel est le moins cher ?","Prix au kilo : A → 1,80 ÷ 0,75 = 2,40 €/kg. B → 2,70 ÷ 1,2 = 2,25 €/kg. B est moins cher au kilo.","Le passage à l'unité permet de comparer ce qui n'a pas la même taille. C'est le rôle des prix au kilo dans les magasins."],
        figure:{ type:'batons', data:[{l:'A',v:2.4,c:C.rougeF},{l:'B',v:2.25,c:C.vertF}], max:3, legende:'prix au kilo (€)' },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un photocopieur fait 40 pages en 50 secondes.","Combien de pages en 2 minutes ? Combien de temps pour 500 pages ?"] } },
      { titre:'Réponse', texte:["2 min = 120 s. Pages : 40 × 120 ÷ 50 = 96 pages. (Coefficient : 0,8 page par seconde ; 120 × 0,8 = 96.)","500 pages : 500 × 50 ÷ 40 = 625 s = 10 min 25 s.","Ordre de grandeur : 500 pages, c'est 12,5 fois 40 pages, donc 12,5 × 50 s = 625 s. ✓"],
        figure:{ type:'tableau', lignes:[['pages','40','96','500'],['secondes','50','120','625']] },
        encart:{ type:'retenir', lignes:["Proportionnel ↔ un seul coefficient · passage à l'unité pour comparer · produit en croix pour les nombres compliqués · vitesse, échelle, débit et masse volumique sont des coefficients."] } },
    ] },
  ] };

/* ══════════════════════════════════════════════════════════════

LIVRES['Pourcentages'] = { branch:'nombres', level:'6ème–3ème', figure:{ type:'barre', n:10, k:3, legende:'30 % = 30/100' },
  intro:"« −30 % », « TVA 20 % », « 40 % des élèves » : un pourcentage est une part de cent. Ce livre explique ce que ça veut dire, comment le calculer dans les deux sens, puis comment enchaîner hausses et baisses sans se tromper.",
  competences:[

    { nom:'Exprimer une proportion en pourcentage', classe:'5ème', pages:[
      { titre:'Une part de cent', texte:["40 %, c'est « 40 pour cent » : sur 100, on en prend 40. C'est la fraction 40/100, le nombre décimal 0,40.","Pourquoi 100 ? Parce que c'est pratique pour comparer. Dire « 12 élèves sur 30 » ou « 18 sur 45 », c'est difficile à comparer ; « 40 % » et « 40 % », on voit tout de suite que c'est pareil.","Un pourcentage est une proportion ramenée à un total de 100."],
        figure:{ type:'barre', n:10, k:4, legende:'40 sur 100 = 40 %' },
        encart:{ type:'retenir', lignes:["t % = t/100 = t × 0,01"] } },
      { titre:'De la proportion au pourcentage', texte:["12 élèves sur 30 portent des lunettes. Quelle proportion ? 12 ÷ 30 = 0,4. Et 0,4 = 40/100 = 40 %.","Méthode : partie ÷ total, puis × 100. Ou : compléter la fraction pour avoir 100 au dénominateur : 12/30 = 4/10 = 40/100.","18 sur 45 : 18 ÷ 45 = 0,4 aussi. Même pourcentage, deux classes de tailles différentes."],
        figure:{ type:'tableau', lignes:[['lunettes','12','4','40'],['élèves','30','10','100']] },
        encart:{ type:'piege', lignes:["12 sur 30, c'est 12 %  ✗ (le total n'est pas 100)","12 ÷ 30 = 0,4 = 40 %  ✓"] } },
      { titre:'Les repères à connaître', texte:["50 % = 1/2, la moitié. 25 % = 1/4, le quart. 75 % = 3/4. 10 % = 1/10. 20 % = 1/5. 100 % = le tout. 200 % = le double.","Un pourcentage peut dépasser 100 : « une hausse de 150 % » signifie que le prix a été multiplié par 2,5.","Un pourcentage sans total n'a pas de sens : « 30 % » de quoi ? Toujours préciser à quoi il s'applique."],
        figure:{ type:'pizza', n:4, k:3, legende:'3/4 = 75 %' },
        encart:{ type:'exercice', titre:'À toi', lignes:["Dans une classe de 25 élèves, 15 sont des filles. Pourcentage de filles ?","Sur 80 tirs, un joueur en réussit 52. Pourcentage de réussite ?"] } },
      { titre:'Réponse', texte:["Filles : 15 ÷ 25 = 0,6 = 60 %. (Ou 15/25 = 3/5 = 60/100.)","Tirs : 52 ÷ 80 = 0,65 = 65 %.","Contrôle : 15 sur 25, c'est plus que la moitié (12,5), donc plus de 50 % : 60 % est cohérent."],
        figure:{ type:'batons', data:[{l:'filles',v:60},{l:'tirs réussis',v:65,c:C.vertF}], max:100, legende:'en %' } },
    ] },

    { nom:'Appliquer un pourcentage', classe:'6ème–4ème', pages:[
      { titre:'Calculer 20 % de 150', texte:["20 % de 150 : on prend 20 pour chaque 100. Dans 150, il y a 1,5 fois 100, donc 20 × 1,5 = 30.","La formule : 150 × 20/100 = 150 × 0,2 = 30. Prendre t % d'un nombre, c'est le multiplier par t/100.","Autrement : 10 % de 150 = 15 (on divise par 10), donc 20 % = 30 (le double)."],
        figure:{ type:'pizza', n:10, k:2, legende:'20 % de 150 = 30' },
        encart:{ type:'retenir', lignes:["t % de N = N × t / 100"] } },
      { titre:'De tête, avec les repères', texte:["15 % de 80 : 10 % = 8, 5 % = 4 (la moitié de 10 %), donc 15 % = 12.","25 % de 64 : le quart, 64 ÷ 4 = 16.","30 % de 90 : 10 % = 9, donc 30 % = 27.","Le pourboire, la remise, la part d'un budget : le calcul mental des pourcentages se fait presque toujours par 10 %, 5 % et 1 %."],
        figure:{ type:'tableau', lignes:[['de 80','10 %','5 %','15 %','1 %'],['','8','4','12','0,8']] },
        encart:{ type:'monde', lignes:["Pourboire de 15 % sur 46 € : 10 % = 4,60 €, 5 % = 2,30 €, total 6,90 €."] } },
      { titre:'Deux pièges classiques', texte:["20 % de 150, ce n'est pas 150 ÷ 20 (= 7,5). Le pourcentage se multiplie, il ne se divise pas.","Le pourcentage s'applique au total indiqué, pas à autre chose : 30 % de réduction sur 60 €, c'est 30 % DE 60, soit 18 €, pas 30 €.","Enfin, 50 % de 50 % du tout, ce n'est pas 100 % : c'est 25 % (la moitié de la moitié)."],
        figure:{ type:'barre', n:4, k:1, legende:'50 % de 50 % = 25 %' },
        encart:{ type:'exercice', titre:'À toi', lignes:["Une ville de 40 000 habitants compte 35 % de moins de 25 ans. Combien de jeunes ?","Un sac de 2,5 kg de riz contient 8 % d'eau. Masse d'eau ?"] } },
      { titre:'Réponse', texte:["Jeunes : 40 000 × 0,35 = 14 000. (10 % = 4 000 ; 30 % = 12 000 ; 5 % = 2 000 ; total 14 000.)","Eau : 2,5 × 0,08 = 0,2 kg = 200 g.","Vérification du premier : 35 % est un peu plus qu'un tiers ; un tiers de 40 000 ≈ 13 300 : 14 000 est cohérent."],
        figure:{ type:'disque', parts:[{label:'jeunes 35 %',frac:0.35,c:C.vertF},{label:'autres 65 %',frac:0.65}] } },
    ] },

    { nom:'Calculer une augmentation ou une remise', classe:'4ème', pages:[
      { titre:'Le jean soldé à −30 %', texte:["Un jean coûte 60 €, il est soldé à −30 %. La remise porte sur le prix : 30 % de 60 = 18 €.","Nouveau prix : 60 − 18 = 42 €.","Une remise se calcule en deux temps : d'abord le montant (un pourcentage du prix), ensuite on l'enlève."],
        figure:{ type:'barre', n:10, k:7, legende:'60 € − 18 € = 42 €', total:'60 €' },
        encart:{ type:'piege', lignes:["60 € − 30 % = 30 €  ✗ (on a soustrait le nombre 30)","On enlève 30 % DE 60 €, soit 18 € : 42 €  ✓"] } },
      { titre:'Le ticket qui augmente', texte:["Un ticket de bus à 1,60 € augmente de 25 %. Hausse : 25 % de 1,60 = 0,40 €. Nouveau prix : 1,60 + 0,40 = 2 €.","Même logique : le montant d'abord, on l'ajoute ensuite.","Le pourcentage s'applique toujours à la valeur AVANT le changement : les 25 % portent sur 1,60 €."],
        figure:{ type:'batons', data:[{l:'avant',v:1.6},{l:'hausse',v:0.4,c:C.rougeF},{l:'après',v:2,c:C.vertF}], max:2.5, legende:'en euros' },
        encart:{ type:'methode', lignes:["1. Montant de la variation : prix × t/100.","2. Baisse : prix − montant. Hausse : prix + montant.","3. Contrôle : une baisse donne un prix plus petit, une hausse un prix plus grand."] } },
      { titre:'Retrouver le pourcentage d\'une remise', texte:["Un article passe de 80 € à 60 €. Remise : 20 €. Par rapport au prix initial : 20 ÷ 80 = 0,25 = 25 %.","Le pourcentage se calcule toujours par rapport au prix de DÉPART, pas au prix final (20 ÷ 60 donnerait 33 %, ce qui est faux).","Une remise de 25 % ramène 80 à 60 ; mais pour revenir de 60 à 80, il faut une hausse de 33 % : les pourcentages ne sont pas symétriques."],
        figure:{ type:'tableau', lignes:[['prix initial','80'],['remise','20'],['20 ÷ 80','25 %']] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Une console à 450 € est soldée à −15 %, puis, la semaine suivante, le prix soldé baisse encore de 10 %.","Prix après la première remise ? Après la seconde ? Est-ce une baisse totale de 25 % ?"] } },
      { titre:'Réponse', texte:["Première remise : 15 % de 450 = 67,50 €. Prix : 382,50 €.","Seconde remise : 10 % de 382,50 = 38,25 €. Prix : 344,25 €.","Baisse totale : 450 − 344,25 = 105,75 €, soit 105,75 ÷ 450 = 23,5 %. Pas 25 % : la seconde remise porte sur un prix déjà réduit, elle vaut moins."],
        figure:{ type:'batons', data:[{l:'450',v:450},{l:'−15 %',v:382.5},{l:'−10 %',v:344.25,c:C.vertF}], max:500, legende:'en euros' } },
    ] },

    { nom:'Les coefficients multiplicateurs', classe:'3ème', pages:[
      { titre:'Une hausse en un seul calcul', texte:["Augmenter un prix de 35 %, c'est garder 100 % du prix et ajouter 35 % : on obtient 135 % du prix. Et 135 % = 1,35. Le nouveau prix est l'ancien × 1,35.","Baisser de 12 %, c'est garder 100 % − 12 % = 88 % : multiplier par 0,88.","Ces nombres, 1,35 et 0,88, sont des coefficients multiplicateurs. Un seul calcul remplace les deux étapes."],
        figure:{ type:'tableau', lignes:[['évolution','+35 %','−12 %','+20 %','−50 %'],['coefficient','1,35','0,88','1,20','0,50']] },
        encart:{ type:'retenir', lignes:["hausse de t % : × (1 + t/100)      baisse de t % : × (1 − t/100)"] } },
      { titre:'Du prix hors taxes au prix TTC', texte:["Un article coûte 50 € HT. TVA à 20 % : prix TTC = 50 × 1,20 = 60 €.","Dans l'autre sens : un article à 60 € TTC, TVA 20 %. Prix HT = 60 ÷ 1,20 = 50 €. On DIVISE par le coefficient. Surtout pas 60 × 0,80 = 48 €.","Le coefficient sert dans les deux sens : × pour avancer, ÷ pour revenir en arrière."],
        figure:{ type:'tableau', lignes:[['HT','50 €'],['× 1,20','↓'],['TTC','60 €'],['÷ 1,20','↑']] },
        encart:{ type:'piege', lignes:["Prix HT = 60 × 0,80 = 48 €  ✗","Prix HT = 60 ÷ 1,20 = 50 €  ✓"] } },
      { titre:'Enchaîner des évolutions', texte:["+10 % puis −10 % : on multiplie les coefficients, 1,10 × 0,90 = 0,99. Au final, une baisse de 1 %, pas un retour au point de départ !","Pourquoi ? Les −10 % portent sur un prix plus grand que les +10 %. 100 → 110 → 99.","Deux hausses de 20 % : 1,2 × 1,2 = 1,44, soit +44 % et non +40 %. Les pourcentages successifs ne s'additionnent jamais : ils se multiplient."],
        figure:{ type:'batons', data:[{l:'100',v:100},{l:'+10 %',v:110,c:C.vertF},{l:'−10 %',v:99,c:C.rougeF}], max:120, legende:'100 → 110 → 99' },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un loyer de 800 € augmente de 3 % par an pendant 2 ans. Loyer au bout de 2 ans ?","Une action perd 40 % puis gagne 40 %. Est-elle revenue à son prix ?"] } },
      { titre:'Réponse', texte:["Loyer : 800 × 1,03 × 1,03 = 800 × 1,0609 = 848,72 €. (Et non 800 × 1,06 = 848 €.)","Action : 0,60 × 1,40 = 0,84. Elle vaut 84 % de son prix de départ : elle a perdu 16 %. Pour revenir de 60 à 100, il aurait fallu +66,7 %.","Retenir : une baisse de t % ne se rattrape pas avec une hausse de t %."],
        figure:{ type:'batons', data:[{l:'100',v:100},{l:'−40 %',v:60,c:C.rougeF},{l:'+40 %',v:84,c:C.orF}], max:120, legende:'100 → 60 → 84' } },
    ] },

    { nom:"Calculer un taux d'évolution", classe:'3ème', pages:[
      { titre:'De 80 € à 92 €', texte:["Un prix passe de 80 € à 92 €. Variation : 92 − 80 = 12 €. Par rapport au prix de départ : 12 ÷ 80 = 0,15. Taux d'évolution : +15 %.","Formule : taux = (arrivée − départ) ÷ départ. Le résultat est positif pour une hausse, négatif pour une baisse.","Avec le coefficient : 92 ÷ 80 = 1,15 = 1 + 0,15. On retrouve +15 %."],
        figure:{ type:'batons', data:[{l:'avant',v:80},{l:'après',v:92,c:C.vertF}], max:100, legende:'+12 sur 80 = +15 %' },
        encart:{ type:'retenir', lignes:["taux = (arrivée − départ) ÷ départ      coefficient = arrivée ÷ départ"] } },
      { titre:'Une baisse, et le retour au prix initial', texte:["De 250 € à 200 € : (200 − 250) ÷ 250 = −50 ÷ 250 = −0,2. Taux : −20 %.","Retrouver le prix initial : après +25 %, un article coûte 50 €. Le coefficient est 1,25 ; prix initial = 50 ÷ 1,25 = 40 €. Vérification : 40 × 1,25 = 50. ✓","Erreur classique : enlever 25 % de 50 (→ 37,50 €). Faux, car les 25 % portaient sur 40, pas sur 50."],
        figure:{ type:'tableau', lignes:[['initial','?','40'],['× 1,25','',''],['final','50','50']] },
        encart:{ type:'piege', lignes:["Prix initial = 50 − 12,50 = 37,50 €  ✗","Prix initial = 50 ÷ 1,25 = 40 €  ✓"] } },
      { titre:'Les pourcentages dans les nouvelles', texte:["« Le chômage passe de 8 % à 10 % » : c'est +2 POINTS de pourcentage, mais une hausse de 25 % (2 ÷ 8) du nombre de chômeurs. Les deux formulations sont vraies, et très différentes.","« Population multipliée par 3 » : coefficient 3, donc taux +200 % (et non +300 %).","Toujours se demander : pourcentage de quoi ? Et par rapport à quelle valeur de départ ?"],
        figure:{ type:'batons', data:[{l:'avant',v:8},{l:'après',v:10,c:C.rougeF}], max:12, legende:'8 % → 10 % : +2 points, +25 %' },
        encart:{ type:'exercice', titre:'À toi', lignes:["Une ville passe de 12 500 à 13 750 habitants en dix ans. Taux d'évolution ?","Après une baisse de 30 %, un manteau coûte 84 €. Prix initial ?"] } },
      { titre:'Réponse', texte:["Ville : (13 750 − 12 500) ÷ 12 500 = 1 250 ÷ 12 500 = 0,1. Taux : +10 %.","Manteau : coefficient 0,70. Prix initial = 84 ÷ 0,70 = 120 €. Vérification : 30 % de 120 = 36, et 120 − 36 = 84. ✓","Dans les deux cas, le prix ou la population de DÉPART est la référence."],
        figure:{ type:'tableau', lignes:[['','départ','arrivée','taux'],['ville','12 500','13 750','+10 %'],['manteau','120','84','−30 %']] } },
    ] },

    { nom:'Résoudre un problème', classe:'4ème', pages:[
      { titre:'Le comparateur de soldes', texte:["Article A : 60 € à −30 %. Article B : 55 € à −20 %. Lequel est le moins cher après remise ?","A : 60 × 0,70 = 42 €. B : 55 × 0,80 = 44 €. A est le moins cher, de 2 €.","Le pourcentage seul ne dit rien : −30 % sur un prix élevé peut coûter plus cher que −20 % sur un prix bas. On calcule les prix finaux, et on compare les prix finaux."],
        figure:{ type:'batons', data:[{l:'A : 42 €',v:42,c:C.vertF},{l:'B : 44 €',v:44}], max:60, legende:'prix après remise' },
        encart:{ type:'methode', lignes:["1. Identifier le total auquel s'applique chaque pourcentage.","2. Calculer chaque valeur finale (coefficient ou montant).","3. Comparer les valeurs finales, jamais les pourcentages seuls."] } },
      { titre:'Pourcentages et fractions, même combat', texte:["Un budget de 1 200 € : 30 % pour le loyer, 1/4 pour la nourriture, 15 % pour les transports. Que reste-t-il ?","Loyer : 360 €. Nourriture : 300 €. Transports : 180 €. Total dépensé : 840 €. Reste : 360 €, soit 30 % du budget.","En pourcentages : 30 % + 25 % + 15 % = 70 % dépensés, 30 % restants. Une fraction se convertit en pourcentage (1/4 = 25 %) et inversement."],
        figure:{ type:'disque', parts:[{label:'loyer 30 %',frac:0.3,c:C.rougeF},{label:'nourriture 25 %',frac:0.25,c:C.orF},{label:'transports 15 %',frac:0.15,c:C.bleuF},{label:'reste 30 %',frac:0.3,c:C.vertF}] },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un magasin affiche « −25 % sur le 2e article ». Deux pulls à 40 €.","Combien paie-t-on ? Quel est le pourcentage de remise sur l'ensemble ?"] } },
      { titre:'Réponse', texte:["Premier pull : 40 €. Second : 40 × 0,75 = 30 €. Total : 70 € au lieu de 80 €.","Remise sur l'ensemble : 10 € sur 80 € = 12,5 %. Pas 25 % : la remise ne porte que sur la moitié de l'achat.","Un pourcentage annoncé porte sur une base précise ; ramené à ce qu'on paie vraiment, il est souvent plus modeste."],
        figure:{ type:'batons', data:[{l:'plein tarif',v:80},{l:'payé',v:70,c:C.vertF}], max:90, legende:'70 € sur 80 € : −12,5 %' },
        encart:{ type:'retenir', lignes:["t % de N = N × t/100 · hausse × (1 + t/100), baisse × (1 − t/100) · taux = variation ÷ départ · les évolutions successives se multiplient."] } },
    ] },
  ] };


/* ══════════════════════════════════════════════════════════════
   THÉORÈME DE PYTHAGORE — livre complet

LIVRES['Théorème de Pythagore'] = { branch:'geometrie', level:'4ème–3ème', figure:{ type:'carresPythagore', anim:true },
  intro:"Une échelle contre un mur, la diagonale d'un écran, le fil qui retient un mât, la corde à 13 nœuds des maçons : partout où il y a un angle droit, les trois côtés sont liés par une seule égalité. Ce livre montre d'où elle vient, puis l'utilise pour calculer, prouver, et réfuter.",
  competences:[

    { nom:"Repérer l'hypoténuse et énoncer le théorème", classe:'4ème', pages:[
      { titre:'Le triangle rectangle et son grand côté', texte:["Un triangle rectangle a un angle droit. Le côté qui lui fait face, celui qui ne touche pas l'angle droit, s'appelle l'hypoténuse. C'est toujours le plus long des trois.","Dans le triangle ABC rectangle en A, l'hypoténuse est [BC]. Les deux autres côtés, [AB] et [AC], sont les côtés de l'angle droit.","Pour repérer l'hypoténuse sans hésiter : cherche le sommet de l'angle droit ; l'hypoténuse est le seul côté qui ne porte pas cette lettre."],
        figure:{ type:'triangle', rect:true, hyp:true, cotes:{AB:'côté de l\'angle droit', CA:'côté', BC:'hypoténuse'} },
        encart:{ type:'piege', lignes:["L'hypoténuse est le côté qui touche l'angle droit  ✗","L'hypoténuse est EN FACE de l'angle droit : dans ABC rectangle en A, c'est [BC]  ✓"] } },
      { titre:'D\'où vient le théorème : les trois carrés', texte:["Prends un triangle rectangle de côtés 3, 4 et 5. Construis un carré sur chaque côté : leurs aires sont 3² = 9, 4² = 16 et 5² = 25.","9 + 16 = 25 : les deux petits carrés contiennent exactement autant de cases que le grand. Ce n'est pas une coïncidence de ce triangle-là : c'est vrai pour TOUS les triangles rectangles, et pour eux seuls.","C'est le théorème de Pythagore : dans un triangle rectangle, le carré de l'hypoténuse est égal à la somme des carrés des deux autres côtés."],
        figure:{ type:'carresPythagore', anim:true },
        encart:{ type:'retenir', lignes:["ABC rectangle en A   ⟹   BC² = AB² + AC²"] } },
      { titre:'Écrire l\'égalité pour n\'importe quel triangle', texte:["DEF rectangle en E : l'hypoténuse est [DF] (elle ne contient pas E). Égalité : DF² = DE² + EF².","MNP rectangle en P : hypoténuse [MN]. Égalité : MN² = MP² + NP².","Règle d'écriture : le carré de l'hypoténuse seul à gauche, la somme des deux autres carrés à droite. On l'écrit AVANT de remplacer par des nombres."],
        figure:{ type:'tableau', lignes:[['rectangle en','hypoténuse','égalité'],['A','[BC]','BC² = AB² + AC²'],['E','[DF]','DF² = DE² + EF²'],['P','[MN]','MN² = MP² + NP²']] },
        encart:{ type:'monde', lignes:["Depuis 4 000 ans, les arpenteurs égyptiens et les maçons utilisent la corde à 13 nœuds : 3, 4 et 5 intervalles donnent un angle droit parfait pour tracer les fondations."] } },
      { titre:'À toi', texte:["1. Dans le triangle RST rectangle en S, quelle est l'hypoténuse ? Écris l'égalité de Pythagore.","2. Un triangle a pour côtés 6, 8 et 10. Sans rien calculer, si ce triangle est rectangle, quel côté est l'hypoténuse ?","3. Vrai ou faux : dans un triangle rectangle, l'hypoténuse peut mesurer moins qu'un autre côté."],
        figure:{ type:'triangle', rect:true, hyp:true, noms:['S','T','R'], cotes:{} },
        encart:{ type:'exercice', titre:'Indice', lignes:["L'hypoténuse ne contient jamais la lettre de l'angle droit, et c'est le plus grand côté."] } },
      { titre:'Réponse', texte:["1. Hypoténuse [RT] (le côté sans S). Égalité : RT² = RS² + ST².","2. Le plus grand côté, 10 : l'hypoténuse est toujours la plus longue.","3. Faux : l'hypoténuse est le plus long côté. Si BC² = AB² + AC², alors BC² est plus grand que AB² et que AC², donc BC est plus grand que chacun."],
        figure:{ type:'triangle', rect:true, hyp:true, noms:['S','T','R'], cotes:{AB:'ST', CA:'RS', BC:'RT (hypoténuse)'} } },
    ] },

    { nom:"Calculer l'hypoténuse", classe:'4ème', pages:[
      { titre:'Le fil du mât', texte:["Un mât de 4 m est tenu par un fil fixé au sol à 3 m du pied du mât. Le mât est vertical, le sol horizontal : angle droit au pied du mât. Le fil est l'hypoténuse.","fil² = 4² + 3² = 16 + 9 = 25. Le fil mesure √25 = 5 m.","Le nombre 25 n'est pas la longueur : c'est son carré. Il faut prendre la racine carrée pour revenir à des mètres."],
        figure:{ type:'echelle', h:'4 m', d:'3 m', l:'fil = ?', anim:true },
        encart:{ type:'methode', lignes:["1. Repérer l'angle droit, nommer l'hypoténuse.","2. Écrire l'égalité : hyp² = côté² + côté².","3. Remplacer, calculer les carrés, additionner.","4. Prendre la racine carrée. Arrondir si demandé, avec l'unité."] } },
      { titre:'Quand la racine ne tombe pas juste', texte:["Deux côtés de 5 cm et 7 cm. hyp² = 25 + 49 = 74. Et √74 n'est pas un entier : 8² = 64 et 9² = 81, donc √74 est entre 8 et 9. La calculatrice donne √74 ≈ 8,60.","On écrit la valeur exacte √74 cm, puis la valeur approchée : hyp ≈ 8,6 cm.","Ne pas arrondir avant la fin : on garde 74 sous la racine, on n'arrondit qu'au résultat."],
        figure:{ type:'triangle', rect:true, hyp:true, cotes:{AB:'7', CA:'5', BC:'√74 ≈ 8,6'} },
        encart:{ type:'exemple', titre:'Côtés 2,5 et 6', lignes:["hyp² = 2,5² + 6² = 6,25 + 36 = 42,25","hyp = √42,25 = 6,5"] } },
      { titre:'La diagonale de l\'écran', texte:["Un écran de 40 cm de large et 30 cm de haut. Les bords sont perpendiculaires : la diagonale est l'hypoténuse d'un triangle rectangle.","d² = 40² + 30² = 1 600 + 900 = 2 500. d = 50 cm. (Et 50 cm ≈ 19,7 pouces : c'est la taille affichée sur la boîte.)","Contrôle : la diagonale doit être plus longue que chaque côté (50 > 40 ✓) et plus courte que leur somme (50 < 70 ✓)."],
        figure:{ type:'carrelage', L:4, l:3, unite:'0 cm', legende:'diagonale = 50 cm' },
        encart:{ type:'piege', lignes:["diagonale = 40 + 30 = 70 cm  ✗ (on n'additionne pas les longueurs)","d = √(40² + 30²) = 50 cm : on additionne les CARRÉS  ✓"] } },
      { titre:'À toi', texte:["1. Un terrain rectangulaire mesure 120 m sur 50 m. Longueur de la diagonale ?","2. Une échelle de pompiers est posée contre un immeuble : son pied est à 6 m du mur, son sommet touche le mur à 8 m de haut. Longueur de l'échelle ?","3. Un randonneur marche 9 km vers l'est puis 12 km vers le nord. À quelle distance est-il de son départ ?"],
        figure:{ type:'echelle', h:'8 m', d:'6 m', l:'?', anim:false },
        encart:{ type:'exercice', titre:'Indice', lignes:["Est et nord sont perpendiculaires : le trajet dessine un triangle rectangle."] } },
      { titre:'Réponse', texte:["1. d² = 120² + 50² = 14 400 + 2 500 = 16 900. d = 130 m.","2. échelle² = 8² + 6² = 64 + 36 = 100. L'échelle mesure 10 m.","3. distance² = 9² + 12² = 81 + 144 = 225. Il est à 15 km de son départ, à vol d'oiseau, alors qu'il a marché 21 km."],
        figure:{ type:'tableau', lignes:[['','côté','côté','hyp'],['terrain','120','50','130'],['échelle','8','6','10'],['marche','9','12','15']] } },
    ] },

    { nom:"Calculer un côté de l'angle droit", classe:'4ème–3ème', pages:[
      { titre:'Quand c\'est l\'hypoténuse qu\'on connaît', texte:["Une échelle de 13 m est posée contre un mur, son pied à 5 m du mur. À quelle hauteur touche-t-elle le mur ?","L'échelle est l'hypoténuse : 13² = h² + 5². On isole h² : h² = 13² − 5² = 169 − 25 = 144. h = √144 = 12 m.","Pour un côté de l'angle droit, on SOUSTRAIT : le carré de l'hypoténuse moins le carré du côté connu. C'est l'hypoténuse qui est la plus grande."],
        figure:{ type:'echelle', h:'h = ?', d:'5 m', l:'13 m', anim:true },
        encart:{ type:'piege', lignes:["h² = 13² + 5² = 194  ✗ (l'hypoténuse n'est pas un côté de l'angle droit)","h² = 13² − 5² = 144, h = 12  ✓"] } },
      { titre:'Rédiger proprement', texte:["« Dans le triangle ABC rectangle en A, d'après le théorème de Pythagore : BC² = AB² + AC². »","« Donc AC² = BC² − AB² = 13² − 5² = 169 − 25 = 144. »","« Donc AC = √144 = 12 cm. »","Trois lignes : le cadre (quel triangle, quel angle droit), l'égalité, le calcul. C'est cette rédaction qui est attendue en contrôle et au brevet."],
        figure:{ type:'triangle', rect:true, hyp:true, cotes:{AB:'5', CA:'? = 12', BC:'13'} },
        encart:{ type:'methode', lignes:["1. Écrire l'égalité complète avec l'hypoténuse.","2. Isoler le carré du côté cherché par une soustraction.","3. Calculer, puis racine carrée."] } },
      { titre:'Un exemple avec des décimaux', texte:["Un triangle rectangle a une hypoténuse de 7,5 cm et un côté de 4,5 cm. L'autre côté ?","c² = 7,5² − 4,5² = 56,25 − 20,25 = 36. c = 6 cm.","Contrôle : 6 est plus petit que 7,5 (l'hypoténuse) ✓, et 4,5² + 6² = 20,25 + 36 = 56,25 = 7,5² ✓."],
        figure:{ type:'triangle', rect:true, hyp:true, cotes:{AB:'4,5', CA:'6', BC:'7,5'} },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un cerf-volant est retenu par une ficelle de 25 m tendue en ligne droite ; il est à la verticale d'un point situé à 7 m de l'enfant.","À quelle hauteur vole-t-il ?"] } },
      { titre:'Réponse', texte:["La ficelle est l'hypoténuse (25 m), la distance au sol un côté (7 m), la hauteur l'autre côté.","h² = 25² − 7² = 625 − 49 = 576. h = √576 = 24 m.","Le cerf-volant vole à 24 m. Contrôle : 24 < 25 ✓. Le trio 7, 24, 25 est un autre triplet pythagoricien, comme 3, 4, 5 et 5, 12, 13."],
        figure:{ type:'echelle', h:'24 m', d:'7 m', l:'25 m' } },
    ] },

    { nom:'Réciproque et contraposée', classe:'3ème', pages:[
      { titre:'Dans l\'autre sens : prouver un angle droit', texte:["Un triangle a pour côtés 5, 12 et 13 cm. Est-il rectangle ? On ne peut pas se fier au dessin : on calcule.","Plus grand côté : 13² = 169. Somme des carrés des deux autres : 5² + 12² = 25 + 144 = 169.","Égalité ! D'après la RÉCIPROQUE du théorème de Pythagore, le triangle est rectangle. L'angle droit est en face du plus grand côté, celui de 13 cm."],
        figure:{ type:'triangle', rect:true, hyp:true, cotes:{AB:'12', CA:'5', BC:'13'} },
        encart:{ type:'retenir', lignes:["Si (plus grand côté)² = (côté)² + (côté)², alors le triangle est rectangle. Sinon, il ne l'est pas."] } },
      { titre:'Quand ça ne colle pas : la contraposée', texte:["Côtés 4, 6 et 8. Plus grand côté : 8² = 64. Les deux autres : 4² + 6² = 16 + 36 = 52.","64 ≠ 52. Si le triangle était rectangle, le théorème imposerait l'égalité. Elle est fausse : donc le triangle n'est PAS rectangle.","Ce raisonnement s'appelle la contraposée. On l'écrit : « Si ABC était rectangle en A, on aurait BC² = AB² + AC². Or 64 ≠ 52. Donc ABC n'est pas rectangle. »"],
        figure:{ type:'tableau', lignes:[['8²','64'],['4² + 6²','52'],['','64 ≠ 52 : pas rectangle']] },
        encart:{ type:'piege', lignes:["64 ≠ 52, on ne peut rien conclure  ✗","On conclut : pas rectangle (contraposée)  ✓"] } },
      { titre:'Pourquoi calculer les deux membres séparément', texte:["On ne sait pas encore si le triangle est rectangle : on n'a donc pas le droit d'écrire l'égalité comme si elle était vraie.","On calcule d'un côté le carré du plus grand côté, de l'autre la somme des deux autres carrés, puis on COMPARE. Égaux → rectangle (réciproque). Différents → pas rectangle (contraposée).","Le plus grand côté est le seul candidat pour être l'hypoténuse : c'est lui qu'on isole."],
        figure:{ type:'tableau', lignes:[['côtés','13 · 5 · 12','8 · 4 · 6','10 · 6 · 8'],['grand²','169','64','100'],['somme','169','52','100'],['verdict','rectangle','non','rectangle']] },
        encart:{ type:'monde', lignes:["Vérifier qu'un mur est bien d'équerre, qu'un cadre de porte n'est pas de travers, qu'un terrain de sport est rectangulaire : on mesure trois longueurs et on compare."] } },
      { titre:'À toi', texte:["1. Un triangle a pour côtés 7, 24 et 25. Est-il rectangle ? Où est l'angle droit ?","2. Un menuisier vérifie un cadre : côtés 60 cm et 80 cm, diagonale 101 cm. Le cadre est-il d'équerre ?","3. Le triangle de côtés 1, 1 et √2 est-il rectangle ?"],
        figure:{ type:'carrelage', L:8, l:6, legende:'60 × 80 : la diagonale devrait faire 100' },
        encart:{ type:'exercice', titre:'Indice', lignes:["Dans 3, (√2)² = 2 : pas besoin de calculatrice."] } },
      { titre:'Réponse', texte:["1. 25² = 625 et 7² + 24² = 49 + 576 = 625. Égaux : rectangle, angle droit opposé au côté de 25.","2. 101² = 10 201 et 60² + 80² = 3 600 + 6 400 = 10 000. Différents : le cadre n'est pas d'équerre (la diagonale devrait faire 100 cm ; il est un peu « ouvert »).","3. (√2)² = 2 et 1² + 1² = 2. Égaux : rectangle. C'est la moitié d'un carré de côté 1, coupé par sa diagonale."],
        figure:{ type:'tableau', lignes:[['','grand²','somme','verdict'],['7-24-25','625','625','rectangle'],['60-80-101','10 201','10 000','non'],['1-1-√2','2','2','rectangle']] } },
    ] },

    { nom:'Résoudre un problème', classe:'3ème', pages:[
      { titre:'Trouver le triangle rectangle caché', texte:["Dans un problème, l'angle droit n'est pas toujours annoncé. Il se cache dans : un mur et le sol, les bords d'un rectangle, une hauteur et une base, le nord et l'est, le rayon d'un cercle et sa tangente.","Première étape, toujours : un schéma. Nomme les points, marque l'angle droit avec un petit carré, écris les longueurs connues, mets un « ? » sur l'inconnue.","Puis décide : hypoténuse inconnue → addition. Côté de l'angle droit inconnu → soustraction."],
        figure:{ type:'echelle', h:'mur', d:'sol', l:'échelle' },
        encart:{ type:'methode', lignes:["1. Schéma avec l'angle droit et les longueurs.","2. Choisir : + (hypoténuse) ou − (côté).","3. Rédiger avec le théorème, calculer, racine, unité.","4. Contrôler l'ordre de grandeur."] } },
      { titre:'La tente et la boîte', texte:["Une tente a une hauteur de 1,5 m et une largeur au sol de 4 m. Longueur de la toile d'un côté ? La hauteur coupe la largeur en deux : demi-largeur 2 m. toile² = 1,5² + 2² = 2,25 + 4 = 6,25, toile = 2,5 m.","Une baguette de 35 cm rentre-t-elle à plat dans une boîte de 30 cm × 20 cm ? Diagonale de la boîte : √(30² + 20²) = √1 300 ≈ 36,1 cm. Oui, de justesse.","Dans les deux cas, il a fallu voir le triangle rectangle : la moitié de la tente, la diagonale de la boîte."],
        figure:{ type:'carrelage', L:6, l:4, legende:'30 × 20 : diagonale ≈ 36,1 cm' },
        encart:{ type:'exercice', titre:'À toi', lignes:["Un pylône de 24 m est haubané par un câble fixé au sol à 10 m du pied. Longueur du câble ?","Le câble coûte 3,50 € le mètre. Prix de quatre câbles identiques ?"] } },
      { titre:'Réponse', texte:["câble² = 24² + 10² = 576 + 100 = 676. câble = 26 m.","Quatre câbles : 4 × 26 = 104 m. Prix : 104 × 3,50 = 364 €.","Le problème enchaîne Pythagore (une longueur) et une proportionnalité (un prix) : c'est le cas général des problèmes de brevet."],
        figure:{ type:'echelle', h:'24 m', d:'10 m', l:'26 m' },
        encart:{ type:'retenir', lignes:["hyp² = a² + b² pour calculer · a² = hyp² − b² pour un côté · réciproque pour prouver un angle droit · contraposée pour prouver qu'il n'y en a pas."] } },
    ] },
  ] };
