<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathBase — Tutoriels interactifs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b09; --surface:#111110; --surface2:#181815;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --accent:#c8b97a; --text:#f0ece0; --muted:rgba(240,236,224,0.45);
  --serif:'Playfair Display',Georgia,serif; --sans:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;
  padding:0 3rem;height:64px;background:rgba(11,11,9,0.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
.logo{font-family:var(--serif);font-size:1.35rem;color:var(--text);text-decoration:none;}
.logo em{font-style:italic;color:var(--accent);}
.nav-tabs{display:flex;gap:.25rem;}
.tab{background:none;border:none;color:var(--muted);font-family:var(--sans);font-size:.85rem;padding:.45rem .9rem;
  border-radius:6px;cursor:pointer;transition:.2s;text-decoration:none;display:inline-flex;align-items:center;}
.tab:hover,.tab.active{color:var(--text);background:var(--surface2);}
.nav-cta{font-family:var(--sans);font-size:.8rem;font-weight:500;background:var(--accent);color:var(--bg);
  border:none;border-radius:8px;padding:.55rem 1.2rem;cursor:pointer;text-decoration:none;}
.wrap{max-width:1100px;margin:0 auto;padding:3rem 2rem 5rem;}
.head{text-align:center;margin-bottom:3rem;}
.eyebrow{font-family:var(--mono);font-size:.58rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);
  margin-bottom:1rem;display:flex;align-items:center;justify-content:center;gap:.8rem;}
.eyebrow::before,.eyebrow::after{content:'';display:block;width:2.5rem;height:1px;background:rgba(200,185,122,.4);}
.title{font-family:var(--serif);font-size:clamp(2.2rem,5vw,3.4rem);font-weight:700;margin-bottom:.8rem;}
.title em{font-style:italic;color:var(--accent);}
.sub{color:var(--muted);font-size:.95rem;line-height:1.7;max-width:600px;margin:0 auto;}
.section{margin-bottom:2.6rem;}
.section-head{--bc:#c8b97a;display:flex;align-items:center;gap:.65rem;font-family:var(--serif);font-size:1.5rem;
  font-weight:700;margin-bottom:1.2rem;padding-bottom:.7rem;border-bottom:1px solid var(--border);}
.section-dot{width:11px;height:11px;border-radius:50%;background:var(--bc);box-shadow:0 0 14px var(--bc);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem;}
.chip{--bc:#c8b97a;position:relative;display:flex;align-items:center;gap:.7rem;background:var(--surface);
  border:1px solid var(--border2);border-radius:12px;padding:1rem 1.1rem;cursor:pointer;text-decoration:none;
  color:var(--text);transition:border-color .2s,transform .15s,background .2s;overflow:hidden;}
.chip::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bc);opacity:.5;transition:.2s;}
.chip:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--bc) 45%,transparent);}
.chip:hover::after{opacity:1;width:4px;}
.chip-icon{width:34px;height:34px;border-radius:9px;background:rgba(200,185,122,.1);border:1px solid rgba(200,185,122,.3);
  display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--accent);flex-shrink:0;}
.chip-body{flex:1;min-width:0;}
.chip-title{font-size:.92rem;font-weight:500;line-height:1.2;}
.chip-badge{font-family:var(--mono);font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;margin-top:.25rem;}
.chip-badge.ready{color:#82d6a0;}
.chip-badge.soon{color:var(--muted);}
@media(max-width:700px){nav{padding:0 1.2rem;}.wrap{padding:2rem 1.2rem 4rem;}}
</style>
<script src="auth.js" data-protect></script>
<script src="ui.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="eyebrow">Tutoriels interactifs</div>
    <h1 class="title">Apprends <em>en manipulant.</em></h1>
    <p class="sub">Quarante tutoriels, tout le programme du collège. Chaque tutoriel se déroule étape par étape : tu manipules, et dès qu'une étape est réussie, tu passes à la suivante.</p>
  </header>
  <div id="host"></div>
</div>

<script>
const BRANCHES = [
  { id:'nombres',   label:'Nombres',      color:'#7ab4c8' },
  { id:'algebre',   label:'Algèbre',      color:'#c8a07a' },
  { id:'geometrie', label:'Géométrie',    color:'#a07ac8' },
  { id:'fonctions', label:'Fonctions',    color:'#7ac8a0' },
  { id:'proba',     label:'Probabilités', color:'#c87a9a' },
  { id:'stats',     label:'Statistiques', color:'#e8a87c' },
];

// id, titre, branche, prêt ?
const CHAPTERS = [
  ['decimaux','Entiers & décimaux','nombres',true],
  ['fractions','Fractions','nombres',true],
  ['relatifs','Nombres relatifs','nombres',true],
  ['puissances','Puissances','nombres',true],
  ['proportionnalite','Proportionnalité','nombres',true],
  ['pourcentages','Pourcentages','nombres',true],
  ['longueur','Longueur','nombres',true],
  ['aires','Aires','nombres',true],
  ['durees','Repérage temps & durées','nombres',true],
  ['arithmetique','Arithmétique','nombres',true],

  ['operations','Enchaînement d\'opérations','algebre',true],
  ['litteral','Calcul littéral','algebre',true],
  ['developpement','Développement et factorisation','algebre',true],
  ['equation1','Équations du 1er degré','algebre',true],
  ['systemes','Systèmes d\'équations','algebre',true],
  ['inequations','Inéquations','algebre',true],

  ['geometrie','Géométrie','geometrie',true],
  ['symetrie-axiale','Symétrie axiale','geometrie',true],
  ['symetrie-centrale','Symétrie centrale','geometrie',true],
  ['angles','Angles et parallélisme','geometrie',true],
  ['parallelogrammes','Les parallélogrammes','geometrie',true],
  ['triangle','Géométrie du triangle','geometrie',true],
  ['perimetres','Périmètres et aires','geometrie',true],
  ['prisme','Prisme droit et cylindre','geometrie',true],
  ['pythagore','Théorème de Pythagore','geometrie',true],
  ['thales','Théorème de Thalès','geometrie',true],
  ['trigonometrie','Trigonométrie','geometrie',true],
  ['triangles-semblables','Triangles semblables','geometrie',true],
  ['homotheties','Homothéties','geometrie',true],
  ['translation','Translation et rotation','geometrie',true],
  ['pyramides','Pyramides et cônes','geometrie',true],

  ['fonctions-notion','Notions de fonctions','fonctions',true],
  ['fonction-lineaire','Fonction linéaire','fonctions',true],
  ['fonction-affine','Fonction affine','fonctions',true],

  ['proba-vocab','Vocabulaire des probabilités','proba',true],
  ['proba-simple','Probabilités simples','proba',true],

  ['stats-organisation','Organisation des données','stats',true],
  ['stats-position','Indicateurs de position','stats',true],
  ['stats-graphiques','Représentations graphiques','stats',true],
];

function build(){
  const host = document.getElementById('host');
  BRANCHES.forEach(b=>{
    const items = CHAPTERS.filter(c=>c[2]===b.id);
    if(!items.length) return;
    const sec = document.createElement('div'); sec.className='section';
    sec.innerHTML = `<div class="section-head" style="--bc:${b.color}"><span class="section-dot"></span>${b.label}</div>`;
    const grid = document.createElement('div'); grid.className='grid';
    items.forEach(([id,title,branch,ready])=>{
      const a = document.createElement('a');
      a.className='chip'; a.style.setProperty('--bc', b.color);
      a.href = `tutoriel.html?ch=${encodeURIComponent(id)}&title=${encodeURIComponent(title)}`;
      a.innerHTML = `
        <div class="chip-icon">${ready?'▶':'✎'}</div>
        <div class="chip-body">
          <div class="chip-title">${title}</div>
          <div class="chip-badge ${ready?'ready':'soon'}">${ready?'● Prêt à jouer':'En préparation'}</div>
        </div>`;
      grid.appendChild(a);
    });
    sec.appendChild(grid); host.appendChild(sec);
  });
}
build();
</script>
</body>
</html>
